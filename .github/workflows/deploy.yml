name: Deploy to Google Cloud Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Autentificare în Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/204575075833/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@manual-paramotor-ro.iam.gserviceaccount.com

      - name: Instalare gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Sincronizare site în bucket
        run: |
          gcloud storage rsync . gs://manual-paramotor-ro-web \
            --recursive \
            --delete-unmatched-destination-objects \
            --exclude='^(\.git|\.github|tools|data|components)(/|$)|\.md$|^\.gitignore$'
