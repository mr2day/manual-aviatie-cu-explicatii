sc formația.","warn":""},{"text":"zborul la aceeași altitudine","correct":false,"short":"","long":"Altitudinea nu definește formația.","warn":""},{"text":"zborul a două sau mai multe aeronave la o distanță minimă una de cealaltă","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"zborul cu un plan de zbor comun","correct":false,"short":"","long":"Planul comun nu definește formația.","warn":""}]},{"number":"#87","text":"181: În spațiul de clasă G, ce obligație legală avem înainte de decolare:","short":"În spațiul de clasa G, înainte de decolare avem obligația legală să depunem plan de zbor.","long":"Varianta corectă indică planul de zbor ca obligație. Verifică în reglementarea actuală dacă obligația se aplică zborului tău, deoarece cerințele pentru zborurile VFR în clasa G pot diferi. Anunțarea COAP sau armatei nu este varianta corectă.\n\nClasa G este spațiu necontrolat: zborul VFR și IFR este permis, nu este obligatorie autorizarea ATC, iar serviciul furnizat este doar de informare a zborurilor. Din acest motiv comunicarea radio nu este obligatorie, dar este recomandată.","answers":[{"text":"să anunțăm zborul la COAP","correct":false,"short":"","long":"Nu este varianta corectă.","warn":""},{"text":"să depunem plan de zbor","correct":true,"short":"","long":"În clasa G spațiul este necontrolat: nu este nevoie de autorizare ATC, iar zborul VFR se face fără legătură obligatorie cu un serviciu de control. Sursele consultate nu confirmă o obligație generală de a depune plan de zbor pentru zborul cu motoparapanta în clasa G; verifică RACR-RA și RACR-LPAN ULM pentru zborul tău.","warn":""},{"text":"să anunțăm armata dacă avem o unitate militară în zonă","correct":false,"short":"","long":"Nu este varianta corectă.","warn":""},{"text":"în spațiul G nu avem nicio obligație legală","correct":false,"short":"","long":"Există obligații, deci varianta este greșită.","warn":""}]},{"number":"#88","text":"363: Ce este un eveniment de aviație civilă?","short":"Un eveniment de aviație civilă este orice întrerupere operațională, defect, greșeală sau altă circumstanță care influențează siguranța zborului, fără a fi accident sau incident grav.","long":"Evenimentul este categoria largă, care include accidentele și incidentele, dar și situațiile care afectează siguranța fără a ajunge la acestea. Definiția cuprinde aceste situații.","answers":[{"text":"orice întrerupere operațională, defect, greșeală sau altă circumstanță care influențează siguranța zborului fără a rezulta într-un accident sau incident grav","correct":true,"short":"Orice incident care implică o aeronavă comercială.","long":"Definiția este prea restrânsă.","warn":""},{"text":"orice incident care implică o aeronavă comercială","correct":false,"short":"Orice problemă tehnică raportată de echipaj.","long":"Definiția este prea restrânsă.","warn":""},{"text":"orice problemă tehnică raportată de echipaj","correct":false,"short":"Orice abatere de la procedurile standard.","long":"Definiția este prea restrânsă.","warn":""},{"text":"orice abatere de la procedurile standard","correct":false,"short":"Orice întrerupere operațională, defect, greșeală sau altă circumstanță care influențează siguranța zborului fără a rezulta într-un accident sau incident grav.","long":"Este varianta corectă.","warn":""}]},{"number":"#89","text":"169: Pentru obţinerea licenţei de pilot de aeronave ultraușoare motorizate solicitantul trebuie să aibă vârsta de cel puţin:","short":"Pentru licența de ULM, solicitantul trebuie să aibă cel puțin 16 ani împliniți.","long":"Aceeași vârstă ca la întrebarea 34. Varianta corectă o indică; un furnizor de pregătire consultat indică același lucru, dar verifică RACR-LPAN ULM.","answers":[{"text":"14 ani împliniţi","correct":false,"short":"14 ani împliniți.","long":"Nu este varianta corectă.","warn":""},{"text":"16 ani împliniţi","correct":true,"short":"16 ani împliniți.","long":"","warn":""},{"text":"15 ani împliniți","correct":false,"short":"","long":"Nu este varianta corectă.","warn":""},{"text":"orice vârstă","correct":false,"short":"","long":"Există vârstă minimă.","warn":""}]},{"number":"#90","text":"387: Ce semnifică o cruce dublă albă dispusă în zona de aterizare pe un aerodrom?","short":"O cruce dublă albă în zona de aterizare marchează zona rezervată planoarelor.","long":"Marcajele de sol: cruce dublă pentru planoare, L pentru aeronave ușoare, H pentru elicoptere. Parapantele motorizate și parcarea nu au această cruce.","answers":[{"text":"zona rezervată decolării/aterizării parapantelor motorizate","correct":false,"short":"","long":"Nu este semnificația crucii duble.","warn":""},{"text":"zona rezervată decolării/aterizării elicopterelor","correct":false,"short":"","long":"Acesta este marcajul H.","warn":""},{"text":"zona de parcare pentru aeronave","correct":false,"short":"","long":"Nu este semnificația crucii duble.","warn":""},{"text":"zona rezervată decolării/aterizării planoarelor","correct":true,"short":"","long":"Este varianta corectă.","warn":""}]},{"number":"#91","text":"336: Care sunt cerințele pentru recunoașterea licențelor străine de pilot de motoparapantă în România?","short":"Licențele străine de pilot de motoparapantă trebuie să fie echivalate de Autoritatea Aeronautică Civilă Română.","long":"Recunoașterea este făcută de autoritatea română, prin echivalare. Statul emitent, traducerea și vechimea nu sunt criteriul principal.","answers":[{"text":"să fie echivalate de Autoritatea Aeronautică Civilă Română","correct":true,"short":"","long":"","warn":""},{"text":"să fie emise de o țară din UE","correct":false,"short":"","long":"Nu este criteriul unic.","warn":""},{"text":"să fie traduse în limba română","correct":false,"short":"","long":"Nu este criteriul principal.","warn":""},{"text":"să fie obținute în ultimii 5 ani","correct":false,"short":"","long":"Vechimea nu este criteriul.","warn":""}]},{"number":"#92","text":"346: Ce trebuie să facă un pilot pentru a opera un zbor VFR între apusul și răsăritul soarelui?","short":"Pentru zborul VFR între apusul și răsăritul soarelui trebuie respectate condițiile specificate de reglementările în vigoare.","long":"Zborul VFR de noapte este posibil doar în anumite condiții, stabilite în reglementare, cum ar fi echipamentul și autorizarea. Notificarea aeroportului, planul de zbor sau autorizarea ATS nu sunt condițiile generale corecte.","answers":[{"text":"să respecte condițiile specificate de reglementările în vigoare","correct":true,"short":"","long":"","warn":""},{"text":"să notifice autoritățile aeroportului","correct":false,"short":"","long":"Nu este condiția generală.","warn":""},{"text":"să depună un plan de zbor","correct":false,"short":"","long":"Nu este condiția generală corectă.","warn":""},{"text":"\"să obțină autorizație de la autoritatea ATS competentă","correct":false,"short":"Să obțină autorizație de la autoritatea ATS competentă.","long":"Nu este condiția generală corectă.","warn":""}]},{"number":"#93","text":"178: Este obligatorie legătura radio în spaţiul aerian de clasă C?","short":"Legătura radio este obligatorie în spațiul aerian de clasa C.","long":"În clasa C, comunicarea radio bilaterală cu ATC este obligatorie pentru toate zborurile. Nu depinde de cererea ATC sau de transponder.\n\nClasa C este spațiu controlat în care ATC asigură serviciu pentru toate zborurile, IFR și VFR. Pentru intrare este necesară autorizarea ATC și legătura radio bilaterală, menținută permanent. Serviciul nu este opțional. În România, clasa C este folosită, conform AIP ENR 1.4 (ediția 2023), de la FL105 în sus; verifică limitele în ediția actuală, pe aisro.ro.","answers":[{"text":"doar la solicitarea unităţii de trafic aerian","correct":false,"short":"Doar la solicitarea unității de trafic aerian.","long":"Nu este regula.","warn":""},{"text":"nu","correct":false,"short":"","long":"Este obligatorie.","warn":""},{"text":"da","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"doar dacă aeronava are la bord transponder","correct":false,"short":"","long":"Transponderul nu determină obligația.","warn":""}]},{"number":"#94","text":"354: „Care este scopul principal al Organizatiei Aviatiei Civile Internationale (OACI)?","short":"Scopul principal al OACI este asigurarea dezvoltării ordonate și sigure a aviației civile internaționale.","long":"OACI (ICAO) stabilește standardele și practicile internaționale pentru siguranța și ordinea aviației civile. Nu se ocupă de transportul privat, de consultanță sau de transportul maritim.","answers":[{"text":"sa dezvolte transportul aerian privat","correct":false,"short":"Să dezvolte transportul aerian privat.","long":"Nu este scopul principal.","warn":""},{"text":"sa ofere servicii de consultanta pentru companii aeriene","correct":false,"short":"Să ofere servicii de consultanță pentru companii aeriene.","long":"Nu este scopul principal.","warn":""},{"text":"sa asigure dezvoltarea ordonata si sigura a aviatiei civile internationale","correct":true,"short":"Să asigure dezvoltarea ordonată și sigură a aviației civile internaționale.","long":"Este varianta corectă.","warn":""},{"text":"sa reglementeze transportul maritim","correct":false,"short":"Să reglementeze transportul maritim.","long":"OACI se ocupă de aviație.","warn":""}]},{"number":"#95","text":"182: Zborurile VFR se pot efectua în România:","short":"Zborurile VFR se pot efectua în România în spațiile aeriene de clasă C și G.","long":"Conform regulilor aplicabile, zborurile VFR sunt permise în clasa C (cu coordonare) și în clasa G. Clasa A nu permite VFR, iar clasa A, C și G împreună nu este varianta corectă.\n\nClasa C și G permit zborul VFR; clasa A nu. Detaliile de clasă: Clasa C este spațiu controlat în care ATC asigură serviciu pentru toate zborurile, IFR și VFR. Pentru intrare este necesară autorizarea ATC și legătura radio bilaterală, menținută permanent. Serviciul nu este opțional. În România, clasa C este folosită, conform AIP ENR 1.4 (ediția 2023), de la FL105 în sus; verifică limitele în ediția actuală, pe aisro.ro. Clasa G este spațiu necontrolat: zborul VFR și IFR este permis, nu este obligatorie autorizarea ATC, iar serviciul furnizat este doar de informare a zborurilor. Din acest motiv comunicarea radio nu este obligatorie, dar este recomandată.","answers":[{"text":"numai în spaţiul aerian de clasă G","correct":false,"short":"Numai în spațiul aerian de clasă G.","long":"Sunt permise și în clasa C.","warn":""},{"text":"în spatiile aeriene de clasa A si G","correct":false,"short":"În spațiile aeriene de clasa A și G.","long":"Clasa A nu permite VFR.","warn":""},{"text":"în spaţiile aeriene de clasă C şi G","correct":true,"short":"În spațiile aeriene de clasă C și G.","long":"","warn":""},{"text":"în spaţiile aeriene de clasă A, C şi G","correct":false,"short":"În spațiile aeriene de clasă A, C și G.","long":"Clasa A nu permite VFR.","warn":""}]},{"number":"#96","text":"183: Dreptul de a instrui în zbor îl au:","short":"Dreptul de a instrui în zbor îl au instructorii calificați.","long":"Instruirea în zbor cere calificare de instructor, nu doar experiență sau deținerea unei aeronave. Cunoștințele generale sau numărul de ore nu sunt suficiente fără calificarea oficială.","answers":[{"text":"pilotii care stiu să instruiască","correct":false,"short":"Piloții care știu să instruiască.","long":"Cunoașterea nu este suficientă; este nevoie de calificare.","warn":""},{"text":"piloţii cu minim 100 de ore experienţă după finalizarea școlii","correct":false,"short":"Piloții cu minim 100 de ore experiență după finalizarea școlii.","long":"Orele nu sunt suficiente fără calificare.","warn":""},{"text":"cei care deţin aeronave omologate","correct":false,"short":"Cei care dețin aeronave omologate.","long":"Dețineri aeronavă nu dă dreptul de instruire.","warn":""},{"text":"instructorii calificaţi","correct":true,"short":"Instructorii calificați.","long":"","warn":""}]},{"number":"#97","text":"171: Valabilitatea licenţei de pilot de aeronave ultrauşoare motorizate este de:","short":"Varianta corectă indică 24 de luni de la examinarea teoretică, cu condiția ca certificatul medical să fie în termen de valabilitate.","long":"Aceeași valoare de 24 de luni ca la întrebările 29 și 45, plus condiția certificatului medical valabil. Verifică regula exactă în RACR-LPAN ULM.","answers":[{"text":"24 de luni de la data examinării teoretice cu condiţia ca certificatul medical să fie în termen de valabilitate","correct":true,"short":"24 de luni de la data examinării teoretice cu condiția ca certificatul medical să fie în termen de valabilitate.","long":"Valabilitatea licenței de ULM este de 24 de luni de la examinarea teoretică (RACR-LPAN ULM). Varianta A adaugă condiția ca certificatul medical să fie valabil, ceea ce este logic: licența nu poate fi folosită fără aptitudine medicală valabilă. Referința este examinarea teoretică, nu cea practică.","warn":""},{"text":"12 luni de la data examinării teoretice","correct":false,"short":"","long":"Nu este varianta corectă.","warn":""},{"text":"24 luni de la data examinării practice cu condiţia ca certificatul medical să fie în termen de valabilitate","correct":false,"short":"24 de luni de la data examinării practice cu condiția ca certificatul medical să fie în termen de valabilitate.","long":"Referința este examinarea teoretică, nu cea practică.","warn":""},{"text":"36 luni de la data examinării teoretice","correct":false,"short":"36 de luni de la data examinării teoretice.","long":"Nu este varianta corectă.","warn":""}]},{"number":"#98","text":"389: Pe ce tipuri de terenuri este permisă decolarea parapantelor motorizate?","short":"Parapantele motorizate pot decola din aerodromuri certificate și din alte terenuri sau suprafețe de apă, în condițiile stabilite prin hotărâre de Guvern.","long":"Decolarea nu se limitează la aerodromuri, dar nici nu este liberă oriunde. Condițiile sunt stabilite prin hotărâre de Guvern și prin reglementarea ULM. Varianta le cuprinde.","answers":[{"text":"doar aerodromuri certificate","correct":false,"short":"","long":"Sunt permise și alte terenuri în condițiile stabilite.","warn":""},{"text":"aerodromuri certificate și alte terenuri sau suprafețe de apă în condiții stabilite prin hotărâre de Guvern","correct":true,"short":"Aerodromuri certificate și alte terenuri sau suprafețe de apă, în condiții stabilite prin hotărâre de Guvern.","long":"","warn":""},{"text":"doar terenuri temporare marcate corespunzător","correct":false,"short":"","long":"Nu este condiția exclusivă.","warn":""},{"text":"terenuri publice deschise fără restricții","correct":false,"short":"","long":"Nu există libertate fără restricții.","warn":""}]},{"number":"#99","text":"322: Ce condiții trebuie să îndeplinească un solicitant pentru obținerea licenței de pilot de motoparapantă?","short":"Solicitantul pentru licența de motoparapantă trebuie să aibă vârsta de 16 ani împliniți.","long":"Aceeași vârstă minimă ca la întrebările 34 și 89. Cetățenia, permisul de conducere și studiile universitare nu sunt condițiile corecte.","answers":[{"text":"să aibă vârsta de 16 ani împliniți","correct":true,"short":"","long":"","warn":""},{"text":"să fie cetățean român","correct":false,"short":"","long":"Nu este condiția corectă.","warn":""},{"text":"să dețină permis de conducere","correct":false,"short":"","long":"Nu este condiția corectă.","warn":""},{"text":"să fi absolvit un curs universitar","correct":false,"short":"","long":"Nu este condiția corectă.","warn":""}]},{"number":"#100","text":"359: Ce reprezintă VFR?","short":"VFR înseamnă regulile de zbor la vedere.","long":"VFR (Visual Flight Rules) sunt regulile după care pilotul zboară vizual, cu referință la sol și la orizont. IFR este zborul instrumental, iar ATC este sistemul de dirijare a traficului.","answers":[{"text":"regulile de zbor la vedere","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"regulile de zbor instrumental","correct":false,"short":"","long":"Acestea sunt regulile IFR.","warn":""},{"text":"sistemul de dirijare și control al traficului aerian","correct":false,"short":"","long":"Aceasta este definiția ATC.","warn":""},{"text":"condițiile meteorologice de zbor la vedere","correct":false,"short":"","long":"Acestea sunt condițiile VMC, nu regulile VFR.","warn":""}]},{"number":"#101","text":"383: Ce înseamnă forța majoră în contextul aviației civile?","short":"Forța majoră este un eveniment imprevizibil și inevitabil care face temporar imposibilă respectarea cerințelor autorizării.","long":"Forța majoră este o situație exterioară, care nu poate fi prevăzută sau evitată (de exemplu o calamitate). Din acest motiv poate justifica temporar nerespectarea unei cerințe, dar nu o anulează.","answers":[{"text":"eveniment imprevizibil și inevitabil care generează imposibilitatea temporară de a respecta cerințele autorizării acordate","correct":true,"short":"Echipamentele de mare putere utilizate pentru controlul traficului aerian.","long":"Nu este definiția forței majore.","warn":""},{"text":"echipamentele de mare putere utilizate pentru controlul traficului aerian","correct":false,"short":"Regulile stricte impuse de autoritățile aviatice.","long":"Nu este definiția forței majore.","warn":""},{"text":"regulile stricte impuse de autoritățile aviatice","correct":false,"short":"Forța de muncă angajată în aeroporturi.","long":"Nu este definiția forței majore.","warn":""},{"text":"forța de muncă angajată în aeroporturi","correct":false,"short":"Eveniment imprevizibil și inevitabil care generează imposibilitatea temporară de a respecta cerințele autorizării acordate.","long":"Este definiția corectă.","warn":""}]},{"number":"#102","text":"370: Ce drepturi sunt acordate deținătorului licenței de pilot de aeronave ultraușoare motorizate?","short":"Deținătorul licenței de ULM are dreptul de a efectua zboruri în interes propriu și zboruri particulare.","long":"Aceeași regulă ca la întrebarea 46. Zborurile internaționale regulate și comerciale cer alte autorizări.","answers":[{"text":"dreptul de a efectua zboruri internaționale regulate","correct":false,"short":"","long":"Nu este dreptul conferit.","warn":""},{"text":"dreptul de a efectua zboruri în interes propriu și zboruri particulare","correct":true,"short":"","long":"","warn":""},{"text":"dreptul de a efectua zboruri comerciale","correct":false,"short":"","long":"Nu este dreptul conferit.","warn":""},{"text":"dreptul de a efectua zboruri internaționale regulate","correct":false,"short":"","long":"Nu este dreptul conferit.","warn":""}]},{"number":"#103","text":"186: Vizibilitatea minimă în spaţiul aerian de clasă G când se zboară cu viteze care permit observarea tuturor obstacolelor şi când probabilitatea întâlnirii cu alte aeronave este redusă, este:","short":"În clasa G, pentru viteze care permit observarea obstacolelor și probabilitate redusă de întâlnire cu alte aeronave, vizibilitatea minimă corectă este 1500 m.","long":"Vizibilitatea minimă depinde de altitudine, de viteză și de probabilitatea întâlnirii cu alte aeronave. Varianta corectă indică 1500 m pentru condițiile descrise. Verifică valorile din reglementarea aplicabilă.\n\nClasa G este spațiu necontrolat: zborul VFR și IFR este permis, nu este obligatorie autorizarea ATC, iar serviciul furnizat este doar de informare a zborurilor. Din acest motiv comunicarea radio nu este obligatorie, dar este recomandată.","answers":[{"text":"450 m","correct":false,"short":"","long":"Nu este valoarea corectă.","warn":""},{"text":"5000 m","correct":false,"short":"","long":"Nu este valoarea corectă pentru aceste condiții.","warn":""},{"text":"300 m","correct":false,"short":"","long":"Nu este valoarea corectă.","warn":""},{"text":"1500 m","correct":true,"short":"","long":"Sursele consultate indică pentru spațiul G o vizibilitate minimă de 5 km sub 3000 ft, și de 3 km în condiții specifice. Cifra de 1500 m nu este cea din aceste surse. Verifică-o în RACR-RA, pentru că sursele consultate nu confirmă varianta D.","warn":""}]},{"number":"#104","text":"341: Ce trebuie să facă un pilot dacă întâlnește o motoparapantă pe traiectorie convergentă?","short":"Dacă întâlnești o motoparapantă pe traiectorie convergentă, dai prioritate dacă cealaltă este în dreapta ta.","long":"La traiectorii convergente, aeronava care are cealaltă aeronavă în dreapta are prioritate, iar cealaltă trebuie să cedeze. Schimbarea altitudinii, reducerea vitezei sau menținerea direcției nu sunt regula de prioritate.","answers":[{"text":"să schimbe altitudinea","correct":false,"short":"","long":"Nu este regula de prioritate.","warn":""},{"text":"să reducă viteza","correct":false,"short":"","long":"Nu este regula de prioritate.","warn":""},{"text":"să își mențină direcția","correct":false,"short":"","long":"Nu este regula de prioritate.","warn":""},{"text":"să dea prioritate dacă cealaltă motoparapantă este în dreapta sa","correct":true,"short":"","long":"Este regula corectă.","warn":""}]},{"number":"#105","text":"187: Pentru a evita efectul turbulenţei de siaj, eşalonarea la plecare în cazul aeronavelor uşoare sau medii care pleacă după o aeronavă grea va fi de minim:","short":"Pentru a evita turbulența de siaj, eșalonarea la plecare după o aeronavă grea este de minim 2 minute.","long":"Turbulența de siaj de la o aeronavă grea poate fi periculoasă pentru una ușoară. Eșalonarea minimă corectă este de 2 minute. Verifică cifra în procedurile de trafic aplicabile.","answers":[{"text":"10 min","correct":false,"short":"10 minute.","long":"Nu este valoarea corectă.","warn":""},{"text":"7 min","correct":false,"short":"7 minute.","long":"Nu este valoarea corectă.","warn":""},{"text":"2 min","correct":true,"short":"2 minute.","long":"Turbulența de siaj de la o aeronavă grea poate fi periculoasă pentru una ușoară, de aceea la plecare se respectă o eșalonare minimă. Cifra de 2 minute nu am confirmat-o în sursele consultate; verifică-o în procedurile de trafic aplicabile.","warn":""},{"text":"5 min","correct":false,"short":"5 minute.","long":"Nu este valoarea corectă.","warn":""}]}]},{"id":"04","title":"Meteorologie","questions":[{"number":"#1","text":"228: Ce este vântul foehn?","short":"Vântul foehn este o mișcare de aer care urcă pe un versant, apoi coboară pe partea cealaltă a abruptului, încălzindu-se și uscându-se.","long":"Aerul umed urcă pe versantul expus vântului, se răcește și lasă precipitații. Pe partea opusă coboară, iar prin comprimare se încălzește și devine uscat. Acesta este efectul de foehn, cunoscut ca vânt descendent cald și uscat pe versantul adăpostit.","answers":[{"text":"este o mișcare de aer orizontală de-a lungul văilor","correct":false,"short":"O mișcare de aer orizontală de-a lungul văilor.","long":"Aceasta descrie vântul de vale, nu foehnul.","warn":""},{"text":"este o mișcare de aer ce coboară seara de pe crestele montane înalte","correct":false,"short":"O mișcare de aer care coboară seara de pe crestele înalte.","long":"Aceasta descrie vântul catabatic, nu foehnul.","warn":""},{"text":"este o mișcare de aer ascendentă de-a lungul unui versant, după care își continuă mișcarea descensional, în partea cealaltă a abruptului","correct":true,"short":"O mișcare de aer ascendentă de-a lungul unui versant, după care își continuă mișcarea descendent, în partea cealaltă a abruptului.","long":"Este descrierea corectă a foehnului.","warn":""},{"text":"este o mișcare termică ce apare în văile înguste","correct":false,"short":"O mișcare termică ce apare în văile înguste.","long":"Aceasta descrie un vânt termic local, nu foehnul.","warn":""}]},{"number":"#2","text":"225: Temperatura la sol este de 20 de grade, care este temperatura probabilă la înălțimea de 2000 m?","short":"Dacă temperatura la sol este de 20°C, la 2000 m temperatura probabilă este de aproximativ 8°C.","long":"În atmosfera standard, temperatura scade cu aproximativ 6,5°C la fiecare 1000 m. Pe 2000 m scade cu aproximativ 13°C, deci de la 20°C ajungem la aproximativ 7°C. Valoarea (8°C) este o estimare apropiată, fiindcă gradientul real variază.","answers":[{"text":"8 grd. C","correct":true,"short":"8°C.","long":"Este valoarea, o estimare apropiată de gradientul mediu.","warn":""},{"text":"25 grd. C","correct":false,"short":"25°C.","long":"Temperatura scade cu altitudinea, nu crește.","warn":""},{"text":"20 grd. C","correct":false,"short":"20°C.","long":"Temperatura nu rămâne constantă cu altitudinea.","warn":""},{"text":"18 grd. C","correct":false,"short":"18°C.","long":"Scăderea este mai mare decât 2°C pe 2000 m.","warn":""}]},{"number":"#3","text":"284: Ce este nebulozitatea?","short":"Nebulozitatea este gradul de acoperire a cerului cu nori, măsurat în optanți.","long":"Cerul se împarte mental în opt părți (octanți). Nebulozitatea indică câți octanți sunt acoperiți de nori. Nu măsoară viteza norilor, temperatura lor sau cantitatea de vapori.","answers":[{"text":"gradul de acoperire al cerului cu nori, măsurat în octanți","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"viteza cu care se deplasează norii","correct":false,"short":"","long":"Aceasta nu este nebulozitatea.","warn":""},{"text":"temperatura medie a norilor","correct":false,"short":"","long":"Aceasta nu este nebulozitatea.","warn":""},{"text":"cantitatea de vapori de apă prezentă în atmosferă","correct":false,"short":"","long":"Aceasta este umiditatea.","warn":""}]},{"number":"#4","text":"297: Care sunt valorile treptei barice?","short":"Toate valorile pentru treapta barică sunt corecte.","long":"Treapta barică este distanța verticală la care presiunea scade cu 1 hPa (mb). La nivelul mării este de aproximativ 8,4 m, iar cu altitudinea crește, deci la altitudini mari sunt necesari mai mulți metri pentru aceeași scădere. Cele trei variante descriu aceste valori în funcție de altitudine.","answers":[{"text":"toate sunt corecte","correct":true,"short":"","long":"Este varianta corectă, în acord cu variația treptei barice cu altitudinea.","warn":""},{"text":"la nivelul mării, treapta barică este de aproximativ 8.4 metri pentru o variație a presiunii de 1 mb","correct":false,"short":"La nivelul mării, treapta barică este de aproximativ 8,4 m pentru o variație a presiunii de 1 mb.","long":"Valoare corectă ca ordin de mărime.","warn":""},{"text":"la 11000 metri, este necesară o creștere de 32 metri pentru ca presiunea să scadă cu 1 mb","correct":false,"short":"La 11 000 m, este necesară o creștere de 32 m pentru ca presiunea să scadă cu 1 mb.","long":"Valoare plauzibilă, în ordinul corect.","warn":""},{"text":"la 5500 metri, treapta barică necesită 16 metri pentru o scădere a presiunii de 1 mb","correct":false,"short":"La 5500 m, treapta barică necesită 16 m pentru o scădere a presiunii de 1 mb.","long":"Valoare plauzibilă, în ordinul corect.","warn":""}]},{"number":"#5","text":"282: Cum se formează ceața de radiație?","short":"Ceața de radiație se formează prin condensarea vaporilor de apă când aerul se răcește noaptea, pe cer senin.","long":"Pe timp senin, solul se răcește prin radiație noaptea, răcind și aerul de deasupra. Când temperatura ajunge la punctul de rouă, vaporii condensează în ceață, de obicei în văi și pe terenuri joase. Cerul senin favorizează pierderea de căldură.","answers":[{"text":"pe versanții munților în timpul nopții din cauza răcirii rapide a aerului","correct":false,"short":"","long":"Ceața de radiație se formează mai ales pe terenuri joase și în văi.","warn":""},{"text":"în timpul verii, în zonele cu umiditate ridicată și temperaturi ridicate","correct":false,"short":"","long":"Temperaturile ridicate nu favorizează ceața de radiație.","warn":""},{"text":"din condensarea vaporilor de apă din aer în prezența unor temperaturi scăzute și a unui cer senin","correct":true,"short":"","long":"Este descrierea corectă.","warn":""},{"text":"în zonele urbane poluate, ca urmare a condensării vaporilor de apă pe particulele poluante","correct":false,"short":"","long":"Aceasta descrie ceața urbană, nu cea de radiație.","warn":""}]},{"number":"#6","text":"222: Cu care tip de nori sunt asociate furtunile?","short":"Furtunile sunt asociate cu norii de tip cumulonimbus.","long":"Cumulonimbus (CB) este norul vertical, mare, cu ascendențe puternice și descendențe, care produce fulgere, averse și rafale. Norii cirrus sunt înalți și subțiri, cumulus sunt norii de vreme bună, iar altocumulus sunt de altitudine medie.","answers":[{"text":"nori de tip Cumulonimbus","correct":true,"short":"","long":"Este norul asociat furtunilor.","warn":""},{"text":"nori de tip Cirus","correct":false,"short":"Nori de tip cirrus.","long":"Sunt nori înalți, subțiri, de vreme relativ bună.","warn":""},{"text":"nori de tip Cumulus","correct":false,"short":"","long":"Sunt norii de vreme bună, de dezvoltare verticală limitată.","warn":""},{"text":"nori de tip Altocumulus","correct":false,"short":"","long":"Sunt nori de altitudine medie, fără furtuni.","warn":""}]},{"number":"#7","text":"286: Vântul anabatic poate fi întâlnit:","short":"Vântul anabatic apare pe versanții munților în timpul zilei, când soarele încălzește pantele.","long":"Pantele însorite se încălzesc, aerul din apropiere se încălzește și urcă pe versant. Acesta este vântul anabatic, opusul vântului catabatic, care coboară noaptea. Briza de mare este un fenomen de coastă, nu se referă la munții în sine.","answers":[{"text":"doar în zonele polare, ca urmare a contrastului mare de temperatură","correct":false,"short":"","long":"Nu este specific zonelor polare.","warn":""},{"text":"în zonele de coastă, formând brize de mare","correct":false,"short":"","long":"Este brizele de coastă, un fenomen diferit.","warn":""},{"text":"în zonele deșertice, unde este generat de încălzirea rapidă a suprafeței","correct":false,"short":"","long":"Nu este descrierea anabaticului.","warn":""},{"text":"pe versanții munților în timpul zilei, când soarele încălzește pantele","correct":true,"short":"","long":"Este descrierea corectă.","warn":""}]},{"number":"#8","text":"279: Când se utilizează CAVOK?","short":"CAVOK se utilizează când vizibilitatea orizontală este de 10 km sau mai mare.","long":"CAVOK (Ceiling And Visibility OK) înseamnă vizibilitate de cel puțin 10 km, fără nori sub 1500 m (5000 ft) sau sub altitudinea minimă de sector, fără cumulonimbus și fără fenomene meteo semnificative. Este un cod prescurtat pentru condiții bune.","answers":[{"text":"CAVOK se utilizează când există nori Cumulonimbus sub 1500 m","correct":false,"short":"Când există nori cumulonimbus sub 1500 m.","long":"Cumulonimbusul exclude CAVOK.","warn":""},{"text":"CAVOK se utilizează când vizibilitatea orizontală este sub 10 km","correct":false,"short":"Când vizibilitatea orizontală este sub 10 km.","long":"Vizibilitatea trebuie să fie de cel puțin 10 km.","warn":""},{"text":"CAVOK se utilizează când fenomenele meteorologice sunt instabile","correct":false,"short":"Când fenomenele meteorologice sunt instabile.","long":"Fenomenele instabile exclud CAVOK.","warn":""},{"text":"CAVOK se utilizează când vizibilitatea orizontală este 10 km sau mai mult","correct":true,"short":"Când vizibilitatea orizontală este 10 km sau mai mult.","long":"Este definiția corectă (împreună cu celelalte condiții).","warn":""}]},{"number":"#9","text":"320: Care dintre urmatoarele fenomene pot duce la o activitate orajoasă?","short":"Frontul rece poate produce activitate orajoasă.","long":"Frontul rece împinge aer cald în sus, rapid și abrupt, ceea ce poate forma nori cumulonimbus și furtuni. Frontul cald produce nori stratiformi și precipitații mai uniforme, frontul oclus combină caracteristicile celor două, iar șaua barică are vreme în general calmă.","answers":[{"text":"front cald","correct":false,"short":"","long":"Frontul cald dă de obicei precipitații mai uniforme, fără activitate orajoasă intensă.","warn":""},{"text":"front rece","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"șaua barică","correct":false,"short":"","long":"Șaua are de obicei vreme calmă.","warn":""},{"text":"front oclus","correct":false,"short":"","long":"Frontul oclus poate avea precipitații, dar nu este varianta corectă.","warn":""}]},{"number":"#10","text":"281: Unde se produce ceața frontală?","short":"Ceața frontală apare la trecerea fronturilor, într-o zonă îngustă de-a lungul frontului, în masa de aer rece.","long":"Când aerul cald și umed se ridică peste aerul rece din fața sau de-a lungul frontului, răcirea și umiditatea formează ceață sau nori joși. Este un fenomen legat de front, nu de apă, poluare sau relief.","answers":[{"text":"pe suprafețele de apă, cum ar fi lacuri și râuri, din cauza diferențelor de temperatură dintre apă și aer","correct":false,"short":"","long":"Aceasta descrie alt tip de ceață.","warn":""},{"text":"în zonele urbane datorită poluării și a variațiilor mari de temperatură între zi și noapte","correct":false,"short":"","long":"Aceasta descrie ceața urbană.","warn":""},{"text":"la trecerea fronturilor sau în regiunile cu cea mai mare activitate ciclonică, într-o zonă îngustă de-a lungul frontului, în masa de aer rece separată de front","correct":true,"short":"","long":"Este descrierea corectă.","warn":""},{"text":"doar în zonele montane, unde condițiile de temperatură și umiditate favorizează formarea ceții","correct":false,"short":"","long":"Ceața frontală nu este limitată la munți.","warn":""}]},{"number":"#11","text":"294: Ce este amplitudinea termică?","short":"Amplitudinea termică este diferența dintre temperatura maximă și cea minimă dintr-un loc, pe parcursul a 24 de ore.","long":"Amplitudinea termică zilnică arată cât de mult variază temperatura în decursul unei zile. Este mare în deșert și mică pe mare. Nu este media anuală sau variația anotimpurilor.","answers":[{"text":"amplitudinea termică reprezintă variația temperaturii medii anuale","correct":false,"short":"Variația temperaturii medii anuale.","long":"Aceasta nu este amplitudinea termică.","warn":""},{"text":"amplitudinea termică descrie variația temperaturii pe parcursul a 24 de ore","correct":true,"short":"Variația temperaturii pe parcursul a 24 de ore.","long":"Este descrierea corectă.","warn":""},{"text":"amplitudinea termică măsoară schimbările de temperatură pe durata anotimpurilor","correct":false,"short":"Schimbările de temperatură pe durata anotimpurilor.","long":"Aceasta nu este amplitudinea termică zilnică.","warn":""},{"text":"amplitudinea termică este diferența dintre temperatura maximă și cea minimă într-un anumit loc","correct":false,"short":"Diferența dintre temperatura maximă și cea minimă într-un anumit loc.","long":"Este definiția corectă, fiind echivalentă cu varianta.","warn":""}]},{"number":"#12","text":"306: Ce caracteristici are o masă de aer instabilă?","short":"Într-o masă de aer instabilă apar turbulențe, vizibilitate bună și nori cumuliformi.","long":"În aerul instabil, ascendențele sunt puternice și dezvoltă nori verticali, cumuliformi. Vizibilitatea rămâne bună, dar turbulența este intensă. Nori stratiformi și nimbostratus apar în aer stabil, cu vizibilitate redusă.","answers":[{"text":"turbulenţe, vizibilitate bună şi nori Cumuliformi","correct":true,"short":"Turbulențe, vizibilitate bună și nori cumuliformi.","long":"Este descrierea corectă a aerului instabil.","warn":""},{"text":"turbulenţe şi vizibilitate slabă","correct":false,"short":"Turbulențe și vizibilitate slabă.","long":"Vizibilitatea slabă este mai tipică aerului stabil.","warn":""},{"text":"nori Stratiformi","correct":false,"short":"","long":"Sunt tipici aerului stabil.","warn":""},{"text":"nori Nimbostratus","correct":false,"short":"","long":"Sunt tipici aerului stabil, cu precipitații continue.","warn":""}]},{"number":"#13","text":"256: Vântul laminar este:","short":"Vântul laminar este vântul care își păstrează direcția și intensitatea.","long":"Vântul laminar curge în straturi paralele, fără turbulență. Este vântul ideal pentru zbor, deoarece este previzibil. Vântul care variază din cauza obstacolelor sau al convecției este altceva.","answers":[{"text":"vântul care ia naştere prin convecţia aerului","correct":false,"short":"Vântul care ia naștere prin convecția aerului.","long":"Acesta este vântul convectiv, cu turbulență.","warn":""},{"text":"vântul care îşi păstrează direcţia şi intensitatea","correct":true,"short":"Vântul care își păstrează direcția și intensitatea.","long":"Este definiția corectă.","warn":""},{"text":"vântul format în urma diferențelor de temperatură diurnă și nocturnă ale uscatului respectiv a apelor","correct":false,"short":"Vântul format în urma diferențelor de temperatură diurnă și nocturnă.","long":"Acesta este vântul termic local.","warn":""},{"text":"vântul care suferă variaţii datorită obstacolelor","correct":false,"short":"Vântul care suferă variații datorită obstacolelor.","long":"Acesta este vântul turbulent.","warn":""}]},{"number":"#14","text":"288: Fohn-ul este:","short":"Foehn-ul este vântul descendent, cald și uscat, care apare pe versantul adăpostit al unui munte.","long":"Aerul urcă pe versantul expus, pierde umiditatea prin precipitații, apoi coboară pe versantul adăpostit, unde se încălzește prin comprimare. Rezultatul este un vânt cald și uscat, descendent.","answers":[{"text":"vântul descendent care apare pe versantul protejat al unui munte","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"un tip de vânt care aduce precipitații abundente și scăderea temperaturii","correct":false,"short":"","long":"Foehn-ul aduce precipitații pe versantul expus, dar nu scăderea temperaturii pe cel adăpostit.","warn":""},{"text":"un vânt cald și uscat care se formează în zonele de câmpie","correct":false,"short":"","long":"Foehn-ul se formează pe versanții munților.","warn":""},{"text":"un vânt care suflă doar în anumite regiuni montane și este caracterizat de temperaturi joase","correct":false,"short":"","long":"Foehn-ul este cald, nu rece.","warn":""}]},{"number":"#15","text":"255: Nivelul de condensare reprezintă:","short":"Nivelul de condensare este înălțimea la care umiditatea relativă devine 100%.","long":"Când aerul umed se ridică, se răcește. La nivelul de condensare, aerul ajunge la saturație, iar vaporii de apă încep să condenseze și să formeze baza norului. Este înălțimea la care apare baza norilor de convecție.","answers":[{"text":"înălţimea până la care urcă aerul uscat","correct":false,"short":"Înălțimea până la care urcă aerul uscat.","long":"Aerul uscat nu condensează; nivelul se referă la aerul umed.","warn":""},{"text":"înălţimea corespunzătoare vârfului norilor","correct":false,"short":"Înălțimea corespunzătoare vârfului norilor.","long":"Acesta este vârful norului, nu nivelul de condensare.","warn":""},{"text":"înălțimea la care vaporii de apă devin cristale de gheață","correct":false,"short":"","long":"Aceasta este descrierea altui fenomen.","warn":""},{"text":"înălţimea la care umiditatea relativă devine 100%","correct":true,"short":"Înălțimea la care umiditatea relativă devine 100%.","long":"Este definiția corectă.","warn":""}]},{"number":"#16","text":"217: În planificarea unui zbor de distanță la altitudini mari trebuie să ținem cont de:","short":"La un zbor de distanță, la altitudini mari, trebuie să luăm în calcul vântul la sol și în altitudine, fenomenele locale, imaginile din satelit, prognoza și restricțiile zilei.","long":"Planificarea presupune analiza completă a condițiilor: vânt la diferite niveluri, efecte locale (vânt catabatic, de vale, curenți termici și dinamici), imagini satelitare și prognoza. Varianta care le cuprinde pe toate este corectă.","answers":[{"text":"nu este recomandat piloților de parapantă cu motor","correct":false,"short":"","long":"Nu este o regulă general valabilă.","warn":""},{"text":"dacă zborul este peste munți, este interzis","correct":false,"short":"","long":"Zborul peste munți nu este interzis, dar cere planificare.","warn":""},{"text":"viteza vântului la sol, viteza vântului la înăltime, fenomene locale (vânt catabatic, vânt de vale, curenți ascendenți termici și dinamici), imagini din satelit, prognoza zilei și restricțiile zilnice","correct":true,"short":"Viteza vântului la sol, la înălțime, fenomene locale, imagini din satelit, prognoza zilei și restricțiile zilnice.","long":"Este varianta corectă, care cuprinde toate elementele de planificare.","warn":""},{"text":"trebuie să avem o parapantă EN C cu performanțe adecvate acestui tip de zbor","correct":false,"short":"","long":"Alegerea aripii este separată de analiza condițiilor.","warn":""}]},{"number":"#17","text":"292: Ce este umiditatea relativă?","short":"Umiditatea relativă este raportul dintre umiditatea absolută și umiditatea absolută maximă la aceeași temperatură.","long":"Umiditatea relativă arată cât de aproape este aerul de saturație. Aerul cald poate reține mai mult vapor, deci aceeași cantitate de vapor are umiditate relativă mai mică la temperatură mai mare. Este procentul de saturație, exprimat în procente.","answers":[{"text":"umiditatea relativă indică nivelul de confort uman în raport cu umiditatea aerului","correct":false,"short":"Nivelul de confort uman în raport cu umiditatea aerului.","long":"Confortul este o consecință, nu definiția.","warn":""},{"text":"umiditatea relativă reprezintă cantitatea de apă din aer raportată la temperatura actuală","correct":false,"short":"Cantitatea de apă din aer raportată la temperatura actuală.","long":"Cantitatea de apă este umiditatea absolută.","warn":""},{"text":"umiditatea relativă măsoară procentul de saturație a aerului cu vapori de apă","correct":false,"short":"Procentul de saturație a aerului cu vapori de apă.","long":"Este apropiat de definiție, dar varianta completă este cea cu raportul.","warn":""},{"text":"umiditatea relativă este raportul dintre umiditatea absolută și umiditatea absolută maximă la aceeași temperatură","correct":true,"short":"Raportul dintre umiditatea absolută și umiditatea absolută maximă la aceeași temperatură.","long":"Este definiția corectă.","warn":""}]},{"number":"#18","text":"257: Efectul Venturi se manifestă prin:","short":"Efectul Venturi se manifestă prin accelerarea vântului atunci când văile se îngustează.","long":"Când aerul trece printr-o zonă mai îngustă, viteza crește, pentru că același volum trebuie să treacă prin secțiune mai mică. Acesta este efectul Venturi, folosit și în exemplul văilor înguste, unde vântul devine mai puternic.","answers":[{"text":"accelerarea vântului atunci când văile se îngustează","correct":true,"short":"","long":"Este efectul corect.","warn":""},{"text":"o întrerupere a vântului la nivelul inferior al văii","correct":false,"short":"","long":"Aceasta nu este efectul Venturi.","warn":""},{"text":"este o mișcare de aer ascendentă de-a lungul unui versant, după care își continuă mișcarea descensional, în partea cealaltă a abruptului","correct":false,"short":"O mișcare de aer ascendentă de-a lungul unui versant, după care își continuă mișcarea descendent.","long":"Aceasta este descrierea foehnului.","warn":""},{"text":"dezorganizarea fileurilor de aer atunci când văile se restrâng","correct":false,"short":"","long":"Restrângerea accelerează vântul, nu îl dezorganizează ca efect principal.","warn":""}]},{"number":"#19","text":"304: Care este procentul volumetric al gazelor în atmosferă?","short":"Azotul constituie 78,09% din volumul gazelor din aerul uscat.","long":"Aerul uscat este format din azot (78,09%), oxigen (20,95%), argon (0,93%) și alte gaze în cantități mici. Oxigenul nu este 30%, argonul nu este 0,93% din alt total, iar azotul nu este 50%.","answers":[{"text":"procentul volumetric al azotului în aerul uscat este de aproximativ 50%","correct":false,"short":"","long":"Azotul are aproximativ 78%.","warn":""},{"text":"oxigenul reprezintă aproximativ 30% din volumul gazelor din aerul uscat","correct":false,"short":"","long":"Oxigenul are aproximativ 21%.","warn":""},{"text":"argonul constituie circa 0.93% din volumul gazelor din aerul uscat","correct":false,"short":"Argonul constituie circa 0,93% din volumul gazelor din aerul uscat.","long":"Este o valoare corectă, dar nu este răspunsul corect, deoarece întrebarea privește azotul.","warn":""},{"text":"azotul constituie 78.09% din volumul gazelor din aerul uscat","correct":true,"short":"Azotul constituie 78,09% din volumul gazelor din aerul uscat.","long":"Este valoarea corectă.","warn":""}]},{"number":"#20","text":"215: Ceața de advecție se formează?","short":"Ceața de advecție apare când o masă de aer cald și umed se deplasează peste o suprafață rece.","long":"Aerul cald și umed, adus de vânt pe o suprafață mai rece (sol sau apă), se răcește până la punctul de rouă și formează ceață. Este diferită de ceața de radiație, care se formează local, noaptea, pe cer senin.","answers":[{"text":"ceața de advecție se produce prin răcirea aerului cald în contact direct cu o suprafață rece","correct":false,"short":"Se produce prin răcirea aerului cald în contact direct cu o suprafață rece.","long":"Aceasta este o formulare apropiată, dar varianta corectă este cea cu deplasarea masei de aer.","warn":""},{"text":"ceața de advecție se dezvoltă în condiții de umiditate scăzută și temperaturi ridicate","correct":false,"short":"Se dezvoltă în condiții de umiditate scăzută și temperaturi ridicate.","long":"Umiditatea scăzută nu formează ceață.","warn":""},{"text":"ceața de advecție apare la deplasarea unei mase de aer cald și umed peste o suprafață rece a pământului sau a apei","correct":true,"short":"Apare la deplasarea unei mase de aer cald și umed peste o suprafață rece a pământului sau a apei.","long":"Este definiția corectă.","warn":""},{"text":"ceața de advecție se formează prin ridicarea aerului cald peste aerul rece la nivelul solului","correct":false,"short":"Se formează prin ridicarea aerului cald peste aerul rece la nivelul solului.","long":"Aceasta descrie alt proces.","warn":""}]},{"number":"#21","text":"226: O perdea de copaci în faţa vântului provoacă:","short":"O perdea de copaci în fața vântului produce turbulențe și umbre de vânt în spatele copacilor.","long":"Copacii frânează aerul din față, dar în spatele lor apar vârtejuri și turbulențe, numite umbre de vânt, care pot fi periculoase la aterizare. Turbulența apare în special sub vânt, nu în partea din față.","answers":[{"text":"nu provoacă turbulenţe","correct":false,"short":"Nu provoacă turbulențe.","long":"Provoacă turbulențe.","warn":""},{"text":"creșteri în intensitate ale mișcării masei de aer","correct":false,"short":"","long":"Vântul este frânat, nu accelerat.","warn":""},{"text":"turbulenţe în partea vântului","correct":false,"short":"Turbulențe în partea vântului.","long":"Turbulența apare mai ales sub vânt.","warn":""},{"text":"turbulenţe şi “umbre de vânt” în spatele copacilor, sub vânt","correct":true,"short":"Turbulențe și umbre de vânt în spatele copacilor, sub vânt.","long":"Este descrierea corectă.","warn":""}]},{"number":"#22","text":"272: Pe panta următoare, veţi găsi cei mai buni curenți ascendenţi de dinamică:","short":"Cei mai buni curenți ascendenți dinamici se găsesc pe panta 1, conform figurii.","long":"Curenții dinamici apar pe pantele expuse vântului, unde aerul este forțat să urce. Alegerea pantei depinde de direcția vântului față de versant. Verifică figura, deoarece varianta corectă depinde de desen.","answers":[{"text":"în 1 si 2","correct":false,"short":"În 1 și 2.","long":"Varianta nu este cea corectă.","warn":""},{"text":"în 1 si 2","correct":false,"short":"În 1.","long":"Nu este varianta corectă; depinde de figură.","warn":""},{"text":"în 1","correct":true,"short":"În 2.","long":"Varianta nu este cea corectă.","warn":""},{"text":"în 2","correct":false,"short":"În 1 și 2.","long":"Varianta este dublată și nu este cea corectă.","warn":""}]},{"number":"#23","text":"315: Cantitatea de vapori de apă pe care aerul o poate reține depinde de:","short":"Cantitatea de vapori de apă pe care aerul o poate reține depinde de temperatura aerului.","long":"Aerul cald poate reține mult mai mult vapor decât aerul rece. De aceea, când aerul se răcește, vaporii în exces condensează. Temperatura punctului de rouă și sursa apei sunt mărimi diferite.","answers":[{"text":"temperatura punctului de rouă","correct":false,"short":"","long":"Punctul de rouă este o consecință a umidității, nu factorul care determină capacitatea.","warn":""},{"text":"temperatura aerului","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"sursa din care se evaporă apa","correct":false,"short":"","long":"Sursa nu determină capacitatea de reținere.","warn":""},{"text":"stabilitatea aerului","correct":false,"short":"","long":"Stabilitatea nu determină capacitatea de reținere.","warn":""}]},{"number":"#24","text":"314: Vântul care suflă spre vârful unui obstacol orografic, pe timp de zi, datorită încălzirii regiunilor joase ale acestuia, se numește:","short":"Vântul care suflă spre vârful unui obstacol pe timp de zi, datorită încălzirii versantului, se numește vânt anabatic.","long":"Ziua, versantul se încălzește și aerul din apropiere urcă. Acesta este vântul anabatic. Vântul catabatic este opusul, care coboară noaptea. Vântul de contrapantă și cel geostrofic sunt alte concepte.","answers":[{"text":"vânt catabatic","correct":false,"short":"","long":"Coboară de pe versant, noaptea.","warn":""},{"text":"vânt de contrapantă","correct":false,"short":"","long":"Nu este denumirea vântului descris.","warn":""},{"text":"vânt anabatic","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"vânt geostrofic","correct":false,"short":"","long":"Este vântul paralel cu izobarele, la altitudine.","warn":""}]},{"number":"#25","text":"268: O perdea de copaci în faţa vântului provoacă:","short":"O perdea de copaci în fața vântului produce turbulențe și umbre de vânt în spatele copacilor.","long":"Aceeași explicație ca la întrebarea 21: turbulențele apar sub vânt, în spatele copacilor, nu în față.","answers":[{"text":"turbulențele sunt neglijabile, deoarece frunzele copacilor atenuează viteza vântului","correct":false,"short":"Turbulențele sunt neglijabile, deoarece frunzele atenuează viteza vântului.","long":"Turbulența este semnificativă.","warn":""},{"text":"turbulenţe şi “umbre de vânt” în spatele copacilor, sub vânt","correct":true,"short":"Turbulențe și umbre de vânt în spatele copacilor, sub vânt.","long":"Este varianta corectă.","warn":""},{"text":"turbulenţe în partea vântului","correct":false,"short":"Turbulențe în partea vântului.","long":"Turbulența apare sub vânt.","warn":""},{"text":"nu provoacă turbulenţe","correct":false,"short":"Nu provoacă turbulențe.","long":"Provoacă turbulențe.","warn":""}]},{"number":"#26","text":"270: Puteţi întâlni turbulenţa de forfecare:","short":"Turbulența de forfecare apare când două mase de aer au direcții și caracteristici diferite.","long":"Forfecarea (wind shear) este schimbarea bruscă a vitezei sau direcției vântului pe o distanță scurtă. Apare la limita dintre două mase de aer diferite. Lățirea izobarelor, inversiunea sau decolarea altei aeronave nu sunt cauzele principale.","answers":[{"text":"într-o zonă în care izobarele se lărgesc","correct":false,"short":"","long":"Lărgirea izobarelor înseamnă vânt slab, nu forfecare.","warn":""},{"text":"când apare un strat de inversiune","correct":false,"short":"","long":"Inversiunea poate contribui, dar nu definește forfecarea.","warn":""},{"text":"atunci când o altă aeronavă mai mare decolează înaintea Dvs.","correct":false,"short":"","long":"Acesta este turbulența de siaj, nu forfecarea.","warn":""},{"text":"când două mase de aer au direcţii şi caracteristici diferite","correct":true,"short":"Când două mase de aer au direcții și caracteristici diferite.","long":"Este varianta corectă.","warn":""}]},{"number":"#27","text":"293: Ce este umiditatea absolută?","short":"Umiditatea absolută este cantitatea de vapori de apă pe unitatea de volum de aer.","long":"Umiditatea absolută se exprimă în g/m³ și arată câți grame de vapori sunt într-un metru cub de aer. Nu este procentul de apă din aer, nici raportul dintre apă și aer.","answers":[{"text":"umiditatea absolută măsoară umiditatea relativă a aerului la o temperatură constantă","correct":false,"short":"","long":"Aceasta este umiditatea relativă.","warn":""},{"text":"umiditatea absolută reprezintă raportul dintre cantitatea de apă și aer la o temperatură dată","correct":false,"short":"","long":"Este o formulare apropiată, dar varianta corectă este cantitatea pe unitatea de volum.","warn":""},{"text":"umiditatea absolută este cantitatea de vapori de apă pe unitatea de volum de aer","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"umiditatea absolută indică procentul de apă din compoziția totală a aerului","correct":false,"short":"","long":"Acesta nu este definiția umidității absolute.","warn":""}]},{"number":"#28","text":"253: Frontul atmosferic este:","short":"Frontul atmosferic este zona de contact între două mase de aer cu caracter termic diferit.","long":"La front se întâlnesc două mase de aer diferite ca temperatură și umiditate. Frontul este limita dintre ele, iar la trecerea lui apar schimbări de vreme. Nu este doar o linie de nori sau limita dintre ploaie și vreme bună.","answers":[{"text":"o formațiune de nori care indică trecerea de la un front cald la unul rece","correct":false,"short":"","long":"Frontul nu este doar o formațiune de nori.","warn":""},{"text":"zona de demarcaţie între ploaie şi timp frumos","correct":false,"short":"Zona de demarcație între ploaie și timp frumos.","long":"Aceasta este o descriere parțială, nu definiția.","warn":""},{"text":"linia de nori care apare când se răceşte vremea","correct":false,"short":"Linia de nori care apare când se răcește vremea.","long":"Frontul nu este definit doar de nori.","warn":""},{"text":"zona de contact între două mase de aer cu caracter termic diferit","correct":true,"short":"","long":"Este definiția corectă.","warn":""}]},{"number":"#29","text":"273: Veţi întâlni turbulenţe ce pot fi periculoase în cazul în care zburaţi prea aproape de relief","short":"Turbulențe periculoase apar când zbori prea aproape de relief, în zonele 3 și 4 din figură.","long":"Turbulențele puternice apar în zonele aflate sub vânt și în apropierea reliefului accidentat. Zonele indicate în figura sunt 3 și 4. Verifică figura pentru poziția exactă.","answers":[{"text":"în 1","correct":false,"short":"","long":"Varianta nu este cea corectă.","warn":""},{"text":"în 3 şi 4","correct":true,"short":"În 3 și 4.","long":"Depinde de figură.","warn":""},{"text":"în 1, 2 si 3","correct":false,"short":"În 1, 2 și 3.","long":"Varianta nu este cea corectă.","warn":""},{"text":"în 1 şi 2","correct":false,"short":"În 1 și 2.","long":"Varianta nu este cea corectă.","warn":""}]},{"number":"#30","text":"219: Avem în față un relief muntos cu spații puține de aterizare:","short":"În fața unui relief muntos cu puține spații de aterizare zburăm cu un con de siguranță, care permite aterizarea într-o zonă înainte sau după munți.","long":"Conul de siguranță este zona din care pilotul poate ajunge la un loc de aterizare în caz de urgență. În relief muntos, trebuie păstrat un con de siguranță, nu zboruri la altitudine mică prin văi sau în direcția respectivă.","answers":[{"text":"zburăm peste munți cu atentie și înălțime mică, să putem ateriza rapid în caz că se intensifică vântul","correct":false,"short":"Zburăm peste munți cu atenție și înălțime mică, să putem ateriza rapid în caz că se intensifică vântul.","long":"Zborul la altitudine mică peste munți este periculos.","warn":""},{"text":"nu zburăm în direcția respectivă","correct":false,"short":"","long":"Nu este varianta corectă; se poate zbura cu planificare.","warn":""},{"text":"zburăm cu con de siguranță care ne permite să aterizăm în caz de urgență într-o zonă anterioară munților sau după ei","correct":true,"short":"","long":"","warn":""},{"text":"zburăm prin văi la înalțime mică","correct":false,"short":"Zburăm prin văi la înălțime mică.","long":"Zborul prin văi la înălțime mică este periculos.","warn":""}]},{"number":"#31","text":"260: Vântul de vale produs în zonele de munte se mai numește:","short":"Vântul de vale produs în zonele de munte se mai numește vânt catabatic.","long":"Noaptea, aerul de pe versanți se răcește și coboară spre vale. Acest vânt descendent se numește catabatic. Briza și vântul anabatic au sensul opus sau sunt fenomene diferite.","answers":[{"text":"vânt catabatic","correct":true,"short":"","long":"","warn":""},{"text":"briză","correct":false,"short":"","long":"Briza este un fenomen de coastă sau de lac, nu vântul de munte.","warn":""},{"text":"undă orografică","correct":false,"short":"","long":"Este un fenomen de undă la munte, nu vântul de vale.","warn":""},{"text":"vânt anabatic","correct":false,"short":"","long":"Anabaticul urcă pe versant, pe timp de zi.","warn":""}]},{"number":"#32","text":"290: Conform legii lui Buys Ballot, dacă deriva este spre dreapta, ne îndreptăm înspre o zonă cu presiune:","short":"Conform legii lui Buys Ballot, dacă deriva este spre dreapta, ne îndreptăm spre o zonă cu presiune scăzută.","long":"Legea lui Buys Ballot (emisfera nordică): stând cu vântul în spate, presiunea scăzută se află în stânga. Varianta corectă indică presiunea scăzută ca zonă spre care se îndreaptă deriva spre dreapta, în conformitate cu această regulă.","answers":[{"text":"constantă","correct":false,"short":"","long":"Presiunea constantă nu definește direcția de deriva.","warn":""},{"text":"înaltă","correct":false,"short":"","long":"Presiunea înaltă este în partea opusă, conform legii.","warn":""},{"text":"scazută","correct":true,"short":"Scăzută.","long":"","warn":""},{"text":"variabilă","correct":false,"short":"","long":"Nu este varianta definită de lege.","warn":""}]},{"number":"#33","text":"264: Ce reprezintă înălţimea bazei (plafonul) norului?","short":"Înălțimea bazei norului (plafonul) este distanța de la suprafața solului până la baza norului.","long":"Plafonul este înălțimea cea mai joasă la care norii acoperă mai mult de jumătate din cer. Este important pentru zbor, deoarece limitează altitudinea și vizibilitatea. Vârful norului este altă mărime.","answers":[{"text":"distanţa de la suprafaţa solului până la baza norului","correct":true,"short":"Distanța de la suprafața solului până la baza norului.","long":"Este definiția corectă.","warn":""},{"text":"distanța de la motoparapantă și până la baza norului","correct":false,"short":"","long":"Plafonul se măsoară de la sol, nu de la aeronavă.","warn":""},{"text":"distanţa de la baza la vârful norului","correct":false,"short":"Distanța de la baza la vârful norului.","long":"Aceasta este grosimea norului.","warn":""},{"text":"partea cea mai înaltă a norului","correct":false,"short":"","long":"Aceasta este vârful norului.","warn":""}]},{"number":"#34","text":"309: Care este viteza aproximativă a unui vânt de 20 de noduri, exprimată în m/s?","short":"Un vânt de 20 de noduri este aproximativ 10 m/s.","long":"1 nod este 0,514 m/s, deci 20 de noduri înseamnă aproximativ 10,3 m/s. Varianta corectă este 10 m/s. Verifică conversia când planifici un zbor.","answers":[{"text":"10 m/s","correct":true,"short":"","long":"Este varianta corectă, aproximativ.","warn":""},{"text":"15 m/s","correct":false,"short":"","long":"Este prea mult pentru 20 de noduri.","warn":""},{"text":"12 m/s","correct":false,"short":"","long":"Este puțin peste valoarea corectă.","warn":""},{"text":"20 m/s","correct":false,"short":"","long":"Ar fi 20 m/s, adică aproximativ 39 de noduri.","warn":""}]},{"number":"#35","text":"307: Atmosfera standard internațională definește o scădere a presiunii atmosferice pe măsură ce înălțimea crește. Pentru piloții de aviație generală, aceasta este de aproximativ:","short":"La nivelul mării, presiunea standard este 1013 hPa, iar presiunea scade cu aproximativ 1 hPa pe fiecare 30 ft (aproximativ 8 m) în straturile joase.","long":"Varianta, „1015 hPa scăzând cu 30 hPa la 100 ft”, este greșită: 30 hPa pe 100 ft ar însemna o scădere de sute de hPa pe câțiva metri. Regula pilotului este 1 hPa la aproximativ 30 ft, iar presiunea standard la nivelul mării este 1013,25 hPa. Întrebarea conține o eroare.","answers":[{"text":"1013 hPa MSL scăzând cu 1hPa pe 30 ft","correct":false,"short":"1013 hPa MSL, scăzând cu 1 hPa pe 30 ft.","long":"Aceasta este regula corectă: 1013 hPa la nivelul mării, cu scădere de 1 hPa la aproximativ 30 ft.","warn":""},{"text":"1015 hPa MSL scăzând cu 30 hPa per 100 ft","correct":true,"short":"1015 hPa MSL, scăzând cu 30 hPa pe 100 ft.","long":"Este greșită: scăderea de 30 hPa pe 100 ft este imposibilă.","warn":"Acest răspuns este greșit: presiunea standard la nivelul mării este 1013,25 hPa, iar în straturile joase presiunea scade cu aproximativ 1 hPa la fiecare 30 ft (circa 8–9 m). Scăderea de 30 hPa la 100 ft nu are sens."},{"text":"1015 hPa MSL scăzând cu 1 hPa pe 30 ft","correct":false,"short":"1015 hPa MSL, scăzând cu 1 hPa pe 30 ft.","long":"Presiunea standard este 1013,25 hPa, nu 1015.","warn":""},{"text":"1013 hPa MSL scăzând cu 30 hPa pe 1 ft","correct":false,"short":"1013 hPa MSL, scăzând cu 30 hPa pe 1 ft.","long":"Valoarea este absurdă.","warn":""}]},{"number":"#36","text":"302: Care sunt proprietățile atmosferei ISA?","short":"În atmosfera standard internațională (ISA), presiunea la nivelul mării este 1013,25 mb, iar temperatura este +15°C.","long":"ISA este o atmosferă de referință, cu valori standard: presiune 1013,25 hPa, temperatură 15°C la nivelul mării, scădere de temperatură cu altitudinea și densitate de 1,225 kg/m³ la nivelul mării. Celelalte variante contrazic aceste valori.","answers":[{"text":"în atmosfera ISA, presiunea la nivelul mării este de 1013.25 mb și temperatura este de +15°C","correct":true,"short":"Umiditatea în atmosfera ISA crește proporțional cu altitudinea.","long":"Umiditatea nu crește cu altitudinea în ISA.","warn":""},{"text":"umiditatea în atmosfera ISA crește proporțional cu altitudinea","correct":false,"short":"În atmosfera ISA, presiunea la nivelul mării este de 1013,25 mb, iar temperatura este de +15°C.","long":"Este varianta corectă.","warn":""},{"text":"temperatura atmosferei ISA rămâne constantă de la nivelul mării până la 11 km altitudine","correct":false,"short":"Temperatura în ISA rămâne constantă de la nivelul mării până la 11 km.","long":"În ISA temperatura scade cu altitudinea.","warn":""},{"text":"atmosfera ISA are o densitate constantă la toate altitudinile","correct":false,"short":"","long":"Densitatea scade cu altitudinea.","warn":""}]},{"number":"#37","text":"301: Care este densitatea atmosferei ISA?","short":"Densitatea atmosferei ISA la nivelul mării este de 1,225 kg/m³, adică 1225 g/m³.","long":"Varianta cu 1,225 g/m³ are o eroare de unitate: valoarea corectă este 1,225 kg/m³ (adică 1225 g/m³, cum apare la întrebarea 61). Reține valoarea 1,225 kg/m³.","answers":[{"text":"densitatea atmosferei ISA la nivelul mării este de 1.225 g/m³","correct":true,"short":"Densitatea atmosferei ISA la nivelul mării este de 1,225 g/m³.","long":"Are unitatea greșită; valoarea corectă este 1,225 kg/m³.","warn":"Unitatea este greșită: densitatea aerului ISA la nivelul mării este 1,225 kg/m³, adică 1225 g/m³. Varianta cu 1,225 g/m³ are unitatea greșită."},{"text":"Densitatea atmosferei ISA la nivelul mării este de 0.1225 g/m³","correct":false,"short":"Densitatea atmosferei ISA la nivelul mării este de 0,1225 g/m³.","long":"Valoarea este greșită.","warn":""},{"text":"Densitatea atmosferei ISA la nivelul mării este de 1.225 kg/m³","correct":false,"short":"Densitatea atmosferei ISA la nivelul mării este de 1,225 kg/m³.","long":"Aceasta este valoarea corectă.","warn":""},{"text":"Densitatea atmosferei ISA la nivelul mării este de 12.25 g/m³","correct":false,"short":"Densitatea atmosferei ISA la nivelul mării este de 12,25 g/m³.","long":"Valoarea este greșită.","warn":""}]},{"number":"#38","text":"287: Vântul catabatic poate fi întâlnit:","short":"Vântul catabatic apare în zonele de dealuri și de munte, coborând pe pantele munților noaptea și în cursul dimineții.","long":"Pe timp de noapte, pantele se răcesc și aerul rece, mai greu, coboară spre vale. Acesta este vântul catabatic. Apare în special în zonele montane, nu doar în zonele polare, costiere sau deșertice.","answers":[{"text":"exclusiv în zonele polare, unde temperaturile extrem de scăzute influențează mișcările de aer","correct":false,"short":"Exclusiv în zonele polare.","long":"Nu este exclusiv polar.","warn":""},{"text":"numai în zonele costiere, ca rezultat al diferențelor de temperatură între apă și uscat","correct":false,"short":"Numai în zonele costiere.","long":"Este specific brizelor de coastă.","warn":""},{"text":"în zonele de dealuri și de munte, coborând pe pantele munților noaptea și în cursul dimineții","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"doar în regiunile deșertice, unde variațiile mari de temperatură între zi și noapte generează vânturi puternice","correct":false,"short":"Doar în regiunile deșertice.","long":"Nu este limitat la deșert.","warn":""}]},{"number":"#39","text":"311: Vântul de forfecare este:","short":"Vântul de forfecare este schimbarea bruscă, pe verticală și orizontală, a vitezei și direcției vântului.","long":"Forfecarea (wind shear) înseamnă că vântul se schimbă brusc pe o distanță scurtă, pe verticală sau pe orizontală. Este periculoasă la decolare și la aterizare. Nu înseamnă doar o creștere de viteză sau vântul care coboară pe munte.","answers":[{"text":"vântul care curge spre baza versanților unui munte, întâlnit în special în Alpi","correct":false,"short":"","long":"Aceasta descrie vântul catabatic.","warn":""},{"text":"schimbarea bruscă pe verticală și orizontală a vitezei și direcției vântului","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"o schimbare a vitezei vântului de peste 30 km/h","correct":false,"short":"","long":"Definiția nu depinde de un prag fix.","warn":""},{"text":"o creștere ușoară a vitezei vântului la altitudini de peste 12000 ft","correct":false,"short":"O creștere ușoară a vitezei vântului la altitudini de peste 12 000 ft.","long":"Aceasta nu este forfecarea.","warn":""}]},{"number":"#40","text":"278: Frontul rece de ordinul 2 este?","short":"Frontul rece de ordinul 2 este frontul în care, de-a lungul părții superioare a suprafeței sale, se observă descendența aerului cald.","long":"Frontul rece de ordinul II (cu aer cald în ascensiune pe suprafața frontală) are aer cald care coboară pe partea superioară a frontului. Varianta corectă indică această descriere. Pentru detalii consultă un manual de meteorologie.","answers":[{"text":"frontul rece de ordinul II este frontul caracterizat prin nebulozitatea și precipitațiile de lungă durată","correct":false,"short":"Frontul caracterizat prin nebulozitate și precipitații de lungă durată.","long":"Aceasta descrie frontul cald, nu ordinul II al frontului rece.","warn":""},{"text":"frontul rece de ordinul II este frontul în care de-a lungul părții inferioare a suprafeței acestuia se observă ascendența aerului cald","correct":false,"short":"Frontul în care de-a lungul părții inferioare a suprafeței se observă ascendența aerului cald.","long":"Descrierea nu corespunde ordinului II.","warn":""},{"text":"frontul rece de ordinul II este frontul cu o viteză de deplasare foarte mică","correct":false,"short":"Frontul cu o viteză de deplasare foarte mică.","long":"Viteza de deplasare nu definește ordinul.","warn":""},{"text":"frontul rece de ordinul II este frontul în care de-a lungul părții superioare a suprafeței acestuia se observă descendența aerului cald","correct":true,"short":"Frontul în care de-a lungul părții superioare a suprafeței se observă descendența aerului cald.","long":"","warn":""}]},{"number":"#41","text":"271: Îngustarea văilor poate duce la:","short":"Îngustarea văilor poate duce la accelerarea vântului care bate în axa lor.","long":"Ca și la efectul Venturi, vântul din axul unei văi care se îngustează accelerează, pentru că trece prin secțiune mai mică. Nu are efect nul și nu încetinește vântul în axă.","answers":[{"text":"accelerarea vântului care bate în axa lor","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"nu are nici un efect asupra circulaţiei vântului","correct":false,"short":"Nu are niciun efect asupra circulației vântului.","long":"Are efect, prin accelerare.","warn":""},{"text":"poate crea ceață la temperaturi mari","correct":false,"short":"","long":"Nu este efectul îngustării văii.","warn":""},{"text":"încetinirea vântului care bate în axa lor","correct":false,"short":"","long":"Este opusul efectului corect.","warn":""}]},{"number":"#42","text":"269: Se numeşte zonă de forfecare:","short":"Zona de forfecare este o zonă de întâlnire a unor mase de aer care poate provoca turbulențe puternice.","long":"Zona de forfecare este unde două mase de aer cu viteze sau direcții diferite se întâlnesc, cu turbulență intensă. Nu este o zonă în care zborul este liber de probleme, nici una în care turbulența rupe suspantele, nici o zonă de izobare restrânse.","answers":[{"text":"o zonă de intalnire a unor mase de aer ce riscă să provoace turbulenţe puternice","correct":true,"short":"O zonă de întâlnire a unor mase de aer care poate provoca turbulențe puternice.","long":"Este definiția corectă.","warn":""},{"text":"o zonă în care se poate zbura fară probleme cu aripile omologate","correct":false,"short":"O zonă în care se poate zbura fără probleme cu aripile omologate.","long":"Zona nu este fără probleme.","warn":""},{"text":"o zonă în interiorul căreia violenţa turbulenţelor este atât de mare încât riscă să provoace ruperea suspantelor","correct":false,"short":"O zonă în care violența turbulențelor riscă să rupă suspantele.","long":"Descrierea este exagerată și nu definește forfecarea.","warn":""},{"text":"o zonă unde izobarele se restrâng","correct":false,"short":"","long":"Restrângerea izobarelor înseamnă vânt mai puternic, nu forfecare.","warn":""}]},{"number":"#43","text":"299: Ce înseamnă deviația ISA?","short":"Deviația ISA este diferența dintre atmosfera reală și atmosfera standard ISA.","long":"Deviația ISA arată cât de mult diferă temperatura reală de cea standard la aceeași altitudine. Este folosită la calculul performanțelor. Densitatea, umiditatea sau presiunea nu definesc deviația.","answers":[{"text":"deviația ISA înseamnă diferența dintre atmosfera reală și ISA","correct":true,"short":"Diferența dintre atmosfera reală și ISA.","long":"Este definiția corectă.","warn":""},{"text":"deviația ISA este schimbarea densității aerului comparativ cu valorile ISA","correct":false,"short":"Schimbarea densității aerului comparativ cu valorile ISA.","long":"Este o consecință, nu definiția.","warn":""},{"text":"deviația ISA semnifică diferența de umiditate dintre atmosfera reală și standardul ISA","correct":false,"short":"Diferența de umiditate dintre atmosfera reală și standardul ISA.","long":"Deviația se referă la temperatură, nu la umiditate.","warn":""},{"text":"deviația ISA reprezintă variația presiunii atmosferice față de standardul ISA","correct":false,"short":"Variația presiunii atmosferice față de standardul ISA.","long":"Deviația este de temperatură, nu de presiune.","warn":""}]},{"number":"#44","text":"275: Indicaţi zonele cu “umbre de vânt”:","short":"Zonele cu umbre de vânt sunt marcate cu d în figura.","long":"Umbrele de vânt apar în spatele obstacolelor, pe partea de sub vânt. Figura arată zonele, iar varianta corectă este d. Verifică figura pentru a vedea cum se aplică.","answers":[{"text":"b","correct":false,"short":"","long":"Varianta nu este cea corectă.","warn":""},{"text":"a","correct":false,"short":"","long":"Varianta nu este cea corectă.","warn":""},{"text":"d","correct":true,"short":"","long":"Depinde de figură.","warn":""},{"text":"b și c","correct":false,"short":"","long":"Varianta nu este cea corectă.","warn":""}]},{"number":"#45","text":"234: În ce perioadă a zilei este recomandat zborul cu paramotorul, pentru ca atmosfera să fie cât mai calmă:","short":"Zborul cu paramotorul este recomandat dimineața și seara, când atmosfera este mai calmă.","long":"Dimineața și seara vântul este de regulă mai slab, iar convecția este redusă. La mijlocul zilei, termicele sunt intense și pot închide aripa. Zborul după apus sau fără condiții bune nu este recomandat.","answers":[{"text":"după apusul soarelui, dacă suntem echipați cu lumini de aviație","correct":false,"short":"","long":"Zborul de noapte este alt caz, cu restricții.","warn":""},{"text":"în mijlocul zilei, pentru a beneficia de termice","correct":false,"short":"","long":"Termicele de amiază pot fi turbulente.","warn":""},{"text":"orice perioadă este potrivită, chiar cu riscul unei închideri parțiale a aripii","correct":false,"short":"","long":"Riscul de închidere nu este acceptabil.","warn":""},{"text":"dimineața și seara","correct":true,"short":"","long":"Este varianta corectă.","warn":""}]},{"number":"#46","text":"224: Vântul laminar este:","short":"Vântul laminar este vântul care își păstrează direcția și intensitatea.","long":"Aceeași definiție ca la întrebarea 13: vântul laminar curge în straturi paralele, fără turbulență.","answers":[{"text":"vântul care nu permite decolarea","correct":false,"short":"","long":"Nu este definiția vântului laminar.","warn":""},{"text":"vântul care suferă variaţii datorită obstacolelor","correct":false,"short":"Vântul care suferă variații datorită obstacolelor.","long":"Acesta este vântul turbulent.","warn":""},{"text":"vântul care ia naştere prin convecţia aerului","correct":false,"short":"Vântul care ia naștere prin convecția aerului.","long":"Acesta este vântul convectiv.","warn":""},{"text":"vântul care îşi păstrează direcţia şi intensitatea","correct":true,"short":"Vântul care își păstrează direcția și intensitatea.","long":"Este definiția corectă.","warn":""}]},{"number":"#47","text":"319: În timpul aterizării, dacă o aeronavă are o viteză față de sol (GS) mai mare decât cea indicată (IAS) de vitezometrul acesteia, înseamnă că:","short":"Dacă viteza față de sol (GS) este mai mare decât viteza indicată (IAS) la aterizare, vântul suflă din spatele aeronavei.","long":"Viteza față de sol este viteza indicată plus componenta vântului din spate. Dacă vântul suflă din spate, GS este mai mare decât IAS. Temperatura și presiunea nu produc această diferență.","answers":[{"text":"temperatura ambientală este optimă","correct":false,"short":"","long":"Temperatura nu explică diferența.","warn":""},{"text":"vântul suflă din fața aeronavei","correct":false,"short":"","long":"Vântul din față ar scădea GS sub IAS.","warn":""},{"text":"vântul suflă din spatele aeronavei","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"presiunea atmosferică este mare","correct":false,"short":"","long":"Presiunea nu explică diferența.","warn":""}]},{"number":"#48","text":"318: Fenomenele meteorologice care reduc vizibilitatea se produc atunci când:","short":"Fenomenele care reduc vizibilitatea apar când diferența dintre temperatura aerului și punctul de rouă este mică.","long":"Când aerul se apropie de punctul de rouă, umiditatea relativă se apropie de 100%, iar ceața sau pâcla se formează ușor. Diferența mică între temperatura aerului și punctul de rouă arată că aerul este aproape saturat.","answers":[{"text":"diferența dintre temperatura punctului de rouă și temperatura aerului este mare","correct":false,"short":"","long":"Diferența mare înseamnă aer uscat, cu vizibilitate bună.","warn":""},{"text":"diferența dintre temperatura punctului de rouă și temperatura aerului este mică","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"temperatura punctului de rouă este mică","correct":false,"short":"","long":"Contează diferența, nu valoarea absolută.","warn":""},{"text":"temperatura punctului de rouă este mare","correct":false,"short":"","long":"Contează diferența, nu valoarea absolută.","warn":""}]},{"number":"#49","text":"220: Este ora 13 într-o zi de vară caldă cu cer senin. Cum abordăm zborul cu parapanta cu motor în acestă situație:","short":"La ora 13, într-o zi de vară cu cer senin, zborul cu paramotorul nu este interzis, dar nu este recomandat, din cauza termicelor care pot închide aripa.","long":"În această situație, termicele puternice pot închide aripa și pot duce la pierderea controlului. Zborul nu este interzis, dar cere atenție sporită și o înțelegere a comportamentului aripii în termice. Varianta reflectă această abordare.","answers":[{"text":"decolăm, dar nu ne ridicăm la înălțime mare și nu traversăm munți","correct":false,"short":"","long":"Măsurile de precauție sunt bune, dar nu descriu situația complet.","warn":""},{"text":"nu decolăm deoarece este interzis zborul cu parapanta cu motor în situația prezentată","correct":false,"short":"Nu decolăm, deoarece este interzis zborul cu paramotorul cu motor în această situație.","long":"Zborul nu este interzis.","warn":""},{"text":"acest zbor nu este interzis, însă nu este recomandat, trebuie acordată atenție sporită controlului parapantei încât curenții ascendenți termici pot cauza închideri necontrolate ale aripii","correct":true,"short":"Acest zbor nu este interzis, însă nu este recomandat; trebuie acordată atenție sporită controlului aripii, pentru că termicele pot cauza închideri necontrolate.","long":"","warn":""},{"text":"nu este nicio diferență față de zborul de seară sau de dimineață în vânt laminar","correct":false,"short":"Nu este nicio diferență față de zborul de seară sau de dimineață, în vânt laminar.","long":"Termicele de amiază fac diferența.","warn":""}]},{"number":"#50","text":"213: Cu ce fronturi sunt asociate vijeliile?","short":"Vijeliile sunt asociate cu fronturile reci de ordinul II.","long":"Vijeliile (squall lines) apar de obicei în fața frontului rece de ordinul II, unde aerul cald este împins brusc în sus și apar nori cumulonimbus și rafale. Fronturile staționare, ocluse și calde sunt asociate cu alte tipuri de vreme.","answers":[{"text":"fronturile staționare sunt asociate cu vijeliile","correct":false,"short":"","long":"Fronturile staționare dau vreme mai stabilă.","warn":""},{"text":"fronturile ocluse sunt cele mai frecvent asociate cu vijeliile","correct":false,"short":"","long":"Ocluziunea nu este cea mai frecventă asociere.","warn":""},{"text":"vijeliile sunt asociate cu fronturile reci de ordinul II","correct":true,"short":"","long":"","warn":""},{"text":"vijeliile sunt asociate cu fronturile calde","correct":false,"short":"","long":"Fronturile calde dau precipitații mai uniforme.","warn":""}]},{"number":"#51","text":"285: Cum sunt clasificați norii după formă?","short":"Norii sunt împărțiți în stratus, cirrus și cumulus pe baza formei lor.","long":"Clasificarea de bază a norilor se face după formă: stratiform (straturi), cumuliform (grămezi) și cirriform (fibre). Altitudinea și conținutul de apă sunt alte criterii, dar nu cel principal.","answers":[{"text":"norii sunt clasificați doar pe baza dimensiunii și densității lor","correct":false,"short":"","long":"Dimensiunea și densitatea nu sunt criteriul principal.","warn":""},{"text":"norii sunt împărțiți în stratus, cirrus și cumulus pe baza formei lor","correct":true,"short":"","long":"","warn":""},{"text":"clasificarea norilor se face pe baza conținutului lor de apă sau gheață","correct":false,"short":"Clasificarea norilor se face pe baza conținutului de apă sau gheață.","long":"Conținutul de apă nu este criteriul principal.","warn":""},{"text":"norii sunt clasificați în funcție de altitudinea la care se formează","correct":false,"short":"","long":"Altitudinea este un criteriu secundar.","warn":""}]},{"number":"#52","text":"300: Ce înseamnă ISA?","short":"ISA înseamnă International Standard Atmosphere.","long":"ISA (Intern
