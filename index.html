  <script type="application/json" id="manual-data">[{"id":"01","title":"Comunicații","questions":[{"number":"#1","text":"698: Care este instituția responsabilă cu eliberarea certificatului general de operator radiotelefonist?","short":"ANCOM (Autoritatea Națională pentru Administrare și Reglementare în Comunicații) eliberează certificatul general de operator radiotelefonist.","long":"Pentru a folosi o stație radio aeronautică (la bord sau la sol) trebuie să existe o persoană care deține certificatul de operator. Certificatul general permite operarea oricărei stații din serviciul aeronautic, iar ANCOM este autoritatea care îl emite și îl reglementează, prin decizii care stabilesc condițiile de examinare, valabilitatea și obligațiile titularului. Celelalte instituții din variante nu au atribuția de a certifica operatorii radio pentru aviație.","answers":[{"text":"CNA","correct":false,"short":"Consiliul Național al Audiovizualului, autoritatea pentru radio și televiziune.","long":"CNA reglementează conținutul audiovizual (radio și TV) și nu certifică operatorii de stații aeronautice.","warn":""},{"text":"SATCOM","correct":false,"short":"SATCOM, nume generic pentru comunicațiile prin satelit.","long":"SATCOM este o tehnologie de comunicare, nu o instituție care eliberează certificate.","warn":""},{"text":"CEDAM","correct":false,"short":"CEDAM, care nu are atribuții de certificare a operatorilor radio în aviație.","long":"Nu este autoritatea care eliberează certificatul general de operator radiotelefonist.","warn":""},{"text":"ANCOM","correct":true,"short":"ANCOM, autoritatea națională de reglementare în comunicații.","long":"ANCOM eliberează certificatele de operator radio și reglementează stațiile și frecvențele din România.","warn":""}]},{"number":"#2","text":"691: Cine are autoritatea de a controla serviciul fiecărei stații aeronautice?","short":"Serviciul fiecărei stații aeronautice este controlat de un operator care deține un certificat emis sau recunoscut de guvernul țării.","long":"Fiecare stație radio aeronautică trebuie să fie condusă de o persoană calificată. Certificatul de operator arată că persoana cunoaște procedurile de radiotelefonie, frazeologia și regulile de utilizare a frecvențelor. Certificatul trebuie să fie emis sau recunoscut de statul în care se află stația, deoarece fiecare țară aplică propriile reglementări.","answers":[{"text":"un inspector de zbor","correct":false,"short":"Un inspector de zbor, persoană care verifică aeronavele și pilotii.","long":"Inspectorii de zbor verifică pregătirea și aeronavele, nu conduc serviciul stațiilor radio.","warn":""},{"text":"un operator deținator al unui certificat emis sau recunoscut de guvernul țării respective","correct":true,"short":"Un operator care deține un certificat emis sau recunoscut de guvernul țării.","long":"Operatorul certificat răspunde de funcționarea corectă a stației și respectă procedurile de radiotelefonie.","warn":""},{"text":"un mecanic de avion","correct":false,"short":"Un mecanic de avion, specialist în întreținerea aeronavei.","long":"Mecanicul întreține aeronava, dar nu are atribuție asupra serviciului radio.","warn":""},{"text":"un pilot","correct":false,"short":"Un pilot, indiferent dacă are certificat de operator.","long":"Pilotul poate folosi stația doar dacă are certificatul de operator necesar.","warn":""}]},{"number":"#3","text":"715: Distanţa maximă până la care aveţi obligaţia de a menţine legătura radio cu organul de trafic prin spaţiul aerian controlat de acesta prin care vă deplasaţi către spaţiul aerian de clasă G este:","short":"Legătura radio cu organul de trafic se menține până la ieșirea din zona controlată, adică până la intrarea în spațiul de clasă G.","long":"Spațiul aerian de clasă G este necontrolat, deci în el nu este obligatorie comunicarea radio cu un organ de trafic. Din acest motiv, obligația de a menține legătura radio se termină în momentul în care aeronava părăsește zona controlată. Până atunci, pilotul trebuie să rămână pe frecvența organului de trafic, iar dacă pierde comunicarea trebuie să urmeze procedurile de pierdere a legăturii radio.\n\nClasa G este spațiu necontrolat: zborul VFR și IFR este permis, nu este obligatorie autorizarea ATC, iar serviciul furnizat este doar de informare a zborurilor. Din acest motiv comunicarea radio nu este obligatorie, dar este recomandată.","answers":[{"text":"nu este specificat","correct":false,"short":"Nu este specificat, pentru că regula nu există.","long":"Regula există și este stabilită în reglementările de trafic aerian, dar nu este specificată în întrebare.","warn":""},{"text":"până când organul de trafic va ordona schimbarea frecvenţei","correct":false,"short":"Până când organul de trafic ordonă schimbarea frecvenței.","long":"Schimbarea frecvenței este o instrucțiune de trafic, nu limita obligației de a menține legătura radio.","warn":""},{"text":"până la limita audibilităţii","correct":false,"short":"Până la limita audibilității semnalului radio.","long":"Audibilitatea depinde de condiții tehnice și nu este criteriul legal pentru această obligație.","warn":""},{"text":"până la ieşirea din zona controlată","correct":true,"short":"Până la ieșirea din zona controlată.","long":"În clasa G legătura radio nu este obligatorie, deci obligația încetează la ieșirea din zona controlată.","warn":""}]},{"number":"#4","text":"762: Ce informații trebuie incluse într-un mesaj de urgență „PAN, PAN”?","short":"Un mesaj PAN PAN trebuie să conțină detaliile problemei de siguranță și asistența solicitată.","long":"PAN PAN indică o situație de urgență care nu este imediat periculoasă, dar cere ajutor. Mesajul trebuie să spună cine ești (indicativul), ce problemă ai și ce ajutor ceri, plus poziția și intențiile. Informațiile despre numărul de pasageri sau despre destinație nu sunt esențiale pentru urgență.","answers":[{"text":"timpul estimat până la destinație","correct":false,"short":"","long":"Este util în planul de zbor, dar nu este informația esențială a unui mesaj de urgență.","warn":""},{"text":"locația exactă a aeronavei","correct":false,"short":"","long":"Poziția este importantă, dar nu este singura informație cerută; problema și asistența trebuie spuse și ele.","warn":""},{"text":"detalii despre problema de siguranță și asistența solicitată","correct":true,"short":"Detaliile problemei de siguranță și asistența solicitată.","long":"Acestea spun controlorului ce se întâmplă și ce ajutor ai nevoie, ceea ce permite reacția corectă.","warn":""},{"text":"numărul de pasageri la bord","correct":false,"short":"","long":"Numărul de persoane poate fi cerut ulterior, dar nu este conținutul principal al mesajului.","warn":""}]},{"number":"#5","text":"728: Autorizarea de decolare se solicită de la:","short":"Autorizarea de decolare se solicită de la turnul de control (TWR).","long":"Turnul de control al aerodromului (TWR) coordonează circulația pe pistă și în vecinătatea aerodromului, inclusiv autorizările de decolare și aterizare. Dispecerul de sol (GND) se ocupă de rulare, iar serviciul de trafic oferă informații sau servicii de apropiere. Briefingul este o pregătire înaintea zborului și nu este un organ de control.","answers":[{"text":"turnul de control","correct":true,"short":"Turnul de control (TWR).","long":"TWR autorizează decolarea și aterizarea pe aerodromul respectiv.","warn":""},{"text":"dispecerul de sol","correct":false,"short":"","long":"Dispecerul de sol autorizează rularea pe platformă, nu decolarea.","warn":""},{"text":"serviciul de trafic","correct":false,"short":"","long":"Serviciul de trafic oferă informații și servicii, dar nu autorizează decolarea de pe pistă.","warn":""},{"text":"briefing","correct":false,"short":"Briefingul.","long":"Briefingul este o pregătire înainte de zbor și nu emite autorizații.","warn":""}]},{"number":"#6","text":"746: Ce termen desemnează faza de alarmă în codurile de urgență?","short":"Faza de alarmă se numește ALERFA.","long":"În serviciile de căutare și salvare există trei faze: INCERFA (incertitudine, nu se știe sigur dacă aeronava are o problemă), ALERFA (alarmă, există motive să se creadă că aeronava are probleme) și DETRESFA (pericol grav și iminent, aeronava are nevoie de ajutor imediat). Abrevierile sunt folosite în mesajele dintre organele de trafic și cele de căutare și salvare.","answers":[{"text":"PAN","correct":false,"short":"PAN, care este un mesaj de urgență, nu o fază.","long":"PAN PAN este un semnal de urgență pentru o problemă care nu este imediat periculoasă, nu o fază a alarmei.","warn":""},{"text":"ALERFA","correct":true,"short":"ALERFA, faza de alarmă.","long":"ALERFA este faza în care există motive să se creadă că aeronava are probleme și trebuie pornite măsurile de alarmare.","warn":""},{"text":"DETRESFA","correct":false,"short":"DETRESFA, faza de pericol grav și iminent.","long":"DETRESFA este faza cea mai gravă, când aeronava este în pericol și are nevoie de ajutor imediat.","warn":""},{"text":"INCERFA","correct":false,"short":"INCERFA, faza de incertitudine.","long":"INCERFA este faza inițială, când nu se știe sigur dacă aeronava are probleme.","warn":""}]},{"number":"#7","text":"784: Ce informații trebuie transmise către ATC de către o aeronavă care se pregătește să intre din spațiul necontrolat în spațiul controlat?","short":"Înainte de a intra în spațiul controlat, ATC trebuie să primească indicativul, poziția, altitudinea, ruta și destinația.","long":"Aceste informații permit controlorului să identifice aeronava, să știe unde se află și unde va merge și să decidă dacă poate intra în spațiul controlat. Lista este gândită pentru coordonarea traficului, nu pentru datele personale ale echipajului sau pentru date comerciale.","answers":[{"text":"Numărul de pasageri la bord, greutatea totală a aeronavei și durata zborului","correct":false,"short":"Numărul de pasageri, greutatea și durata zborului.","long":"Greutatea și pasagerii sunt date de siguranță din altă documentație; ATC are nevoie mai ales de identificare și poziție.","warn":""},{"text":"Indicativul aeronavei, poziția curentă, altitudinea, ruta intenționată și destinația","correct":true,"short":"Indicativul, poziția curentă, altitudinea, ruta intenționată și destinația.","long":"Acestea sunt informațiile care permit controlorului să identifice aeronava și să planifice intrarea în spațiul controlat.","warn":""},{"text":"Identitatea pilotului, certificatul de operator radio și licența de zbor","correct":false,"short":"Identitatea pilotului, certificatul de operator și licența de zbor.","long":"Documentele personale nu sunt transmise în mod normal prin radio către ATC.","warn":""},{"text":"Viteza actuală a aeronavei și condițiile meteo locale","correct":false,"short":"Viteza actuală și condițiile meteo locale.","long":"Viteza și meteo pot fi utile, dar nu formează setul minim de informații cerut la intrare.","warn":""}]},{"number":"#8","text":"772: Ce înseamnă abrevierea VOR?","short":"VOR înseamnă VHF Omnidirectional Range, un radiofar de navigație pe unde foarte scurte.","long":"VOR este un radiofar care emite pe frecvențe VHF (aprox. 108–118 MHz) și permite aeronavei să afle radialul pe care se află față de stație. Cuvântul „omnidirectional” înseamnă că semnalul se transmite în toate direcțiile, iar aeronava determină direcția din care îl primește.","answers":[{"text":"VHF Omnidirectional Range","correct":true,"short":"","long":"Denumirea corectă a radiofarului VOR.","warn":""},{"text":"Variable Orientation Range","correct":false,"short":"","long":"Denumirea nu există; VOR se referă la semnalul omnidirecțional.","warn":""},{"text":"Visual Omnidirectional Range","correct":false,"short":"","long":"Radiofarul nu funcționează vizual, ci prin semnale radio.","warn":""},{"text":"VHF Operational Range","correct":false,"short":"","long":"Denumirea corectă este Omnidirectional și nu Operational.","warn":""}]},{"number":"#9","text":"761: Ce înseamnă abrevierea ADS-B?","short":"ADS-B înseamnă Automatic Dependent Surveillance–Broadcast.","long":"ADS-B este un sistem prin care aeronava își transmite automat poziția, altitudinea și viteza, calculate pe baza GNSS (GPS). Este numit „dependent” pentru că depinde de sursa de navigație a bordului și „broadcast” pentru că informația este transmisă tuturor receptorilor din zonă, care pot fi alte aeronave sau stații la sol.","answers":[{"text":"Aeronautical Data System-Broadcast","correct":false,"short":"Aeronautical Data System–Broadcast.","long":"Nu este denumirea sistemului; ADS-B se referă la supraveghere dependentă automată.","warn":""},{"text":"Automatic Directional System-Broadcast","correct":false,"short":"Automatic Directional System–Broadcast.","long":"Sistemul nu este de direcție, ci de supraveghere a poziției.","warn":""},{"text":"Airborne Detection System-Broadcast","correct":false,"short":"Airborne Detection System–Broadcast.","long":"Denumirea nu este cea standard pentru ADS-B.","warn":""},{"text":"Automatic Dependent Surveillance-Broadcast","correct":true,"short":"Automatic Dependent Surveillance–Broadcast.","long":"Este denumirea oficială a sistemului de supraveghere prin transmitere automată a poziției.","warn":""}]},{"number":"#10","text":"708: Folosind scala de audibilitate “te aud cu 4 “înseamnă?","short":"Scara de audibilitate „te aud cu 4” înseamnă că mesajul se aude bine.","long":"Scara ICAO de lizibilitate are cinci niveluri: 5 înseamnă perfect audibil, 4 înseamnă bine audibil, 3 înseamnă audibil cu dificultate, 2 înseamnă audibil din când în când, iar 1 înseamnă neinteligibil. Scara măsoară cât de ușor se înțelege mesajul, nu intensitatea semnalului.","answers":[{"text":"te aud bine","correct":true,"short":"","long":"Nivelul 4 de pe scara ICAO corespunde unui mesaj bine audibil.","warn":""},{"text":"te aud cu zgomot de fond","correct":false,"short":"","long":"Zgomotul de fond afectează calitatea, dar nu este un nivel distinct al scalei ICAO.","warn":""},{"text":"te aud cu dificultate","correct":false,"short":"","long":"Aceasta corespunde nivelului 3 de pe scara ICAO.","warn":""},{"text":"nu te aud deloc","correct":false,"short":"","long":"Aceasta corespunde nivelului 1 de pe scara ICAO.","warn":""}]},{"number":"#11","text":"699: Pentru a limita interferențele produse de motorul motoparapantei dumneavoastră:","short":"Pentru a reduce interferențele produse de motor se folosește o bujie cu rezistență încorporată.","long":"Motorul cu aprindere produce impulsuri electrice care emit unde radio ce pot perturba receptorul stației. Bujia cu rezistență (supresor) atenuează aceste impulsuri la sursă. Celelalte variante nu rezolvă sursa interferenței: uleiul influențează funcționarea motorului, telefonul nu este cauza, iar o antenă mai puternică nu elimină zgomotul.","answers":[{"text":"utilizați o bujie cu rezistență încorporată","correct":true,"short":"Bujie cu rezistență încorporată.","long":"Atenuează impulsurile electrice care produc zgomot radio.","warn":""},{"text":"utilizați un ulei premium pentru motoarele in doi timpi","correct":false,"short":"Ulei premium pentru motoarele în doi timpi.","long":"Uleiul influențează lubrifierea, nu emisia de zgomot electric.","warn":""},{"text":"nu veți utiliza telefonul mobil în timpul zborului","correct":false,"short":"Nu se folosește telefonul mobil în zbor.","long":"Telefonul nu este sursa interferenței motorului; este o altă problemă.","warn":""},{"text":"utilizați o antenă mai puternică pentru stație","correct":false,"short":"O antenă mai puternică pentru stație.","long":"O antenă mai puternică nu elimină zgomotul produs de motor; poate chiar să-l amplifice.","warn":""}]},{"number":"#12","text":"765: Care este rolul unei stații de control al traficului aerian (ATC)?","short":"Un ATC gestionează și coordonează traficul aerian pentru a asigura siguranța zborurilor.","long":"Rolul controlului traficului aerian este să prevină coliziunile între aeronave și să organizeze fluxul de trafic, în special pe aerodrom și în spațiul controlat. Verificarea documentelor, inspecțiile de securitate sau bagajele sunt atribuții ale altor servicii.","answers":[{"text":"verificarea documentelor pasagerilor","correct":false,"short":"","long":"Documentele se verifică la alte controale, nu de ATC.","warn":""},{"text":"efectuarea inspecțiilor de securitate la sol","correct":false,"short":"","long":"Securitatea la sol este atribuția altor servicii.","warn":""},{"text":"gestionarea bagajelor pierdute","correct":false,"short":"","long":"Bagajele nu țin de atribuțiile ATC.","warn":""},{"text":"gestionarea și coordonarea traficului aerian pentru a asigura siguranța zborurilor","correct":true,"short":"","long":"Aceasta este funcția de bază a ATC.","warn":""}]},{"number":"#13","text":"718: La întreruperea comunicaţiei radio în spaţiul aerian în care transponderul este obligatoriu pilotul setează transponderul în:","short":"Dacă comunicațiile radio sunt întrerupte într-un spațiu în care transponderul este obligatoriu, se setează codul 7600.","long":"Codul 7600 semnalează pierderea comunicațiilor radio, astfel încât controlorii să știe că aeronava nu poate vorbi și să ia măsuri. Codul 7700 este pentru urgență generală, 7500 pentru intervenție ilicită la bord, iar 7777 este un cod rezervat intervențiilor militare și nu pierderii radioului.","answers":[{"text":"squak 7600","correct":true,"short":"Squawk 7600.","long":"Codul pentru pierderea comunicațiilor radio.","warn":""},{"text":"squak 7700","correct":false,"short":"Squawk 7700.","long":"Codul pentru urgență generală, folosit când există un pericol, nu doar un radio defect.","warn":""},{"text":"squak 7777","correct":false,"short":"Squawk 7777.","long":"Cod rezervat intervențiilor militare, nu pentru pierderea radioului.","warn":""},{"text":"squak 7500","correct":false,"short":"Squawk 7500.","long":"Codul pentru intervenție ilicită la bord, de exemplu deturnare.","warn":""}]},{"number":"#14","text":"714: La defectarea staţiei radio în zbor în spaţiul aerian de clasă G:","short":"Dacă stația radio se defectează în zbor în spațiul de clasă G, zborul continuă, pentru că nu este obligatorie comunicarea radio în acest spațiu.","long":"În clasa G nu există servicii de control obligatorii, deci nu este necesar să aterizezi sau să te întorci din cauza unei defecțiuni radio. Pilotul trebuie să zboare cu precauție, să respecte regulile VFR și să evite zonele controlate, unde comunicarea radio devine obligatorie și trebuie refăcută.\n\nClasa G este spațiu necontrolat: zborul VFR și IFR este permis, nu este obligatorie autorizarea ATC, iar serviciul furnizat este doar de informare a zborurilor. Din acest motiv comunicarea radio nu este obligatorie, dar este recomandată.","answers":[{"text":"aterizaţi de urgenţă pe cel mai adecvat teren situate în spaţiu clasa G","correct":false,"short":"Aterizați de urgență pe cel mai potrivit teren din spațiul G.","long":"Nu este necesar, dacă aeronava poate continua zborul în siguranță.","warn":""},{"text":"vă întoarceţi imediat la locul de decolare prin spaţiul clasa G","correct":false,"short":"Vă întoarceți imediat la locul de decolare.","long":"Întoarcerea nu este obligatorie în spațiul G și nu are justificare în sine.","warn":""},{"text":"vă continuaţi zborul în spaţiu clasa G","correct":true,"short":"Vă continuați zborul în spațiul clasa G.","long":"În clasa G comunicarea radio nu este obligatorie, deci zborul poate continua cu prudență.","warn":""},{"text":"se aterizează de urgență pe un aerodrom certificat","correct":false,"short":"","long":"Aterizarea de urgență nu este cerută doar de defecțiunea radioului.","warn":""}]},{"number":"#15","text":"752: Ce cod transponder este utilizat pentru a semnala o urgență medicală la bord?","short":"Pentru o urgență medicală la bord nu există un cod transponder specific.","long":"Codurile 7500, 7600 și 7700 au semnificații precise, iar 7000 este pentru zbor VFR normal. Pentru o urgență medicală nu există un cod dedicat; de obicei se comunică problema prin radio, iar dacă situația este gravă se folosește PAN PAN sau MAYDAY, în funcție de pericol.","answers":[{"text":"7600","correct":false,"short":"","long":"Este pentru pierderea comunicațiilor radio, nu pentru urgențe medicale.","warn":""},{"text":"7500","correct":false,"short":"","long":"Este pentru intervenție ilicită la bord, nu pentru probleme medicale.","warn":""},{"text":"nu există un cod specific pentru urgențe medicale","correct":true,"short":"","long":"Este varianta corectă: problema se comunică prin radio, nu printr-un cod dedicat.","warn":""},{"text":"7000","correct":false,"short":"","long":"Este codul pentru zborul VFR normal, nu pentru urgențe.","warn":""}]},{"number":"#16","text":"725: Informaţii privind audiţia se transmit cu numere care indică calitatea recepţiei semnificaţia cifrei „4” este:","short":"Nivelul 4 de audibilitate înseamnă că mesajul se aude bine.","long":"Pe scara ICAO, nivelul 4 corespunde unui mesaj „audibil” (ușor de înțeles). Nivelul 5 este perfect audibil, nivelul 3 este audibil cu dificultate, iar nivelul 2 este audibil din când în când, adică cu întreruperi.","answers":[{"text":"audibil","correct":true,"short":"","long":"Corespunde nivelului 4 de pe scara ICAO.","warn":""},{"text":"audibil cu întreruperi","correct":false,"short":"","long":"Corespunde nivelului 2, când mesajul se aude doar din când în când.","warn":""},{"text":"perfect audibil","correct":false,"short":"","long":"Corespunde nivelului 5.","warn":""},{"text":"audibil cu dificultate","correct":false,"short":"","long":"Corespunde nivelului 3.","warn":""}]},{"number":"#17","text":"710: Abrevierea pentru o zonă de control este:","short":"CTR este abrevierea pentru zona de control (Control Zone).","long":"CTR (Control Zone) este un spațiu aerian controlat în jurul unui aerodrom, de regulă de la sol până la o anumită altitudine. CTA (Control Area) este un spațiu controlat mai mare, aflat deasupra. Celelalte abrevieri nu sunt denumiri standard pentru zona de control.","answers":[{"text":"CTR","correct":true,"short":"CTR, zona de control.","long":"Este denumirea standard a spațiului controlat din jurul aerodromului.","warn":""},{"text":"CTA","correct":false,"short":"CTA, aria de control.","long":"CTA este un spațiu controlat, dar de regulă situat deasupra CTR.","warn":""},{"text":"AMR","correct":false,"short":"","long":"Nu este abrevierea unui spațiu controlat standard.","warn":""},{"text":"CTZ","correct":false,"short":"","long":"Nu este o abreviere standard a spațiului controlat.","warn":""}]},{"number":"#18","text":"736: Ce cod transponder este utilizat pentru a semnala o deturnare?","short":"Codul transponder 7500 semnalează o deturnare sau o intervenție ilicită la bord.","long":"7500 este cel mai grav cod de securitate și este folosit pentru deturnare sau intervenție ilicită. În unele regiuni, în funcție de situație, poate fi folosit și 7700. Codul 7000 este pentru zbor VFR normal, 7700 pentru urgență generală, iar 7600 pentru pierderea radioului.","answers":[{"text":"7000","correct":false,"short":"","long":"Este codul pentru zbor VFR normal.","warn":""},{"text":"7500","correct":true,"short":"","long":"Este codul pentru deturnare sau intervenție ilicită la bord.","warn":""},{"text":"7700","correct":false,"short":"","long":"Este codul pentru urgență generală, nu specific deturnării.","warn":""},{"text":"7600","correct":false,"short":"","long":"Este codul pentru pierderea comunicațiilor radio.","warn":""}]},{"number":"#19","text":"690: Ce documente sunt obligatorii pentru stațiile de radiocomunicații aeronautice?","short":"Pentru stațiile radio aeronautice sunt obligatorii licența de utilizare a frecvențelor și autorizația stației.","long":"Stația radio are nevoie de o licență pentru folosirea frecvențelor, emisă de autoritatea competentă (în România, ANCOM), și de o autorizație pentru stația în sine. Certificatul de garanție și pașaportul nu sunt documente de funcționare a stației, iar carnetul de sănătate nu are legătură cu radioul.","answers":[{"text":"certificat de garanție","correct":false,"short":"Certificatul de garanție.","long":"Atestă garanția echipamentului, nu dreptul de a funcționa.","warn":""},{"text":"carnet de sănătate","correct":false,"short":"Carnetul de sănătate.","long":"Nu are legătură cu funcționarea stației radio.","warn":""},{"text":"licența de utilizare a frecvențelor și autorizația stației","correct":true,"short":"","long":"Acestea sunt documentele care permit legal funcționarea stației.","warn":""},{"text":"pașaport","correct":false,"short":"Pașaportul.","long":"Pașaportul identifică persoana, nu autorizează stația.","warn":""}]},{"number":"#20","text":"777: Ce informații sunt necesare într-un mesaj de urgență „PAN, PAN”?","short":"Un mesaj PAN PAN trebuie să conțină detaliile problemei de siguranță și asistența solicitată.","long":"PAN PAN indică o urgență care nu este imediat periculoasă, dar cere ajutor. Mesajul trebuie să includă ce problemă există și ce sprijin ceri. Timpul până la destinație și numărul de pasageri pot fi cerute ulterior, dar nu sunt esențiale în primul mesaj.","answers":[{"text":"timpul estimat până la destinație","correct":false,"short":"","long":"Nu este informația principală a unui mesaj de urgență.","warn":""},{"text":"locația exactă a aeronavei","correct":false,"short":"","long":"Poziția este importantă, dar nu este singura informație cerută.","warn":""},{"text":"numărul de pasageri la bord","correct":false,"short":"","long":"Nu este informația esențială în primul mesaj.","warn":""},{"text":"detalii despre problema de siguranță și asistența solicitată","correct":true,"short":"Detaliile problemei de siguranță și asistența solicitată.","long":"Este informația care permite controlorului să reacționeze corect.","warn":""}]},{"number":"#21","text":"734: Dacă un pilot primeşte o instrucţiune pe care nu poate să o îndeplinească, va spune controlorului:","short":"Dacă nu poți executa o instrucțiune, spui „nu pot urma instrucțiunea”.","long":"Este fraza standard pentru a comunica controlorului că nu poți executa o instrucțiune, fără să folosești cuvinte care pot fi confundate. Răspunsurile „anulați” și „abort” nu sunt fraze standard pentru acest caz, iar „negativ” se folosește pentru a răspunde la întrebări cu da sau nu.","answers":[{"text":"anulaţi instrucţiunea","correct":false,"short":"Anulați instrucțiunea.","long":"Nu este fraza standard; controlorul nu anulează instrucțiunea din cauza ta.","warn":""},{"text":"negativ instrucţiunea","correct":false,"short":"Negativ instrucțiunea.","long":"„Negativ” înseamnă nu, la o întrebare, nu la o instrucțiune.","warn":""},{"text":"nu pot urma instrucţiunea","correct":true,"short":"Nu pot urma instrucțiunea.","long":"Este fraza standard pentru a spune că nu poți executa instrucțiunea.","warn":""},{"text":"abort","correct":false,"short":"","long":"Abort înseamnă întreruperea unei proceduri, nu refuzul unei instrucțiuni.","warn":""}]},{"number":"#22","text":"704: În cazul pierderii certificatului general de operator radiotelefonist:","short":"În cazul pierderii certificatului, se solicită în scris un nou certificat de la ANCOM.","long":"Certificatul de operator este emis de ANCOM, deci și duplicatul sau reeliberarea se solicită de la aceeași instituție, de regulă printr-o cerere scrisă. Aeroclubul nu emite certificate de operator radio, iar prelungirea nu înlocuiește un certificat pierdut. Verifică procedura actuală la ANCOM, deoarece formularele și cerințele pot fi actualizate.","answers":[{"text":"se va solicita, în scris, eliberarea unui nou certificat de la ANCOM","correct":true,"short":"Se solicită în scris un nou certificat de la ANCOM.","long":"Autoritatea care emite certificatul este și cea care îl reeliberează.","warn":""},{"text":"se va solicita, în scris, eliberarea unui nou certificat de la Aeroclubul României","correct":false,"short":"Se solicită în scris un nou certificat de la Aeroclubul României.","long":"Aeroclubul nu emite certificate de operator radio.","warn":""},{"text":"se va solicita, cu ocazia prelungirii valabilitații certificatului deținut eliberarea unui nou certificat","correct":false,"short":"Se solicită un nou certificat cu ocazia prelungirii valabilității.","long":"Prelungirea nu înlocuiește un certificat pierdut.","warn":""},{"text":"nu se va întreprinde nici o măsură întrucât există o bază de date cu operatorii certificați de ANCOM","correct":false,"short":"Nu se întreprinde nimic, pentru că există o bază de date ANCOM.","long":"Baza de date nu înlocuiește documentul; trebuie făcută o cerere.","warn":""}]},{"number":"#23","text":"694: Ce semnal se utilizează pentru identificarea stațiilor radio aeronautice?","short":"Stațiile radio aeronautice se identifică printr-un semnal de identificare format din litere.","long":"Fiecare stație are un semnal de identificare, folosit pentru a fi recunoscută de celelalte stații. Acest semnal are, de regulă, câteva litere, iar la radiofarurile de navigație se transmite și în cod Morse. Semnalele luminoase, de fum sau acustice nu sunt metode standard de identificare radio.","answers":[{"text":"semnal luminos","correct":false,"short":"","long":"Nu este metoda standard de identificare radio.","warn":""},{"text":"semnal de fum","correct":false,"short":"","long":"Nu este metoda standard de identificare radio.","warn":""},{"text":"semnal acustic","correct":false,"short":"","long":"Nu este metoda standard de identificare radio.","warn":""},{"text":"semnal de identificare format din 3-5 litere","correct":true,"short":"","long":"Este metoda corectă: stația se identifică printr-un cod scurt de litere.","warn":""}]},{"number":"#24","text":"774: Care este rolul unui operator de stație radio aeronautică cu certificat general?","short":"Operatorul cu certificat general poate opera pe orice frecvență din spectrul alocat serviciului aeronautic.","long":"Certificatul general dă dreptul de a opera stații în serviciul aeronautic pe toate frecvențele alocate acestui serviciu. Certificatul restrâns este limitat la frecvențele alocate exclusiv unui anumit serviciu. Restul variantelor descriu funcții care nu țin de certificat, cum ar fi inspecțiile sau controlul comunicațiilor.","answers":[{"text":"poate opera pe orice frecvență din spectrul alocat serviciului","correct":true,"short":"","long":"Este dreptul specific al certificatului general.","warn":""},{"text":"poate efectua inspecții ale stațiilor radio","correct":false,"short":"","long":"Inspecțiile țin de autoritate, nu de certificatul de operator.","warn":""},{"text":"poate opera doar pe frecvențele alocate exclusiv serviciului respectiv","correct":false,"short":"","long":"Aceasta descrie certificatul restrâns, nu cel general.","warn":""},{"text":"poate controla toate comunicațiile aer-sol","correct":false,"short":"","long":"Operatorul nu are, prin certificat, atribuția de a controla toate comunicațiile.","warn":""}]},{"number":"#25","text":"719: Ce semnifica termenul UTC?","short":"UTC înseamnă timpul universal coordonat.","long":"UTC (Coordinated Universal Time) este ora de referință folosită în aviație pentru a evita confuziile între fusuri orare. Planurile de zbor, NOTAM-urile și METAR-urile folosesc ora UTC.","answers":[{"text":"timpul decolării","correct":false,"short":"","long":"Nu este denumirea UTC; ora de decolare se exprimă tot în UTC, dar nu înseamnă asta.","warn":""},{"text":"timpul total de zbor anuntat","correct":false,"short":"Timpul total de zbor anunțat.","long":"Durata zborului nu are legătură cu abrevierea UTC.","warn":""},{"text":"timpul universal coordonat","correct":true,"short":"","long":"Este denumirea corectă a orei de referință.","warn":""},{"text":"ceasul timpului universal","correct":false,"short":"","long":"Denumirea nu este cea standard.","warn":""}]},{"number":"#26","text":"768: Ce termen desemnează faza de pericol în codurile de urgență?","short":"Faza de pericol se numește DETRESFA.","long":"DETRESFA este faza în care există pericol grav și iminent, iar aeronava are nevoie de ajutor imediat. Este faza cea mai gravă dintre cele trei (INCERFA, ALERFA, DETRESFA). PAN nu este o fază, ci un mesaj de urgență.","answers":[{"text":"INCERFA","correct":false,"short":"","long":"Faza de incertitudine, mai puțin gravă.","warn":""},{"text":"DETRESFA","correct":true,"short":"","long":"Faza de pericol grav și iminent.","warn":""},{"text":"ALERFA","correct":false,"short":"","long":"Faza de alarmă, între incertitudine și pericol.","warn":""},{"text":"PAN","correct":false,"short":"","long":"Un mesaj de urgență pentru probleme care nu sunt imediat periculoase.","warn":""}]},{"number":"#27","text":"756: Care este scopul principal al comunicațiilor radio în aviație?","short":"Scopul principal al comunicațiilor radio în aviație este siguranța și regularitatea zborului.","long":"Radioul permite coordonarea între aeronave și sol, transmiterea instrucțiunilor de trafic și semnalarea urgențelor. Toate acestea contribuie la siguranța zborului și la desfășurarea ordonată a traficului. Mesajele private și comunicarea cu pasagerii nu sunt scopul principal.","answers":[{"text":"raportarea incidentelor la sol","correct":false,"short":"Raportarea incidentelor de la sol.","long":"Este o utilizare secundară, nu scopul principal.","warn":""},{"text":"comunicarea cu pasagerii","correct":false,"short":"","long":"Nu este scopul principal al radioului de bord.","warn":""},{"text":"transmiterea mesajelor private","correct":false,"short":"","long":"Radioul aeronautic nu este folosit pentru mesaje private.","warn":""},{"text":"asigurarea siguranței și regularității zborului","correct":true,"short":"","long":"Este scopul principal al comunicațiilor radio.","warn":""}]},{"number":"#28","text":"773: Ce semnificație are expresia „distress signal”?","short":"„Distress signal” înseamnă un semnal de pericol grav și iminent.","long":"Semnalul de distres indică o situație în care aeronava este amenințată de un pericol grav și iminent și cere ajutor imediat. Nu este o schimbare de frecvență și nici o solicitare de rutină. Pentru situații mai puțin grave se folosește PAN PAN.","answers":[{"text":"schimbare de frecvență","correct":false,"short":"","long":"Nu are legătură cu semnalul de pericol.","warn":""},{"text":"semnal de pericol grav și iminent","correct":true,"short":"","long":"Este sensul corect al expresiei.","warn":""},{"text":"solicitare de asistență la sol","correct":false,"short":"","long":"Este mai aproape de PAN PAN, nu de distres.","warn":""},{"text":"semnal de urgență minoră","correct":false,"short":"","long":"Distresul este pentru pericol grav, nu pentru urgențe minore.","warn":""}]},{"number":"#29","text":"685: Ce semnifică codul transponder 7700?","short":"Codul transponder 7700 semnalează o urgență generală.","long":"7700 este codul de urgență generală, folosit când aeronava se află într-o situație de pericol. Nu înseamnă deturnare (7500), nici pierderea radioului (7600), iar schimbarea frecvenței nu are un cod dedicat.","answers":[{"text":"urgență generală","correct":true,"short":"","long":"Este semnificația corectă a codului 7700.","warn":""},{"text":"schimbarea frecvenței radio","correct":false,"short":"","long":"Nu există un cod transponder pentru aceasta.","warn":""},{"text":"deturnare","correct":false,"short":"","long":"Deturnarea este codul 7500.","warn":""},{"text":"pierderea comunicațiilor","correct":false,"short":"","long":"Pierderea comunicațiilor este codul 7600.","warn":""}]},{"number":"#30","text":"775: Ce termen desemnează o fază de alarmă în codurile de urgență?","short":"Faza de alarmă se numește ALERFA.","long":"ALERFA este faza în care există motive să se creadă că aeronava are probleme și trebuie pornite măsurile de alarmare. Este între INCERFA (incertitudine) și DETRESFA (pericol grav și iminent).","answers":[{"text":"PAN","correct":false,"short":"","long":"Un mesaj de urgență, nu o fază de alarmă.","warn":""},{"text":"INCERFA","correct":false,"short":"","long":"Faza de incertitudine, mai puțin gravă.","warn":""},{"text":"ALERFA","correct":true,"short":"","long":"Faza de alarmă, cu motive reale de îngrijorare.","warn":""},{"text":"DETRESFA","correct":false,"short":"","long":"Faza de pericol grav și iminent, mai gravă decât alarma.","warn":""}]},{"number":"#31","text":"729: Distanţa maximă până la care aveţi obligaţia de a menţine legătura radio cu organul de trafic prin spaţiul aerian controlat de acesta prin care vă deplasaţi către spaţiul aerian de clasă G este:","short":"Legătura radio cu organul de trafic se menține până la ieșirea din zona controlată.","long":"În spațiul de clasă G comunicarea radio nu este obligatorie. Din acest motiv, obligația de a menține legătura radio încetează când aeronava iese din zona controlată. Distanțele fixe, cum ar fi 10 NM, nu sunt criteriul legal.\n\nClasa G este spațiu necontrolat: zborul VFR și IFR este permis, nu este obligatorie autorizarea ATC, iar serviciul furnizat este doar de informare a zborurilor. Din acest motiv comunicarea radio nu este obligatorie, dar este recomandată.","answers":[{"text":"până la limita audibilităţii","correct":false,"short":"Până la limita audibilității.","long":"Audibilitatea nu este criteriul legal.","warn":""},{"text":"până la o distanță de minim 10NM","correct":false,"short":"Până la o distanță de minim 10 NM.","long":"Nu există o distanță fixă de 10 NM ca reper pentru această obligație.","warn":""},{"text":"până când organul de trafic va ordona schimbarea frecvenţei","correct":false,"short":"Până când organul de trafic ordonă schimbarea frecvenței.","long":"Schimbarea frecvenței este o instrucțiune, nu limita obligației.","warn":""},{"text":"până la ieşirea din zona controlată","correct":true,"short":"Până la ieșirea din zona controlată.","long":"Este limita corectă, pentru că în clasa G nu este obligatorie comunicarea radio.","warn":""}]},{"number":"#32","text":"697: Valabilitatea certificatului general de operator radiotelefonist este de:","short":"Certificatul general de operator radiotelefonist are valabilitate de 5 ani.","long":"Conform Deciziei ANCOM 543/2017, certificatul de operator este valabil 5 ani. Pentru reînnoire trebuie verificate condițiile actuale la ANCOM, deoarece cerințele pot fi actualizate. Celelalte perioade nu corespund reglementării actuale.","answers":[{"text":"2 ani","correct":false,"short":"","long":"Perioada nu corespunde reglementării actuale.","warn":""},{"text":"5 ani","correct":true,"short":"","long":"Este valabilitatea certificatului conform reglementării ANCOM.","warn":""},{"text":"1 an","correct":false,"short":"","long":"Perioada este prea scurtă pentru reglementarea actuală.","warn":""},{"text":"3 ani","correct":false,"short":"","long":"Perioada nu corespunde reglementării actuale.","warn":""}]},{"number":"#33","text":"688: Care sunt condițiile de vizibilitate minimă pentru zborurile VFR?","short":"Vizibilitatea minimă pentru zborurile VFR la altitudini mari este de 5 km.","long":"Cerințele de vizibilitate și de distanță față de nori depind de clasa spațiului aerian și de altitudine. Conform regulilor europene (SERA), la altitudini de peste 3000 ft AMSL, în clasa G, vizibilitatea minimă este de 5 km. Pentru altitudini mai mici există alte valori, așa că pilotul trebuie să verifice tabelul din reglementare pentru situația lui.","answers":[{"text":"8 km","correct":false,"short":"","long":"Nu este valoarea standard pentru această situație.","warn":""},{"text":"1.500 m","correct":false,"short":"","long":"Valoarea de 1.500 m apare pentru altitudini mai mici, nu ca minim general.","warn":""},{"text":"5 km","correct":true,"short":"","long":"Este valoarea corectă pentru situația din întrebare.","warn":""},{"text":"3.000 m","correct":false,"short":"","long":"Nu este valoarea cerută pentru această situație.","warn":""}]},{"number":"#34","text":"687: Folosind alfabetul fonetic ICAO, literele E, X și B se pronunță astfel:","short":"Pe alfabetul fonetic ICAO, E, X și B se pronunță Echo, X-ray, Bravo.","long":"Alfabetul fonetic ICAO este folosit pentru a evita confuziile între litere în radiotelefonie. E se spune Echo, X se spune X-ray, iar B se spune Bravo. Celelalte variante conțin cuvinte care nu fac parte din alfabetul oficial.","answers":[{"text":"Engage , Xerox, Baccalaureate","correct":false,"short":"Engage, Xerox, Baccalaureate.","long":"Cuvintele nu fac parte din alfabetul ICAO.","warn":""},{"text":"Echo, X-mas, Baboon","correct":false,"short":"","long":"X-mas și Baboon nu fac parte din alfabetul ICAO.","warn":""},{"text":"Easy, Xenon, Baby","correct":false,"short":"","long":"Cuvintele nu fac parte din alfabetul ICAO.","warn":""},{"text":"Echo, X-ray, Bravo","correct":true,"short":"","long":"Sunt cuvintele corecte din alfabetul fonetic ICAO.","warn":""}]},{"number":"#35","text":"733: În comunicarea sol aer dintre un controlor de trafic şi motoparapantă, controlorul întotdeauna va spune:","short":"Controlorul spune întâi indicativul aeronavei și apoi mesajul.","long":"În radiotelefonie, indicativul spus primul asigură că pilotul știe că mesajul îi este adresat. Mesajul apare după indicativ, iar pilotul trebuie să răspundă cu propriul indicativ. Ordinea inversă sau fără indicativ ar crea confuzie când mai multe aeronave ascultă aceeași frecvență.","answers":[{"text":"mesajul apoi indicativul aeronavei","correct":false,"short":"Mesajul, apoi indicativul.","long":"Ordinea corectă este indicativul primul, nu ultimul.","warn":""},{"text":"indicativul prima oară apoi mesajul","correct":true,"short":"Indicativul prima oară, apoi mesajul.","long":"Este ordinea standard a frazeologiei.","warn":""},{"text":"numele și mesajul","correct":false,"short":"","long":"În radiotelefonie se folosește indicativul, nu numele.","warn":""},{"text":"numai indicativul","correct":false,"short":"","long":"Mesajul trebuie transmis, nu doar indicativul.","warn":""}]},{"number":"#36","text":"759: Ce termen este folosit pentru a desemna o comunicare referitoare la siguranța unei aeronave sau persoane la bord?","short":"Comunicarea despre siguranța aeronavei sau a persoanelor la bord este un mesaj de urgență.","long":"Mesajele de urgență au prioritate după mesajele de primejdie și cuprind informații despre o problemă care afectează siguranța aeronavei sau a persoanelor. Mesajele de rutină și cele de servicii sunt pentru operarea obișnuită a zborului.","answers":[{"text":"mesaj de servicii","correct":false,"short":"","long":"Mesajele de servicii țin de operarea normală a zborului.","warn":""},{"text":"mesaj de primejdie","correct":false,"short":"","long":"Mesajele de primejdie sunt pentru pericol grav și iminent, de cel mai înalt nivel.","warn":""},{"text":"mesaj de rutină","correct":false,"short":"","long":"Mesajele de rutină nu afectează urgent siguranța.","warn":""},{"text":"mesaj de urgență","correct":true,"short":"","long":"Este categoria pentru comunicări despre siguranța aeronavei sau a persoanelor.","warn":""}]},{"number":"#37","text":"747: Ce informație este esențială într-un mesaj de primejdie?","short":"Într-un mesaj de primejdie, poziția aeronavei este informația esențială.","long":"Pentru ca serviciile de salvare să ajungă la aeronavă, trebuie știută poziția cât mai precis. Numărul de pasageri, altitudinea de croazieră și durata zborului sunt informații utile, dar nu sunt esențiale pentru localizare.","answers":[{"text":"numărul de pasageri","correct":false,"short":"","long":"Nu ajută la localizarea aeronavei.","warn":""},{"text":"altitudinea de croazieră","correct":false,"short":"","long":"Altitudinea ajută, dar nu este informația esențială pentru localizare.","warn":""},{"text":"poziția aeronavei","correct":true,"short":"","long":"Este informația esențială pentru ca ajutorul să ajungă la aeronavă.","warn":""},{"text":"durata estimată a zborului","correct":false,"short":"","long":"Nu ajută la localizarea imediată.","warn":""}]},{"number":"#38","text":"700: Sunteți în zbor, iar calitatea transmisiei şi a recepţiei scade datorită distanţei. În acest caz, puteți utiliza pentru a creşte calitatea transmisiei:","short":"Butonul squelch reduce zgomotul de fond, astfel încât semnalele slabe se aud mai clar.","long":"Squelch-ul blochează zgomotul atunci când nu există semnal util. Când calitatea scade din cauza distanței, ajustarea squelch-ului ajută la auzirea mesajelor, dar nu mărește raza de acțiune a stației. Volumul doar mărește sunetul, iar ANL și ON/OFF au alte funcții.","answers":[{"text":"butonul de volum","correct":false,"short":"","long":"Volumul mărește sunetul, nu calitatea semnalului.","warn":""},{"text":"butonul ANL","correct":false,"short":"","long":"ANL reduce zgomotul pe anumite tipuri de interferențe, nu este comanda corectă pentru această situație.","warn":""},{"text":"butonul ON|OFF","correct":false,"short":"Butonul ON/OFF.","long":"Pornește sau oprește stația, nu îmbunătățește recepția.","warn":""},{"text":"butonul squelch","correct":true,"short":"","long":"Ajustează pragul de zgomot, ajutând la auzirea semnalelor slabe.","warn":""}]},{"number":"#39","text":"706: Pe ce frecvenţa aveţi obligaţia legală să intraţi în legătură cu o aeronavă care vă interceptează?","short":"Pentru o aeronavă care vă interceptează, obligația legală este să intrați în legătură pe 121,5 MHz.","long":"121,5 MHz este frecvența internațională de urgență, ascultată de toate aeronavele și de serviciile de sol. Când o aeronavă de stat te interceptează, trebuie să folosești această frecvență pentru a stabili legătura. Celelalte frecvențe nu sunt cele de urgență.","answers":[{"text":"123","correct":false,"short":"123 MHz.","long":"Nu este frecvența de urgență pentru interceptare.","warn":""},{"text":"125,5","correct":false,"short":"125,5 MHz.","long":"Nu este frecvența de urgență pentru interceptare.","warn":""},{"text":"136,00","correct":false,"short":"136,00 MHz.","long":"Nu corespunde frecvenței de urgență pentru interceptare.","warn":""},{"text":"121,50","correct":true,"short":"121,50 MHz.","long":"Este frecvența internațională de urgență.","warn":""}]},{"number":"#40","text":"749: Ce înseamnă abrevierea ICAO?","short":"ICAO înseamnă International Civil Aviation Organization.","long":"ICAO este agenția Organizației Națiunilor Unite pentru aviația civilă. Stabilește standardele internaționale (Anexele) pe care statele membre le aplică, inclusiv regulile de radiotelefonie și de urgență.","answers":[{"text":"International Communications and Air Operations","correct":false,"short":"","long":"Nu este denumirea ICAO.","warn":""},{"text":"International Control and Air Observations","correct":false,"short":"","long":"Nu este denumirea ICAO.","warn":""},{"text":"International Civil Aeronautics Organization","correct":false,"short":"","long":"Denumirea este Civil Aviation, nu Civil Aeronautics.","warn":""},{"text":"International Civil Aviation Organization","correct":true,"short":"","long":"Este denumirea oficială a ICAO.","warn":""}]},{"number":"#41","text":"780: Cum se realizează comunicațiile în spațiul aerian necontrolat pentru evitarea coliziunilor?","short":"În spațiul necontrolat, aeronavele folosesc frecvențele VHF stabilite regional și ascultă frecvența TIBA.","long":"În spațiul necontrolat nu există un organ de control, deci aeronavele își transmit intențiile pe frecvența de informare a traficului (TIBA), stabilită regional. Ascultarea de veghe pe această frecvență ajută la evitarea coliziunilor. Radarul SSR și semnalele vizuale nu sunt sistemul principal de comunicare.","answers":[{"text":"aeronavele se bazează pe sistemele de radar de supraveghere secundară (SSR)","correct":false,"short":"Se bazează pe radarul SSR.","long":"SSR este pentru organele de control, nu pentru comunicarea între aeronave din spațiul necontrolat.","warn":""},{"text":"aeronavele comunică exclusiv prin semnale vizuale","correct":false,"short":"Comunică exclusiv prin semnale vizuale.","long":"Semnalele vizuale nu sunt sistemul principal.","warn":""},{"text":"aeronavele folosesc doar frecvențele ATC","correct":false,"short":"Folosesc doar frecvențele ATC.","long":"În spațiul necontrolat nu există ATC pe aceste frecvențe.","warn":""},{"text":"aeronavele utilizează frecvențele de radiocomunicații aeronautice VHF stabilite regional și mențin ascultarea de veghe pe frecvența TIBA","correct":true,"short":"Folosesc frecvențele VHF regionale și țin ascultarea de veghe pe TIBA.","long":"Este modul corect de a evita coliziunile în spațiul necontrolat.","warn":""}]},{"number":"#42","text":"731: Aflaţi în zbor, atunci când TWR ne comunică prin radio o informaţie, este necesar să confirmăm faptul că am recepţionat corect mesajul respectiv?","short":"Confirmarea corectă a unei informații primite de la turn este „confirm”.","long":"În frazeologia standard, când primești o instrucțiune sau o informație importantă trebuie să o repeți (readback) și să confirmi cu cuvântul „confirm”. Răspunsul „am copiat” sau „am înțeles” nu este frazeologia standard pentru această situație.","answers":[{"text":"este suficient să confirmăm prin răspunsul “am înţeles”","correct":false,"short":"Este suficient răspunsul „am înțeles”.","long":"Nu este frazeologia standard pentru confirmare.","warn":""},{"text":"da, prin răspunsul „am copiat!”","correct":false,"short":"Da, prin răspunsul „am copiat”.","long":"Nu este frazeologia standard.","warn":""},{"text":"trebuie să fim întotdeauna pe recepţie când ne aflăm într-o categorie de spaţiu aerian în care legătura radio este obligatorie","correct":false,"short":"Trebuie să fim mereu pe recepție, dar nu se confirmă.","long":"Recepția nu înlocuiește confirmarea mesajului.","warn":""},{"text":"da, prin răspunsul “confirm”","correct":true,"short":"Da, prin răspunsul „confirm”.","long":"Este frazeologia corectă pentru confirmarea informației.","warn":""}]},{"number":"#43","text":"711: Daca sunteţi în legătură cu un organ de trafic şi vi s-a oprit motorul în zbor veţi declara:","short":"Dacă motorul s-a oprit în zbor, se declară MAYDAY.","long":"MAYDAY este folosit pentru o situație de pericol grav și iminent, în care aeronava are nevoie de ajutor imediat. Pană de motor în zbor este de obicei o astfel de situație. Dacă aeronava mai este controlabilă și are timp suficient, pilotul poate declara PAN PAN. PAN PAN nu înlocuiește MAYDAY dacă pericolul devine iminent.","answers":[{"text":"PAN PAN","correct":false,"short":"","long":"Potrivit pentru situații controlabile, dar pană de motor în zbor este de obicei urgență de pericol.","warn":""},{"text":"EMERGENCY","correct":false,"short":"","long":"Nu este un mesaj standard ICAO pentru această situație.","warn":""},{"text":"MAY DAY","correct":true,"short":"MAYDAY.","long":"Este declarația standard pentru pericol grav și iminent, inclusiv pană de motor.","warn":""},{"text":"Nu se informeaza organul de trafic avem disponibil pentru aterizare un teren mare","correct":false,"short":"Nu se informează organul de trafic; avem disponibil un teren mare.","long":"Organul de trafic trebuie informat, indiferent de terenul disponibil.","warn":""}]},{"number":"#44","text":"705: Abrevierea WILCO semnifică:","short":"WILCO înseamnă că am înțeles mesajul și mă voi conforma.","long":"WILCO vine de la „will comply” și confirmă că pilotul a înțeles și va executa instrucțiunea. Nu înseamnă că aeronava va continua zborul pe o direcție sau că a rămas fără combustibil.","answers":[{"text":"am să continui zborul pe direcția din planul de zbor!","correct":false,"short":"Voi continua zborul pe direcția din planul de zbor.","long":"Nu este sensul abrevierii.","warn":""},{"text":"nu semnifică nimic","correct":false,"short":"","long":"WILCO are un sens standard.","warn":""},{"text":"am epuizat combustibilul și voi ateriza!","correct":false,"short":"Am epuizat combustibilul și voi ateriza.","long":"Nu este sensul abrevierii.","warn":""},{"text":"am înteles mesajul și mă voi conforma!","correct":true,"short":"Am înțeles mesajul și mă voi conforma.","long":"Este sensul corect: will comply.","warn":""}]},{"number":"#45","text":"742: Ce semnifică semnalul de urgență „PAN, PAN”?","short":"PAN PAN înseamnă o solicitare de asistență pentru o problemă de siguranță.","long":"PAN PAN indică o urgență care nu este imediat periculoasă, dar necesită asistență. Este folosit, de exemplu, pentru o problemă tehnică ce permite aeronavei să rămână controlabilă. Dacă pericolul devine iminent, trebuie folosit MAYDAY.","answers":[{"text":"solicitarea de asistență pentru o problemă de siguranță","correct":true,"short":"","long":"Este sensul corect al PAN PAN.","warn":""},{"text":"o solicitare de decolare imediată","correct":false,"short":"","long":"Nu este sensul PAN PAN.","warn":""},{"text":"o schimbare de frecvență radio","correct":false,"short":"","long":"Nu este sensul PAN PAN.","warn":""},{"text":"o situație de pericol grav și iminent","correct":false,"short":"","long":"Aceasta este MAYDAY, nu PAN PAN.","warn":""}]},{"number":"#46","text":"712: Când transmiteţi un mesaj de urgenta aveţi obligaţia să furnizaţi următoarele informaţii:","short":"Într-un mesaj de urgență trebuie să spui poziția curentă sau ultima poziție cunoscută, altitudinea și capul compas.","long":"Aceste trei informații permit serviciilor de salvare să localizeze și să estimeze zona în care se află aeronava. Distanța față de aerodromul de plecare, tipul avionului sau GPS-ul nu sunt, în mod standard, informațiile principale ale primului mesaj de urgență.","answers":[{"text":"distanţa şi poziţia fată de aerodromul de plecare","correct":false,"short":"Distanța și poziția față de aerodromul de plecare.","long":"Nu este informația standard pentru localizare.","warn":""},{"text":"tipul de avion si cantitatea de combustibil la bord","correct":false,"short":"Tipul de avion și cantitatea de combustibil.","long":"Sunt utile ulterior, dar nu sunt primele informații de localizare.","warn":""},{"text":"poziţia după GPS","correct":false,"short":"Poziția după GPS.","long":"Poziția contează, dar mesajul standard cere poziția, altitudinea și capul compas.","warn":""},{"text":"poziţia curentă sau ultima poziţie ştiută împreună cu înălţimea şi capul compas","correct":true,"short":"Poziția curentă sau ultima poziție cunoscută, împreună cu înălțimea și capul compas.","long":"Este informația standard pentru localizare.","warn":""}]},{"number":"#47","text":"721: Aţi intrat în legătură cu turnul de control al unui aeroport şi recepţionaţi mesajul “RAMÂNEȚI PE RECEPȚIE “, veţi răspunde înapoi:","short":"La „RĂMÂNEȚI PE RECEPȚIE” nu răspunzi, ci aștepți să fii rechemat.","long":"Când controlorul spune „rămâneți pe recepție”, îți cere să asculți frecvența și să aștepți. Nu răspunzi decât dacă controlorul cere un răspuns. Răspunsurile „ok”, „confirm” sau „rămân pe recepție” nu sunt cerute în acest caz.","answers":[{"text":"nu răspundeţi nimic, aşteptaţi să fiţi rechemaţi","correct":true,"short":"Nu răspundeți nimic, așteptați să fiți rechemați.","long":"Este răspunsul corect: asculți și aștepți.","warn":""},{"text":"ok","correct":false,"short":"","long":"Nu este răspunsul cerut în acest caz.","warn":""},{"text":"confirm","correct":false,"short":"","long":"Nu este răspunsul cerut în acest caz.","warn":""},{"text":"rămân pe recepţie","correct":false,"short":"Rămân pe recepție.","long":"Nu este răspunsul standard; ascultarea este implicită.","warn":""}]},{"number":"#48","text":"739: Ce termen este folosit pentru a desemna condițiile meteorologice de zbor instrumental?","short":"Condițiile meteorologice de zbor instrumental se numesc IMC.","long":"IMC (Instrument Meteorological Conditions) sunt condițiile în care vizibilitatea sau distanța față de nori nu permit zborul la vedere, deci zborul trebuie făcut după instrumente. VMC (la vedere) este opusul, iar IFR și VFR sunt reguli de zbor, nu condiții meteo.","answers":[{"text":"IFR","correct":false,"short":"","long":"Sunt regulile de zbor, nu condițiile meteo.","warn":""},{"text":"VMC","correct":false,"short":"","long":"Sunt condițiile de zbor la vedere, opusul IMC.","warn":""},{"text":"IMC","correct":true,"short":"","long":"Sunt condițiile meteo de zbor instrumental.","warn":""},{"text":"VFR","correct":false,"short":"","long":"Sunt regulile de zbor la vedere, nu condițiile meteo.","warn":""}]},{"number":"#49","text":"760: Ce este un ELT (Emergency Locator Transmitter)?","short":"ELT este un dispozitiv care transmite automat un semnal de urgență în caz de accident.","long":"ELT (Emergency Locator Transmitter) este un emițător care pornește automat la impact sau poate fi activat manual și transmite un semnal pe frecvențele de urgență, ajutând la localizarea aeronavei. Nu măsoară distanța, viteza sau direcția.","answers":[{"text":"un dispozitiv care oferă navigație direcțională","correct":false,"short":"Dispozitiv care oferă navigație direcțională.","long":"Aceasta este funcția altor echipamente, nu a ELT.","warn":""},{"text":"un dispozitiv care măsoară distanța față de sol","correct":false,"short":"Dispozitiv care măsoară distanța față de sol.","long":"ELT nu măsoară distanța.","warn":""},{"text":"un dispozitiv care măsoară viteza aeronavei","correct":false,"short":"Dispozitiv care măsoară viteza aeronavei.","long":"ELT nu măsoară viteza.","warn":""},{"text":"un dispozitiv care transmite automat un semnal de urgență în caz de accident","correct":true,"short":"Dispozitiv care transmite automat un semnal de urgență în caz de accident.","long":"Este funcția corectă a ELT.","warn":""}]},{"number":"#50","text":"686: Ce cod transponder este utilizat pentru a semnala pierderea comunicațiilor?","short":"Codul transponder 7600 semnalează pierderea comunicațiilor radio.","long":"Când radioul nu mai funcționează, codul 7600 îi anunță pe controlori că aeronava nu poate comunica vocal. Codul 7000 este pentru zbor VFR normal, 7700 pentru urgență generală, iar 7500 pentru deturnare.","answers":[{"text":"7000","correct":false,"short":"","long":"Este codul pentru zbor VFR normal.","warn":""},{"text":"7600","correct":true,"short":"","long":"Este codul pentru pierderea comunicațiilor radio.","warn":""},{"text":"7700","correct":false,"short":"","long":"Este codul pentru urgență generală.","warn":""},{"text":"7500","correct":false,"short":"","long":"Este codul pentru deturnare sau intervenție ilicită.","warn":""}]},{"number":"#51","text":"743: Ce procedură trebuie urmată în caz de pierdere a comunicațiilor radio?","short":"În caz de pierdere a comunicațiilor radio se setează transponderul pe 7600.","long":"Codul 7600 este procedura standard atunci când radioul este defect sau comunicarea nu mai este posibilă, pentru ca organele de trafic să știe situația. Oprirea transponderului ar face aeronava invizibilă radarului, iar 7500 și 7700 sunt pentru alte situații.","answers":[{"text":"setarea transponderului pe codul 7600","correct":true,"short":"","long":"Este procedura corectă.","warn":""},{"text":"setarea transponderului pe codul 7500","correct":false,"short":"","long":"7500 este pentru deturnare.","warn":""},{"text":"setarea transponderului pe codul 7700","correct":false,"short":"","long":"7700 este pentru urgență generală.","warn":""},{"text":"oprirea transponderului","correct":false,"short":"","long":"Oprirea îl face invizibil pentru radar și nu este procedura.","warn":""}]},{"number":"#52","text":"695: Folosirea staţiei radio la bord se face în baza:","short":"Stația radio de bord se folosește pe baza certificatului general de operator radiotelefonist.","long":"Certificatul general dă dreptul de a opera stația aeronavei. Stația nu poate fi folosită fără o pregătire, iar licența de pilot și certificatul de identificare a aeronavei nu sunt documente de operare a radioului.","answers":[{"text":"certificatului general de operator radiotelefonist","correct":true,"short":"","long":"Este documentul care permite operarea stației de bord.","warn":""},{"text":"licenţei staţiei de aeronavă şi certificatului restrâns de operator radiotelefonist","correct":false,"short":"Licenței stației de aeronavă și certificatului restrâns.","long":"Certificatul restrâns este limitat la un anumit serviciu.","warn":""},{"text":"stația radio la bord poate fi operată fără o pregătire prealabilă","correct":false,"short":"Stația poate fi operată fără o pregătire prealabilă.","long":"Operarea necesită pregătire și certificat.","warn":""},{"text":"licenţei de pilot şi a CI","correct":false,"short":"Licenței de pilot și a certificatului de identificare.","long":"Licența de pilot nu autorizează operarea radioului.","warn":""}]},{"number":"#53","text":"717: Pe ce frecvenţa comunicaţi cu o aeronava care vă interceptează:","short":"Frecvența de urgență pentru o aeronavă care vă interceptează este 121,5 MHz.","long":"121,5 MHz este frecvența internațională de urgență, folosită pentru interceptare și pentru situații de pericol. Celelalte frecvențe nu au acest rol.","answers":[{"text":"123,45","correct":false,"short":"123,45 MHz.","long":"Nu este frecvența de urgență.","warn":""},{"text":"129,4","correct":false,"short":"129,4 MHz.","long":"Nu este frecvența de urgență.","warn":""},{"text":"121,5","correct":true,"short":"121,5 MHz.","long":"Este frecvența internațională de urgență.","warn":""},{"text":"123,5","correct":false,"short":"123,5 MHz.","long":"Nu este frecvența de urgență.","warn":""}]},{"number":"#54","text":"730: Frecvenţele radio ale turnului de control ale aeroporturilor din Romania se publică în:","short":"Frecvențele radio ale turnurilor din România se publică în AIP România.","long":"AIP (Aeronautical Information Publication) este publicația oficială de informații aeronautice a unui stat. Conține frecvențele, spațiile aeriene și procedurile. Codul Aerian și alte acte normative nu sunt publicația care conține frecvențele.","answers":[{"text":"serviciul de trafic aerian naţional","correct":false,"short":"Serviciul de trafic aerian național.","long":"Serviciul nu publică frecvențele în această formă oficială.","warn":""},{"text":"AIP Romania","correct":true,"short":"AIP România.","long":"Este publicația oficială cu informații aeronautice.","warn":""},{"text":"Codul Aerian","correct":false,"short":"","long":"Reglementează zborul, dar nu publică frecvențele.","warn":""},{"text":"HG 912//2010 - Anexa 1","correct":false,"short":"HG 912/2010, Anexa 1.","long":"Este un act normativ, nu publicația cu frecvențe.","warn":""}]},{"number":"#55","text":"778: În spațiul aerian de clasă G, ce tipuri de zboruri sunt permise și ce serviciu de trafic aerian este furnizat?","short":"În spațiul de clasă G sunt permise zborurile IFR și VFR, iar serviciul furnizat este de informare a zborurilor.","long":"În clasa G nu există control, dar pot zbura atât zboruri VFR, cât și IFR. Organele de trafic oferă, la cerere, servicii de informare a zborurilor, nu control. Serviciul de control este rezervat spațiului controlat.\n\nClasa G este spațiu necontrolat: zborul VFR și IFR este permis, nu este obligatorie autorizarea ATC, iar serviciul furnizat este doar de informare a zborurilor. Din acest motiv comunicarea radio nu este obligatorie, dar este recomandată.","answers":[{"text":"Sunt permise doar zborurile IFR și se furnizează serviciul de alarmare","correct":false,"short":"Sunt permise doar zborurile IFR, iar serviciul este de alarmare.","long":"Zborurile VFR sunt permise, iar serviciul de alarmare nu este cel descris.","warn":""},{"text":"Sunt permise doar zborurile VFR și se furnizează serviciul de control al traficului aerian","correct":false,"short":"Sunt permise doar zborurile VFR, iar serviciul este de control.","long":"Zborurile IFR sunt permise, iar în clasa G nu se oferă control.","warn":""},{"text":"Sunt permise toate tipurile de zboruri și se furnizează serviciul de control de apropiere","correct":false,"short":"Sunt permise toate zborurile, iar serviciul este de control de apropiere.","long":"Controlul de apropiere nu se oferă în clasa G.","warn":""},{"text":"Sunt permise zborurile IFR și VFR și se furnizează serviciul de informare a zborurilor tuturor zborurilor care solicită acest lucru","correct":true,"short":"Sunt permise zborurile IFR și VFR, iar serviciul este de informare pentru cei care îl cer.","long":"Este descrierea corectă a clasei G.","warn":""}]},{"number":"#56","text":"709: Rămâi pe recepţie înseamnă:","short":"„Rămâi pe recepție” înseamnă să aștepți până ești rechemat.","long":"Instrucțiunea îți cere să asculți frecvența și să aștepți. Nu înseamnă să menții poziția, să schimbi frecvența sau să selectezi stand-by pe transponder.","answers":[{"text":"aşteaptă până te rechem","correct":true,"short":"Așteaptă până te rechem.","long":"Este sensul corect.","warn":""},{"text":"menţine poziţia","correct":false,"short":"Menține poziția.","long":"Nu este sensul expresiei.","warn":""},{"text":"schimba frecventa","correct":false,"short":"Schimbă frecvența.","long":"Nu este sensul expresiei.","warn":""},{"text":"selectează stand by la transponder","correct":false,"short":"Selectează stand-by la transponder.","long":"Nu are legătură cu expresia.","warn":""}]},{"number":"#57","text":"738: Ce document este esențial pentru desfășurarea unui zbor VFR?","short":"Pentru un zbor VFR, documentul esențial este planul de zbor.","long":"Planul de zbor informează organele de trafic despre intențiile zborului: ruta, altitudinea, durata și alternativele. El este obligatoriu în anumite situații VFR, de exemplu când zbori în anumite spații aeriene sau peste granițe. Celelalte documente nu sunt cele care reglementează zborul.","answers":[{"text":"planul de zbor","correct":true,"short":"","long":"Documentul care descrie intențiile zborului.","warn":""},{"text":"certificatul de garanție","correct":false,"short":"","long":"Atestă garanția, nu zborul.","warn":""},{"text":"carnetul de sănătate","correct":false,"short":"","long":"Nu este documentul de zbor.","warn":""},{"text":"pașaportul","correct":false,"short":"","long":"Identifică persoana, nu zborul.","warn":""}]},{"number":"#58","text":"732: Cum veţi solicita repetarea unui mesaj neînţeles?","short":"Pentru a cere repetarea unui mesaj, spui „repetați mesajul”.","long":"Este fraza standard pentru a cere repetarea unei informații. Expresiile „nu am înțeles” și „spuneți din nou” nu sunt frazeologia standard, iar „repetați vă rog” nu conține formularea corectă.","answers":[{"text":"repetaţi mesajul","correct":true,"short":"Repetați mesajul.","long":"Este fraza standard pentru a cere repetarea.","warn":""},{"text":"nu am înțeles","correct":false,"short":"","long":"Nu este frazeologia standard pentru a cere repetarea.","warn":""},{"text":"repetaţi vă rog","correct":false,"short":"Repetați vă rog.","long":"Nu este formularea standard.","warn":""},{"text":"spuneţi din nou mesajul","correct":false,"short":"Spuneți din nou mesajul.","long":"Nu este formularea standard.","warn":""}]},{"number":"#59","text":"757: Ce semnal trebuie emis în cazul unui pericol grav și iminent, care necesită asistență imediată?","short":"În caz de pericol grav și iminent se emite MAYDAY.","long":"MAYDAY este cuvântul de urgență pentru pericol grav și iminent, care cere ajutor imediat. Se repetă de trei ori. HELP, SOS și PAN nu sunt semnalul de primejdie în radiotelefonie.","answers":[{"text":"MAYDAY","correct":true,"short":"","long":"Este semnalul pentru pericol grav și iminent.","warn":""},{"text":"HELP","correct":false,"short":"","long":"Nu este semnalul standard de primejdie.","warn":""},{"text":"PAN","correct":false,"short":"","long":"Este pentru urgență care nu e imediat periculoasă.","warn":""},{"text":"SOS","correct":false,"short":"","long":"SOS este semnal Morse, nu semnal de primejdie în radiotelefonie.","warn":""}]},{"number":"#60","text":"767: Ce informații trebuie incluse în mesajele de primejdie?","short":"Un mesaj de primejdie trebuie să conțină poziția exactă, natura urgenței și asistența solicitată.","long":"Aceste informații permit serviciilor să ajungă rapid la aeronavă și să pregătească ajutorul potrivit. Timpul până la destinație, altitudinea de croazieră și numărul de pasageri sunt informații secundare.","answers":[{"text":"timpul estimat până la destinație","correct":false,"short":"","long":"Nu este informația esențială într-un mesaj de primejdie.","warn":""},{"text":"poziția exactă, natura urgenței și asistența solicitată","correct":true,"short":"","long":"Sunt informațiile esențiale.","warn":""},{"text":"altitudinea de croazieră","correct":false,"short":"","long":"Este informație secundară.","warn":""},{"text":"numărul de pasageri la bord","correct":false,"short":"","long":"Este informație secundară.","warn":""}]},{"number":"#61","text":"692: Care este ordinea de prioritate a comunicațiilor în serviciul mobil aeronautic?","short":"Apelurile și mesajele de primejdie au prioritatea cea mai mare în serviciul mobil aeronautic.","long":"Prioritatea comunicațiilor este stabilită pentru a proteja viețile. Apelurile de primejdie, mesajele de primejdie și traficul de primejdie trec înaintea tuturor celorlalte, inclusiv a mesajelor de serviciu, guvernamentale sau meteo.","answers":[{"text":"comunicări de serviciu","correct":false,"short":"Comunicările de serviciu.","long":"Au prioritate mai mică decât primejdia.","warn":""},{"text":"apeluri de primejdie, mesaje de primejdie și trafic de primejdie","correct":true,"short":"Apelurile de primejdie, mesajele de primejdie și traficul de primejdie.","long":"Sunt cele cu prioritatea cea mai mare.","warn":""},{"text":"mesaje guvernamentale","correct":false,"short":"Mesajele guvernamentale.","long":"Au prioritate mai mică decât primejdia.","warn":""},{"text":"mesaje meteo","correct":false,"short":"Mesajele meteo.","long":"Au prioritate mai mică decât primejdia.","warn":""}]},{"number":"#62","text":"783: Care sunt procedurile standard de comunicare atunci când o aeronavă intră din spațiul aerian necontrolat (clasa G) în spațiul aerian controlat (clasele A-E)?","short":"Înainte de a intra din spațiul G în spațiul controlat, trebuie să stabiliți contactul radio cu ATC și să obțineți autorizarea.","long":"Spațiul controlat (clasele A–E) necesită autorizare de la ATC. Aeronava trebuie să stabilească legătura radio, să raporteze intențiile și să aștepte aprobarea înainte de intrare. Schimbarea transponderului sau reducerea vitezei nu sunt procedura de intrare.\n\nClasa G este spațiu necontrolat: zborul VFR și IFR este permis, nu este obligatorie autorizarea ATC, iar serviciul furnizat este doar de informare a zborurilor. Din acest motiv comunicarea radio nu este obligatorie, dar este recomandată.","answers":[{"text":"Aeronava trebuie să schimbe transponderul pe codul 7000 și să continue zborul fără comunicare suplimentară","correct":false,"short":"Schimbați transponderul pe 7000 și continuați zborul fără comunicare.","long":"Intrarea în spațiul controlat cere autorizare și comunicare radio.","warn":""},{"text":"Aeronava trebuie să stabilească contact radio cu unitatea ATC corespunzătoare și să obțină autorizarea înainte de a intra în spațiul controlat","correct":true,"short":"Stabiliți contact radio cu unitatea ATC și obțineți autorizarea înainte de intrare.","long":"Este procedura corectă.","warn":""},{"text":"Aeronava trebuie să reducă viteza sub 250 noduri și să monitorizeze frecvența de urgență 121.5 MHz","correct":false,"short":"Reduceți viteza sub 250 noduri și monitorizați 121,5 MHz.","long":"Monitorizarea 121,5 nu înlocuiește autorizarea.","warn":""},{"text":"Aeronava trebuie să efectueze un raport de poziție și să aștepte instrucțiuni de la ATC","correct":false,"short":"Efectuați un raport de poziție și așteptați instrucțiuni.","long":"Așteptarea fără autorizare nu este procedura; trebuie cerută autorizarea.","warn":""}]},{"number":"#63","text":"696: Zburati în grup în spațiul G și ați pierdut legătura radio:","short":"Dacă ați pierdut legătura radio în grup, continuați zborul cu prudență și urmăriți grupul.","long":"În spațiul G, pierderea radioului nu obligă la aterizare. Dacă zbori în grup, continui zborul în siguranță, urmărind ceilalți piloți. Încercarea de a repara în zbor sau aruncarea stației sunt acțiuni nerecomandate.","answers":[{"text":"va continuați zborul prudent, zburând atent și urmărind grupul în continuare","correct":true,"short":"Continuați zborul prudent, urmărind grupul.","long":"Este procedura potrivită în spațiul G.","warn":""},{"text":"puneți comenzile în magneți și încercați să diagnosticați problema în zbor","correct":false,"short":"Puneți comenzile în magneți și diagnosticați problema în zbor.","long":"Nu este procedura recomandată.","warn":""},{"text":"aterizați de urgență pe cel mai apropiat teren disponibil","correct":false,"short":"Aterizați de urgență pe cel mai apropiat teren.","long":"Nu este necesar dacă zborul poate continua în siguranță.","warn":""},{"text":"aruncați stația radio încât dacă nu funcționează e doar balast","correct":false,"short":"Aruncați stația radio, este doar balast.","long":"Nu este o procedură recomandată.","warn":""}]},{"number":"#64","text":"701: Sunteți în zbor într-un CTR și nu sunteți sigur că stația radio pe care o aveți la bord functionează corect. In acest caz, veți:","short":"Într-un CTR cu stația nesigură, ceri turnului un control radio folosind frazeologia dedicată.","long":"Într-un CTR comunicarea este obligatorie. Dacă nu ești sigur că stația funcționează, ceri verificarea (radio check) de la TWR, folosind frazeologia standard. Continuarea zborului fără verificare sau trimiterea unor mesaje fără sens nu sunt proceduri corecte.","answers":[{"text":"continua zborul fără a mai interveni asupra stației","correct":false,"short":"Continuați zborul fără a mai interveni asupra stației.","long":"Într-un CTR nu este corect să continui fără verificare.","warn":""},{"text":"scoate antena stației și o montați înapoi pentru a reface emisia","correct":false,"short":"Scoateți antena și o montați înapoi.","long":"Nu este o procedură recomandată.","warn":""},{"text":"cere TWR un control radio utilizând frazeologia dedicată","correct":true,"short":"Cereți TWR un control radio folosind frazeologia dedicată.","long":"Este procedura corectă.","warn":""},{"text":"emite un mesaj oarecare pentru a verifica emisia stației","correct":false,"short":"Emiteți un mesaj oarecare pentru a verifica emisia.","long":"Mesajele fără sens nu sunt o verificare corectă.","warn":""}]},{"number":"#65","text":"693: Ce este un zbor VFR special?","short":"Un zbor VFR special este autorizat de ATC să zboare în condiții meteo sub valorile VMC.","long":"Zborul VFR special este o excepție, autorizată explicit de controlul traficului aerian, pentru zboruri care nu pot respecta valorile VMC obișnuite. Nu este zbor de instruire, zbor de urgență sau zbor IFR fără plan.","answers":[{"text":"un zbor de instruire","correct":false,"short":"","long":"Nu este definiția zborului VFR special.","warn":""},{"text":"un zbor de urgență","correct":false,"short":"","long":"Nu este definiția zborului VFR special.","warn":""},{"text":"un zbor VFR autorizat de controlul traficului aerian să se deruleze în condiții meteorologice cu valori inferioare condițiilor VMC","correct":true,"short":"Un zbor VFR autorizat de ATC să zboare sub valorile VMC.","long":"Este definiția corectă.","warn":""},{"text":"un zbor IFR fără plan de zbor","correct":false,"short":"","long":"Nu este definiția zborului VFR special.","warn":""}]},{"number":"#66","text":"764: Ce semnal se utilizează pentru a solicita asistență urgentă, dar fără a exista un pericol imediat?","short":"Pentru asistență urgentă fără pericol imediat se folosește PAN PAN.","long":"PAN PAN indică o urgență care nu este imediat periculoasă, dar cere sprijin. MAYDAY este rezervat pericolului grav și iminent. SOS și HELP nu sunt semnalele standard în radiotelefonie pentru această situație.","answers":[{"text":"SOS","correct":false,"short":"","long":"Nu este semnalul standard în radiotelefonie.","warn":""},{"text":"PAN, PAN","correct":true,"short":"PAN PAN.","long":"Este semnalul pentru urgență fără pericol imediat.","warn":""},{"text":"MAYDAY","correct":false,"short":"","long":"Este pentru pericol grav și iminent.","warn":""},{"text":"HELP","correct":false,"short":"","long":"Nu este semnalul standard în radiotelefonie.","warn":""}]},{"number":"#67","text":"722: Rămâi pe recepţie înseamnă:","short":"„Rămâi pe recepție” înseamnă să aștepți instrucțiuni și să rămâi atent la comunicațiile radio.","long":"Ești pus în așteptare și trebuie să asculți frecvența, pentru că urmează o instrucțiune. Nu înseamnă să menții direcția sau poziția și nici să selectezi stand-by la transponder.","answers":[{"text":"menţine directia","correct":false,"short":"Menține direcția.","long":"Nu este sensul expresiei.","warn":""},{"text":"aşteaptă instrucţiuni, ramai atent la comunicatiile radio","correct":true,"short":"Așteaptă instrucțiuni și rămâi atent la comunicațiile radio.","long":"Este sensul corect.","warn":""},{"text":"menţine poziţia","correct":false,"short":"Menține poziția.","long":"Nu este sensul expresiei.","warn":""},{"text":"selectează stand by la transponder","correct":false,"short":"Selectează stand-by la transponder.","long":"Nu are legătură cu expresia.","warn":""}]},{"number":"#68","text":"745: Ce document trebuie să aibă la bord o aeronavă pentru a opera legal în spațiul aerian?","short":"Aeronava trebuie să aibă la bord certificatul de înmatriculare pentru a opera legal.","long":"Certificatul de înmatriculare arată că aeronava este înregistrată și că are dreptul de a zbura. Pașaportul, permisul de conducere și certificatul de garanție nu sunt documente de înmatriculare ale aeronavei.","answers":[{"text":"pașaportul","correct":false,"short":"","long":"Este documentul persoanei, nu al aeronavei.","warn":""},{"text":"certificatul de înmatriculare","correct":true,"short":"","long":"Este documentul care dovedește înregistrarea aeronavei.","warn":""},{"text":"permisul de conducere","correct":false,"short":"","long":"Este pentru vehicule rutiere, nu pentru aeronave.","warn":""},{"text":"certificatul de garanție","correct":false,"short":"","long":"Atestă garanția, nu înregistrarea aeronavei.","warn":""}]},{"number":"#69","text":"781: Ce frecvență de radiocomunicații VHF este utilizată pentru comunicațiile aer-sol în cazul întreruperii temporare a serviciilor de trafic în spațiul aerian controlat?","short":"În cazul întreruperii serviciilor de trafic se folosește frecvența TIBA, stabilită regional.","long":"TIBA (Traffic Information Broadcast by Aircraft) este frecvența pe care aeronavele își transmit intențiile și poziția când nu există un organ de control. Ea este stabilită și comunicată regional, conform reglementărilor. Frecvențele de urgență 121,5 și 243,0 MHz nu sunt pentru aceasta.","answers":[{"text":"frecvența de control de aerodrom","correct":false,"short":"","long":"Nu mai funcționează când serviciile de trafic sunt întrerupte.","warn":""},{"text":"frecvența de urgență 243.0 MHz","correct":false,"short":"Frecvența de urgență 243,0 MHz.","long":"Este frecvență de urgență, nu pentru informare de rutină.","warn":""},{"text":"frecvența TIBA, stabilită și comunicată la nivel regional potrivit reglementărilor specifice aplicabile","correct":true,"short":"Frecvența TIBA, stabilită și comunicată regional.","long":"Este frecvența folosită în acest caz.","warn":""},{"text":"frecvența de urgență 121.5 MHz","correct":false,"short":"Frecvența de urgență 121,5 MHz.","long":"Este frecvența de urgență, nu cea de informare.","warn":""}]},{"number":"#70","text":"740: Ce înseamnă abrevierea NOTAM?","short":"NOTAM înseamnă Notice to Airmen.","long":"NOTAM este un aviz oficial, transmis piloților, care anunță modificări temporare sau importante: închideri de pistă, zone restricționate, instalații defecte. Piloții trebuie să-l consulte înainte de zbor.","answers":[{"text":"Notification of Aircraft Movement","correct":false,"short":"","long":"Nu este denumirea NOTAM.","warn":""},{"text":"Notice of Air Traffic","correct":false,"short":"","long":"Nu este denumirea NOTAM.","warn":""},{"text":"Notice to Airmen","
