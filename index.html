correct":true,"short":"","long":"Este denumirea corectă.","warn":""},{"text":"Navigation to Airfield","correct":false,"short":"","long":"Nu este denumirea NOTAM.","warn":""}]},{"number":"#71","text":"689: Ce înseamnă abrevierea VMC în contextul aviației?","short":"VMC înseamnă condiții meteorologice de zbor la vedere.","long":"VMC (Visual Meteorological Conditions) sunt condițiile în care pilotul poate vedea și evita obstacolele și alte aeronave. Sunt opusul condițiilor IMC, în care zborul se face după instrumente.","answers":[{"text":"vizibilitate minimă critică","correct":false,"short":"","long":"Nu este denumirea VMC.","warn":""},{"text":"condiții meteorologice de zbor la vedere","correct":true,"short":"","long":"Este denumirea corectă.","warn":""},{"text":"control de trafic aerian","correct":false,"short":"","long":"ATC este control de trafic aerian, nu VMC.","warn":""},{"text":"vizibilitate maximă critică","correct":false,"short":"","long":"Nu este denumirea VMC.","warn":""}]},{"number":"#72","text":"707: Frecvenţele radio a turnurilor de control din Romania sunt publicate în:","short":"Frecvențele turnurilor de control din România sunt publicate în AIP România.","long":"AIP România este publicația oficială cu informații aeronautice. Conține frecvențele, aerodromurile și spațiile aeriene. Celelalte surse nu sunt publicația oficială care le conține.","answers":[{"text":"AIP Romania","correct":true,"short":"AIP România.","long":"Este publicația oficială care conține frecvențele.","warn":""},{"text":"HG 912/2010 - Anexa 1","correct":false,"short":"HG 912/2010, Anexa 1.","long":"Este un act normativ, nu publicația cu frecvențe.","warn":""},{"text":"Regulamentul Circulaţiei Aeriene din România","correct":false,"short":"Regulamentul Circulației Aeriene din România.","long":"Reglementează zborul, dar nu publică frecvențele.","warn":""},{"text":"în manualul de operare al aeronavei","correct":false,"short":"","long":"Manualul conține proceduri ale aeronavei, nu frecvențele oficiale.","warn":""}]},{"number":"#73","text":"753: Care sunt semnalele vizuale folosite de o aeronavă pentru a indica o situație de urgență?","short":"Un semnal vizual de urgență este aprinderea și stingerea repetată a luminilor de aterizare.","long":"Semnalele vizuale permit comunicarea între aeronavă și sol când radioul nu funcționează. Aprinderea și stingerea repetată a luminilor sunt folosite ca semnal de urgență. Schimbarea culorii luminilor sau mișcarea eleroanelor nu sunt semnale standard.","answers":[{"text":"schimbarea culorii luminilor de navigație","correct":false,"short":"","long":"Nu este semnalul standard.","warn":""},{"text":"aprinderea și stingerea repetată a luminilor de aterizare","correct":true,"short":"","long":"Este semnalul vizual de urgență descris.","warn":""},{"text":"folosirea luminilor intermitente de navigație","correct":false,"short":"","long":"Luminile de navigație au rolul lor normal, nu semnal de urgență.","warn":""},{"text":"schimbarea poziției eleroanelor","correct":false,"short":"","long":"Nu este semnal vizual standard.","warn":""}]},{"number":"#74","text":"724: Staţiile radio de aviaţie au un domeniu de frecvenţă de:","short":"Radiostațiile de aviație funcționează între 118 și 135,975 MHz, cu un ecart de 8,33 kHz între canale.","long":"Benzile VHF aeronautice sunt între 118 și 136 MHz. Ecartul de 8,33 kHz permite mai multe canale în aceeași bandă, iar în Europa acest standard este folosit pe scară largă. Celelalte variante dau fie ecart greșit (25 kHz), fie domenii care nu corespund benzii aeronautice.","answers":[{"text":"118.000 MHz la 135.975 MHz cu un ecart între canale de 25 KHz","correct":false,"short":"118.000 MHz – 135,975 MHz, ecart de 25 kHz.","long":"Ecartul de 25 kHz este un standard vechi; în Europa se folosește ecartul de 8,33 kHz.","warn":""},{"text":"118.000 MHz la 135.975 Mhz cu un ecart între canale de 8.33 Khz","correct":true,"short":"118.000 MHz – 135,975 MHz, ecart de 8,33 kHz.","long":"Este varianta corectă pentru domeniu și ecart.","warn":""},{"text":"domeniul de frecvenţa se schimbă la fiecare 6 luni","correct":false,"short":"Domeniul se schimbă la fiecare 6 luni.","long":"Domeniul nu se schimbă periodic.","warn":""},{"text":"115000 MHz la 155000 MHz","correct":false,"short":"115.000 MHz – 155.000 MHz.","long":"Acest domeniu depășește banda aeronautică.","warn":""}]},{"number":"#75","text":"785: Cum trebuie să procedeze o aeronavă în cazul în care nu poate stabili contact radio cu ATC la intrarea din spațiul G în spațiul controlat?","short":"Dacă aeronava nu poate stabili contactul radio cu ATC la intrarea în spațiul controlat, rămâne în spațiul necontrolat și încearcă să restabilească legătura.","long":"Intrarea în spațiul controlat fără autorizare nu este permisă. Aeronava rămâne în spațiul necontrolat, continuă să încerce comunicarea și urmează procedurile de rămânere în afara spațiului controlat până când se stabilește contactul. Codul 7700 sau aterizarea nu sunt răspunsul standard la această problemă.","answers":[{"text":"Aeronava trebuie să seteze transponderul pe codul 7700 și să emită un mesaj de urgență","correct":false,"short":"Setează transponderul pe 7700 și emite un mesaj de urgență.","long":"7700 nu este codul pentru lipsa contactului la intrare.","warn":""},{"text":"Aeronava trebuie să se mențină în spațiul necontrolat și să încerce să restabilească contactul radio","correct":true,"short":"Rămâne în spațiul necontrolat și încearcă să restabilească contactul radio.","long":"Este procedura corectă.","warn":""},{"text":"Aeronava trebuie să continuie zborul conform planului de zbor depus, utilizând procedurile standard de pierdere a comunicațiilor","correct":false,"short":"Continuă zborul conform planului, folosind procedurile de pierdere a comunicațiilor.","long":"Pierderea comunicațiilor nu este aceeași situație cu lipsa autorizării de intrare.","warn":""},{"text":"Aeronava trebuie să aterizeze la cel mai apropiat aerodrom necontrolat","correct":false,"short":"Aterizează la cel mai apropiat aerodrom necontrolat.","long":"Aterizarea nu este procedura cerută în acest caz.","warn":""}]},{"number":"#76","text":"771: Ce termen este folosit pentru a desemna serviciile de telecomunicații fixe sau mobile accesibile publicului?","short":"Serviciile de telecomunicații fixe sau mobile accesibile publicului se numesc servicii publice de telecomunicații.","long":"Serviciile publice sunt cele pe care le poate folosi oricine, contra unei taxe sau gratuit, spre deosebire de cele private sau de securitate, rezervate unor utilizatori.","answers":[{"text":"servicii de telecomunicații de securitate","correct":false,"short":"","long":"Sunt rezervate unor utilizatori speciali.","warn":""},{"text":"servicii de telecomunicații de urgență","correct":false,"short":"","long":"Sunt pentru situații de urgență, nu pentru acces general.","warn":""},{"text":"servicii private de telecomunicații","correct":false,"short":"","long":"Sunt pentru un grup restrâns de utilizatori.","warn":""},{"text":"servicii publice de telecomunicații","correct":true,"short":"","long":"Sunt cele accesibile publicului.","warn":""}]},{"number":"#77","text":"723: Dacă sunteţi în legătură cu un organ de trafic şi vi s-a oprit motorul în zbor veţi declara:","short":"Dacă motorul s-a oprit în zbor, se declară MAYDAY.","long":"Pană de motor în zbor este, de regulă, o situație de pericol grav și iminent, deci se declară MAYDAY. Dacă aeronava mai este controlabilă și are timp suficient, poate fi folosit PAN PAN, dar MAYDAY este răspunsul standard pentru pană de motor.","answers":[{"text":"MAY DAY","correct":true,"short":"MAYDAY.","long":"Este declarația corectă pentru pană de motor în zbor.","warn":""},{"text":"veți ateriza de urgență și apoi veți raporta poziția TWR","correct":false,"short":"Voi ateriza de urgență și apoi raportez poziția turnului.","long":"Raportul trebuie făcut înainte de aterizare, prin mesajul de urgență.","warn":""},{"text":"PAN PAN","correct":false,"short":"","long":"Potrivit doar pentru situații controlabile, fără pericol iminent.","warn":""},{"text":"EMERGENCY","correct":false,"short":"","long":"Nu este un mesaj standard ICAO pentru această situație.","warn":""}]},{"number":"#78","text":"751: Ce semnificație are grupul de litere „SOS” în Codul Morse?","short":"În codul Morse, SOS înseamnă semnal de pericol.","long":"SOS (··· −−− ···) este semnalul internațional de primejdie în codul Morse. Este recunoscut oriunde și înseamnă că cel care îl transmite se află în pericol și are nevoie de ajutor.","answers":[{"text":"semnal de atenție","correct":false,"short":"","long":"Nu este sensul SOS.","warn":""},{"text":"semnal de urgență","correct":false,"short":"","long":"Aproape corect, dar SOS este în mod special semnal de pericol.","warn":""},{"text":"semnal de avertizare","correct":false,"short":"","long":"Nu este sensul SOS.","warn":""},{"text":"semnal de pericol","correct":true,"short":"","long":"Este sensul internațional al SOS.","warn":""}]},{"number":"#79","text":"748: Ce termen este folosit pentru o transmisie automată de un semnal de urgență?","short":"ELT este termenul pentru transmisia automată a unui semnal de urgență.","long":"ELT (Emergency Locator Transmitter) emite automat un semnal de localizare la accident. DME măsoară distanța, VOR oferă radial și ADF indică direcția spre un radiofar NDB.","answers":[{"text":"DME (Distance Measuring Equipment)","correct":false,"short":"","long":"Măsoară distanța, nu transmite semnal de urgență.","warn":""},{"text":"ELT (Emergency Locator Transmitter)","correct":true,"short":"","long":"Este dispozitivul care transmite automat semnalul de urgență.","warn":""},{"text":"VOR (VHF Omnidirectional Range)","correct":false,"short":"","long":"Este radiofar de navigație, nu de urgență.","warn":""},{"text":"ADF (Automatic Direction Finder)","correct":false,"short":"","long":"Indică direcția spre un radiofar, nu transmite urgență.","warn":""}]},{"number":"#80","text":"769: Ce cod transponder este utilizat pentru toate zborurile VFR în spațiul aerian necontrolat?","short":"Codul 7000 este codul standard pentru zborurile VFR în Europa (inclusiv în România), când nu ai primit un cod de la ATC.","long":"(cunoscut ca „Squawk 7000”) este codul standard utilizat pentru zborurile care se desfășoară conform regulilor de zbor la vedere (VFR) în Europa (inclusiv în România) și în majoritatea celorlalte regiuni ale lumii, cu excepția Americii de Nord.\n\nAtunci când un pilot zboară VFR și nu a primit un cod specific din patru cifre din partea controlorilor de trafic aerian (ATC), va selecta codul 7000 pe transponder.\n\nCe rol are codul 7000?\n• Asigură vizibilitatea (conspicuity): codul transmite radarului secundar al controlorilor, și sistemelor anti-coliziune de la bordul altor avioane (precum TCAS), că aeronava este acolo, chiar dacă nu se află sub ghidare directă.\n• Indică tipul de zbor: controlorii pot vedea imediat că aeronava zboară VFR și, în general, în spațiul aerian necontrolat.\n• Nu este un cod de urgență: spre deosebire de alte coduri din seria 7000, 7000 este un cod de operare normală și nu semnalează nicio problemă la bord.\n\nDiferențe regionale: în Europa și în majoritatea statelor ICAO se folosește 7000; în SUA și Canada, codul pentru zbor VFR este 1200.\n\nCum se compară cu codurile de urgență? Este important să nu selectezi accidental un cod rezervat situațiilor critice:\n• 7500: deturnare / intervenție ilicită la bord.\n• 7600: pană de radio (lipsa comunicațiilor).\n• 7700: urgență generală (pericol iminent, probleme tehnice majore).","answers":[{"text":"7500","correct":false,"short":"zboruri VFR în spațiul necontrolat (clasa G).","long":"Este codul standard pentru zborurile VFR în Europa, inclusiv în spațiul necontrolat.","warn":""},{"text":"7000","correct":true,"short":"pierderea comunicațiilor radio (cunoscut și ca radio failure sau stare NORDO – No Radio).","long":"Semnalează că aeronava nu mai poate comunica pe radio.","warn":""},{"text":"7600","correct":false,"short":"semnal de urgență folosit pentru o intervenție ilicită la bord, inclusiv o tentativă de deturnare (hijacking).","long":"Este codul de securitate pentru deturnare sau intervenție ilicită.","warn":""},{"text":"7700","correct":false,"short":"semnalul universal pentru o situație de urgență generală în aviația civilă (echivalentul digital al unui MAYDAY).","long":"Se folosește când există un pericol sau o problemă gravă, care cere ajutor.","warn":""}]},{"number":"#81","text":"716: În ce reglementare se află regulile de radiotelefonie specifice pentru aviaţie?","short":"Regulile de radiotelefonie pentru aviație se află în Regulamentul stațiilor de telecomunicații.","long":"Regulamentul stațiilor de telecomunicații stabilește regulile de funcționare a stațiilor radio, inclusiv cele aeronautice. Codul Aerian și regulamentele de circulație aeriană reglementează zborul, nu stațiile radio.","answers":[{"text":"Regulile Aerului","correct":false,"short":"","long":"Nu este un act normativ cu această denumire.","warn":""},{"text":"Regulamentul staţiilor de telecomunicaţii","correct":true,"short":"Regulamentul stațiilor de telecomunicații.","long":"Conține regulile de funcționare a stațiilor radio.","warn":""},{"text":"în codul Aerian","correct":false,"short":"","long":"Codul Aerian reglementează zborul, nu toate regulile radio.","warn":""},{"text":"Regulamentul circulaţiei aeriene şi serviciilor de trafic aerian","correct":false,"short":"Regulamentul circulației aeriene și serviciilor de trafic aerian.","long":"Reglementează circulația aeriană, nu toate regulile de radiotelefonie.","warn":""}]},{"number":"#82","text":"702: Pentru a putea utiliza în mod corect o stație radio atunci când zburăm cu motoparapanta trebuie să:","short":"Pentru a folosi corect stația radio la motoparapantă, trebuie să ai o cască cu sistem de comunicații integrat.","long":"În practică, la motoparapantă stația se folosește de regulă hands-free, iar căștile cu microfon și sistem integrat permit auzirea și vorbitul fără să fie nevoie să ții stația în mână. Protecția la umezeală, antena lungă sau displayul mare nu sunt criteriile de utilizare corectă.","answers":[{"text":"avem o stație care să aibă un grad ridicat de protecție la umezeală","correct":false,"short":"O stație cu grad ridicat de protecție la umezeală.","long":"Protecția este utilă, dar nu este cerința de utilizare corectă.","warn":""},{"text":"dispunem de o cască prevăzută cu sistem de comunicații integrat","correct":true,"short":"O cască prevăzută cu sistem de comunicații integrat.","long":"Este modul corect de utilizare a stației în zbor.","warn":""},{"text":"avem o stație cu antenă suficient de lungă pentru a permite raze mari de acțiune","correct":false,"short":"O stație cu antenă suficient de lungă.","long":"Antena influențează raza, dar nu modul de utilizare.","warn":""},{"text":"avem o stație radio cu un display suficient de mare","correct":false,"short":"O stație cu display suficient de mare.","long":"Displayul nu este cerința de utilizare corectă.","warn":""}]},{"number":"#83","text":"779: Care este rolul serviciului de informare a zborurilor în spațiul aerian necontrolat?","short":"Serviciul de informare a zborurilor în spațiul necontrolat furnizează informații utile pentru un zbor sigur și eficient.","long":"Acest serviciu nu autorizează decolările sau aterizările și nu controlează zborurile. Oferă informații despre trafic, vreme, NOTAM-uri și alte date utile, la cerere sau când este nevoie.","answers":[{"text":"să furnizeze informații utile pentru desfășurarea în siguranță și eficientă a zborului","correct":true,"short":"Să furnizeze informații utile pentru un zbor sigur și eficient.","long":"Este rolul serviciului de informare.","warn":""},{"text":"să autorizeze decolările și aterizările","correct":false,"short":"","long":"Autorizarea nu este rolul serviciului de informare.","warn":""},{"text":"să controleze toate zborurile VFR și IFR","correct":false,"short":"","long":"Serviciul de informare nu controlează zborurile.","warn":""},{"text":"să coordoneze operațiunile de salvare și căutare","correct":false,"short":"","long":"Coordonarea SAR este atribuția altui serviciu.","warn":""}]},{"number":"#84","text":"770: Ce document este necesar pentru a opera legal o stație radio aeronautică?","short":"Pentru a opera legal o stație radio aeronautică este necesar certificatul de operator radio.","long":"Stația trebuie condusă de o persoană care deține certificatul de operator. Certificatul de garanție, pașaportul și permisul de conducere nu dau dreptul de a folosi stația radio.","answers":[{"text":"certificatul de garanție","correct":false,"short":"","long":"Nu dă dreptul de a opera stația.","warn":""},{"text":"pașaportul","correct":false,"short":"","long":"Identifică persoana, nu dă dreptul de operare.","warn":""},{"text":"certificatul de operator radio","correct":true,"short":"","long":"Este documentul necesar pentru operarea legală a stației.","warn":""},{"text":"permisul de conducere","correct":false,"short":"","long":"Nu dă dreptul de a opera o stație radio.","warn":""}]},{"number":"#85","text":"750: Care este rolul unui operator radio cu certificat restrâns?","short":"Operatorul cu certificat restrâns poate opera doar pe frecvențele alocate exclusiv serviciului respectiv.","long":"Certificatul restrâns are o arie mai mică decât cel general, deci operatorul este limitat la frecvențele serviciului pentru care a fost certificat. Certificatul general permite operarea pe toate frecvențele serviciului aeronautic.","answers":[{"text":"poate opera pe orice frecvență","correct":false,"short":"","long":"Aceasta este aria certificatului general.","warn":""},{"text":"poate opera pe frecvențele alocate exclusiv serviciului respectiv","correct":true,"short":"Poate opera doar pe frecvențele alocate exclusiv serviciului respectiv.","long":"Este aria certificatului restrâns.","warn":""},{"text":"poate controla toate comunicațiile aer-sol","correct":false,"short":"","long":"Certificatul de operator nu dă această atribuție.","warn":""},{"text":"poate efectua inspecții ale stațiilor radio","correct":false,"short":"","long":"Inspecțiile țin de autoritate, nu de certificatul de operator.","warn":""}]},{"number":"#86","text":"766: Ce document este necesar pentru autorizarea funcționării unei stații de radiocomunicații?","short":"Pentru autorizarea funcționării unei stații radio este necesar certificatul general de operator radiotelefonist.","long":"Certificatul general este documentul care arată că persoana poate conduce o stație din serviciul aeronautic. Permisul de conducere, certificatul de sănătate și pașaportul nu înlocuiesc certificatul de operator.","answers":[{"text":"certificatul general de operator radiotelefonist","correct":true,"short":"","long":"Este documentul corect pentru autorizarea funcționării.","warn":""},{"text":"permisul de conducere","correct":false,"short":"","long":"Nu are legătură cu funcționarea stației radio.","warn":""},{"text":"certificatul de sănătate","correct":false,"short":"","long":"Nu este documentul de operator radio.","warn":""},{"text":"pașaportul operatorului","correct":false,"short":"","long":"Identifică persoana, nu autorizează stația.","warn":""}]},{"number":"#87","text":"754: Ce termen codificat indică o fază de incertitudine?","short":"Faza de incertitudine se numește INCERFA.","long":"INCERFA este prima fază a serviciilor de căutare și salvare, când există incertitudine despre siguranța aeronavei. Este urmată de ALERFA (alarmă) și DETRESFA (pericol grav și iminent).","answers":[{"text":"INCERFA","correct":true,"short":"","long":"Faza de incertitudine.","warn":""},{"text":"ALERFA","correct":false,"short":"","long":"Faza de alarmă, mai gravă decât incertitudinea.","warn":""},{"text":"PAN","correct":false,"short":"","long":"Mesaj de urgență, nu fază.","warn":""},{"text":"DETRESFA","correct":false,"short":"","long":"Faza de pericol grav și iminent.","warn":""}]},{"number":"#88","text":"758: Ce documente trebuie să însoțească în mod obligatoriu stațiile de radiocomunicații?","short":"Stațiile radio trebuie însoțite de autorizația de utilizare a frecvențelor și de licența stației.","long":"Autorizația de utilizare a frecvențelor și licența stației dovedesc că stația poate funcționa legal pe frecvențele alocate. Pașaportul operatorului, certificatul de garanție și manualul de utilizare nu sunt documentele care autorizează funcționarea.","answers":[{"text":"autorizația de utilizare a frecvențelor și licența stației","correct":true,"short":"","long":"Sunt documentele care autorizează funcționarea.","warn":""},{"text":"pașaportul operatorului","correct":false,"short":"","long":"Identifică persoana, nu stația.","warn":""},{"text":"certificatul de garanție al echipamentului","correct":false,"short":"","long":"Atestă garanția, nu autorizarea.","warn":""},{"text":"manualul de utilizare al stației","correct":false,"short":"","long":"Este un document tehnic, nu o autorizație.","warn":""}]},{"number":"#89","text":"776: Ce semnifică termenul „air traffic control” (ATC)?","short":"ATC înseamnă gestionarea și coordonarea traficului aerian pentru a asigura siguranța zborurilor.","long":"Air Traffic Control este serviciul care organizează fluxul de aeronave, previne coliziunile și dă instrucțiuni pentru rulare, decolare și aterizare. Celelalte variante descriu activități care nu țin de ATC.","answers":[{"text":"gestionarea bagajelor pierdute","correct":false,"short":"","long":"Nu ține de ATC.","warn":""},{"text":"gestionarea și coordonarea traficului aerian pentru a asigura siguranța zborurilor","correct":true,"short":"","long":"Este sensul corect al ATC.","warn":""},{"text":"verificarea documentelor pasagerilor","correct":false,"short":"","long":"Nu ține de ATC.","warn":""},{"text":"efectuarea inspecțiilor de securitate la sol","correct":false,"short":"","long":"Nu ține de ATC.","warn":""}]},{"number":"#90","text":"720: Unitatea de măsura a frecventei este:","short":"Unitatea de măsură a frecvenței este hertzul (Hz).","long":"Frecvența se măsoară în hertzi: un hertz înseamnă un ciclu pe secundă. Pentru radio se folosesc kilohertzi (kHz) și megahertzi (MHz). Newtonul măsoară forța, decibelul măsoară raportul de intensitate, iar VHF este o bandă de frecvențe, nu o unitate.","answers":[{"text":"Newtonul","correct":false,"short":"","long":"Este unitatea forței, nu a frecvenței.","warn":""},{"text":"VHF","correct":false,"short":"","long":"Este o bandă de frecvențe, nu o unitate de măsură.","warn":""},{"text":"Decibelul","correct":false,"short":"","long":"Este unitate pentru raport de intensitate, nu pentru frecvență.","warn":""},{"text":"Hertzul","correct":true,"short":"","long":"Este unitatea de măsură a frecvenței.","warn":""}]},{"number":"#91","text":"741: Ce reprezintă abrevierea ATC?","short":"ATC înseamnă Air Traffic Control.","long":"Air Traffic Control este denumirea serviciului care gestionează circulația aeriană. Celelalte denumiri nu sunt sensul abrevierii ATC.","answers":[{"text":"Aircraft Technical Check","correct":false,"short":"","long":"Nu este sensul ATC.","warn":""},{"text":"Air Traffic Control","correct":true,"short":"","long":"Este sensul corect.","warn":""},{"text":"Aviation Training Center","correct":false,"short":"","long":"Nu este sensul ATC.","warn":""},{"text":"Air Transport Command","correct":false,"short":"","long":"Nu este sensul ATC.","warn":""}]},{"number":"#92","text":"782: Care sunt componentele serviciului de informare a zborurilor în spațiul necontrolat?","short":"Serviciul de informare în spațiul necontrolat oferă indicații și informații utile pentru un zbor sigur și eficient.","long":"Serviciul de informare nu autorizează zboruri și nu controlează trafic. Componentele lui sunt informațiile și indicațiile date pilotului, la cerere sau când este necesar.","answers":[{"text":"furnizarea de indicații și informații utile pentru desfășurarea în siguranță și eficientă a zborului","correct":true,"short":"Furnizarea de indicații și informații utile pentru un zbor sigur și eficient.","long":"Este componenta corectă a serviciului.","warn":""},{"text":"autorizarea decolărilor și aterizărilor","correct":false,"short":"","long":"Nu ține de serviciul de informare.","warn":""},{"text":"controlul tuturor zborurilor IFR și VFR","correct":false,"short":"","long":"Serviciul de informare nu controlează zborurile.","warn":""},{"text":"coordonarea operațiunilor de salvare și căutare","correct":false,"short":"","long":"Nu este componenta serviciului de informare.","warn":""}]},{"number":"#93","text":"703: Ați solicitat TWR condițiile meteo pentru aterizare și nu ați primit niciun răspuns. Cum procedați în continuare?","short":"Dacă turnul nu răspunde la cererea de condiții meteo, aștepți puțin și reîncerci cererea.","long":"Nu presupui condițiile meteo și nu aterizezi pe baza unei estimări. Așteptați scurt, apoi repetați cererea. Consultarea imaginilor satelitare nu înlocuiește informația oficială, iar continuarea aterizării fără date este periculoasă.","answers":[{"text":"continuați procedura de aterizare chiar dacă turnul de control nu a răspuns solicitării","correct":false,"short":"Continuați procedura de aterizare chiar dacă turnul nu a răspuns.","long":"Este periculos să aterizezi fără informația meteo.","warn":""},{"text":"evaluați singur condiția meteo și procedați la aterizare","correct":false,"short":"","long":"Estimarea personală nu înlocuiește informația oficială.","warn":""},{"text":"consultați harta meteo satelitară și condiția meteo dată de METAR","correct":false,"short":"Consultați harta meteo satelitară și METAR-ul.","long":"Nu este procedura corectă când turnul nu răspunde.","warn":""},{"text":"așteptați 10 secunde după care solicitați din nou turnului de control condiția meteo","correct":true,"short":"Așteptați 10 secunde și solicitați din nou condiția meteo turnului.","long":"Este procedura corectă: așteptați scurt și reîncercați.","warn":""}]},{"number":"#94","text":"713: Care din următoarele afirmații este corectă:","short":"În spațiul de clasă G nu este obligatorie legătura radio cu organul de trafic.","long":"Clasa G este spațiu necontrolat, deci nu este obligatorie comunicarea radio cu un organ de trafic. Totuși, în alte spații sau în anumite condiții, comunicarea poate fi obligatorie. Walkie-talkie-urile nu sunt obligatorii în clasa G.","answers":[{"text":"în spațiul G nu este obligatorie legătura radio cu organul de trafic","correct":true,"short":"","long":"Este afirmația corectă.","warn":""},{"text":"în spațiul G stațiile de tip walkie talkie sunt oblogatorii","correct":false,"short":"În spațiul G stațiile walkie-talkie sunt obligatorii.","long":"Nu sunt obligatorii în clasa G.","warn":""},{"text":"în spațiul G este obligatorie legatura radio cu organul de trafic","correct":false,"short":"În spațiul G este obligatorie legătura radio cu organul de trafic.","long":"Nu este obligatorie în clasa G.","warn":""},{"text":"în spațiul G se poate zbura fără stație în frecvența de aviație doar dacă organul de control permite asta","correct":false,"short":"În spațiul G se poate zbura fără stație doar dacă organul de control permite.","long":"În clasa G nu este nevoie de permisiunea organului de control pentru a zbura fără radio.","warn":""}]},{"number":"#95","text":"726: Semnificaţia mesajului „ALERFA” este:","short":"ALERFA este termenul codificat care indică o fază de alarmă.","long":"ALERFA este faza în care există motive de îngrijorare pentru siguranța aeronavei și sunt pornite măsurile de alarmare. Este între INCERFA (incertitudine) și DETRESFA (pericol grav și iminent).","answers":[{"text":"termenul codificat care indică o faza de alarmă","correct":true,"short":"Termenul codificat care indică o fază de alarmă.","long":"Este definiția corectă.","warn":""},{"text":"termenul codificat care indică o faza de incertitudine","correct":false,"short":"Termenul codificat care indică o fază de incertitudine.","long":"Aceasta este INCERFA.","warn":""},{"text":"termenul codificat care indică o faza de atenționare","correct":false,"short":"Termenul codificat care indică o fază de atenționare.","long":"Nu este o fază standard.","warn":""},{"text":"termenul codificat care indică o faza de pericol","correct":false,"short":"Termenul codificat care indică o fază de pericol.","long":"Aceasta este DETRESFA.","warn":""}]},{"number":"#96","text":"755: Ce cod transponder este utilizat pentru a semnala toate situațiile normale de zbor?","short":"Codul 7000 este folosit pentru toate situațiile normale de zbor VFR.","long":"Codul 7000 este codul de zbor normal VFR în Europa, folosit când nu ai un cod atribuit de ATC. Codurile 7600, 7700 și 7500 sunt pentru situații de urgență sau de pericol.","answers":[{"text":"7600","correct":false,"short":"","long":"Este pentru pierderea comunicațiilor.","warn":""},{"text":"7000","correct":true,"short":"","long":"Este codul pentru situațiile normale de zbor VFR.","warn":""},{"text":"7700","correct":false,"short":"","long":"Este pentru urgență generală.","warn":""},{"text":"7500","correct":false,"short":"","long":"Este pentru deturnare.","warn":""}]},{"number":"#97","text":"763: Ce termen este folosit pentru a desemna o rută definită pentru traficul aerian?","short":"Ruta definită pentru traficul aerian se numește rută ATS.","long":"Rutele ATS (Air Traffic Services) sunt rute stabilite și publicate, pe care aeronavele zboară pentru o coordonare eficientă a traficului. Rutele VFR și IFR sunt tipuri de zbor, nu rute definite.","answers":[{"text":"rută VFR","correct":false,"short":"","long":"VFR este un tip de regulă de zbor, nu o rută definită.","warn":""},{"text":"rută IFR","correct":false,"short":"","long":"IFR este un tip de regulă de zbor, nu o rută definită.","warn":""},{"text":"rută ATS","correct":true,"short":"","long":"Este rută definită și publicată pentru traficul aerian.","warn":""},{"text":"rută de serviciu","correct":false,"short":"","long":"Nu este denumirea rutei definite.","warn":""}]},{"number":"#98","text":"727: Zburaţi cu o motoparapantă care nu este echipată cu transponder, cum veţi raporta organului de trafic când acesta va cere să afişaţi un SQUAK?","short":"Dacă nu ai transponder, raportezi „negativ transponder”.","long":"Când controlorul cere afișarea unui cod SQUAWK și nu ai transponder, răspunzi „negativ transponder”. Expresiile în limba engleză fără formularea standard („I don't have transponder”, „no transponder”) nu sunt frazeologia corectă, iar „negativ squak” nu este termenul corect.","answers":[{"text":"I don't have transponder","correct":false,"short":"","long":"Nu este frazeologia standard.","warn":""},{"text":"negativ squak","correct":false,"short":"","long":"Termenul corect este „negativ transponder”.","warn":""},{"text":"no transponder","correct":false,"short":"","long":"Nu este frazeologia standard.","warn":""},{"text":"negativ transponder","correct":true,"short":"","long":"Este răspunsul standard.","warn":""}]},{"number":"#99","text":"735: ’’Go around’’ înseamnă:","short":"Go around înseamnă că execuți imediat ratarea aterizării.","long":"Go around este instrucțiunea de a abandona aterizarea și de a relua zborul pentru o nouă abordare. Se execută imediat, de exemplu dacă pista nu este liberă sau condițiile nu permit aterizarea în siguranță.","answers":[{"text":"execută un tur de pistă","correct":false,"short":"","long":"Nu este sensul expresiei; ratarea este imediată.","warn":""},{"text":"Degajează pista imediat","correct":false,"short":"","long":"Acesta este mesajul pentru eliberarea pistei, nu go around.","warn":""},{"text":"execută imediat ratarea aterizării","correct":true,"short":"","long":"Este sensul corect.","warn":""},{"text":"executa imediat un viraj de 360 grade","correct":false,"short":"Execută imediat un viraj de 360 de grade.","long":"Nu este sensul expresiei.","warn":""}]},{"number":"#100","text":"744: Ce semnal se utilizează pentru a indica o situație de pericol grav și iminent în radiotelefonie?","short":"În radiotelefonie, pericolul grav și iminent se semnalează prin MAYDAY.","long":"MAYDAY se rostește de trei ori și este folosit când aeronava are nevoie de ajutor imediat. HELP, PAN și SOS nu sunt semnalul de pericol grav și iminent în radiotelefonie.","answers":[{"text":"HELP","correct":false,"short":"","long":"Nu este semnalul standard de pericol.","warn":""},{"text":"PAN","correct":false,"short":"","long":"Este pentru urgență care nu e imediat periculoasă.","warn":""},{"text":"MAYDAY","correct":true,"short":"","long":"Este semnalul pentru pericol grav și iminent.","warn":""},{"text":"SOS","correct":false,"short":"","long":"Este semnal Morse, nu semnal de pericol în radiotelefonie.","warn":""}]},{"number":"#101","text":"737: Care este frecvența internațională de primejdie pentru aviație?","short":"Frecvența internațională de primejdie pentru aviație este 121,5 MHz.","long":"121,5 MHz este frecvența internațională de urgență și de primejdie pentru aviație, ascultată pe scară largă. Celelalte frecvențe nu au acest rol internațional.","answers":[{"text":"125.5 MHz","correct":false,"short":"125,5 MHz.","long":"Nu este frecvența internațională de primejdie.","warn":""},{"text":"121.5 MHz","correct":true,"short":"121,5 MHz.","long":"Este frecvența internațională de primejdie.","warn":""},{"text":"124.5 MHz","correct":false,"short":"124,5 MHz.","long":"Nu este frecvența internațională de primejdie.","warn":""},{"text":"123.5 MHz","correct":false,"short":"123,5 MHz.","long":"Nu este frecvența internațională de primejdie.","warn":""}]}]},{"id":"02","title":"Cunoașterea aeronavei","questions":[{"number":"#1","text":"398: Ce trebuie să conțină kitul de unelte pentru întreținerea de urgență?","short":"Kitul de unelte pentru întreținerea de urgență trebuie să conțină chei, șurubelnițe, cheie pentru bujii și clești.","long":"Întreținerea de urgență se face în teren, fără atelier, deci kitul trebuie să permită strângerea șuruburilor, înlocuirea bujiei și tăierea sau repararea unor elemente simple. Ochelarii, busola și bateriile sunt utile, dar nu sunt unelte de întreținere. Un set cu chei imbus, șurubelnițe, cheie pentru bujii, cuțit mic, clește mic și chei tubulare acoperă cele mai frecvente intervenții.","answers":[{"text":"omănuși de protecție și ochelari de protecție","correct":false,"short":"Mănuși de protecție și ochelari de protecție.","long":"Sunt echipament de protecție, nu unelte de întreținere.","warn":""},{"text":"obusolă și hartă","correct":false,"short":"Busolă și hartă.","long":"Sunt instrumente de navigație, nu de întreținere.","warn":""},{"text":"obaterii de rezervă și lanternă","correct":false,"short":"Baterii de rezervă și lanternă.","long":"Sunt utile, dar nu sunt unelte de întreținere a motorului.","warn":""},{"text":"ochei imbus, șurubelnițe, cheie pentru bujii, cuțit mic, clește mic, set de chei tubulare","correct":true,"short":"Chei imbus, șurubelnițe, cheie pentru bujii, cuțit mic, clește mic, set de chei tubulare.","long":"Acestea sunt uneltele necesare pentru intervenții de urgență.","warn":""}]},{"number":"#2","text":"203: Ce este amestecul de carburant?","short":"Amestecul de carburant este amestecul de aer și vapori de benzină care se aprinde în camera de ardere.","long":"În motor, benzina se vaporizează și se amestecă cu aerul în carburator. Acest amestec se comprimă și se aprinde în camera de ardere, producând energia care mișcă pistonul. La motoarele în doi timpi, uleiul se amestecă separat cu benzina pentru ungere, dar amestecul carburant în sine rămâne aer și vapori de benzină.","answers":[{"text":"amestecul ulei/benzină folosit drept carburant la motoarele în doi timpi","correct":false,"short":"","long":"Acesta este amestecul de combustibil cu ulei, nu amestecul carburant în sensul termodinamic.","warn":""},{"text":"amestecul apă/antigel care se folosește la motoarele răcite cu lichid","correct":false,"short":"Amestecul apă/antigel folosit la motoarele răcite cu lichid.","long":"Este lichidul de răcire, nu carburantul.","warn":""},{"text":"amestecul de aer/vapori de benzină care se aprinde în camera de ardere","correct":true,"short":"Amestecul de aer și vapori de benzină care se aprinde în camera de ardere.","long":"Este definiția corectă a amestecului carburant.","warn":""},{"text":"amestecul aer/kerosen care se folosește la motoarele în 2 timpi","correct":false,"short":"Amestecul aer/kerosen folosit la motoarele în doi timpi.","long":"Motoarele paramotorului folosesc benzină, nu kerosen.","warn":""}]},{"number":"#3","text":"434: Cum se verifică starea elicei înainte de fiecare zbor?","short":"Elicea se verifică vizual, căutând fisuri sau daune, înainte de fiecare zbor.","long":"O elice cu fisură sau cioburi se poate rupe în zbor, ceea ce duce la vibrații puternice și la pierderea propulsiei. De aceea inspecția vizuală este prima verificare. Fixarea și jocul axial se verifică și ele, dar detectarea daunelor este esențială.","answers":[{"text":"verifică dacă elicea este bine fixată și nu are joc axial","correct":false,"short":"","long":"Este o verificare corectă, dar nu este cea principală a inspecției vizuale.","warn":""},{"text":"aplică un strat de lubrifiant pe elice","correct":false,"short":"","long":"Elicea nu se lubrifiază de obicei; nu este verificarea corectă.","warn":""},{"text":"curăță elicea de praf și murdărie","correct":false,"short":"","long":"Curățarea nu înlocuiește inspecția pentru daune.","warn":""},{"text":"inspectează vizual elicea pentru fisuri sau daune","correct":true,"short":"","long":"Este verificarea de bază înainte de fiecare zbor.","warn":""}]},{"number":"#4","text":"207: Încărcarea alară se referă la:","short":"Încărcarea alară este raportul dintre greutatea totală în zbor și suprafața portantă a aripii.","long":"Încărcarea alară arată cât de multă greutate revine pe fiecare metru pătrat de aripă. O încărcare mai mare înseamnă, de regulă, viteze de zbor mai mari și o aripă mai puțin iertătoare. Este un parametru important la alegerea aripii și a greutății admise.","answers":[{"text":"suprafața raportată la lungimea suspantelor","correct":false,"short":"","long":"Nu este definiția încărcării alare.","warn":""},{"text":"greutatea maximă în zbor","correct":false,"short":"","long":"Este greutatea maximă admisă, nu raportul care definește încărcarea.","warn":""},{"text":"sarcina minimă și maximă a parapantei","correct":false,"short":"","long":"Acestea sunt limite ale greutății, nu încărcarea alară.","warn":""},{"text":"raportul dintre greutatea totală în zbor și suprafața portantă","correct":true,"short":"","long":"Este definiția corectă.","warn":""}]},{"number":"#5","text":"412: Ce este un anemometru?","short":"Anemometrul este un dispozitiv care măsoară viteza cu care se deplasează aerul.","long":"Anemometrul are de regulă o elice sau cupe care se rotesc sub acțiunea vântului, iar viteza de rotație indică viteza aerului. Altimetrul măsoară altitudinea, iar termometrul temperatura. Direcția vântului se indică cu fanioane sau girouette.","answers":[{"text":"un instrument pentru măsurarea altitudinii","correct":false,"short":"","long":"Acesta este altimetrul.","warn":""},{"text":"un echipament pentru controlul temperaturii motorului","correct":false,"short":"","long":"Acesta este un termometru sau un senzor de temperatură.","warn":""},{"text":"un dispozitiv pentru determinarea direcției vântului","correct":false,"short":"","long":"Aceasta este funcția unui fanion sau a unei girouette.","warn":""},{"text":"un dispozitiv care măsoară viteza cu care se deplasează aerul","correct":true,"short":"","long":"Este definiția corectă a anemometrului.","warn":""}]},{"number":"#6","text":"404: Ce trebuie să faceți dacă observați bule pe furtunul de combustibil?","short":"Dacă vezi bule în furtunul de combustibil, verifici dacă furtunul are găuri și îl înlocuiești dacă e necesar.","long":"Bulele în linia de combustibil arată că aerul intră în sistem, de obicei printr-o fisură sau o îmbinare slăbită. Aerul poate opri motorul sau îl poate face să meargă neregulat. Înainte de orice reglaj se verifică și se repară sursa scurgerii.","answers":[{"text":"curățați rezervorul de combustibil","correct":false,"short":"","long":"Curățarea nu rezolvă intrarea de aer prin furtun.","warn":""},{"text":"reglați carburatorul","correct":false,"short":"","long":"Reglajul nu rezolvă o scurgere de aer.","warn":""},{"text":"verificați dacă există găuri în furtun și înlocuiți furtunul dacă este necesar","correct":true,"short":"","long":"Aceasta este verificarea corectă, căci bulele arată intrare de aer.","warn":""},{"text":"adăugați mai mult combustibil","correct":false,"short":"","long":"Nu rezolvă problema și poate agrava situația.","warn":""}]},{"number":"#7","text":"239: Ce este amestecul carburant?","short":"Amestecul carburant este amestecul de aer și vapori de benzină care se aprinde în camera de ardere.","long":"Aceeași noțiune ca la întrebarea despre amestecul de carburant: aerul și vaporii de benzină formează amestecul care arde în motor. Uleiul din carter sau uleiul amestecat cu benzina au alte roluri, de ungere.","answers":[{"text":"amestecul apa/antigel care se foloseşte la motoarele ce se răcesc cu lichid","correct":false,"short":"Amestecul apă/antigel folosit la motoarele răcite cu lichid.","long":"Este lichidul de răcire.","warn":""},{"text":"amestecul aer/vapori de benzină care se aprinde în camera de ardere","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"amestecul ulei/ aer din carter","correct":false,"short":"Amestecul ulei/aer din carter.","long":"Nu este amestecul carburant.","warn":""},{"text":"amestecul ulei/benzină care se foloseşte drept carburant la motoarele în doi timpi","correct":false,"short":"Amestecul ulei/benzină folosit drept carburant la motoarele în doi timpi.","long":"Este combustibilul cu ulei de ungere, nu amestecul carburant.","warn":""}]},{"number":"#8","text":"199: Pentru un motor echipat cu reductor cu raportul 3:1, dacă motorul funcționează la 9000 RPM, care va fi viteza de rotație a elicei:","short":"Dacă reductorul are raportul 3:1 și motorul face 9000 rot/min, elicea face 3000 rot/min.","long":"Reductorul reduce turația transmisă elicei. La raport 3:1, turația elicei este de trei ori mai mică decât a motorului: 9000 împărțit la 3 înseamnă 3000 rot/min. Reductorul permite motorului să funcționeze la turații mari, unde are putere mai bună, în timp ce elicea se rotește mai lent, la o turație mai eficientă.","answers":[{"text":"27000 rot/min","correct":false,"short":"","long":"Ar fi dacă reductorul ar multiplica turația, dar el o reduce.","warn":""},{"text":"1000 rot/min","correct":false,"short":"","long":"Ar fi dacă raportul ar fi 9:1.","warn":""},{"text":"3000 rot/min","correct":true,"short":"","long":"Este turația corectă: 9000 împărțit la 3.","warn":""},{"text":"9000 rot/min","correct":false,"short":"","long":"Ar fi dacă nu existau reductor.","warn":""}]},{"number":"#9","text":"433: Ce trebuie făcut după o imersiune accidentală a aripii în apă sărată?","short":"După o imersiune în apă sărată, aripa se clătește cu apă proaspătă pentru a îndepărta sarea.","long":"Sarea din apa de mare se depune în țesătura și în suspante și poate înțepeni materialul sau corodă piesele metalice. Clătirea cu apă proaspătă și uscarea la umbră, întinsă, sunt pașii recomandați. Detergenții puternici pot deteriora țesătura, iar lăsarea la soare poate degrada materialul.","answers":[{"text":"curăță aripa cu un detergent puternic","correct":false,"short":"","long":"Detergentul puternic poate deteriora țesătura.","warn":""},{"text":"lasă aripa să se usuce la soare","correct":false,"short":"","long":"Soarele poate degrada materialul și nu îndepărtează sarea.","warn":""},{"text":"clătește aripa cu apă proaspătă pentru a îndepărta sarea","correct":true,"short":"","long":"Este pasul corect de întreținere.","warn":""},{"text":"înlocuiește toate suspentele și materialul aripii","correct":false,"short":"Înlocuiește toate suspantele și materialul aripii.","long":"Nu este necesar doar pentru că aripa a intrat în apă sărată.","warn":""}]},{"number":"#10","text":"230: Pentru ca pornirea paramotorului să se facă în siguranță, se recomandă a se face:","short":"Pentru a porni paramotorul în siguranță, se pornește pe spate, cu cel puțin casca pusă.","long":"Pornirea pe spate, cu elicea în direcția în care nu te afectează, reduce riscul de lovire de elice și permite controlul motorului. Casca protejează capul dacă motorul se întoarce brusc sau dacă apare o problemă la pornire. Pornirea pe sol sau fără elice nu sunt metode corecte.","answers":[{"text":"pe spate, echipat cel putin cu cască","correct":true,"short":"Pe spate, echipat cel puțin cu cască.","long":"Este procedura recomandată pentru pornire în siguranță.","warn":""},{"text":"pe sol","correct":false,"short":"","long":"Pornirea pe sol, fără poziție corectă, poate duce la accidentare.","warn":""},{"text":"cu putin combustibil","correct":false,"short":"Cu puțin combustibil.","long":"Nu are legătură cu siguranța pornirii.","warn":""},{"text":"fără elice","correct":false,"short":"","long":"Pornirea trebuie făcută cu elicea montată, dar cu precauțiile corecte.","warn":""}]},{"number":"#11","text":"458: Ce tip de aripă este cel mai potrivit pentru piloții experimentați care doresc să participe la competiții?","short":"Aripa EN D este potrivită pentru piloții experimentați care participă la competiții.","long":"Clasificarea EN (EN 926-2) împarte aripile în clase de la A (cea mai iertătoare) la D (cea mai performantă și mai pretențioasă). Aripile de competiție, de clasă D, cer pilot cu experiență, pentru că sunt mai rapide și mai greu de controlat. EN A este pentru începători, iar EN B și C pentru piloții cu experiență intermediară.","answers":[{"text":"EN A","correct":false,"short":"","long":"Clasa pentru începători, cea mai iertătoare.","warn":""},{"text":"EN C","correct":false,"short":"","long":"Clasă intermediară, pentru piloți cu experiență.","warn":""},{"text":"EN B","correct":false,"short":"","long":"Clasă intermediară, pentru piloți cu experiență.","warn":""},{"text":"EN D","correct":true,"short":"","long":"Clasa cea mai performantă, pentru piloți experimentați, în competiții.","warn":""}]},{"number":"#12","text":"425: Ce tip de paramotor este recomandat pentru piloții care doresc autonomie mare și eficiență în consumul de combustibil?","short":"Un paramotor cu motor în patru timpi oferă autonomie mare și consum mai eficient.","long":"Motoarele în patru timpi consumă mai puțin combustibil pentru aceeași putere, deoarece nu pierd combustibil prin baleiaj și au o ardere mai completă. Dezavantajul este greutatea mai mare. Motoarele în doi timpi sunt mai ușoare, dar consumă mai mult. Paramotorul electric și cel ultraușor nu sunt categoriile care răspund cel mai bine la acest criteriu.","answers":[{"text":"paramotor cu motor în patru timpi","correct":true,"short":"","long":"Este varianta cu consum mai eficient și autonomie mai mare.","warn":""},{"text":"paramotor cu motor în doi timpi","correct":false,"short":"","long":"Consumă mai mult combustibil decât motorul în patru timpi.","warn":""},{"text":"paramotor ultraușor","correct":false,"short":"","long":"Este o categorie de aeronavă, nu un tip de motor eficient.","warn":""},{"text":"paramotor electric","correct":false,"short":"","long":"Autonomia unor paramotoare electrice este limitată de baterie.","warn":""}]},{"number":"#13","text":"237: Răcirea unui motor în 2 sau 4 timpi se poate face:","short":"Motoarele în doi sau patru timpi se pot răci mixt, cu aer sau cu lichid.","long":"Paramotoarele folosesc de regulă răcire cu aer, prin curentul creat de elice și prin aripioarele cilindrului. Unele motoare au răcire cu lichid sau o combinație. Răcirea se face deci cu aer, cu lichid sau mixt, în funcție de construcție.","answers":[{"text":"forţat cu lichid","correct":false,"short":"Forțat cu lichid.","long":"Este posibil la unele motoare, dar nu este singura variantă.","warn":""},{"text":"stropit cu apă","correct":false,"short":"","long":"Nu este metoda corectă de răcire a motorului.","warn":""},{"text":"cu aer","correct":false,"short":"","long":"Este răcirea cea mai comună la paramotoare, dar nu singura.","warn":""},{"text":"mixt, cu aer sau lichid","correct":true,"short":"","long":"Este varianta cea mai completă, care acoperă toate situațiile.","warn":""}]},{"number":"#14","text":"210: Consemnarea lucrărilor periodice regulamentare se face în:","short":"Lucrările periodice regulamentare se consemnează în livretul aeronavei.","long":"Livretul aeronavei este documentul în care se trec lucrările de întreținere, inspecțiile și reparațiile. Acest registru arată istoricul aeronavei și este cerut la controale. Lucrările periodice nu sunt considerate rutină fără consemnare, iar carnetul de zbor sau fișa de navigație nu sunt documentele de întreținere.","answers":[{"text":"aceste lucrări nu se consemnează deoarece fac parte din categoria verificărilor de rutină","correct":false,"short":"Aceste lucrări nu se consemnează, deoarece fac parte din verificările de rutină.","long":"Lucrările periodice se consemnează întotdeauna.","warn":""},{"text":"carnetul de zbor","correct":false,"short":"","long":"Este documentul pentru zboruri, nu pentru întreținere.","warn":""},{"text":"livretul aeronavei","correct":true,"short":"","long":"Este documentul în care se consemnează lucrările periodice.","warn":""},{"text":"fişa de navigaţie","correct":false,"short":"Fișa de navigație.","long":"Este pentru planificarea zborului, nu pentru întreținere.","warn":""}]},{"number":"#15","text":"242: Sistemul de accelerator/ speed:","short":"Sistemul de accelerator (speed) scade unghiul de incidență, iar aripa devine mai rapidă.","long":"Sistemul de accelerație modifică geometria aripii, prin care piloții apasă barele sau picioarele. Prin scurtarea liniilor inferioare, bordul de atac se apropie de bordul de fugă, unghiul de incidență scade și aripa zboară mai repede, dar cu mai puțină stabilitate și cu o viteză de coborâre mai mare. Nu crește unghiul de incidență și nu modifică liniile B.","answers":[{"text":"crește unghiul de incidență","correct":false,"short":"","long":"Ar fi opusul: sistemul scade unghiul de incidență.","warn":""},{"text":"modifică lungimea suspantelor liniei B","correct":false,"short":"","long":"Sistemul de accelerație acționează pe liniile inferioare, dar nu este descrierea corectă a efectului.","warn":""},{"text":"scade viteza când este apăsat","correct":false,"short":"","long":"Dimpotrivă, aripa accelerează.","warn":""},{"text":"scade unghiul de incidență, iar aripa este mai rapidă","correct":true,"short":"","long":"Este efectul corect al sistemului de accelerare.","warn":""}]},{"number":"#16","text":"415: Ce înseamnă „alunecare laterală”?","short":"Alunecarea laterală înseamnă deplasarea laterală în zbor, pentru a menține traiectoria dorită.","long":"Alunecarea laterală (side slip) este o manevră în care aeronava se deplasează lateral față de direcția de zbor. Se folosește pentru a pierde altitudine rapid sau pentru a corecta traiectoria față de vânt. Frânele, altitudinea și direcția de decolare sunt alte noțiuni.","answers":[{"text":"ajustarea frânelor pentru o aterizare lină","correct":false,"short":"","long":"Este o noțiune diferită, legată de frâne.","warn":""},{"text":"deplasarea laterală în zbor pentru a menține traiectoria dorită","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"măsurarea altitudinii de zbor","correct":false,"short":"","long":"Aceasta este funcția altimetrului.","warn":""},{"text":"schimbarea direcției în timpul decolării","correct":false,"short":"","long":"Nu este definiția alunecării laterale.","warn":""}]},{"number":"#17","text":"399: Cât de des ar trebui înlocuite bujiile la un paramotor?","short":"Bujiile se înlocuiesc, conform recomandărilor, la aproximativ 20 de ore sau la primul semn de probleme.","long":"La motoarele în doi timpi, bujia se murdărește repede cu reziduuri de ulei, iar intervalul depinde de motor și de amestec. Sursele consultate indică intervale între circa 20 și 25 de ore, de aceea intervalul exact se stabilește din manualul motorului. Semnele de probleme sunt pornirea greoaie, funcționarea neregulată sau electrodul murdar.","answers":[{"text":"la fiecare 50 de ore de zbor","correct":false,"short":"","long":"Intervalul este prea lung pentru motoarele în doi timpi.","warn":""},{"text":"la fiecare 10 ore de zbor","correct":false,"short":"","long":"Intervalul este prea scurt, sub recomandările obișnuite.","warn":""},{"text":"la fiecare 20 de ore sau la primul semn de probleme","correct":true,"short":"","long":"Este varianta cea mai apropiată de recomandările consultate, verificată și din manual.","warn":""},{"text":"la fiecare 100 de ore de zbor","correct":false,"short":"","long":"Intervalul este prea lung pentru bujie.","warn":""}]},{"number":"#18","text":"232: Inspecția înainte de zbor este:","short":"Inspecția înainte de zbor trebuie să fie temeinică, neîntreruptă și consistentă: toate variantele sunt corecte.","long":"Inspecția înainte de zbor are trei caracteristici: nu se omite niciun element, se face fără întreruperi (dacă se întrerupe, se reia de la început) și se face mereu în aceeași ordine. Respectarea acestor reguli evită uitarea unui element esențial.","answers":[{"text":"toate variantele","correct":true,"short":"","long":"Este varianta corectă, pentru că toate cele trei caracteristici se aplică.","warn":""},{"text":"temeinică – nu se omite niciun lucru","correct":false,"short":"Temeinică, nu se omite niciun lucru.","long":"Este una dintre caracteristici, dar nu singura.","warn":""},{"text":"neintreruptă – dacă se întrerupe se reia în totalitate","correct":false,"short":"Neîntreruptă, dacă se întrerupe se reia în totalitate.","long":"Este una dintre caracteristici, dar nu singura.","warn":""},{"text":"consistentă – se începe din același loc și în același fel de fiecare dată","correct":false,"short":"Consistentă, se începe din același loc și în același fel de fiecare dată.","long":"Este una dintre caracteristici, dar nu singura.","warn":""}]},{"number":"#19","text":"417: De ce este importantă ajustarea corectă a frânelor?","short":"Ajustarea corectă a frânelor asigură un control optim și evită frânarea neintenționată.","long":"Frânele trebuie reglate astfel încât să fie la fel de lungi și să nu tragă aripa în timpul zborului. Dacă sunt prea scurte, aripa poate fi frânată neintenționat, iar dacă sunt prea lungi, controlul la aterizare este redus. Ajustarea nu are legătură cu confortul, consumul sau viteza.","answers":[{"text":"pentru a îmbunătăți confortul pilotului","correct":false,"short":"","long":"Confortul nu este motivul principal.","warn":""},{"text":"pentru a reduce consumul de combustibil","correct":false,"short":"","long":"Frânele nu au legătură cu consumul.","warn":""},{"text":"pentru a asigura un control optim și a evita frînarea neintenționată","correct":true,"short":"Pentru a asigura un control optim și a evita frânarea neintenționată.","long":"Este motivul corect al ajustării.","warn":""},{"text":"pentru a crește viteza de zbor","correct":false,"short":"","long":"Frânele nu cresc viteza.","warn":""}]},{"number":"#20","text":"243: Când alegem o parapantă trebuie să ținem cont de:","short":"Clasa de omologare a parapantei trebuie să fie conformă cu nivelul de experiență și frecvența utilizării.","long":"O aripă de clasă înaltă este rapidă și nervoasă, deci nu este potrivită unui începător. Alegerea corectă ține cont de experiență, de frecvența zborului și de tipul de zbor. Viteza, noutatea sau dorința de a depăși alți piloți nu sunt criteriile de alegere.","answers":[{"text":"să fie cât mai rapidă posibil pentru a-i depăși pe cei cu care zburăm","correct":false,"short":"Să fie cât mai rapidă posibil, pentru a-i depăși pe cei cu care zburăm.","long":"Viteza mare nu este criteriul pentru începători.","warn":""},{"text":"să fie cât mai nouă","correct":false,"short":"","long":"Vechimea nu este criteriul principal; contează clasa și potrivirea cu pilotul.","warn":""},{"text":"să fie manevrabilă și potrivită pentru competiție","correct":false,"short":"","long":"Competiția nu este potrivită pentru toți piloții.","warn":""},{"text":"clasa de omologare trebuie sa fie conformă cu nivelul de experienţă şi frecvenţa utilizării","correct":true,"short":"Clasa de omologare trebuie să fie conformă cu nivelul de experiență și frecvența utilizării.","long":"Este criteriul corect de alegere.","warn":""}]},{"number":"#21","text":"241: Sistemul de trimer al parapantei:","short":"Sistemul de trimmer, când este deschis, crește viteza de zbor a aripii.","long":"Trimmerele sunt clape sau dispozitive care scurtează liniile inferioare și schimbă unghiul de incidență, la fel ca sistemul de accelerație. Când sunt deschise, aripa zboară mai repede, dar cu o stabilitate mai redusă. Când sunt închise, aripa zboară mai lent și este mai stabilă.","answers":[{"text":"crește finețea","correct":false,"short":"","long":"Trimmerele nu sunt descrise ca mărire a finețelor.","warn":""},{"text":"implică un efort permanent în zbor","correct":false,"short":"","long":"Trimmerele se fixează, fără efort permanent.","warn":""},{"text":"crește viteza de zbor cînd este închis","correct":false,"short":"Crește viteza de zbor când este închis.","long":"Când sunt închise, viteza scade.","warn":""},{"text":"crește viteza de zbor când este deschis","correct":true,"short":"","long":"Este efectul corect al trimmerelor.","warn":""}]},{"number":"#22","text":"429: Cum se face verificarea liniei de combustibil pentru scurgeri?","short":"Linia de combustibil se verifică pentru bule sau găuri și pentru frecare cu șasiul sau cu piese vecine.","long":"Verificarea liniei de combustibil are scopul de a depista scurgerile, fisurile și frecările, care pot duce la scurgeri sau la aer în sistem. Se verifică ambele capete ale furtunului, fixările și traseul. Reglarea carburatorului sau măsurarea presiunii sunt verificări separate.","answers":[{"text":"verifică nivelul de ulei","correct":false,"short":"","long":"Este o verificare diferită, care nu depistează scurgerile de combustibil.","warn":""},{"text":"ajustează carburatorul","correct":false,"short":"","long":"Reglajul nu verifică linia de combustibil.","warn":""},{"text":"verifică dacă există găuri sau bule în linie, frecare cu șasiul sau cu piese în vecinătate","correct":true,"short":"","long":"Este verificarea corectă a liniei.","warn":""},{"text":"măsoară presiunea combustibilului","correct":false,"short":"","long":"Presiunea se verifică separat, nu depistează scurgerile vizuale.","warn":""}]},{"number":"#23","text":"442: Ce trebuie să faci dacă observi uzură sau fisuri la suspantele aripii?","short":"Dacă observi uzură sau fisuri la suspante, le înlocuiești imediat.","long":"Suspantele poartă sarcina aripii, deci o suspantă deteriorată poate ceda în zbor. Nu se repară prin adeziv sau prin strângere. Ajustarea tensiunii sau curățarea nu rezolvă problema de rezistență.","answers":[{"text":"ajustează tensiunea suspantelor","correct":false,"short":"","long":"Ajustarea nu rezolvă uzura sau fisura.","warn":""},{"text":"înlocuiește imediat suspentele deteriorate","correct":true,"short":"","long":"Este răspunsul corect: suspentele deteriorate nu mai au rezistența necesară.","warn":""},{"text":"curăță liniile cu un detergent delicat","correct":false,"short":"","long":"Curățarea nu repară uzura.","warn":""},{"text":"aplică o bandă adezivă pentru a întări zona deteriorată","correct":false,"short":"","long":"Banda adezivă nu restabilește rezistența suspantei.","warn":""}]},{"number":"#24","text":"405: Ce trebuie să conțină o inspecție „preflight” pentru un paramotor?","short":"Inspecția preflight a paramotorului verifică carabinierele, elicea, motorul și sistemul de combustibil.","long":"Inspecția preflight acoperă toate elementele care pot cauza o problemă în zbor: fixarea carabinierelor, starea elicei, funcționarea motorului și a sistemului de combustibil. Verificarea aripii și a frânelor se face tot înainte de zbor, dar nu este singura parte a inspecției. Încărcarea echipamentului și GPS-ul nu sunt elemente de inspecție.","answers":[{"text":"verificarea carabinerelor, elicei, motorului și sistemului de combustibil","correct":true,"short":"Verificarea carabinierelor, elicei, motorului și sistemului de combustibil.","long":"Acestea sunt elementele principale ale inspecției preflight a paramotorului.","warn":""},{"text":"verificarea condiției aripii și a frânelor","correct":false,"short":"","long":"Este o parte a inspecției, dar nu descrie întreaga inspecție a paramotorului.","warn":""},{"text":"încărcarea echipamentului de zbor","correct":false,"short":"","long":"Încărcarea nu este o verificare tehnică.","warn":""},{"text":"testarea funcționării GPS-ului","correct":false,"short":"","long":"GPS-ul nu face parte din verificările esențiale ale inspecției.","warn":""}]},{"number":"#25","text":"411: De ce este importantă verificarea liniei de combustibil pentru bule?","short":"Bulele din linia de combustibil pot indica scurgeri sau găuri în linie.","long":"Bulele apar când aerul pătrunde în sistemul de combustibil. Dacă aerul intră, motorul poate funcționa neregulat sau se poate opri. Din acest motiv bulele sunt un semn de avertizare și trebuie căutată sursa intrării de aer.","answers":[{"text":"bulele pot indica scurgeri sau găuri în linie","correct":true,"short":"","long":"Este explicația corectă: aerul intră prin găuri sau îmbinări.","warn":""},{"text":"bulele pot cauza supraîncălzirea motorului","correct":false,"short":"","long":"Bulele nu cauzează direct supraîncălzirea.","warn":""},{"text":"bulele indică un nivel scăzut de combustibil","correct":false,"short":"","long":"Nivelul se vede separat, nu prin bule.","warn":""},{"text":"bulele reduc eficiența aripii","correct":false,"short":"","long":"Bulele din combustibil nu afectează aripa.","warn":""}]},{"number":"#26","text":"451: Care sunt avantajele unei aripi reflex?","short":"Aripa reflex are stabilitate mai mare la viteze mari.","long":"Profilul reflex are o curbură inversă la bordul de fugă, care îi crește stabilitatea și rezistența la colaps, mai ales la viteze mari. Surse de specialitate subliniază însă că aceste aripi sunt mai greu de manevrat și de lansat. Consumul și întreținerea nu sunt avantajele caracteristice ale reflexului.","answers":[{"text":"consum redus de combustibil","correct":false,"short":"","long":"Consumul nu depinde de profilul aripii.","warn":""},{"text":"stabilitate mai mare la viteze mari","correct":true,"short":"","long":"Este avantajul caracteristic al profilului reflex.","warn":""},{"text":"costuri mai mici de întreținere","correct":false,"short":"","long":"Întreținerea nu este avantajul caracteristic.","warn":""},{"text":"manevrabilitate crescută în viraje strânse","correct":false,"short":"","long":"Reflexul este de regulă mai puțin manevrabil în viraje strânse.","warn":""}]},{"number":"#27","text":"462: Cum se comportă aripile de începător în condiții de turbulență?","short":"Aripile de începător oferă stabilitate ridicată și sunt mai iertătoare în turbulență.","long":"Aripile EN A sunt proiectate pentru stabilitate și previzibilitate. Au o tendință mai mică de a se închide în turbulență și revin mai ușor. Ele cer totuși atenție, pentru că nu sunt imune la turbulență violentă. Viteza redusă și riscul de colaps mai mare nu sunt caracteristici ale aripii de începător.","answers":[{"text":"reduc semnificativ viteza de zbor","correct":false,"short":"","long":"Nu este caracteristica principală a aripii de începător în turbulență.","warn":""},{"text":"oferă o stabilitate ridicată și sunt mai iertătoare","correct":true,"short":"","long":"Este caracteristica corectă.","warn":""},{"text":"necesită o atenție sporită din partea pilotului","correct":false,"short":"","long":"Atenția este necesară oricând, nu este răspunsul principal.","warn":""},{"text":"sunt mai susceptibile la colapsuri","correct":false,"short":"","long":"Aripile de începător sunt, de regulă, mai puțin susceptibile la colapsuri.","warn":""}]},{"number":"#28","text":"445: Ce trebuie verificat la suspantele aripii înainte de decolare?","short":"Înainte de decolare se verifică conectarea corectă a suspantelor, fără îndoituri, și integritatea lor: toate variantele sunt corecte.","long":"Suspantele trebuie conectate corect, fără îndoituri care le slăbesc, și trebuie să fie întregi. Verificarea acoperă toate aceste aspecte, deci toate variantele sunt corecte. Dacă o suspantă are îndoituri sau semne de uzură, nu se decolează până nu este înlocuită.","answers":[{"text":"conectarea corectă și fără îndoituri","correct":false,"short":"","long":"Este o parte corectă a verificării.","warn":""},{"text":"conectarea corectă și fără îndoituri","correct":false,"short":"","long":"Este o parte a verificării; pentru întrebarea completă, varianta corectă este „toate variantele”.","warn":""},{"text":"toate variantele sunt corecte","correct":true,"short":"","long":"Este varianta corectă, care le acoperă pe toate.","warn":""},{"text":"integritatea generală a suspantelor","correct":false,"short":"","long":"Este o parte corectă a verificării.","warn":""}]},{"number":"#29","text":"464: Ce caracteristică este specifică aripilor de începător (EN A)?","short":"Aripile de începător EN A sunt concepute pentru a fi extrem de stabile și previzibile.","long":"Clasa EN A este cea mai iertătoare: aripa revine singură din colaps, are reacții previzibile și este ușor de controlat. Nu permite acrobații complexe, nu zboară cel mai rapid și nu are o întreținere mai frecventă decât alte clase.","answers":[{"text":"permit realizarea acrobațiilor aeriene complexe","correct":false,"short":"","long":"Acrobațiile sunt specifice clasei de performanță, nu clasei A.","warn":""},{"text":"sunt concepute pentru a fi extrem de stabile și previzibile","correct":true,"short":"","long":"Este caracteristica corectă a clasei EN A.","warn":""},{"text":"necesită o întreținere mai frecventă","correct":false,"short":"","long":"Întreținerea nu depinde de clasa EN A.","warn":""},{"text":"sunt proiectate pentru a atinge viteze foarte mari","correct":false,"short":"","long":"Acesta este specific clasei de performanță.","warn":""}]},{"number":"#30","text":"408: Ce rol are o elice echilibrată static?","short":"O elice echilibrată static reduce vibrațiile cauzate de dezechilibrul aerodinamic.","long":"Echilibrarea elicei corectează diferențele de masă dintre pale, care duc la vibrații. Vibrațiile uzează motorul și fixările. Echilibrarea nu îmbunătățește stabilitatea în zbor, nu previne supraîncălzirea și nu crește performanța.","answers":[{"text":"reduce vibrațiile cauzate de dezechilibrul aerodinamic","correct":true,"short":"","long":"Este efectul corect al echilibrării statice, deși tehnic se referă mai ales la masă.","warn":""},{"text":"îmbunătățește stabilitatea în zbor","correct":false,"short":"","long":"Echilibrarea nu are acest efect principal.","warn":""},{"text":"previne supraîncălzirea motorului","correct":false,"short":"","long":"Nu este efectul echilibrării.","warn":""},{"text":"crește performanța motorului","correct":false,"short":"","long":"Nu este efectul echilibrării.","warn":""}]},{"number":"#31","text":"414: Ce este o pliere „concertină” a aripii?","short":"Pliera „concertină” păstrează celulele bordului de atac plane.","long":"La pliere concertină, aripa se împachetează în straturi, iar celulele bordului de atac rămân deschise, fără să se curbeze. Așa se reduce riscul de deformare a materialului și se ușurează deschiderea la decolare. Nu este o reparație, nici o tehnică de lansare.","answers":[{"text":"un tip de reparație a aripii","correct":false,"short":"","long":"Nu este o reparație.","warn":""},{"text":"o metodă de pliere care menține celulele bordului de atac plane","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"un tip de reparație a aripii","correct":false,"short":"Un tip de reparație a aripii, aplicat la bordul de atac.","long":"Nu este o reparație.","warn":""},{"text":"o tehnică de lansare în condiții de vânt puternic","correct":false,"short":"","long":"Nu este tehnica de lansare, ci o metodă de pliere.","warn":""}]},{"number":"#32","text":"453: Care este principalul dezavantaj al aripilor cu profil reflex?","short":"Dezavantajul principal al aripilor reflex este stabilitatea redusă la viteze mici.","long":"Din cauza profilului, aripile reflex sunt mai greu de manevrat și de lansat la viteze mici, iar la viteze reduse stabilitatea lor poate scădea. Sursele de specialitate arată că și manevrabilitatea și viteza de lansare sunt aspecte discutate, deci dezavantajul depinde de model. Consumul și costul nu sunt dezavantajele principale.","answers":[{"text":"stabilitatea redusă la viteze mici","correct":true,"short":"","long":"Este dezavantajul indicat, deși depinde de model.","warn":""},{"text":"dificultatea de a menține direcția în condiții de vânt puternic","correct":false,"short":"Dificultatea de a menține direcția în vânt puternic.","long":"Nu este dezavantajul principal din sursele consultate.","warn":""},{"text":"costul ridicat al întreținerii","correct":false,"short":"","long":"Costul nu este dezavantajul principal al profilului.","warn":""},{"text":"consumul mai mare de combustibil la viteze mari","correct":false,"short":"","long":"Consumul nu este legat de profilul aripii.","warn":""}]},{"number":"#33","text":"402: De ce este importantă inspecția profesională a aripii după 2 ani sau 100 de ore de zbor?","short":"Inspecția profesională după 2 ani sau 100 de ore de zbor detectează daune structurale sau uzură.","long":"Intervalele de inspecție sunt recomandate de producător, iar valoarea de 2 ani sau 100 de ore apare în mai multe surse. Scopul inspecției este verificarea materialului, a porozității și a suspantelor, pentru a depista daune nevăzute. Curățarea, calibrarea navigației și verificarea motorului sunt alte operațiuni.","answers":[{"text":"pentru a curăța aripa de praf și murdărie","correct":false,"short":"","long":"Curățarea este o operațiune de întreținere, nu scopul inspecției profesionale.","warn":""},{"text":"pentru a recalibra echipamentele de navigație","correct":false,"short":"","long":"Navigația nu este legată de inspecția aripii.","warn":""},{"text":"pentru a verifica performanța motorului","correct":false,"short":"","long":"Motorul are propriul program de inspecție.","warn":""},{"text":"pentru a detecta eventuale daune structurale sau uzură","correct":true,"short":"","long":"Este scopul corect al inspecției.","warn":""}]},{"number":"#34","text":"460: Care este un dezavantaj al paramotoarelor cu motor în patru timpi?","short":"Un dezavantaj al paramotoarelor cu motor în patru timpi este greutatea mai mare.","long":"Motoarele în patru timpi au mai multe piese mobile, deci sunt mai grele decât cele în doi timpi cu aceeași putere. Pe de altă parte, consumă mai puțin și sunt mai eficiente. Întreținerea și puterea nu sunt, de regulă, dezavantajele lor principale.","answers":[{"text":"consum mai mare de combustibil","correct":false,"short":"","long":"Dimpotrivă, consumă mai puțin.","warn":""},{"text":"putere mai mică","correct":false,"short":"","long":"Puterea poate fi comparabilă; nu este dezavantajul principal.","warn":""},{"text":"greutate mai mare","correct":true,"short":"","long":"Este dezavantajul corect al motorului în patru timpi.","warn":""},{"text":"mai dificil de întreținut","correct":false,"short":"","long":"Întreținerea nu este dezavantajul principal.","warn":""}]},{"number":"#35","text":"430: Ce este un indicator de viteza aerului (airspeed indicator)?","short":"Indicatorul de viteză a aerului (airspeed indicator) măsoară viteza cu care te deplasezi prin aer.","long":"Airspeed indicatorul măsoară presiunea dinamică a aerului, pe care o transformă în viteză. Este diferit de viteza față de sol, care depinde și de vânt. Altimetrul măsoară altitudinea, iar variometrul viteza verticală.","answers":[{"text":"un instrument pentru măsurarea altitudinii","correct":false,"short":"","long":"Aceasta este funcția altimetrului.","warn":""},{"text":"un dispozitiv pentru determinarea direcției vântului","correct":false,"short":"","long":"Aceasta este funcția fanionului sau girouettei.","warn":""},{"text":"un echipament pentru controlul temperaturii motorului","correct":false,"short":"","long":"Aceasta este funcția senzorului de temperatură.","warn":""},{"text":"un dispozitiv care măsoară viteza cu care te deplasezi prin aer","correct":true,"short":"","long":"Este definiția corectă.","warn":""}]},{"number":"#36","text":"459: Care este principalul avantaj al unui paramotor cu motor în doi timpi?","short":"Motorul în doi timpi are greutate mai redusă și putere mai mare raportată la greutate.","long":"Motorul în doi timpi produce o ardere la fiecare rotație, deci pentru aceeași cilindree dă mai multă putere și are mai puține piese. Din aceste motive este mai ușor, avantaj important la paramotor. Consumul mai mare și întreținerea mai frecventă sunt dezavantajele lui.","answers":[{"text":"greutate mai redusă și putere mai mare","correct":true,"short":"","long":"Este avantajul principal al motorului în doi timpi.","warn":""},{"text":"consum redus de combustibil","correct":false,"short":"","long":"Motorul în doi timpi consumă, de regulă, mai mult.","warn":""},{"text":"durată de viață mai lungă","correct":false,"short":"","long":"Motorul în doi timpi are, de regulă, o durată de viață mai scurtă.","warn":""},{"text":"costuri de întreținere mai mici","correct":false,"short":"","long":"Întreținerea este mai frecventă la motorul în doi timpi.","warn":""}]},{"number":"#37","text":"209: Profilul aerodinamic e conceput ca să producă portanţă rezultată din:","short":"Portanța profilului aerodinamic apare din presiune pe intrados și depresiune pe extrados.","long":"Aerul curge mai repede deasupra aripii, ceea ce creează o depresiune pe extrados, și mai încet dedesubt, unde apare o presiune mai mare pe intrados. Diferența de presiune produce portanța. Celelalte variante inversează sau confundă sensurile presiunii.","answers":[{"text":"presiune mărita pe bordul de atac şi depresiune pe bordul de fugă","correct":false,"short":"Presiune mărită pe bordul de atac și depresiune pe bordul de fugă.","long":"Distribuția presiunii nu corespunde portanței.","warn":""},{"text":"vacuum dedesubtul aripii şi presiune mărită pe extrados","correct":false,"short":"Vacuum dedesubtul aripii și presiune mărită pe extrados.","long":"Presiunea mărită pe extrados ar reduce portanța.","warn":""},{"text":"presiune pe intrados şi depresiune pe extrados","correct":true,"short":"Presiune pe intrados și depresiune pe extrados.","long":"Este explicația corectă a portanței.","warn":""},{"text":"depresiune pe intrados şi presiune pe extrados","correct":false,"short":"Depresiune pe intrados și presiune pe extrados.","long":"Sensurile sunt inversate.","warn":""}]},{"number":"#38","text":"247: Depăşirea masei maxime admise la decolare:","short":"Depășirea masei maxime admise la decolare este interzisă, pentru că depășește rezistența structurală.","long":"Masa maximă admisă este calculată pentru rezistența structurii aripii, a suspantelor și a motorului. Peste această limită, încărcarea depășește ce pot suporta componentele, crește riscul de colaps sau de rupere și scad marjele de siguranță. Nu este recomandată nici pentru viteză, nici fără consecințe.","answers":[{"text":"are drept consecinţă doar diminuarea performanţelor aparatului","correct":false,"short":"Are drept consecință doar diminuarea performanțelor aparatului.","long":"Consecința este mai gravă: riscul structural.","warn":""},{"text":"este interzisă întrucât atrage depăşirea rezistenţei structurale","correct":true,"short":"Este interzisă, întrucât atrage depășirea rezistenței structurale.","long":"Este răspunsul corect.","warn":""},{"text":"este recomandată pentru că vom avea vitează mai mare","correct":false,"short":"Este recomandată, pentru că vom avea viteză mai mare.","long":"Viteza mai mare nu compensează riscul structural.","warn":""},{"text":"nu are consecinţe","correct":false,"short":"Nu are consecințe.","long":"Are consecințe, inclusiv structurale.","warn":""}]},{"number":"#39","text":"236: La înclinarea parapantei spre stânga:","short":"La înclinarea parapantei spre stânga, colțul stâng coboară și colțul drept se ridică.","long":"Când un colț al aripii coboară, acel colț primește mai puțin aer și se ridică, iar colțul opus se ridică prin acțiunea frânei. În descrierea, la înclinarea spre stânga, colțul stâng coboară, iar cel drept se ridică, adică aripa se rotește în sensul înclinării.","answers":[{"text":"colțul stâng coboară şi cel drept rămâne orizontal","correct":false,"short":"Colțul stâng coboară și cel drept rămâne orizontal.","long":"Colțul drept nu rămâne orizontal la această înclinare.","warn":""},{"text":"colțul stâng se ridică şi cel drept coboară","correct":false,"short":"Colțul stâng se ridică și cel drept coboară.","long":"Este invers.","warn":""},{"text":"colțul drept coboară și cel stâng urcă","correct":false,"short":"","long":"Este invers.","warn":""},{"text":"colțul stâng coboară şi cel drept se ridică","correct":true,"short":"Colțul stâng coboară și cel drept se ridică.","long":"Este descrierea, corectă pentru înclinarea spre stânga.","warn":""}]},{"number":"#40","text":"245: În ceea ce priveşte rodajul motoarelor ULM:","short":"Rodajul motoarelor ULM se face conform recomandărilor constructorului, specifice fiecărui motor.","long":"Rodajul depinde de construcție, de materiale și de ulei. De aceea singura regulă sigură este să urmezi manualul motorului. Regulile generale (ulei minerale, procente din turația maximă) nu se aplică uniform tuturor motoarelor.","answers":[{"text":"trebuie să ţineţi cont de recomandările constructorului, specifice fiecărui tip de motor","correct":true,"short":"Trebuie să țineți cont de recomandările constructorului, specifice fiecărui tip de motor.","long":"Este răspunsul corect.","warn":""},{"text":"pe perioada de rodare trebuie să utilizaţi doar ulei mineral din surse cunoscute","correct":false,"short":"Pe perioada de rodare trebuie să utilizați doar ulei mineral din surse cunoscute.","long":"Uleiul depinde de motor, nu este o regulă generală.","warn":""},{"text":"nu trebuie să depăşiţi 75% din regimul maxim în primele 100 de ore de funcționare","correct":false,"short":"Nu trebuie să depășiți 75% din regimul maxim în primele 100 de ore.","long":"Limita depinde de constructor, nu este regulă generală.","warn":""},{"text":"la motoarele actuale nu necesită precauţii speciale","correct":false,"short":"La motoarele actuale nu necesită precauții speciale.","long":"Rodajul necesită în continuare respectarea recomandărilor.","warn":""}]},{"number":"#41","text":"403: Ce tip de ulei ar trebui utilizat pentru motoarele în doi timpi ale paramotoarelor?","short":"Pentru motoarele în doi timpi ale paramotoarelor se folosește ulei pentru motoare răcite cu aer, care respectă standardul 2T.","long":"Motoarele răcite cu aer funcționează la temperaturi mai ridicate, iar uleiul trebuie să ofere ungere și să se ardă curat. Uleiul pentru motoare de mașină sau marine nu are aceleași proprietăți. Uleiul sintetic pentru avioane este o altă categorie.","answers":[{"text":"ulei pentru motoare răcite cu aer, care respectă standardele 2T","correct":true,"short":"","long":"Este uleiul potrivit pentru motoarele în doi timpi ale paramotoarelor.","warn":""},{"text":"ulei pentru motoare de mașini","correct":false,"short":"","long":"Nu este formulat pentru motoarele în doi timpi.","warn":""},{"text":"ulei sintetic pentru avioane","correct":false,"short":"","long":"Nu este uleiul specificat pentru amestecul cu benzina.","warn":""},{"text"
