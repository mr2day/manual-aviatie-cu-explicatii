:""}]},{"number":"#94","text":"622: Cum influențează profilul unei aripi eficiența zborului?","short":"Profilul cu o curbură mai pronunțată produce mai multă portanță, dar și mai multă rezistență aerodinamică.","long":"Curbura mai mare crește portanța la același unghi de atac, dar și rezistența. Profilul simetric produce mai puțină portanță la viteze mici. Unghiul negativ nu este folosit pentru consum.","answers":[{"text":"profilul cu o curbură mai pronunțată produce mai multă portanță, dar și mai multă rezistență aerodinamică","correct":true,"short":"","long":"","warn":""},{"text":"profilul simetric este mai eficient în generarea portanței la viteze mici","correct":false,"short":"","long":"Este invers.","warn":""},{"text":"profilul cu unghi de atac negativ optimizează consumul de combustibil","correct":false,"short":"","long":"Nu este efectul corect.","warn":""},{"text":"profilul cu unghi de atac negativ scade consumul de combustibil","correct":false,"short":"","long":"Nu este efectul corect.","warn":""}]},{"number":"#95","text":"631: Ce se întâmplă dacă folosești viteza maximă în timpul urcării?","short":"Dacă folosești viteza maximă în timpul urcării, crește consumul de combustibil și riscul de supraîncălzire a motorului.","long":"La putere maximă, motorul consumă mai mult și se supraîncălzește mai ușor. Urcarea cea mai eficientă se face la viteza optimă, nu la viteza maximă.","answers":[{"text":"crește consumul de combustibil și riscul de supraîncălzire a motorului","correct":true,"short":"","long":"","warn":""},{"text":"stabilizează zborul și reduce uzura aripii","correct":false,"short":"","long":"Nu este efectul.","warn":""},{"text":"optimizează performanța motorului la altitudini joase","correct":false,"short":"","long":"Nu este efectul principal.","warn":""},{"text":"îmbunătățește rata de urcare și stabilitatea în zbor","correct":false,"short":"","long":"Viteza maximă nu este cea mai bună pentru urcare.","warn":""}]},{"number":"#96","text":"644: Cum vei proceda în situația în care aripa intră într-un front stall la viteză maximă cu trimmerele complet deschise?","short":"Dacă aripa intră într-un front stall la viteză maximă cu trimmerele deschise, închizi trimmerele și folosești frânele pentru stabilizare.","long":"La viteză maximă și trimmere deschise, aripa are unghi de atac mic și poate intra în front stall. Închiderea trimmerelor ridică unghiul de atac, iar frânele stabilizează. Continuarea accelerației sau tragerea bruscă de frâne nu sunt corecte.","answers":[{"text":"vei reduce puterea motorului și vei folosi frânele pentru a stabiliza aripa","correct":false,"short":"","long":"Este parțial corect, dar varianta corectă include închiderea trimmerelor.","warn":""},{"text":"vei continua să accelerezi","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"vei trage brusc de frâne pentru a opri stall-ul","correct":false,"short":"","long":"Agravează.","warn":""},{"text":"vei închide trimmerele și vei folosi frânele pentru stabilizare","correct":true,"short":"","long":"","warn":""}]},{"number":"#97","text":"583: Zburăm la 500m înalțime față de relief, care este procedura în cazul în care se oprește motorul?","short":"Dacă zbori la 500 m față de relief și motorul se oprește, vizualizezi terenul de aterizare din conul de siguranță, încerci repornirea și stabilești direcția vântului.","long":"La oprirea motorului, prioritatea este terenul sigur din conul de siguranță. Pilotul vizualizează terenul, stabilește vântul și încearcă repornirea doar dacă are timp. Continuarea zborului normal nu este procedura.","answers":[{"text":"încercare repornire motor, stabilit direcția vântului, și locul de aterizare","correct":false,"short":"Încercare repornire motor, stabilit direcția vântului și locul de aterizare.","long":"Ordinea nu este cea; prioritatea este terenul sigur.","warn":""},{"text":"ne concentăm, pornim motorul și continuăm conform planului de zbor","correct":false,"short":"Ne concentrăm, pornim motorul și continuăm conform planului de zbor.","long":"Nu este procedura.","warn":""},{"text":"continuăm să zburăm normal, aripa planează","correct":false,"short":"","long":"Nu este procedura.","warn":""},{"text":"vizualizare câmp de aterizare aflat în conul de siguranță, încercare repornire motor, stabilire direcția vântului","correct":true,"short":"","long":"","warn":""}]},{"number":"#98","text":"591: Unghiul de incidență al aripii este mai mare:","short":"Unghiul de incidență al aripii este mai mare cu speed-ul neapăsat și trimmerul în poziție standard, închis.","long":"Speed-ul apăsat și trimmerele deschise scad unghiul de incidență. Când ele sunt închise și speed-ul neapăsat, unghiul este mai mare. Trimmerul deschis singur reduce unghiul.","answers":[{"text":"cu speed-ul apăsat si trimerul deschis","correct":false,"short":"Cu speed-ul apăsat și trimmerul deschis.","long":"Unghiul este mai mic.","warn":""},{"text":"cu speed-ul apasat","correct":false,"short":"Cu speed-ul apăsat.","long":"Unghiul este mai mic.","warn":""},{"text":"cu speed-ul neapăsat și trimerul în pozitie standard (închis)","correct":true,"short":"Cu speed-ul neapăsat și trimmerul în poziție standard (închis).","long":"","warn":""},{"text":"cu trimerul deschis","correct":false,"short":"Cu trimmerul deschis.","long":"Unghiul este mai mic.","warn":""}]},{"number":"#99","text":"582: Dacă în timpul decolării în faza de gonflaj aripa este mult în dreapta aproape de sol într-o poziție asimetrică față de pilot, cum procedăm?","short":"Dacă în timpul gonflajului aripa este mult în dreapta, aproape de sol și asimetrică față de pilot, oprești motorul și renunți la decolare.","long":"Aripa asimetrică la gonflaj este o situație periculoasă. Oprirea motorului și renunțarea la decolare sunt soluția, pentru a evita dezechilibrul la decolare. Continuarea cu gaz maxim sau mărirea vitezei agravează situația.","answers":[{"text":"se opreste motorul si se renunta la decolare","correct":true,"short":"Se oprește motorul și se renunță la decolare.","long":"","warn":""},{"text":"ne deplasam in partea opusa cu acceleratie","correct":false,"short":"Ne deplasăm în partea opusă cu accelerație.","long":"Nu rezolvă situația.","warn":""},{"text":"se continua pe directie cu gaz maxim","correct":false,"short":"Se continuă pe direcție cu gaz maxim.","long":"Este periculos.","warn":""},{"text":"se mareste viteza si se scade acceleratia motorului","correct":false,"short":"Se mărește viteza și se scade accelerația motorului.","long":"Nu este procedura.","warn":""}]},{"number":"#100","text":"664: Ce tehnici ar trebui să folosească un elev începător pentru a menține stabilitatea aripii în timpul decolării?","short":"Pentru a menține stabilitatea aripii la decolare, ajustezi frânele pentru a menține aripa centrată, folosești un unghi de atac adecvat și menții o alergare constantă.","long":"Stabilitatea la decolare depinde de centrarea aripii cu frânele, de unghiul de atac corect și de alergarea constantă. Brațele întinse, frâna doar pe o parte și creșterea vitezei de alergare nu sunt corecte.","answers":[{"text":"ă își țină brațele întinse pentru a stabiliza aripa și să folosească doar frâna dreaptă","correct":false,"short":"Să își țină brațele întinse pentru a stabiliza aripa și să folosească doar frâna dreaptă.","long":"Nu este tehnica corectă.","warn":""},{"text":"alergarea cu capul înainte pentru a reduce rezistența aerodinamică, și folosirea unei poziții fixe a trimmerelor","correct":false,"short":"","long":"Nu este tehnica completă.","warn":""},{"text":"utilizarea trimmerelor pentru a schimba rapid direcția aripii, aplicarea de frâne doar pe o parte a aripii, și creșterea vitezei de alergare","correct":false,"short":"Utilizarea trimmerelor pentru a schimba rapid direcția aripii, aplicarea de frâne doar pe o parte, și creșterea vitezei de alergare.","long":"Este periculos.","warn":""},{"text":"ajustarea frânelor pentru a menține aripa centrată, utilizarea unui unghi de atac adecvat, și menținerea unei alergări constante","correct":true,"short":"Ajustarea frânelor pentru a menține aripa centrată, utilizarea unui unghi de atac adecvat și menținerea unei alergări constante.","long":"","warn":""}]},{"number":"#101","text":"679: Cum este direcționată forța de frânare aplicată pe o parapantă în zbor?","short":"Forța de frânare aplicată pe o parapantă în zbor este orientată în jos și înapoi, reducând viteza și crescând portanța.","long":"Frânarea trage marginea de fugă în jos și înapoi. Asta crește unghiul de atac, deci portanța crește și viteza scade. Forța nu este orientată în sus și înainte, nici vertical sau lateral.","answers":[{"text":"în sus și înainte, crescând viteza și reducând rezistența aerodinamică","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"în jos și înapoi, reducând viteza și crescând portanța","correct":true,"short":"","long":"","warn":""},{"text":"vertical, pentru a menține altitudinea constantă","correct":false,"short":"","long":"Nu este descrierea.","warn":""},{"text":"lateral, pentru a stabiliza aripa în viraje","correct":false,"short":"","long":"Nu este descrierea.","warn":""}]},{"number":"#102","text":"642: Cum este indicat să zbori când ai trimmerele setate la viteza maximă?","short":"Când ai trimmerele setate la viteza maximă, eviți manevrele bruște și folosești tip steering pentru viraje.","long":"La viteză maximă aripa este sensibilă. Virajele se fac cu tip steering (trageri ușoare ale comenzilor exterioare), iar manevrele bruște sunt de evitat. Frânarea constantă și virajele strânse nu sunt indicate.","answers":[{"text":"să folosești doar frânele pentru control","correct":false,"short":"","long":"Nu este indicat.","warn":""},{"text":"să reduci constant viteza","correct":false,"short":"","long":"Nu este procedura.","warn":""},{"text":"să faci viraje strânse și rapide","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"să eviți manevrele bruște și să folosești tip steering pentru viraje","correct":true,"short":"","long":"","warn":""}]},{"number":"#103","text":"663: Cum ar trebui să reacționeze un elev începător dacă aripa nu se umflă corect în timpul decolării?","short":"Dacă aripa nu se umflă corect în timpul decolării, reduci imediat puterea motorului, verifici poziția aripii și repeți procedura de umflare cu atenție sporită.","long":"Aripa care nu se umflă corect trebuie verificată înainte de decolare, pentru a evita decolarea instabilă. Reducerea puterii, verificarea și reluarea atentă sunt pașii. Mărirea bruscă a puterii sau continuarea alergării nu sunt corecte.","answers":[{"text":"să crească brusc puterea motorului pentru a forța umflarea aripii","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"să se oprească complet și să aștepte ca aripa să se umfle natural","correct":false,"short":"","long":"Nu este procedura cea mai bună.","warn":""},{"text":"să continue alergarea indiferent de umflarea aripii","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"să reducă imediat puterea motorului, să verifice poziția aripii și să repete procedura de umflare cu atenție sporită","correct":true,"short":"","long":"","warn":""}]}]}]</script>
