ational Standard Atmosphere) este atmosfera de referință folosită în aviație pentru calibrarea instrumentelor și pentru calculul performanțelor. Celelalte variante nu sunt denumirile corecte.","answers":[{"text":"ISA reprezintă International Standard Atmosphere","correct":true,"short":"","long":"Este denumirea corectă.","warn":""},{"text":"ISA semnifică International Solar Alliance","correct":false,"short":"","long":"Nu este denumirea ISA din aviație.","warn":""},{"text":"ISA este acronimul pentru International Space Agency","correct":false,"short":"","long":"Nu este denumirea ISA din aviație.","warn":""},{"text":"ISA înseamnă Integrated Systems Architecture","correct":false,"short":"","long":"Nu este denumirea ISA din aviație.","warn":""}]},{"number":"#53","text":"214: Care sunt caracteristicile unei vijelii?","short":"Vijeliile sunt însoțite de un salt brusc al presiunii și de intensificarea vântului.","long":"Vijelia este o rafală puternică, produsă de frontul rece sau de un nor cumulonimbus. Se manifestă printr-un salt brusc de presiune, un vânt care se intensifică și o schimbare bruscă de direcție. Scăderile bruște de temperatură sau precipitațiile prelungite nu sunt caracteristicile corecte.","answers":[{"text":"vijeliile sunt însoțite de un salt brusc al presiunii și de intensificarea vântului","correct":true,"short":"","long":"","warn":""},{"text":"caracteristicile unei vijelii includ scăderi bruște și semnificative de temperatură","correct":false,"short":"","long":"Nu este caracteristica corectă.","warn":""},{"text":"vijeliile se manifestă prin creșterea bruscă a umidității relative","correct":false,"short":"","long":"Nu este caracteristica corectă.","warn":""},{"text":"vijeliile sunt caracterizate prin precipitații intense și îndelungate","correct":false,"short":"","long":"Vijeliile sunt de scurtă durată.","warn":""}]},{"number":"#54","text":"261: În cursul zborului, un fenomen orajos poate fi evitat prin:","short":"Norii de tip CB se ocolesc la o distanță de minim 10 km, iar pentru furtunile puternice se mărește distanța la minim 37 km.","long":"Distanțele sunt orientative. Cumulonimbusul produce turbulență, grindină, fulgere și rafale. Evitarea lui trebuie făcută cu distanță sigură și verificarea prognozei înainte de zbor. Verifică valorile din procedurile aplicabile.","answers":[{"text":"ocolirea norilor de tip CB la o distanță de minim 10 km și minim 37 km pentru orajele puternice","correct":true,"short":"","long":"Cumulonimbusul produce turbulență, grindină, fulgere și rafale, deci nu trebuie trecut pe sub el sau printre nori. Varianta A este singura care spune să-l ocolești cu o distanță mare. Valorile exacte de distanță trebuie verificate în reglementarea aplicabilă.","warn":""},{"text":"trecerea pe sub nor la o înălțime de maxim 100 m peste cel mai înalt obstacol","correct":false,"short":"","long":"Trecerea pe sub CB este periculoasă.","warn":""},{"text":"trecerea printre două formațiuni noroase numai dacă acestea se află la minim 10 km distanță una față de cealaltă","correct":false,"short":"Trecerea printre două formațiuni noroase numai dacă acestea se află la minim 10 km distanță una de alta.","long":"Trecerea printre nori este periculoasă.","warn":""},{"text":"consultarea hărților aeronautice înainte de efectuarea zborului","correct":false,"short":"","long":"Este recomandabilă, dar nu este modalitatea de evitare în zbor.","warn":""}]},{"number":"#55","text":"265: Sunteți la finalul zborului, chiar înainte de a apune soarele și la apropierea de sol simțiți o scădere bruscă a temperaturii, iar mâneca de vânt indică o altă direcție față de cea de la decolare. Acest fenomen este posibil sa fie dat de:","short":"Scăderea bruscă a temperaturii și schimbarea direcției mânecii de vânt la apus pot fi date de vântul catabatic.","long":"După apus, versanții se răcesc și aerul rece coboară spre vale. Vântul catabatic produce scăderea temperaturii și modifică direcția vântului la sol, față de cea de la decolare. Vântul anabatic are loc pe timp de zi.","answers":[{"text":"vântul catabatic","correct":true,"short":"","long":"","warn":""},{"text":"vântul anabatic","correct":false,"short":"","long":"Anabaticul apare pe timp de zi, nu la apus.","warn":""},{"text":"un front rece local","correct":false,"short":"","long":"Nu este explicația cea mai probabilă, în condițiile descrise.","warn":""},{"text":"vântul de munte","correct":false,"short":"","long":"Termenul este prea general; varianta corectă este catabaticul.","warn":""}]},{"number":"#56","text":"295: Ce este căldura specifică?","short":"Căldura specifică este cantitatea de căldură necesară pentru a încălzi cu 1°C un gram dintr-un corp.","long":"Căldura specifică arată cât de greu se încălzește un material. Apa are căldură specifică mare. Ea nu este energia pentru un metru cub de aer, nici pentru schimbarea stării de agregare.","answers":[{"text":"căldura specifică este cantitatea de căldură necesară pentru a încălzi cu 1°C 1g dintr-un corp","correct":true,"short":"Cantitatea de căldură necesară pentru a încălzi cu 1°C 1 g dintr-un corp.","long":"Este definiția corectă.","warn":""},{"text":"căldura specifică este energia necesară pentru a încălzi cu 1°C un metru cub de aer","correct":false,"short":"Energia necesară pentru a încălzi cu 1°C un metru cub de aer.","long":"Aceasta este definiția altei mărimi.","warn":""},{"text":"căldura specifică se referă la variația temperaturii unui corp sub influența radiației solare","correct":false,"short":"Variația temperaturii unui corp sub influența radiației solare.","long":"Aceasta descrie încălzirea, nu căldura specifică.","warn":""},{"text":"căldura specifică reprezintă cantitatea de energie necesară pentru a schimba starea de agregare a unui corp","correct":false,"short":"Cantitatea de energie necesară pentru a schimba starea de agregare a unui corp.","long":"Aceasta este căldura latentă.","warn":""}]},{"number":"#57","text":"312: Care dintre următoarele mesaje meteorologice poate fi abreviat CAVOK, în conformitate cu reglementările specifice?","short":"Mesajul 15003KT 9999 BKN110 17/11 Q1024 NOSIG poate fi abreviat CAVOK, pentru că vizibilitatea este de 10 km și norii sunt peste 5000 ft.","long":"CAVOK cere vizibilitate de cel puțin 10 km (9999 înseamnă 10 km sau mai mult), fără nori sub 5000 ft (1500 m) și fără fenomene semnificative. Norii BKN110 sunt la 11 000 ft, deci condiția este îndeplinită. Celelalte mesaje au nori joși, ploaie sau vizibilitate redusă.","answers":[{"text":"24009KT 6000 RA SCT010 OVC030 12/11 Q1007 TEMPO 4000","correct":false,"short":"","long":"Ploaia, norii joși și vizibilitatea de 6 km exclud CAVOK.","warn":""},{"text":"29010KT 9000 SCT045TCU 16/12 Q1015 RESHRA NOSIG","correct":false,"short":"","long":"Vizibilitatea de 9 km și ploaia exclud CAVOK.","warn":""},{"text":"15003KT 9999 BKN110 17/11 Q1024 NOSIG","correct":true,"short":"","long":"Este varianta corectă: vizibilitate de 10 km și nori peste 5000 ft.","warn":""},{"text":"04012G26KT 9999 BKN030 11/07 Q1024 NOSIG","correct":false,"short":"","long":"Norii BKN030 sunt sub 5000 ft, deci CAVOK nu se aplică.","warn":""}]},{"number":"#58","text":"254: Presiunea atmosferică scade în altitudine datorită:","short":"Presiunea atmosferică scade cu altitudinea din cauza scăderii densității aerului și a scurtării coloanei de aer deasupra.","long":"La altitudine, coloana de aer deasupra este mai scurtă și mai rară, deci greutatea ei apasă mai puțin. De aceea presiunea scade cu altitudinea. Scăderea temperaturii sau creșterea umezelii nu sunt cauzele principale.","answers":[{"text":"creșterii gradientului termic","correct":false,"short":"","long":"Gradientul termic nu explică scăderea presiunii.","warn":""},{"text":"scăderii densităţii aerului în înălţime şi scurtării coloanei de aer","correct":true,"short":"Scăderii densității aerului în înălțime și scurtării coloanei de aer.","long":"Este explicația corectă.","warn":""},{"text":"scăderii temperaturii aerului în înălţime","correct":false,"short":"Scăderii temperaturii aerului în înălțime.","long":"Temperatura nu este cauza principală.","warn":""},{"text":"creşterii umezelii în înălţime","correct":false,"short":"Creșterii umezelii în înălțime.","long":"Umezeala nu este cauza principală.","warn":""}]},{"number":"#59","text":"298: Ce este treapta barică?","short":"Treapta barică este distanța verticală necesară pentru ca presiunea să scadă cu 1 mb.","long":"Treapta barică variază cu altitudinea: la nivelul mării este de aproximativ 8,4 m, iar mai sus este mai mare. Nu este un interval de timp, nici un nivel la care presiunea se dublează sau rămâne constantă.","answers":[{"text":"treapta barică reprezintă intervalul de timp în care presiunea atmosferică scade cu 1 mb","correct":false,"short":"Intervalul de timp în care presiunea atmosferică scade cu 1 mb.","long":"Este un interval de altitudine, nu de timp.","warn":""},{"text":"treapta barică este un interval de altitudine la care presiunea atmosferică rămâne constantă","correct":false,"short":"Un interval de altitudine la care presiunea atmosferică rămâne constantă.","long":"Presiunea nu rămâne constantă.","warn":""},{"text":"treapta barică indică nivelul la care presiunea atmosferică se dublează","correct":false,"short":"Nivelul la care presiunea atmosferică se dublează.","long":"Nu este definiția.","warn":""},{"text":"treapta barică reprezintă distanța verticală necesară pentru ca presiunea să scadă cu 1 mb","correct":true,"short":"Distanța verticală necesară pentru ca presiunea să scadă cu 1 mb.","long":"Este definiția corectă.","warn":""}]},{"number":"#60","text":"291: Ce este vântul geostrofic?","short":"Vântul geostrofic bate paralel cu izobarele, ca rezultat al echilibrului dintre gradientul de presiune și forța Coriolis.","long":"La altitudine, forța gradientului de presiune este echilibrată de forța Coriolis, iar vântul bate paralel cu izobarele. Nu este un vânt local, nici unul care bate spre presiune scăzută sau cauzat de încălzirea solară.","answers":[{"text":"vântul geostrofic este un vânt care bate paralel cu izobarele, ca rezultat al echilibrului dintre forța gradientului de presiune și forța Coriolis","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"vântul geostrofic este un curent de aer care se formează datorită încălzirii solare","correct":false,"short":"","long":"Aceasta descrie alt tip de vânt.","warn":""},{"text":"vântul geostrofic este un vânt care bate în direcția presiunii atmosferice scăzute","correct":false,"short":"","long":"Vântul geostrofic nu bate spre presiune scăzută.","warn":""},{"text":"vântul geostrofic este un vânt local care apare doar în regiunile montane","correct":false,"short":"","long":"Nu este un vânt local de munte.","warn":""}]},{"number":"#61","text":"308: Valoarea densității în atmosfera standard internațională (ISA) este de:","short":"Densitatea în atmosfera standard ISA este de 1225 g/m³, adică 1,225 kg/m³.","long":"Densitatea aerului la nivelul mării, în ISA, este 1,225 kg/m³. Exprimată în g/m³ este 1225 g/m³. Varianta cu g/m² este greșită, pentru că m² este unitate de suprafață, nu de volum.","answers":[{"text":"29,6 mm Hg","correct":false,"short":"","long":"Aceasta este o unitate de presiune, nu de densitate.","warn":""},{"text":"1013,2 mb","correct":false,"short":"","long":"Aceasta este presiunea standard, nu densitatea.","warn":""},{"text":"1225g/m2","correct":false,"short":"1225 g/m².","long":"Unitatea m² este de suprafață, nu de volum.","warn":""},{"text":"1225g/m3","correct":true,"short":"1225 g/m³.","long":"Este varianta corectă.","warn":""}]},{"number":"#62","text":"221: Atmosfera devine instabilă odată cu apropierea unui:","short":"Atmosfera devine instabilă odată cu apropierea unui front rece.","long":"Frontul rece împinge aer cald în sus, iar aerul din față devine instabil, cu ascendențe și nori cumuliformi, uneori cu furtuni. Cumulonimbusul este un nor, nu o cauză. Frontul oclus și cel cald dau de obicei vreme mai stabilă.","answers":[{"text":"cumulonimbus","correct":false,"short":"","long":"Este un nor care indică instabilitatea, nu o cauză.","warn":""},{"text":"front rece","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"front oclus","correct":false,"short":"","long":"Combină caracteristici și nu este cel mai tipic pentru instabilitate.","warn":""},{"text":"front cald","correct":false,"short":"","long":"Frontul cald dă de obicei vreme mai stabilă.","warn":""}]},{"number":"#63","text":"317: Direcția vântului este indicată de unghiul format între nordul geografic și:","short":"Direcția vântului este unghiul măsurat în sensul acelor de ceasornic de la nordul geografic până la direcția din care bate vântul.","long":"Vântul se raportează la direcția din care bate, nu în care se duce. Unghiul se măsoară de la nordul geografic în sensul acelor de ceasornic. De exemplu, vânt din est este indicat 090.","answers":[{"text":"direcția în care suflă vântul, măsurată în sens invers acelor de ceasornic","correct":false,"short":"","long":"Direcția se măsoară din care bate vântul și în sensul acelor de ceasornic.","warn":""},{"text":"direcția din care bate vântul, măsurată în sens invers acelor de ceasornic","correct":false,"short":"","long":"Sensul corect este cel al acelor de ceasornic.","warn":""},{"text":"direcția din care bate vântul, măsurată în sensul acelor de ceasornic","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"direcția în care suflă vântul, măsurată în sensul acelor de ceasornic","correct":false,"short":"","long":"Vântul se raportează la direcția din care bate.","warn":""}]},{"number":"#64","text":"316: Faptul că o masă de aer încălzită de soare urmează o traiectorie ascendentă este urmarea:","short":"Masa de aer încălzită de soare urmează o traiectorie ascendentă din cauza convecției.","long":"Aerul încălzit de la sol devine mai ușor și urcă. Acest transfer de căldură prin deplasarea maselor de aer se numește convecție. Radiația este transferul de la soare, conducția este prin contact, iar vântul este mișcarea orizontală a aerului.","answers":[{"text":"radiației","correct":false,"short":"","long":"Radiația este transferul de energie prin unde, nu urcarea aerului.","warn":""},{"text":"vântului","correct":false,"short":"","long":"Vântul este mișcare orizontală, nu urcare termică.","warn":""},{"text":"convecției","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"conducției","correct":false,"short":"","long":"Conducția este transferul prin contact direct.","warn":""}]},{"number":"#65","text":"296: La întrebarea: Transmiterea căldurii se face prin? Care este fals?","short":"Căldura se transmite prin convecție, radiație și conducție, nu prin presiune.","long":"Cele trei moduri de transmitere a căldurii sunt conducția (contact), convecția (deplasarea fluidelor) și radiația (unde). Presiunea nu este un mod de transfer a căldurii, deci este varianta falsă.","answers":[{"text":"transmiterea căldurii se face prin convectie","correct":false,"short":"Transmiterea căldurii se face prin convecție.","long":"Este un mod corect de transfer.","warn":""},{"text":"transmiterea căldurii se face prin radiatie","correct":false,"short":"Transmiterea căldurii se face prin radiație.","long":"Este un mod corect de transfer.","warn":""},{"text":"transmiterea căldurii se face prin presiune","correct":true,"short":"","long":"Este varianta falsă: presiunea nu transmite căldura.","warn":""},{"text":"transmiterea căldurii se face prin conductie","correct":false,"short":"Transmiterea căldurii se face prin conducție.","long":"Este un mod corect de transfer.","warn":""}]},{"number":"#66","text":"227: Ce este vântul catabatic?","short":"Vântul catabatic este un vânt descendent, care coboară pe versanții dealurilor în văi, seara.","long":"Seara și noaptea, versanții se răcesc și aerul rece, mai greu, coboară. Vântul catabatic este descendent. Turbionarea din văile înguste și vântul ascendent de dimineață descriu alte fenomene.","answers":[{"text":"este un vânt descendent ce coboară pe versanții dealurilor în văi seara","correct":true,"short":"Un vânt descendent care coboară pe versanții dealurilor în văi seara.","long":"Este varianta corectă.","warn":""},{"text":"este o mișcare de aer turbionară în văile înguste","correct":false,"short":"O mișcare de aer turbionară în văile înguste.","long":"Aceasta descrie turbulența, nu catabaticul.","warn":""},{"text":"este un vânt ascendent ce apare dimineața","correct":false,"short":"Un vânt ascendent care apare dimineața.","long":"Acesta descrie vântul anabatic.","warn":""},{"text":"este un vânt ascendent ce apare dimineața","correct":false,"short":"Un vânt ascendent care apare dimineața.","long":"Varianta este dublată și descrie anabaticul.","warn":""}]},{"number":"#67","text":"252: Zburaţi pe vânt laminar de aproximativ 15km/h, efectuaţi un viraj de 360º cu înclinare şi viteză constante. Care este traiectoria dvs. faţă de sol?","short":"Pe vânt laminar de 15 km/h, un viraj de 360° la viteză și înclinare constante lasă o traiectorie față de sol în formă de buclă, descrisă de figura c.","long":"Vântul deplasează aeronava în timpul virajului, deci traiectoria față de sol nu este un cerc perfect, ci o buclă sau o curbă deplasată în direcția vântului. Figura c ilustrează această traiectorie. Verifică desenul pentru a vedea diferența față de a și b.","answers":[{"text":"b","correct":false,"short":"","long":"Varianta nu este cea corectă.","warn":""},{"text":"niciuna","correct":false,"short":"","long":"Există o traiectorie reprezentată corect.","warn":""},{"text":"c","correct":true,"short":"","long":"Depinde de figură.","warn":""},{"text":"a","correct":false,"short":"","long":"Varianta nu este cea corectă.","warn":""}]},{"number":"#68","text":"283: Ce este pâcla?","short":"Pâcla este suspensia în atmosferă a unor particule uscate, litosferice, foarte mici, care dau aerului un aspect opalescent.","long":"Pâcla (haze) este formată din particule uscate de praf, fum sau nisip, în suspensie. Ceața este formată din picături de apă. Diferența este importantă, pentru că pâcla nu se formează din condensare.","answers":[{"text":"un fenomen meteorologic caracterizat prin viteza mare a vântului","correct":false,"short":"","long":"Aceasta descrie vântul puternic, nu pâcla.","warn":""},{"text":"o formă de precipitație fină care reduce vizibilitatea","correct":false,"short":"","long":"Pâcla nu este precipitație.","warn":""},{"text":"un tip de ceață densă care se formează datorită umidității ridicate","correct":false,"short":"","long":"Pâcla nu este ceață; este suspensie de particule uscate.","warn":""},{"text":"suspensia în atmosferă a unor particule litosferice uscate extrem de mici, care dau aerului un aspect opalescent","correct":true,"short":"","long":"Este definiția corectă.","warn":""}]},{"number":"#69","text":"305: Cum recunoașteți vântul de forfecare în zbor?","short":"Vântul de forfecare se recunoaște în zbor prin schimbări bruște ale capului compas, ratei de viraj, turației motorului și temperaturii ambientale.","long":"În zbor, forfecarea se simte ca schimbări bruște ale direcției și vitezei, care se văd în instrumente: capul compas, rata de viraj și turația. Schimbările bruște ale presiunii uleiului și ale direcției descriu un amestec de efecte, nu semnul principal.","answers":[{"text":"schimbări bruște ale altitudinii și vitezei orizontale și verticale","correct":false,"short":"","long":"Este o descriere apropiată, dar varianta corectă este cea cu capul compas și turația.","warn":""},{"text":"apariția neașteptată a curenților ascendenți termici într-o după-amiază de vară","correct":false,"short":"","long":"Aceasta descrie termicele, nu forfecarea.","warn":""},{"text":"schimbări bruște ale capului compas, ratei de viraj, turației motorului și temperaturii ambientale","correct":true,"short":"","long":"","warn":""},{"text":"schimbări bruște ale presiunii și temperaturii uleiului, turației motorului și ale direcției de zbor","correct":false,"short":"","long":"Include efecte care nu sunt semnele principale ale forfecării.","warn":""}]},{"number":"#70","text":"277: Frontul rece de ordinul 1 este?","short":"Frontul rece de ordinul I este frontul în care, de-a lungul întregii suprafețe frontale, se observă ascensiunea aerului cald.","long":"La frontul rece de ordinul I, aerul cald este împins în sus pe toată suprafața frontului. Este un front cu nori cumuliformi și precipitații intense, dar descrierea se referă la ascensiunea aerului cald pe toată suprafața.","answers":[{"text":"frontul rece de ordinul I este frontul în care de-a lungul întregii suprafețe frontale a acestuia se observă ascensiunea aerului cald","correct":true,"short":"Frontul în care de-a lungul întregii suprafețe frontale se observă ascensiunea aerului cald.","long":"","warn":""},{"text":"frontul rece de ordinul I este frontul care se caracterizează prin deplasare rapidă și precipitații intense","correct":false,"short":"Frontul care se caracterizează prin deplasare rapidă și precipitații intense.","long":"Descrie frontul rece în general, nu definiția ordinului I.","warn":""},{"text":"frontul rece de ordinul I este frontul cu nebulozitate redusă și fără precipitații","correct":false,"short":"Frontul cu nebulozitate redusă și fără precipitații.","long":"Frontul rece are de obicei nebulozitate și precipitații.","warn":""},{"text":"frontul rece de ordinul I este frontul în care predomină descendența aerului cald","correct":false,"short":"Frontul în care predomină descendența aerului cald.","long":"Aerul cald urcă, nu coboară, la frontul de ordinul I.","warn":""}]},{"number":"#71","text":"289: Ce este vântul de gradient?","short":"Vântul de gradient bate paralel cu izobarele curbate, influențat de forța Coriolis și de gradientul de presiune.","long":"Vântul de gradient apare când izobarele sunt curbate, de exemplu în jurul unui ciclon sau anticiclon. Este o generalizare a vântului geostrofic, pentru izobare curbate. Nu este un curent termic sau un vânt de munte.","answers":[{"text":"vântul de gradient este un vânt care bate în direcția în care scade presiunea atmosferică","correct":false,"short":"","long":"Vântul nu bate direct în direcția presiunii scăzute.","warn":""},{"text":"vântul de gradient este un curent de aer care se formează datorită încălzirii solare","correct":false,"short":"","long":"Acesta descrie un vânt termic.","warn":""},{"text":"vântul de gradient este un vânt care bate paralel cu izobarele curbate, influențat de forța Coriolis și de gradientul de presiune","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"vântul de gradient este un tip de vânt care apare doar în zone montane","correct":false,"short":"","long":"Nu este limitat la munte.","warn":""}]},{"number":"#72","text":"218: Probabilitatea să întâlnim turbulențe când zburăm de-a lungul unei văi, cu vânt lateral din stânga este mai mare:","short":"Probabilitatea de turbulență este mai mare în umbra vântului, sub nivelul crestei versantului stâng, când vântul lateral vine din stânga.","long":"Vântul lateral care lovește un versant creează turbulență în partea adăpostită. Dacă vântul vine din stânga, zona cu turbulență cea mai probabilă este sub creasta versantului stâng, în umbra vântului. Mijlocul văii are turbulență mai mică.","answers":[{"text":"turbulențele sunt slabe în intensitate în oricare din variantele de mai sus","correct":false,"short":"","long":"Turbulența poate fi puternică în zona de umbră.","warn":""},{"text":"pe mijlocul văii","correct":false,"short":"","long":"Turbulența este mai mare în umbra versantului.","warn":""},{"text":"în umbra vântului sub nivelul crestei versantului drept","correct":false,"short":"","long":"Pentru vântul din stânga, zona de umbră este pe versantul stâng.","warn":""},{"text":"în umbra vântului sub nivelul crestei versantului stâng","correct":true,"short":"","long":"","warn":""}]},{"number":"#73","text":"267: Un vânt calm şi laminar, de 10 km/h suflă la altitudine deasupra zonei de aterizare:","short":"Viteza vântului la sol depinde de topografia terenului, chiar dacă vântul de la altitudine este calm și laminar.","long":"Relieful, obstacolele și rugozitatea solului modifică vântul la sol. Un vânt de 10 km/h în altitudine poate fi diferit la sol. Varianta ține cont de aceste efecte.","answers":[{"text":"viteza vântului la sol depinde de topografia terenului","correct":true,"short":"","long":"","warn":""},{"text":"vântul la sol va fi de 10km/h","correct":false,"short":"Vântul la sol va fi de 10 km/h.","long":"Relieful modifică vântul la sol.","warn":""},{"text":"vântul la sol va fi 0, ținânâd cont de gradient","correct":false,"short":"Vântul la sol va fi 0, ținând cont de gradient.","long":"Vântul la sol nu este, de obicei, zero.","warn":""},{"text":"vântul la sol va fi foarte slab","correct":false,"short":"","long":"Depinde de teren, nu este valoare fixă.","warn":""}]},{"number":"#74","text":"259: Care este influența vântului asupra asupra motoparapantei în zbor:","short":"Vântul modifică viteza motoparapantei față de sol.","long":"Vântul se adaugă vitezei aeronavei față de aer. Viteza față de sol este suma vectorială. Vântul din față încetinește față de sol, cel din spate o accelerează. Nu imprimă automat un viraj sau colapsează aripa.","answers":[{"text":"imprimarea unei tendințe de viraj","correct":false,"short":"","long":"Vântul nu imprimă automat virajul.","warn":""},{"text":"imprimarea unei descendențe direct proporțională cu viteza vântului","correct":false,"short":"Imprimarea unei descendențe direct proporționale cu viteza vântului.","long":"Vântul nu produce descendență proporțională.","warn":""},{"text":"colapsarea asimetrică a voalurii atunci când este din lateral","correct":false,"short":"","long":"Colapsul poate apărea, dar nu este efectul general al vântului.","warn":""},{"text":"modifica viteza motoparapantei faţă de sol","correct":true,"short":"Modifică viteza motoparapantei față de sol.","long":"","warn":""}]},{"number":"#75","text":"216: De ce este importantă consultarea hărților satelitare ce includ imagini radar meteo?","short":"Hărțile satelitare și imaginile radar meteo ajută să observi mișcarea fronturilor și să îți planifici zborul în siguranță.","long":"Imaginile satelitare și radar arată nori, precipitații și evoluția fronturilor. Consultarea lor este utilă mai ales la zborurile de distanță, indiferent de oră. Nu sunt informații irelevante pentru piloți.","answers":[{"text":"putem oferi aceste informații turnului de control","correct":false,"short":"","long":"Nu este scopul principal.","warn":""},{"text":"ne ajută să observăm mișcarea fronturilor atmosferice și ne ajută să ne planificăm zborul în siguranță, evaluând evoluția acestora","correct":true,"short":"","long":"","warn":""},{"text":"dacă zburăm dimineața și seara, nu este necesară consultarea acestora","correct":false,"short":"","long":"Consultarea rămâne utilă.","warn":""},{"text":"sunt informații nerelevante piloților de parapantă cu motor","correct":false,"short":"Sunt informații nerelevante pilotului de parapantă cu motor.","long":"Sunt relevante.","warn":""}]},{"number":"#76","text":"263: Inversiunea termică este:","short":"Inversiunea termică este o creștere a temperaturii cu înălțimea.","long":"În mod normal temperatura scade cu altitudinea. La inversiune, un strat de aer este mai cald deasupra celui de jos, deci temperatura crește cu înălțimea. Inversiunea blochează convecția și poate reține ceața și poluarea.","answers":[{"text":"o descreştere a presiunii cu înălţimea","correct":false,"short":"O descreștere a presiunii cu înălțimea.","long":"Aceasta este variația normală a presiunii.","warn":""},{"text":"o descreştere a temperaturii cu înălţimea","correct":false,"short":"O descreștere a temperaturii cu înălțimea.","long":"Aceasta este variația normală a temperaturii.","warn":""},{"text":"o creştere a temperaturii cu înălţimea","correct":true,"short":"O creștere a temperaturii cu înălțimea.","long":"Este definiția inversiunii.","warn":""},{"text":"o menținere a temperaturii cu înălțimea","correct":false,"short":"","long":"Aceasta este o izotermie, nu inversiunea.","warn":""}]},{"number":"#77","text":"280: Care sunt mărimile care caracterizează o masă de aer?","short":"Masa de aer este caracterizată de temperatură (°C) și umiditatea specifică (g/kg).","long":"Caracteristicile unei mase de aer sunt temperatura și umiditatea, care definesc comportamentul ei. Presiunea și densitatea descriu starea aerului, dar nu sunt definitorii pentru masa de aer ca atare.","answers":[{"text":"temperatura (°C) și umiditatea specifică (g/kg)","correct":true,"short":"","long":"","warn":""},{"text":"presiunea (mb) și densitatea (g/m³)","correct":false,"short":"","long":"Descriu starea aerului, nu caracterizează masa.","warn":""},{"text":"gradul de turbulență și transparența (km)","correct":false,"short":"","long":"Sunt efecte, nu caracteristicile masei.","warn":""},{"text":"presiunea (mb) și densitatea (g/m³)","correct":false,"short":"","long":"Varianta este dublată și nu este cea corectă.","warn":""}]},{"number":"#78","text":"321: Care sunt condițiile meteorologice necesare pentru formarea unei furtuni?","short":"Pentru formarea unei furtuni sunt necesare umiditate mare, factori declanșatori ai ascendențelor și instabilitate atmosferică.","long":"Furtuna are nevoie de vapori de apă, de un impuls care să ridice aerul (front, relief, încălzire) și de un strat instabil în care aerul continuă să urce. Lipsa unuia dintre acești factori împiedică formarea furtunii.","answers":[{"text":"umiditate mare, factori declanșatori pentru ascendențe și instabilitate atmosferică","correct":true,"short":"","long":"Sunt cele trei condiții necesare.","warn":""},{"text":"umiditate mică, temperaturi ridicate și nori cumulus","correct":false,"short":"","long":"Umiditatea mică nu favorizează furtuna.","warn":""},{"text":"factori declanșatori pentru ascendențe, instabilitate atmosferică și nebulozitate","correct":false,"short":"","long":"Nebulozitatea nu este condiție separată corectă.","warn":""},{"text":"umiditate mică, temperaturi mici și stabilitate atmosferică","correct":false,"short":"","long":"Stabilitatea și umiditatea mică exclud furtuna.","warn":""}]},{"number":"#79","text":"313: Treapta barică, de la nivelul mării până la 5000 ft., scade cu?","short":"Între nivelul mării și 5000 ft, treapta barică este de aproximativ 1 hPa la fiecare 30 ft.","long":"Corect: regula pilotului este 1 hPa la aproximativ 30 ft în straturile joase, adică 1 hPa la aproximativ 8–9 m. Varianta este cea corectă, spre deosebire de întrebarea 35, unde varianta corectă are o eroare.","answers":[{"text":"1 milibar pentru fiecare 1000 ft.","correct":false,"short":"","long":"Scăderea este mult mai mare la 1000 ft.","warn":""},{"text":"1 milibar pentru fiecare 30 ft.","correct":true,"short":"","long":"Este varianta corectă și corespunde regulii pilotului.","warn":""},{"text":"1 milibar pentru fiecare 30 m","correct":false,"short":"","long":"Este mai mult decât valoarea corectă.","warn":""},{"text":"1 milibar pentru fiecare 100 m","correct":false,"short":"","long":"Este mai mult decât valoarea corectă.","warn":""}]},{"number":"#80","text":"276: Veţi întâlni turbulenţe ce pot fi periculoase în caz de zbor aproape de relief:","short":"Turbulențe periculoase apar zburând aproape de relief în zonele 1, 2 și 3 din figura.","long":"Turbulența apare în toate zonele sub vânt și lângă relieful accidentat. Varianta corectă indică zonele 1, 2 și 3. Verifică figura pentru poziționarea exactă.","answers":[{"text":"în 1 şi 2","correct":false,"short":"În 1 și 2.","long":"Varianta nu este cea corectă.","warn":""},{"text":"doar în 2","correct":false,"short":"","long":"Varianta nu este cea corectă.","warn":""},{"text":"în 1, 2 şi 3","correct":true,"short":"În 1, 2 și 3.","long":"Depinde de figură.","warn":""},{"text":"doar în 1","correct":false,"short":"","long":"Varianta nu este cea corectă.","warn":""}]},{"number":"#81","text":"223: Vântul este:","short":"Vântul este mișcarea orizontală a aerului.","long":"Vântul este, prin definiție, mișcarea orizontală a aerului. Mișcarea verticală se numește curent ascendent sau descendent. Mișcarea turbulentă și cea termică sunt alte caracterizări.","answers":[{"text":"mişcarea turbulentă a aerului","correct":false,"short":"Mișcarea turbulentă a aerului.","long":"Turbulența este o caracteristică, nu definiția vântului.","warn":""},{"text":"mişcarea orizontală a aerului","correct":true,"short":"Mișcarea orizontală a aerului.","long":"Este definiția corectă.","warn":""},{"text":"mișcarea verticală termică a aerului","correct":false,"short":"","long":"Aceasta este mișcarea verticală, nu vântul.","warn":""},{"text":"mişcarea orizontală şi verticală a aerului","correct":false,"short":"Mișcarea orizontală și verticală a aerului.","long":"Vântul este orizontal.","warn":""}]},{"number":"#82","text":"303: Care sunt subdiviziunile atmosferei?","short":"Atmosfera este împărțită în troposferă, stratosferă, mezosferă, termosferă și exosferă.","long":"Cele cinci straturi principale sunt, de jos în sus: troposfera, stratosfera, mezosfera, termosfera și exosfera. Ozonul, ionosfera și magnetosfera nu sunt straturi de același tip, iar celelalte variante amestecă denumirile.","answers":[{"text":"atmosfera este divizată în troposferă, stratosferă, mezosferă, termosferă și exosferă","correct":true,"short":"Troposferă, stratosferă, mezosferă, termosferă și exosferă.","long":"Este varianta corectă.","warn":""},{"text":"atmosfera se împarte în troposferă, stratopauza, mezosferă, termopauza și exosferă","correct":false,"short":"Troposferă, stratopauză, mezosferă, termopauză și exosferă.","long":"Pauzele sunt limite, nu straturi principale.","warn":""},{"text":"subdiviziunile atmosferei includ stratul de ozon, ionosfera și magnetosfera","correct":false,"short":"Stratul de ozon, ionosfera și magnetosfera.","long":"Acestea nu sunt cele cinci straturi principale.","warn":""},{"text":"principalele părți ale atmosferei sunt troposfera, stratosfera și mezopauza","correct":false,"short":"Troposfera, stratosfera și mezopauza.","long":"Mezopauza este limită, nu strat.","warn":""}]},{"number":"#83","text":"258: O perdea de copaci în faţa vântului anterior aterizării provoacă:","short":"O perdea de copaci în fața vântului, înainte de aterizare, produce turbulențe și umbre de vânt în spatele copacilor.","long":"Aceeași explicație ca la întrebările 21 și 25: turbulența apare sub vânt, în spatele copacilor, unde pot fi periculoase la aterizare.","answers":[{"text":"turbulenţe şi “umbre de vânt” în spatele copacilor, sub vânt","correct":true,"short":"Turbulențe și umbre de vânt în spatele copacilor, sub vânt.","long":"Este varianta corectă.","warn":""},{"text":"turbulenţe în partea vântului","correct":false,"short":"Turbulențe în partea vântului.","long":"Turbulența apare sub vânt.","warn":""},{"text":"nu provoacă turbulenţe","correct":false,"short":"Nu provoacă turbulențe.","long":"Provoacă turbulențe.","warn":""},{"text":"rotoare în partea superioară și anterioară","correct":false,"short":"","long":"Descrierea nu este cea corectă.","warn":""}]},{"number":"#84","text":"266: Prin temperatura aerului înţelegem:","short":"Temperatura aerului este starea de încălzire a aerului.","long":"Temperatura exprimă cât de cald este aerul, adică energia termică medie a moleculelor. Nu este temperatura la care a ajuns aerul după încălzire, nici cantitatea de căldură cedată.","answers":[{"text":"temperatura la care a ajuns aerul în urma încălzirii de la soare","correct":false,"short":"","long":"Este o descriere parțială, nu definiția.","warn":""},{"text":"starea de încălzire a aerului","correct":true,"short":"","long":"","warn":""},{"text":"starea de încălzire a mediului înconjurător care transferă căldura aerului","correct":false,"short":"","long":"Descrie transferul, nu temperatura aerului.","warn":""},{"text":"cantitatea de temperatură pe care aerul o cedează în urma încălzirii de la soare, mediului înconjurător","correct":false,"short":"Cantitatea de temperatură pe care aerul o cedează mediului înconjurător.","long":"Descrie transferul de căldură, nu temperatura.","warn":""}]},{"number":"#85","text":"262: În informarea meteo furnizată de unitatea ATC veți auzi cuvântul „CAVOK”. Acesta semnifică:","short":"CAVOK înseamnă vizibilitate de cel puțin 10 km, baza norilor de cel puțin 1,5 km și fără fenomene meteo semnificative.","long":"CAVOK: vizibilitate de minim 10 km, nori cu baza peste 1500 m (5000 ft) sau fără nori sub această limită, fără cumulonimbus și fără fenomene semnificative. Varianta reflectă aceste condiții.","answers":[{"text":"vizibilitate min. 5 km, plafon min. 500 m, fără fenomene meteo semnificative","correct":false,"short":"","long":"Valorile sunt insuficiente pentru CAVOK.","warn":""},{"text":"vizibilitate min. 10 km cu cer senin","correct":false,"short":"","long":"CAVOK nu cere cer senin, ci nori peste 1500 m.","warn":""},{"text":"vizibilitate min. 1 km, plafon min. 1000 m, fără fenomene meteo semnificative","correct":false,"short":"","long":"Vizibilitatea de 1 km nu este suficientă.","warn":""},{"text":"vizibilitate min. 10 km, baza norilor min. 1,5 km, fără fenomene meteo semnificative","correct":true,"short":"","long":"","warn":""}]},{"number":"#86","text":"274: Veţi întâlni turbulenţe ce pot fi periculoase în caz de zbor la mică altitudine sau aterizare:","short":"Turbulențe periculoase apar la zbor la altitudine mică sau la aterizare în zonele 3 și 4 din figura.","long":"La altitudine mică și la aterizare, turbulența de sub vânt și de la relief este cea mai periculoasă. Varianta corectă indică zonele 3 și 4. Verifică figura.","answers":[{"text":"în 1","correct":false,"short":"","long":"Varianta nu este cea corectă.","warn":""},{"text":"în 3 şi 4","correct":true,"short":"În 3 și 4.","long":"Depinde de figură.","warn":""},{"text":"în 1 şi 2","correct":false,"short":"În 1 și 2.","long":"Varianta nu este cea corectă.","warn":""},{"text":"în 2 şi 3","correct":false,"short":"În 2 și 3.","long":"Varianta nu este cea corectă.","warn":""}]},{"number":"#87","text":"310: La ce temperatură va ajunge o masă de aer uscat cu temperatura inițială de 10˚C care se răcește adiabatic până la 1000m?","short":"O masă de aer uscat cu temperatura de 10°C, care se răcește adiabatic până la 1000 m, ajunge la aproximativ 0,2°C, nu la 3,5°C.","long":"Pentru aer uscat, gradientul adiabatic este de aproximativ 9,8°C pe kilometru. Pe 1000 m temperatura scade cu circa 9,8°C, deci de la 10°C ajunge la aproximativ 0,2°C. Valoarea de 3,5°C nu corespunde acestui calcul, deci întrebarea conține o eroare. Verifică-o cu profesorul sau cu manualul de meteo.","answers":[{"text":"1 grad Celsius","correct":false,"short":"","long":"Nu corespunde gradientului adiabatic uscat.","warn":""},{"text":"0 grade Celsius","correct":false,"short":"","long":"Este apropiat, dar nu exact: rezultatul este aproximativ 0,2°C.","warn":""},{"text":"3,5 grade Celsius","correct":true,"short":"","long":"Este greșită: nu corespunde gradientului adiabatic uscat (9,8°C/km).","warn":"Răspuns greșit: gradientul adiabatic uscat este de circa 9,8°C/km, deci 10°C scade la aproximativ 0,2°C la 1000 m, nu la 3,5°C."},{"text":"- 2 grade Celsius","correct":false,"short":"-2 grade Celsius.","long":"Nu corespunde calculului.","warn":""}]}]},{"id":"05","title":"Navigație","questions":[{"number":"#1","text":"903: Efectuăm un zbor matinal și în timpul deplasării avem soarele în dreapta, la aprox. 90 grd față de direcția de zbor, în ce direcție ne deplasăm?","short":"Dacă zbori dimineața cu soarele în dreapta, la 90° față de direcția de zbor, te deplasezi spre nord.","long":"Dimineața soarele răsare în est. Dacă îl ai în dreapta, la 90°, direcția ta este cea în care est se află în dreapta, adică nordul. Așadar, zbori spre nord.","answers":[{"text":"N","correct":true,"short":"","long":"Este varianta corectă: cu est în dreapta, zbori spre nord.","warn":""},{"text":"E","correct":false,"short":"","long":"Dacă zbori spre est, soarele ar fi în față.","warn":""},{"text":"V","correct":false,"short":"","long":"Dacă zbori spre vest, soarele ar fi în spate.","warn":""},{"text":"S","correct":false,"short":"","long":"Dacă zbori spre sud, soarele ar fi în stânga.","warn":""}]},{"number":"#2","text":"975: Cum poate fi folosit GPS-ul pentru a naviga în condiții de vizibilitate redusă?","short":"Pentru navigare cu GPS în vizibilitate redusă, urmărești ruta preprogramată și punctele de referință.","long":"Când nu poți vedea solul, GPS-ul arată poziția și ruta planificată. Pilotul urmărește traseul și verifică punctele de referință, dar nu se bazează doar pe contactul vizual cu solul sau pe rapoarte meteo, care nu îi dau poziția.","answers":[{"text":"Menținând contactul vizual cu solul","correct":false,"short":"","long":"Vizibilitatea redusă nu permite acest contact.","warn":""},{"text":"Consultând busola și altimetrul","correct":false,"short":"","long":"Acestea nu dau poziția față de traseu.","warn":""},{"text":"Ascultând rapoartele meteo","correct":false,"short":"","long":"Rapoartele meteo nu dau poziția.","warn":""},{"text":"Urmărind ruta preprogramată și folosind punctele de referință","correct":true,"short":"","long":"Este varianta corectă.","warn":""}]},{"number":"#3","text":"910: Altitudinea se măsoară faţă de:","short":"Altitudinea se măsoară față de nivelul mării.","long":"Altitudinea (MSL) este înălțimea față de nivelul mării. Înălțimea (AGL) se măsoară față de sol. Cel mai jos punct de pe glob sau cel mai înalt reper nu sunt puncte de referință standard.","answers":[{"text":"cel mai jos punct de pe glob","correct":false,"short":"","long":"Nu este referința standard.","warn":""},{"text":"față de cel mai întalt reper de pe traseu","correct":false,"short":"Față de cel mai înalt reper de pe traseu.","long":"Aceasta este o referință locală, nu altitudinea.","warn":""},{"text":"nivelul mării","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"sol","correct":false,"short":"","long":"Față de sol se măsoară înălțimea, nu altitudinea.","warn":""}]},{"number":"#4","text":"926: Ora apusului și răsăritului:","short":"Ora apusului și a răsăritului se schimbă în cursul anului.","long":"Lungimea zilei se modifică cu anotimpul, deci și orele de răsărit și apus se schimbă. Latitudinea influențează și ea această variație. Condițiile meteo și relieful nu determină ora răsăritului.","answers":[{"text":"nu se schimbă față de UTC","correct":false,"short":"","long":"Ora în UTC nu schimbă momentul răsăritului.","warn":""},{"text":"se schimbă în cursul anului","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"diferă în funcție de condițiile meteorologice","correct":false,"short":"","long":"Meteo nu determină ora răsăritului.","warn":""},{"text":"diferă în funcție de relieful zonei","correct":false,"short":"","long":"Relieful poate influența vizibilitatea, nu ora astronomică.","warn":""}]},{"number":"#5","text":"894: Ora universală coordonată UTC este:","short":"UTC este ora locală la meridianul 0 (Greenwich).","long":"Ora coordonată universală este ora de referință la meridianul zero. Ora locală se calculează din UTC prin fusul orar. Ora aerodromului de plecare sau de sosire nu este referința internațională.","answers":[{"text":"ora locală de la aerodromul de plecare","correct":false,"short":"","long":"Ora locală variază, UTC este referința comună.","warn":""},{"text":"este ora de la miezul nopții","correct":false,"short":" Ora de la miezul nopții.","long":"UTC nu este ora de la miezul nopții.","warn":""},{"text":"ora locală de la aerodromul de sosire","correct":false,"short":"","long":"Ora locală variază, UTC este referința comună.","warn":""},{"text":"ora locală la meridianul 0","correct":true,"short":"","long":"Este varianta corectă.","warn":""}]},{"number":"#6","text":"889: Este recomandat zborul cu parapanta cu motor de-a lungul drumurilor?","short":"Zborul de-a lungul drumurilor este recomandat, pentru că în caz de urgență putem fi recuperați mai ușor.","long":"Drumurile sunt repere lizibile și oferă posibilitatea de aterizare sau de acces la o zonă de recuperare. Ele nu sunt recomandate pentru admirația celor de la sol sau pentru curenții termici ai mașinilor.","answers":[{"text":"da, pentru că ne pot admira cei care se deplasează rutier","correct":false,"short":"","long":"Nu este motivul recomandat.","warn":""},{"text":"nu","correct":false,"short":"","long":"Zborul de-a lungul drumurilor este considerat util, cu precauțiile obișnuite.","warn":""},{"text":"da, pentru că putem profita de curenții termici degajați de către acestea","correct":false,"short":"","long":"Drumurile nu generează curenți termici utili.","warn":""},{"text":"da, pentru că în caz de urgență putem fi recuperați mai ușor","correct":true,"short":"","long":"","warn":""}]},{"number":"#7","text":"937: Ce reprezintă curbă de nivel?","short":"O curbă de nivel este linia care unește pe hartă punctele cu aceeași altitudine.","long":"Pe hărțile topografice, curbele de nivel arată relieful: cu cât sunt mai apropiate, cu atât panta este mai abruptă. Ele nu măsoară viteza solului sau variația magnetică.","answers":[{"text":"o metodă de calcul al vitezei solului","correct":false,"short":"","long":"Nu este definiția curbei de nivel.","warn":""},{"text":"linia care unește punctele cu aceeași variație magnetică","correct":false,"short":"","long":"Aceasta este izogona, nu curba de nivel.","warn":""},{"text":"diferența de altitudine între două puncte de pe suprafață","correct":false,"short":"","long":"Aceasta este diferența de nivel, nu curba.","warn":""},{"text":"linia care unește pe o hartă punctele cu aceeași altitudine","correct":true,"short":"","long":"Este definiția corectă.","warn":""}]},{"number":"#8","text":"900: Când GPS-ul va indica 285 grd, în ce direcție vă deplasați?","short":"Dacă GPS-ul indică 285°, te deplasezi spre vest-nord-vest (VNV).","long":"Direcțiile de bază au unghiurile: N 0°, E 90°, S 180°, V 270°. Între V (270°) și NV (315°) se află VNV, care corespunde aproximativ 292°, iar 285° este între V și VNV, deci cel mai apropiat este VNV în sistemul.","answers":[{"text":"S","correct":false,"short":"","long":"S corespunde lui 180°, nu 285°.","warn":""},{"text":"SV","correct":false,"short":"","long":"SV corespunde lui 225°.","warn":""},{"text":"V","correct":false,"short":"","long":"V corespunde lui 270°, iar 285° este mai la nord.","warn":""},{"text":"VNV","correct":true,"short":"","long":"Este varianta corectă, cea mai apropiată de 285°.","warn":""}]},{"number":"#9","text":"973: Care este principalul avantaj al utilizării GPS-ului pentru tracking în navigație?","short":"Principalul avantaj al GPS-ului pentru urmărirea traseului este precizia poziției și a vitezei.","long":"GPS-ul determină poziția, viteza la sol și direcția cu precizie. Nu permite zborul la altitudini mari fără alte măsuri și nu înlocuiește complet harta și cunoașterea zonei.","answers":[{"text":"Precizia ridicată a poziției și vitezei","correct":true,"short":"","long":"Este avantajul principal.","warn":""},{"text":"Capacitatea de a zbura la altitudini mari","correct":false,"short":"","long":"GPS-ul nu determină capacitatea de zbor la altitudine.","warn":""},{"text":"Posibilitatea de a zbura fără hărți","correct":false,"short":"","long":"Harta rămâne necesară ca rezervă.","warn":""},{"text":"Necesitatea unor echipamente suplimentare minime","correct":false,"short":"","long":"Nu este avantajul principal.","warn":""}]},{"number":"#10","text":"979: Un pilot zboară de la punctul A la punctul B, care sunt la 80 km distanță unul de celălalt. Dacă viteza la sol este de 40 km/h, cât timp îi va lua să ajungă la destinație?","short":"Pentru 80 km cu viteza la sol de 40 km/h, timpul este 2 ore.","long":"Timp = distanță / viteză = 80 / 40 = 2 ore.","answers":[{"text":"3 ore","correct":false,"short":"","long":"80 / 40 = 2, nu 3.","warn":""},{"text":"2 ore","correct":true,"short":"","long":"Este varianta corectă: 80 / 40 = 2.","warn":""},{"text":"4 ore","correct":false,"short":"","long":"Ar fi dacă viteza ar fi 20 km/h.","warn":""},{"text":"1 ora","correct":false,"short":"1 oră.","long":"Ar fi dacă distanța ar fi 40 km.","warn":""}]},{"number":"#11","text":"956: O parapantă cu motor zboară cu 40 km/h și întâlnește un vânt lateral de 20 km/h. Care este viteza sa rezultantă la sol?","short":"Cu 40 km/h și un vânt lateral de 20 km/h, viteza rezultantă este 44,72 km/h.","long":"Vântul lateral este perpendicular pe direcția de zbor, deci vitezele se combină după teorema lui Pitagora: √(40² + 20²) = √2000 ≈ 44,72 km/h. Viteza de 50 km/h ar fi suma aritmetică, ce nu se aplică pentru vânt lateral.","answers":[{"text":"50 km/h","correct":false,"short":"","long":"Este suma aritmetică, greșită pentru vânt lateral.","warn":""},{"text":"60 km/h","correct":false,"short":"","long":"Este suma celor două valori, greșită.","warn":""},{"text":"20 km/h","correct":false,"short":"","long":"Ar fi viteza vântului, nu rezultanta.","warn":""},{"text":"44,72 km/h (aplicăm teorema lui Pitagora pentru a calcula viteza rezultantă)","correct":true,"short":"44,72 km/h.","long":"Este varianta corectă, prin teorema lui Pitagora.","warn":""}]},{"number":"#12","text":"906: Cum se numeste distanţa pe verticală dintre două planuri a căror diferenţa de presiune este egală cu un mb (h/Pa):","short":"Distanța verticală dintre două planuri cu diferența de presiune de 1 mb se numește treaptă barică.","long":"Treapta barică este distanța verticală care corespunde unei variații de 1 hPa (mb) a presiunii. La nivelul mării este de aproximativ 8,4 m. Altitudinea, nivelul sau 1000 m nu sunt definiția.","answers":[{"text":"altitudine","correct":false,"short":"","long":"Altitudinea este distanța față de nivelul mării, nu variația de presiune.","warn":""},{"text":"nivel","correct":false,"short":"","long":"Nivelul este o suprafață de presiune, nu distanța.","warn":""},{"text":"treaptă barică","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"1000 m","correct":false,"short":"","long":"Treapta barică nu este 1000 m.","warn":""}]},{"number":"#13","text":"959: În ce direcție trebuie să zburați pentru a ajunge la un punct situat la 180 de grade față de poziția actuală?","short":"Pentru a ajunge la un punct situat la 180° față de poziția actuală, zbori spre sud.","long":"Direcția opusă cu 180° este sudul, dacă poziția de referință este nordul (0°). Dacă punctul este la 180°, îl atingi zburând spre sud.","answers":[{"text":"nord","correct":false,"short":"","long":"Nordul este la 0°, nu la 180°.","warn":""},{"text":"vest","correct":false,"short":"","long":"Vestul este la 270°.","warn":""},{"text":"est","correct":false,"short":"","long":"Estul este la 90°.","warn":""},{"text":"sud","correct":true,"short":"","long":"Este varianta corectă: 180°.","warn":""}]},{"number":"#14","text":"904: Planificăm un zbor de distanța și dorim să alegem o zi potrivită pentru aceasta ruta, referitor la direcția și intensitatea vântului vom ține cont de?","short":"La un zbor de distanță alegi o zi în care pe traseu vei avea vânt de spate sau componentă de spate.","long":"Vântul de spate crește viteza la sol și scurtează timpul de zbor. Vântul din față încetinește zborul și consumă mai mult combustibil. Direcția și intensitatea vântului contează întotdeauna la planificare.","answers":[{"text":"ne orientăm să alegem o zi cu vânt de față pentru că vom avea o rată de urcare mai bună","correct":false,"short":"Ne orientăm să alegem o zi cu vânt de față, pentru că vom avea o rată de urcare mai bună.","long":"Vântul din față încetinește zborul de distanță.","warn":""},{"text":"alegem o zi fără nori și cu vânt de față de 20 km/h","correct":false,"short":"","long":"Vântul de față nu este varianta favorabilă.","warn":""},{"text":"alegem o zi în care pe traiect vom avea vânt de spate sau componenta de spate","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"direcția și intensitatea vântului nu contează în acest caz","correct":false,"short":"","long":"Vântul contează întotdeauna.","warn":""}]},{"number":"#15","text":"976: Care este echipamentul de bază necesar pentru un raid de navigație?","short":"Echipamentul de bază pentru un raid de navigație este harta, busola și GPS-ul.","long":"Harta arată terenul și reperele, busola dă direcția, iar GPS-ul dă poziția și viteza. Ele se completează. Briceagul, binoclul sau telefonul nu sunt echipamentul de bază.","answers":[{"text":"Hartă, busolă și GPS","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"Briceag, foarfecă și sfoară","correct":false,"short":"","long":"Nu sunt echipamente de navigație.","warn":""},{"text":"Binoclu, lanternă și casetofon","correct":false,"short":"","long":"Nu sunt echipamente de navigație de bază.","warn":""},{"text":"Telefon mobil, tabletă și laptop","correct":false,"short":"","long":"Pot fi folosite ca rezervă, nu sunt echipamentul de bază.","warn":""}]},{"number":"#16","text":"935: Ce reprezintă un waypoint?","short":"Un waypoint este un punct de pe suprafață folosit pentru navigare.","long":"Waypoint-ul este un punct cu coordonate, introdus în GPS sau pe hartă, pentru a marca traseul. Nu este viteza adevărată, un reper de altitudine sau altitudinea de croazieră.","answers":[{"text":"viteza adevărată a aeronavei","correct":false,"short":"","long":"Nu este un punct.","warn":""},{"text":"un punct de pe suprafață utilizat pentru navigare","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"un punct de referință pentru înălțime","correct":false,"short":"","long":"Nu este un punct de înălțime.","warn":""},{"text":"altitudinea de croazieră","correct":false,"short":"","long":"Nu este un punct.","warn":""}]},{"number":"#17","text":"1099: Care este recomandarea principală când se planifică o rută în zborul cross-country?","short":"Recomandarea principală la planificarea unei rute cross-country este să începi zborul împotriva vântului.","long":"Dacă începi împotriva vântului, la întoarcere vei avea vânt de spate, care te ajută să te întorci. Așa eviți să rămâi blocat la distanță cu vânt de față. Celelalte variante nu sunt recomandări de siguranță.","answers":[{"text":"Să se înceapă zborul împotriva vântului","correct":true,"short":"","long":"","warn":""},{"text":"Să se zboare doar la altitudini joase","correct":false,"short":"","long":"Nu este recomandarea principală.","warn":""},{"text":"Să se aleagă zile cu vreme nefavorabilă","correct":false,"short":"","long":"Vremea nefavorabilă este un pericol.","warn":""},{"text":"Să se evite utilizarea GPS-ului","correct":false,"short":"","long":"GPS-ul este util, nu trebuie evitat.","warn":""}]},{"number":"#18","text":"942: Ce este o direcție magnetică?","short":"Direcția magnetică este direcția indicată de busolă în raport cu nordul magnetic.","long":"Busola indică nordul magnetic. Direcția magnetică este unghiul față de acest nord. Diferența dintre azimutul magnetic și cel geografic este declinația, iar unghiul dintre vânt și traiect este altă mărime.","answers":[{"text":"diferența între azimutul magnetic și cel geografic","correct":false,"short":"","long":"Aceasta este declinația.","warn":""},{"text":"unghiul format de direcția vântului și direcția de zbor","correct":false,"short":"","long":"Aceasta este unghiul de vânt.","warn":""},{"text":"unghiul dintre direcția nordului geografic și axul longitudinal al aeronavei","correct":false,"short":"","long":"Aceasta este direcția adevărată, nu magnetică.","warn":""},{"text":"direcția indicată de busolă în raport cu nordul magnetic","correct":true,"short":"","long":"Este varianta corectă.","warn":""}]},{"number":"#19","text":"908: Pe o hartă 1:500 000 linia neagra între localităţi reprezintă:","short":"Pe harta 1:500 000, linia neagră între localități reprezintă calea ferată.","long":"Pe hărțile aeronautice și topografice, calea ferată se reprezintă cu linie neagră, de regulă cu semne transversale. Șoseaua națională și drumul de țară au simboluri diferite, iar limita localității are alt marcaj.","answers":[{"text":"cale ferată","correct":true,"short":"","long":"","warn":""},{"text":"şosea naţională","correct":false,"short":"Șosea națională.","long":"Șoseaua are simbol diferit, de obicei roșu sau galben.","warn":""},{"text":"drum de ţară","correct":false,"short":"Drum de țară.","long":"Drumul de țară are marcaj diferit.","warn":""},{"text":"limita de localitate","correct":false,"short":"","long":"Limita are alt simbol.","warn":""}]},{"number":"#20","text":"970: Ce este un „checkpoint” în planificarea zborului?","short":"Un checkpoint este un reper geografic folosit pentru a verifica poziția aeronavei.","long":"Checkpoint-ul este un punct cunoscut, de regulă vizibil, pe care pilotul îl trece și îl verifică pe hartă, pentru a confirma că se află pe traseu. Nu este altitudinea minimă, viteza sau zona de urgență.","answers":[{"text":"Altitudinea minimă de zbor","correct":false,"short":"","long":"Nu este checkpoint.","warn":""},{"text":"Viteza la sol măsurată în timp real","correct":false,"short":"","long":"Nu este checkpoint.","warn":""},{"text":"Un reper geografic folosit pentru a verifica poziția aeronavei","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"O zonă de aterizare de urgență","correct":false,"short":"","long":"Aceasta este altă noțiune.","warn":""}]},{"number":"#21","text":"940: Cum se exprimă latitudinea unei locații?","short":"Latitudinea se exprimă ca distanța unghiulară în grade de la ecuator, măsurată la centrul Pământului, fiind nordică sau sudică.","long":"Latitudinea se măsoară în grade de la ecuator, de la 0° la 90° N sau S, unghiul fiind măsurat din centrul Pământului. Este distanța unghiulară, nu distanța liniară.","answers":[{"text":"Prin distanța sa de la ecuator fiind nordică sau sudică.","correct":false,"short":"Prin distanța sa de la ecuator, fiind nordică sau sudică.","long":"Este o descriere incompletă: lipsește măsurarea în grade.","warn":""},{"text":"Prin distanța sa unghiulara în grade de la polul respectiv, măsurată la centrul pământului.","correct":false,"short":"Prin distanța sa unghiulară în grade de la polul respectiv, măsurată la centrul Pământului.","long":"Latitudinea se măsoară de la ecuator, nu de la pol.","warn":""},{"text":"Prin distanța sa unghiulară în grade de la ecuator, măsurată la centrul pământului, fiind nordică sau sudică.","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"Prin distanța sa de la polul respectiv.","correct":false,"short":"","long":"Latitudinea se măsoară de la ecuator.","warn":""}]},{"number":"#22","text":"930: Ce este deriva?","short":"Deriva este unghiul dintre direcția de zbor dorită și direcția reală de deplasare, determinată de vânt.","long":"Vântul împinge aeronava lateral, deci traiectul real diferă de cel dorit. Unghiul dintre cele două este deriva. Compensarea se face prin corecție de cap.","answers":[{"text":"unghiul format de direcția nordului magnetic și axul longitudinal al aeronavei","correct":false,"short":"","long":"Aceasta este direcția magnetică a capului.","warn":""},{"text":"unghiul dintre axul longitudinal al aeronavei și direcția nordului geografic","correct":false,"short":"Unghiul dintre axul longitudinal și direcția nordului geografic.","long":"Aceasta este direcția adevărată a capului.","warn":""},{"text":"diferența între viteza aerului și viteza solului","correct":false,"short":"","long":"Aceasta este componenta vântului, nu deriva.","warn":""},{"text":"unghiul dintre direcția de zbor dorită și direcția reală de deplasare determinată de vânt","correct":true,"short":"","long":"Este definiția corectă.","warn":""}]},{"number":"#23","text":"912: Capul compas reprezintă:","short":"Capul compas este unghiul format de nordul magnetic și axul longitudinal al aeronavei, partea din față.","long":"Capul compas este direcția în care indică botul aeronavei, măsurată față de nordul magnetic. Eroarea dintre nordul magnetic și cel geografic este declinația, nu capul compas.","answers":[{"text":"unghiul format de direcţia nordului compas şi axul longitudinal al aeronavei partea din faţă","correct":false,"short":"Unghiul format de direcția nordului compas și axul longitudinal al aeronavei, partea din față.","long":"Aceasta descrie același lucru, dar cu denumirea incorectă a nordului.","warn":""},{"text":"eroarea dintre nordul magnetic si cel geografic","correct":false,"short":"Eroarea dintre nordul magnetic și cel geografic.","long":"Aceasta este declinația.","warn":""},{"text":"unghiul format de direcţia nordului magnetic şi axul longitudinal al aeronavei partea din faţă","correct":true,"short":"Unghiul format de direcția nordului magnetic și axul longitudinal al aeronavei, partea din față.","long":"Este definiția corectă.","warn":""},{"text":"direcţia indicată de busolă faţă de nordul magnetic","correct":false,"short":"Direcția indicată de busolă față de nordul magnetic.","long":"Este apropiată, dar varianta completă este cea cu axul longitudinal.","warn":""}]},{"number":"#24","text":"911: Pentru estimarea timpului necesar de deplasare între două puncte sunt minim necesare următoarele elemente:","short":"Pentru a estima timpul de deplasare între două puncte sunt necesare viteza vântului, direcția vântului și viteza proprie adevărată.","long":"Viteza la sol se calculează din viteza adevărată și vânt. Din viteza la sol și distanța se obține timpul. Viteza la sol nu este dată, ci se calculează, deci nu trebuie inclusă ca element necesar.","answers":[{"text":"viteza vântului, direcţia vântului, viteza proprie adevărată","correct":true,"short":"Viteza vântului, direcția vântului, viteza proprie adevărată.","long":"Sunt elementele necesare pentru calculul vitezei la sol și al timpului.","warn":""},{"text":"viteza proprie adevărată, viteza vântului şi viteza la sol","correct":false,"short":"Viteza proprie adevărată, viteza vântului și viteza la sol.","long":"Viteza la sol se calculează, nu este element de intrare.","warn":""},{"text":"viteza la sol, viteza vântului","correct":false,"short":"","long":"Lipsește viteza proprie adevărată.","warn":""},{"text":"viteza la sol, viteza adevarata si directie vantului","correct":false,"short":"Viteza la sol, viteza adevărată și direcția vântului.","long":"Viteza la sol se calculează din celelalte.","warn":""}]},{"number":"#25","text":"954: O parapantă cu motor are o viteză la sol de 30 km/h cu un vânt din spate de 10 km/h. Care este viteza față de aer?","short":"Viteza față de aer este 20 km/h, dacă viteza la sol este 30 km/h și vântul din spate este 10 km/h.","long":"Cu vânt din spate, viteza la sol = viteza față de aer + vânt. Deci viteza față de aer = viteza la sol − vânt = 30 − 10 = 20 km/h.","answers":[{"text":"50 km/h","correct":false,"short":"","long":"Ar fi suma, greșită pentru vânt din spate.","warn":""},{"text":"40 km/h","correct":false,"short":"","long":"Ar fi dacă ar fi vânt din față.","warn":""},{"text":"30 km/h","correct":false,"short":"","long":"Este viteza la sol, nu viteza față de aer.","warn":""},{"text":"20 km/h","correct":true,"short":"","long":"Este varianta corectă: 30 − 10 = 20.","warn":""}]},{"number":"#26","text":"946: Calculați viteza la sol (groundspeed) dacă viteza aerului este de 100 km/h și vântul suflă din față cu 20 km/h.","short":"Viteza la sol este 80 km/h, dacă viteza aerului este 100 km/h și vântul bate din față cu 20 km/h.","long":"Cu vânt din față, viteza la sol = viteza față de aer − vânt = 100 − 20 = 80 km/h.","answers":[{"text":"60 km/h","correct":false,"short":"","long":"Ar fi dacă vântul ar fi de 40 km/h.","warn":""},{"text":"80 km/h","correct":true,"short":"","long":"Este varianta corectă: 100 − 20 = 80.","warn":""},{"text":"100 km/h","correct":false,"short":"","long":"Ar fi fără vânt.","warn":""},{"text":"120 km/h","correct":false,"short":"","long":"Ar fi cu vânt din spate.","warn":""}]},{"number":"#27","text":"898: Efectuăm un zbor în jurul orei 18 și constatăm că busola/ GPS-ul s-a defectat. Cum putem să ne orientăm asfel încât să ajungem la zona de aterizare știind că acesta este la N față de punctul în care ne aflăm:","short":"Dacă soarele apune în vest și zbori spre nord, soarele va fi în stânga ta, la aproximativ 90°.","long":"Seara soarele este în vest. Dacă zbori spre nord, vestul este în stânga, deci soarele este pe stânga, la 90°. Astfel te poți orienta spre zona de aterizare fără busolă sau GPS.","answers":[{"text":"știind că soarele apune în V, vom zbura cu soarele în stânga noastră și la aprox. 90 grd față de traiectoria noastră","correct":true,"short":"Știind că soarele apune în V, vom zbura cu soarele în stânga noastră, la aprox. 90° față de traiectoria noastră.","long":"Este varianta corectă.","warn":""},{"text":"nu ne putem orienta și trebuie să aterizăm de urgență","correct":false,"short":"","long":"Ne putem orienta după soare.","warn":""},{"text":"știind că soarele apune în V, vom zbura cu soarele în dreapta noastră la aprox. 90 grd diferentă de traiectoria noastră față de acesta","correct":false,"short":"Știind că soarele apune în V, vom zbura cu soarele în dreapta noastră, la aprox. 90°.","long":"Cu soarele în vest, pe dreapta ar fi estul; varianta este greșită.","warn":""},{"text":"știind că soarele apune în V, vom zbura cu spatele la soare","correct":false,"short":"","long":"Zborul cu spatele la soare înseamnă zbor spre est, nu spre nord.","warn":""}]},{"number":"#28","text":"909: Unghiul format între nordul geografic şi nordul magnetic se numeşteȘ","short":"Unghiul dintre nordul geografic și nordul magnetic se numește declinație magnetică.","long":"Nordul magnetic nu coincide cu cel geografic. Diferența unghiulară dintre ele se numește declinație magnetică. Derivă, abatere și unghi real sunt alte noțiuni.","answers":[{"text":"derivă","correct":false,"short":"","long":"Deriva este diferența dintre direcția dorită și cea reală, produsă de vânt.","warn":""},{"text":"abatere magnetică","correct":false,"short":"","long":"Este un termen apropiat, dar varianta corectă este declinația.","warn":""},{"text":"declinaţia magnetică","correct":true,"short":"Declinația magnetică.","long":"Este varianta corectă.","warn":""},{"text":"unghi real","correct":false,"short":"","long":"Nu este denumirea corectă.","warn":""}]},{"number":"#29","text":"951: Ce reprezintă viteza la sol a unei parapante cu motor?","short":"Viteza la sol este viteza de deplasare relativă la sol a parapantei cu motor.","long":"Viteza la sol este viteza cu care aeronava se deplasează față de sol, rezultată din viteza față de aer și vânt. Viteza de ascensiune și de coborâre sunt viteze verticale, nu viteza la sol.","answers":[{"text":"viteza de deplasare relativă la aer","correct":false,"short":"","long":"Aceasta este viteza față de aer.","warn":""},{"text":"viteza de ascensiune","correct":false,"short":"","long":"Aceasta este viteza verticală.","warn":""},{"text":"viteza de coborâre","correct":false,"short":"","long":"Aceasta este viteza verticală.","warn":""},{"text":"viteza de deplasare relativă la sol","correct":true,"short":"","long":"Este varianta corectă.","warn":""}]},{"number":"#30","text":"966: În cazul în care navighezi folosind o hartă și zbori spre est, dar vântul bate din sud, ce ajustare trebuie să faci pentru a menține cursul?","short":"Dacă zbori spre est și vântul bate din sud, compensezi cu comanda dreapta, adică îndreptezi nasul ușor spre sud.","long":"Vântul din sud împinge aeronava spre nord. Pentru a menține traiectul spre est, corectezi capul spre sud, adică spre dreapta (când zbori spre est, dreapta este sudul). Corecția se numește crabbing sau compensare cu comanda corespunzătoare.","answers":[{"text":"crabbing spre nord-vest","correct":false,"short":"","long":"Corecția trebuie făcută spre sud.","warn":""},{"text":"crabbing spre sud-vest","correct":false,"short":"","long":"Corecția este spre sud, dar spre est, nu spre vest.","warn":""},{"text":"compensare cu comanda stângă","correct":false,"short":"","long":"Stânga duce spre nord, deci nu compensează.","warn":""},{"text":"compensare cu comanda dreapta","correct":true,"short":"","long":"Este varianta corectă.","warn":""}]},{"number":"#31","text":"944: Ce este o abatere magnetică?","short":"Abaterea magnetică este eroarea dintre nordul magnetic și nordul geografic.","long":"Nordul magnetic se deplasează în timp și nu coincide cu nordul geografic. Diferența dintre ele, la un moment și loc dat, este abaterea (declinația) magnetică.","answers":[{"text":"unghiul dintre direcția de zbor și direcția vântului","correct":false,"short":"","long":"Aceasta este deriva sau unghiul de vânt.","warn":""},{"text":"unghiul dintre axul longitudinal al aeronavei și direcția nordului magnetic","correct":false,"short":"Unghiul dintre axul longitudinal și direcția nordului magnetic.","long":"Aceasta este capul magnetic.","warn":""},{"text":"diferența dintre azimutul geografic și cel magnetic","correct":false,"short":"","long":"Este apropiată, dar definiția standard este eroarea dintre nordul magnetic și cel geografic.","warn":""},{"text":"eroarea dintre nordul magnetic și cel geografic","correct":true,"short":"","long":"Este definiția corectă.","warn":""}]},{"number":"#32","text":"897: Planificăm un zbor de distanță și observăm că pe linia dreaptă între decolare- aterizare avem un vârf muntos cu o înălțime de 3400m:","short":"Când pe traseu există un vârf de 3400 m, planifici zborul ocolindu-l la o distanță sigură, menținând o înălțime maximă legală de 3200 m (FL105).","long":"Vârful depășește limita de altitudine de 3200 m (FL105). Zborul peste el nu este prevăzut, deci trebuie ocolit la distanță sigură. Planul de zbor trebuie depus și respectat, nu ignorat. Anularea nu este obligatorie dacă traseul poate fi modificat.","answers":[{"text":"efectuăm zborul, însă nu depunem plan de zbor, încât autoritățile se pot autosesiza","correct":false,"short":"","long":"Nu se trece peste limită, iar planul trebuie depus.","warn":""},{"text":"planificăm zborul astfel încât să ocolim vârful la o distanță suficient de sigură, păstrând o înălțime maximă legală de 3200m (FL105)","correct":true,"short":"Planificăm zborul astfel încât să ocolim vârful la o distanță suficient de sigură, păstrând o înălțime maximă legală de 3200 m (FL105).","long":"Este varianta corectă.","warn":""},{"text":"putem păstra traiectul și zburăm peste vârf păstrând o înălțime de minim 150m","correct":false,"short":"Putem păstra traiectul și zburăm peste vârf păstrând o înălțime de minim 150 m.","long":"Zborul peste vârf depășește limitele.","warn":""},{"text":"anulăm zborul","correct":false,"short":"","long":"Traseul poate fi ajustat, nu neapărat anulat.","warn":""}]},{"number":"#33","text":"914: Care este metodă de navigație pentru zborul în VFR?","short":"Metoda de navigație pentru zborul VFR este navigația observată (vizuală).","long":"În zborul VFR, pilotul navighează observând terenul și reperele vizuale. Navigația estimată folosește viteza și timpul, iar cea după azimut folosește direcția. Navigația izobarică nu este o metodă de bază.","answers":[{"text":"observată","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"estimată","correct":false,"short":"","long":"Este o metodă complementară, nu cea principală VFR.","warn":""},{"text":"după azimut","correct":false,"short":"","long":"Este o tehnică, nu metoda principală.","warn":""},{"text":"izobarică","correct":false,"short":"","long":"Nu este metoda de navigație VFR.","warn":""}]},{"number":"#34","text":"891: Pentru a merge din punctul A în punctul B, drumul adevărat, din desenul de mai jos, are ca valoare aproximativă:","short":"Din figura, drumul adevărat de la A la B are valoarea aproximativă 310°.","long":"Drumul adevărat se măsoară de la nordul geografic în sensul acelor de ceasornic, până la direcția spre punctul B. Valoarea este citită din figura. Verifică unghiul pe desen.","answers":[{"text":"310º","correct":true,"short":"310°.","long":"Depinde de figură.","warn":""},{"text":"0º","correct":false,"short":"0°.","long":"Nordul este 0°, nu este direcția spre B.","warn":""},{"text":"130º","correct":false,"short":"130°.","long":"Nu corespunde figurii.","warn":""},{"text":"050º","correct":false,"short":"050°.","long":"Nu corespunde figurii.","warn":""}]},{"number":"#35","text":"948: Ipotetic o parapantă zboară cu o viteză adevărată de 150 km/h și are un vânt din spate de 30 km/h. Care este viteza sa la sol?","short":"O parapantă cu viteza adevărată de 150 km/h și vânt din spate de 30 km/h are viteza la sol de 180 km/h.","long":"Cu vânt din spate, viteza la sol = viteza adevărată + vânt = 150 + 30 = 180 km/h.","answers":[{"text":"120 km/h","correct":false,"short":"","long":"Ar fi cu vânt din față de 30 km/h.","warn":""},{"text":"150 km/h","correct":false,"short":"","long":"Ar fi fără vânt.","warn":""},{"text":"200 km/h","correct":false,"short":"","long":"Ar fi dacă vântul ar fi de 50 km/h.","warn":""},{"text":"180 km/h","correct":true,"short":"","long":"Este varianta corectă: 150 + 30 = 180.","warn":""}]},{"number":"#36","text":"901: Când GPS-ul va indica 270 grd, în ce direcție va deplasați?","short":"Când GPS-ul indică 270°, te deplasezi spre vest.","long":"Vestul este la 270° în sistemul de unghiuri de la nordul geografic în sensul acelor de ceasornic: N 0°, E 90°, S 180°, V 270°. Deci 270° înseamnă V.","answers":[{"text":"SV","correct":false,"short":"","long":"SV este 315°.","warn":""},{"text":"VSV","correct":false,"short":"","long":"VSV este 292,5°, deci nu 270°.","warn":""},{"text":"V","correct":true,"short":"","long":"Este varianta corectă: 270°.","warn":""},{"text":"S","correct":false,"short":"","long":"S este 180°.","warn":""}]},{"number":"#37","text":"899: Având zborul deja planificat și traiectul stabilit, când ajungem la decolare constatăm că pe direcția noastră de zbor avem un cumulonimbus:","short":"Când întâlnești un cumulonimbus pe traiect, modifici traseul la o distanță care îl evită: 10 km, respectiv minim 37 km pentru furtunile puternice.","long":"Cumulonimbusul produce turbulență, grindină, fulgere și rafale. Nu trebuie zburat pe sub el sau în apropiere și nu trebuie sperat că se va disipa. Distanțele 10 km și 37 km sunt cele indicate; verifică-le în procedurile aplicabile. Zborul peste nor nu este varianta corectă.","answers":[{"text":"decolăm și zurăm după planul de zbor inițial în speranța că norul de furtună se va disipa până ajungem la el","correct":false,"short":"Decolăm și zburăm după planul de zbor inițial, în speranța că norul se va disipa.","long":"Nu este o decizie sigură.","warn":""},{"text":"modificăm traiectul de zbor la o distanță care ne permite să evităm efectele acestui tip de nor, 10 km respectiv minim 37 km pentru orajele puternice","correct":true,"short":"Modificăm traiectul la o distanță care ne permite să evităm efectele acestui tip de nor, 10 km, respectiv minim 37 km pentru orajele puternice.","long":"","warn":""},{"text":"decolăm, dar zburăm la înălțime mică să putem ateriza în cazul unui pericol","correct":false,"short":"","long":"Zborul la înălțime mică în apropierea CB este periculos.","warn":""},{"text":"modificăm traiectul asftel încât să zburăm peste nor chiar înălțimea acestuia depășește 3200m","correct":false,"short":"Modificăm traiectul astfel încât să zburăm peste nor, chiar dacă înălțimea acestuia depășește 3200 m.","long":"Zborul peste CB este periculos și depășește limitele.","warn":""}]},{"number":"#38","text":"928: Ce reprezintă variația magnetică?","short":"Variația magnetică este diferența dintre nordul geografic și nordul magnetic.","long":"Nordul magnetic se află în alt loc decât cel geografic, iar diferența dintre ele este variația (declinația) magnetică. Ea depinde de locul și de anul în care zbori.","answers":[{"text":"diferența între nordul geografic și nordul magnetic","correct":true,"short":"Diferența dintre nordul geografic și nordul magnetic.","long":"Este definiția corectă.","warn":""},{"text":"unghiul dintre direcția de zbor și direcția vântului","correct":false,"short":"","long":"Aceasta este deriva sau unghiul de vânt.","warn":""},{"text":"Nu există diferență între nordul adevărat și nordul magnetic","correct":false,"short":"","long":"Există diferență.","warn":""},{"text":"diferența între azimutul geografic și azimutul magnetic","correct":false,"short":"","long":"Este apropiată, dar varianta corectă este formularea cu nordul geografic și magnetic.","warn":""}]},{"number":"#39","text":"931: Ce este viteza adevărată a aerului?","short":"Viteza adevărată a aerului este viteza reală prin aer, în comparație cu viteza resimțită de pilot.","long":"Viteza adevărată (TAS) este viteza reală a aeronavei față de masa de aer, corectată de altitudine și temperatură. Viteza indicată (IAS) este cea de pe instrument. Viteza la sol este față de sol.","answers":[{"text":"viteza aerului raportată la nivelul mării","correct":false,"short":"","long":"Aceasta descrie viteza indicată sau corectată, nu definiția TAS.","warn":""},{"text":"viteza la care se deplasează aeronava la sol","correct":false,"short":"","long":"Aceasta este viteza la sol.","warn":""},{"text":"viteza reală prin aer în comparație cu viteza resimțită de pilot","correct":true,"short":"","long":"Este varianta corectă, cu definiția corectă a TAS.","warn":""},{"text":"viteza indicată de un anemometru","correct":false,"short":"","long":"Aceasta este viteza indicată.","warn":""}]},{"number":"#40","text":"949: O parapantă zboară de la punctul A la punctul B, care sunt la 100 km distanță unul de celălalt. Dacă viteza la sol este de 50 km/h, cât timp îi va lua să ajungă la destinație?","short":"Pentru 100 km cu viteza la sol de 50 km/h, timpul este 2 ore.","long":"Timp = distanță / viteză = 100 / 50 = 2 ore.","answers":[{"text":"3 ore","correct":false,"short":"","long":"100 / 50 = 2.","warn":""},{"text":"4 ore","correct":false,"short":"","long":"Ar fi dacă viteza ar fi 25 km/h.","warn":""},{"text":"2 ore","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"1 oră","correct":false,"short":"","long":"Ar fi dacă viteza ar fi 100 km/h.","warn":""}]},{"number":"#41","text":"913: Înălţimea de zbor este:","short":"Înălțimea de zbor este distanța pe verticală de la sol până la aeronavă.","long":"Înălțimea (AGL) se măsoară față de sol, deci e distanța verticală de la sol. Altitudinea se măsoară față de nivelul mării sau față de presiunea standard, iar distanța de la decolare la nivelul mării nu este înălțime.","answers":[{"text":"distanţa pe verticală măsurată de la nivelul mării până la aeronavă","correct":false,"short":"Distanța pe verticală de la nivelul mării până la aeronavă.","long":"Aceasta este altitudinea, nu înălțimea.","warn":""},{"text":"înălţimea de zbor se mai numeşte şi altitudine şi se măsoară de la nivelul corespunzător presiunii standard de 760 mm Hg şi până la aeronavă","correct":false,"short":"Se mai numește altitudine și se măsoară de la presiunea standard 760 mm Hg.","long":"Aceasta descrie altitudinea, nu înălțimea.","warn":""},{"text":"distanța dintre punctul de decolare și nivelul mării","correct":false,"short":"","long":"Nu este definiția înălțimii.","warn":""},{"text":"distanţa pe verticală de la sol până la aeronavă","correct":true,"short":"Distanța pe verticală de la sol până la aeronavă.","long":"Este definiția corectă.","warn":""}]},{"number":"#42","text":"917: Ce este o altitudine barometrică?","short":"Altitudinea barometrică este înălțimea de la nivelul mării.","long":"Altitudinea barometrică este determinată de presiune și se măsoară de la nivelul mării, pe baza reglajului altimetrului. Nu corespunde doar presiunii standard și nu este cea dată de GPS.","answers":[{"text":"o înălțime care corespunde presiunii standard","corr
