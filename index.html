  <script type="application/json" id="glossary-data">[{"term":"transponder","title":"Transponderul și codurile de transponder","text":"Un transponder este un dispozitiv electronic esențial la bordul unei aeronave, iar numele său vine din combinarea cuvintelor **TRANSmitter (emițător)** și **resPONDER (răspunzător)**. Pe scurt, el „vorbește” cu radarele de la sol pentru a le spune controlorilor de trafic aerian exact unde se află avionul și ce face.\nIată o explicație simplă, de la zero, despre cum funcționează și de ce sunt folosite aceste coduri.\n\n## 1. Ce este un transponder și de ce este necesar?\nImaginează-ți că **radarul clasic de la sol (numit radar primar)** este ca o lanternă pe care o aprinzi pe întuneric: lumina lovește un obiect (avionul) și se întoarce la tine ca un ecou. Vezi că „ceva” este acolo, dar nu știi ce avion este, la ce înălțime zboară sau în ce direcție vrea să meargă.\nAici intervine transponderul (sistemul de **radar secundar**):\n1. Radarul de la sol trimite o întrebare electronică: „Cine ești și ce faci?”\n2. Transponderul din avion recepționează întrebarea și răspunde automat cu un semnal radio puternic, trimițând date precise.\n\nDe ce este absolut necesar?\n• **Identificare:** Fără el, ecranul unui controlor de trafic ar fi plin de puncte anonime. Transponderul asociază acel punct de pe ecran cu numărul zborului (ex: ROT301).\n• **Prevenirea coliziunilor:** Transponderul transmite și altitudinea exactă a avionului. Avioanele moderne folosesc aceste date pentru a se „vedea” între ele în aer și a genera alerte automate dacă sunt pe curs de coliziune (sistemul TCAS).\n• **Siguranță în caz de urgență:** Permite pilotului să anunțe instantaneu o problemă majoră fără a mai vorbi la radio.\n\n## 2. Ce sunt „codurile de transponder” (**Squawk**)?\nCodul de transponder este un număr format din 4 cifre pe care piloții îl introduc în aparat înainte de decolare sau în timpul zborului, la cererea controlorului de trafic.\nÎn jargonul aviatic, acest cod se numește **Squawk** (tradus literal: croncănit – o referință istorică din Al Doilea Război Mondial, când primul sistem de acest gen avea numele de cod „Papagalul”). Când controlorul spune „**Squawk** 2415”, înseamnă „Introdu codul 2415 în transponder”.\n• **Matematica din spate:** Codul folosește doar cifre de la 0 la 7 (sistem octal). Prin urmare, cel mai mic cod este 0000, iar cel mai mare este 7777. Există în total 4.096 de combinații posibile.\n\n## 3. Codurile speciale de urgență (cele mai importante)\nÎn aviație, există trei coduri celebre pe care orice pilot le știe pe de rost. Ele sunt folosite exclusiv în situații critice și aprind imediat alerte roșii pe ecranele controlorilor de trafic din întreaga lume.\nPentru a le reține mai ușor, piloții folosesc rime în limba engleză:\n• **7500 – Hijacking (Deturnare)**\n   • **Rima:** „Seventy-five, stay alive” (75, rămâi în viață)\n   • **Ce înseamnă:** Avionul a fost preluat prin forță (terorism/deturnare). Pilotul introduce acest cod discret, fără ca atacatorii să își dea seama, alertând forțele de securitate de la sol.\n• **7600 – Radio Failure (Pană radio)**\n   • **Rima:** „Seventy-six, radio needs a fix” (76, radioul trebuie reparat)\n   • **Ce înseamnă:** Stația radio a avionului s-a defectat complet. Piloții nu mai pot auzi controlorii și nici nu pot vorbi cu ei. Prin setarea codului 7600, controlorii înțeleg situația și eliberează calea avionului, ghidându-l vizual sau prin proceduri standard de urgență până la aterizare.\n• **7700 – Emergency (Urgență generală / Mayday)**\n   • **Rima:** „Seventy-seven, going to heaven” (77, mergem în ceruri – o formă dramatică de a spune că e pericol de prăbușire)\n   • **Ce înseamnă:** Orice urgență majoră la bord care pune în pericol siguranța zborului (defecțiune de motor, incendiu, depresurizare sau o urgență medicală critică a unui pasager). Avionul primește prioritate absolută la aterizare oriunde s-ar afla.\n\n## 4. Alte coduri uzuale (standard)\nDacă avionul nu se află într-o situație de urgență, el va folosi coduri normale:\n• **Codul alocat de turn:** În mod normal, când un avion de linie pleacă de la București la Londra, computerul de trafic îi alocă un cod unic (de exemplu, 3247). Pe tot parcursul zborului, acel număr reprezintă „buletinul” avionului pe radar.\n• **1200 (în SUA) sau 7000 (în Europa):** Acestea sunt coduri standard pentru zborurile VFR (Visual Flight Rules). Adică avioanele mici, private, care zboară la altitudini joase și se ghidează privind pe geam, fără să fie controlate strict de un radar pas cu pas. Ele pun acest cod pentru ca radarele să știe: „Sunt un avion mic, zbor de plăcere, am grijă singur de mine”.\n\n## Coduri transponder (SQUAWK) în România\n\nÎnaintea intrării în FIR București, venind dintr-o regiune adiacentă în care nu este necesară operarea transponderului, piloții zborurilor IFR trebuie să opereze transponderul în Mod A și Mod C, setând codul A2000 și vor menține acest cod până când primesc altă instrucțiune ATC.\n\nDacă nu primesc altă instrucțiune, piloții zborurilor VFR trebuie să opereze transponderul în Mod A și Mod C, cod A7000.\n\nPilotul unui zbor VFR care zboară în spațiu necontrolat, în cazul în care aeronava este echipată cu transponder fără capabilitatea raportării altitudinii, nu trebuie să utilizeze transponderul decât dacă i-a fost alocat un cod Mod A de către unitatea ATC.\n\n## Alocarea codurilor transponder în România\n\n• 6701 – 6777: zboruri VFR locale\n• 5401 – 5477: zboruri IFR internaționale\n• 4001 – 4077: zboruri IFR locale"}]</script>
