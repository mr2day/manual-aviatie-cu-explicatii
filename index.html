ect":false,"short":"","long":"Este o descriere parțială.","warn":""},{"text":"o înălțime dintr-un punct de referință","correct":false,"short":"","long":"Este înălțimea, nu altitudinea barometrică.","warn":""},{"text":"o înălțime de la nivelul mării","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"o înălțime care corespunde GPS","correct":false,"short":"","long":"Aceasta este altitudinea GPS.","warn":""}]},{"number":"#43","text":"887: Dacă vă deplasaţi cu o aeronava către E și nu aveți vânt deloc. In situația în care vă întâlniți un vânt de 20 km/h dinspre N adică perfect din 90 de grade faţă de direcția în care vă deplasaţi, va fi modificată viteza faţă de sol?","short":"Da, viteza față de sol se modifică, pentru că vântul de 20 km/h din nord schimbă componenta de deplasare.","long":"Zburând spre est cu viteza față de aer de 40 km/h, un vânt din nord de 20 km/h adaugă o componentă perpendiculară. Viteza față de sol devine √(40² + 20²) ≈ 44,7 km/h, deci se modifică.","answers":[{"text":"cu maxim 10 km/h si nu depinde de viteza vântului","correct":false,"short":"Cu maxim 10 km/h și nu depinde de viteza vântului.","long":"Viteza se modifică în funcție de vânt.","warn":""},{"text":"depinde de tăria vântului","correct":false,"short":"","long":"Este corect că depinde, dar varianta corectă este „da”.","warn":""},{"text":"da","correct":true,"short":"","long":"Este varianta corectă: viteza față de sol se modifică.","warn":""},{"text":"nu","correct":false,"short":"","long":"Viteza față de sol se modifică cu vântul lateral.","warn":""}]},{"number":"#44","text":"968: Ce trebuie verificat înainte de decolare pentru a evita spațiile aeriene restricționate?","short":"Înainte de decolare verifici NOTAM-urile, pentru a evita spațiile aeriene restricționate.","long":"NOTAM-urile anunță zonele restricționate, temporar închise sau cu activități speciale. Consultarea lor înainte de zbor este obligatorie. Vântul, echipamentul și combustibilul sunt verificări importante, dar nu evită zonele restricționate.","answers":[{"text":"Viteza vântului","correct":false,"short":"","long":"Vântul nu arată zonele restricționate.","warn":""},{"text":"NOTAM-urile","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"Echipamentul de urgență","correct":false,"short":"","long":"Nu arată zonele restricționate.","warn":""},{"text":"Nivelul de combustibil","correct":false,"short":"","long":"Nu arată zonele restricționate.","warn":""}]},{"number":"#45","text":"921: Ora apusului și răsăritului la o anumită dată:","short":"Ora răsăritului și a apusului depinde atât de latitudine, cât și de longitudine.","long":"Latitudinea influențează lungimea zilei, iar longitudinea influențează ora locală, față de fusul orar. Împreună determină orele astronomice. Altitudinea și orientarea nu sunt factorii principali, iar latitudinea contează.","answers":[{"text":"depinde atât de latitudine cât și de longitudine","correct":true,"short":"Depinde atât de latitudine, cât și de longitudine.","long":"","warn":""},{"text":"depinde de altitudine și orientare geografică","correct":false,"short":"","long":"Altitudinea influențează puțin, dar nu este factorul principal.","warn":""},{"text":"nu depinde de latitudine","correct":false,"short":"","long":"Depinde de latitudine.","warn":""},{"text":"nu depinde de longitudine","correct":false,"short":"","long":"Longitudinea influențează ora locală.","warn":""}]},{"number":"#46","text":"932: Ce reprezintă QFE?","short":"QFE este presiunea la pragul pistei.","long":"QFE este presiunea atmosferică măsurată la nivelul aerodromului (pragul pistei). Când altimetrul este reglat pe QFE, indică înălțimea față de pistă. Presiunea standard este QNE, iar presiunea la nivelul mării este QNH.","answers":[{"text":"presiunea standard","correct":false,"short":"","long":"Aceasta este QNE.","warn":""},{"text":"presiunea la nivelul mării","correct":false,"short":"","long":"Aceasta este QNH.","warn":""},{"text":"presiunea la pragul pistei","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"presiunea la altitudinea de croazieră","correct":false,"short":"","long":"Aceasta nu este QFE.","warn":""}]},{"number":"#47","text":"1100: Ce trebuie să faceți dacă vântul schimbă direcția în timpul zborului cross-country?","short":"Dacă vântul își schimbă direcția în timpul zborului cross-country, schimbi altitudinea pentru o viteză mai bună la sol.","long":"Vântul variază cu altitudinea. Ridicând sau coborând, poți găsi un strat cu vânt favorabil, care îți îmbunătățește viteza la sol. Ignorarea schimbării, aterizarea imediată sau oprirea motorului nu sunt măsuri potrivite.","answers":[{"text":"Să ignorați schimbarea vântului","correct":false,"short":"","long":"Schimbarea vântului influențează zborul.","warn":""},{"text":"Să aterizați imediat","correct":false,"short":"","long":"Nu este necesar dacă zborul poate continua în siguranță.","warn":""},{"text":"Să opriți motorul și să plutiți","correct":false,"short":"","long":"Nu este o măsură corectă.","warn":""},{"text":"Să schimbați altitudinea pentru o viteză mai bună la sol","correct":true,"short":"","long":"","warn":""}]},{"number":"#48","text":"967: Care este primul pas în planificarea unui zbor de distanță?","short":"Primul pas în planificarea unui zbor de distanță este verificarea condițiilor meteo.","long":"Meteo decide dacă zborul se face, în ce zi și pe ce altitudini. Înainte de orice calcul sau pregătire, trebuie verificată prognoza. Stabilirea destinației și calculul vitezei vin după.","answers":[{"text":"Verificarea condițiilor meteo","correct":true,"short":"","long":"","warn":""},{"text":"Încărcarea combustibilului","correct":false,"short":"","long":"Se face după verificarea meteo.","warn":""},{"text":"Calcularea vitezei aerului","correct":false,"short":"","long":"Se face după verificarea meteo.","warn":""},{"text":"Stabilirea punctului de destinație","correct":false,"short":"","long":"Este un pas, dar nu primul.","warn":""}]},{"number":"#49","text":"1102: Ce ar trebui să faceți pentru a evita rătăcirea în timpul unui zbor cross-country?","short":"Pentru a evita rătăcirea în zborul cross-country folosești drumuri și alte repere proeminente.","long":"Reperele vizibile, cum sunt drumurile, râurile, căile ferate și localitățile, îți confirmă poziția pe hartă. Zborul la altitudini foarte joase, ignorarea vântului sau pierderea reperelor de la decolare cresc riscul de rătăcire.","answers":[{"text":"Să ignorați schimbările de direcție a vântului","correct":false,"short":"","long":"Vântul trebuie urmărit.","warn":""},{"text":"Să folosiți drumuri și alte repere proeminente","correct":true,"short":"","long":"","warn":""},{"text":"Să zburați la altitudini foarte joase","correct":false,"short":"","long":"Crește riscul de rătăcire.","warn":""},{"text":"Să nu vă uitați înapoi spre zona de lansare după decolare","correct":false,"short":"","long":"Reperele de la decolare ajută la orientare.","warn":""}]},{"number":"#50","text":"907: Deriva reprezintă unghiul format:","short":"Deriva este unghiul dintre direcția dorită a parapantei cu motor și direcția reală de deplasare, determinată de vânt.","long":"Aceeași definiție ca la întrebarea 22: vântul împinge aeronava, iar unghiul dintre traiectul dorit și cel real este deriva.","answers":[{"text":"între direcţia vântului şi deplasarea pe sol a motoparapantei","correct":false,"short":"Între direcția vântului și deplasarea pe sol a motoparapantei.","long":"Aceasta nu este deriva.","warn":""},{"text":"între direcția de deplasare dorită a unei parapante cu motor și direcția reală de deplasare determinată de vânt","correct":true,"short":"Între direcția de deplasare dorită și direcția reală de deplasare determinată de vânt.","long":"Este definiția corectă.","warn":""},{"text":"între axul longitudinal partea din faţă şi linia deplasării pe sol","correct":false,"short":"Între axul longitudinal partea din față și linia deplasării pe sol.","long":"Aceasta este unghiul de cap față de traiect, nu deriva.","warn":""},{"text":"nicio variantă nu este corectă","correct":false,"short":"","long":"Varianta corectă există.","warn":""}]},{"number":"#51","text":"915: Ce unitate de masura este folosit pentru inaltime in normele OACI?","short":"Pentru înălțime, normele OACI folosesc unitatea foot (picior).","long":"OACI folosește piciorul (ft) pentru altitudine și înălțime. Metrul liniar este unitatea SI, dar nu cea folosită de OACI pentru înălțime. Yardul și inch-ul nu sunt unitățile standard.","answers":[{"text":"foot","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"metrul liniar","correct":false,"short":"","long":"Nu este unitatea standard OACI pentru înălțime.","warn":""},{"text":"yardul","correct":false,"short":"","long":"Nu este unitatea standard OACI.","warn":""},{"text":"inch-ul","correct":false,"short":"","long":"Nu este unitatea standard OACI.","warn":""}]},{"number":"#52","text":"955: Dacă o parapantă cu motor zboară 60 km într-o oră cu o viteză aerului de 60 km/h, ce viteză are vântul din spate?","short":"Dacă zbori 60 km într-o oră cu viteza aerului de 60 km/h, vântul din spate este 0 km/h.","long":"Viteza la sol este 60 km/h, egală cu viteza față de aer. Deci vântul este nul, adică 0 km/h.","answers":[{"text":"20 km/h","correct":false,"short":"","long":"Ar fi dacă viteza la sol ar fi 80 km/h.","warn":""},{"text":"30 km/h","correct":false,"short":"","long":"Ar fi dacă viteza la sol ar fi 90 km/h.","warn":""},{"text":"0 km/h","correct":true,"short":"","long":"Este varianta corectă: viteza la sol = viteza aerului.","warn":""},{"text":"10 km/h","correct":false,"short":"","long":"Ar fi dacă viteza la sol ar fi 70 km/h.","warn":""}]},{"number":"#53","text":"895: Am ajuns la FL105 în zbor VFR, iar între timp sub noi cerul s-a acoperit complet, cum ajungem la locul de aterizare?","short":"Dacă ai ajuns la FL105 și sub tine s-a acoperit cerul, cauți o zonă cu vizibilitate care să îți permită să treci sub plafon, chiar dacă trebuie să zbori mai mult.","long":"Zborul VFR cere să ții contact vizual cu solul și să respecți condițiile de vizibilitate. Dacă ai acoperit cerul, trebuie să găsești o zonă deschisă și să cobori sub plafon în condiții sigure. Întoarcerea sau așteptarea până se termină combustibilul nu sunt măsuri de siguranță.","answers":[{"text":"căutăm o zonă cu vizibilitate care să ne permită trecerea sub plafon, chiar dacă asta presupune să zburăm mai mult și mai departe decât ne-am propus","correct":true,"short":"Căutăm o zonă cu vizibilitate care să ne permită trecerea sub plafon, chiar dacă asta presupune să zburăm mai mult.","long":"","warn":""},{"text":"ne întoarceam pe traseul de pe care am venit","correct":false,"short":"Ne întoarcem pe traseul de pe care am venit.","long":"Întoarcerea poate nu rezolva problema plafonului.","warn":""},{"text":"zburăm până se termina benzina spiralând în locul în care suntem și așteptăm să se însenineze","correct":false,"short":"Zburăm până se termină benzina, spiralând în locul în care suntem.","long":"Este periculos și nu este o soluție.","warn":""},{"text":"coborâm în viteză minima prin plafon spre aterizare","correct":false,"short":"Coborâm în viteză minimă prin plafon spre aterizare.","long":"Coborârea prin nori este periculoasă în VFR.","warn":""}]},{"number":"#54","text":"953: O parapantă cu motor zboară cu 50 km/h și întâlnește un vânt de față de 10 km/h. Care este viteza sa la sol?","short":"Dacă zbori cu 50 km/h și întâlnești un vânt de față de 10 km/h, viteza la sol este 40 km/h.","long":"Vântul de față încetinește zborul: 50 − 10 = 40 km/h.","answers":[{"text":"30 km/h","correct":false,"short":"","long":"Ar fi cu vânt de 20 km/h.","warn":""},{"text":"40 km/h","correct":true,"short":"","long":"Este varianta corectă: 50 − 10 = 40.","warn":""},{"text":"60 km/h","correct":false,"short":"","long":"Ar fi cu vânt din spate.","warn":""},{"text":"50 km/h","correct":false,"short":"","long":"Ar fi fără vânt.","warn":""}]},{"number":"#55","text":"923: Direcţia vântului (DV) este:","short":"Direcția vântului este unghiul format între nordul magnetic și vectorul vânt, la aterizare.","long":"Direcția vântului se măsoară de la nordul magnetic (în contextul OACI, folosit la aterizare) până la direcția din care bate vântul. Varianta folosește nordul magnetic, ca standard de referință.","answers":[{"text":"unghiul format între meridianul geografic şi vectorul vânt (la aterizare","correct":false,"short":"Unghiul format între meridianul geografic și vectorul vânt, la aterizare.","long":"Referința este nordul magnetic, nu meridianul geografic.","warn":""},{"text":"unghiul format între vectorul vânt şi meridianul geografic","correct":false,"short":"Unghiul format între vectorul vânt și meridianul geografic.","long":"Referința este nordul magnetic.","warn":""},{"text":"unghiul format planul aeronavei și vectorul vânt","correct":false,"short":"Unghiul format între planul aeronavei și vectorul vânt.","long":"Nu este definiția direcției vântului.","warn":""},{"text":"unghiul format între NM (Nordul magnetic) şi vectorul vânt (la aterizare)","correct":true,"short":"Unghiul format între NM (nordul magnetic) și vectorul vânt, la aterizare.","long":"","warn":""}]},{"number":"#56","text":"934: Cum putem folosi Google Earth pentru zboruri de distanță?","short":"Google Earth ajută să vizualizezi un traseu în 3D înainte de a zbura.","long":"Aplicația arată relieful, reperele și traseul pe care îl planifici. Este un instrument de pregătire, nu înlocuiește harta aeronautică și AIP. Nu măsoară direct variația magnetică sau viteza solului.","answers":[{"text":"pentru a vizualiza un traseu în 3D înainte de a zbura","correct":true,"short":"","long":"","warn":""},{"text":"pentru a găsi puncte de referință geografice","correct":false,"short":"","long":"Este util, dar varianta corectă este vizualizarea 3D.","warn":""},{"text":"pentru a determina variația magnetică","correct":false,"short":"","long":"Nu este folosită pentru aceasta.","warn":""},{"text":"pentru a calcula viteza solului","correct":false,"short":"","long":"Nu este instrumentul pentru calculul vitezei solului.","warn":""}]},{"number":"#57","text":"919: Linia care unește pe o hartă punctele cu aceeasi altitudine se numeste:","short":"Linia care unește pe hartă punctele cu aceeași altitudine se numește curba de nivel.","long":"Curbele de nivel reprezintă relieful pe hartă. Izoclina, ortodroma și loxodroma sunt alte noțiuni: izoclina este linie de înclinare magnetică, ortodroma și loxodroma sunt trasee pe sferă.","answers":[{"text":"curba de nivel","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"izoclina","correct":false,"short":"","long":"Izoclina este linia de egală înclinare magnetică.","warn":""},{"text":"ortodroma","correct":false,"short":"","long":"Ortodroma este cel mai scurt traseu pe sferă.","warn":""},{"text":"loxodroma","correct":false,"short":"","long":"Loxodroma este traseu cu cap constant.","warn":""}]},{"number":"#58","text":"902: Efectuăm un zbor matinal și ne deplasăm cu soarele în față, în ce direcție ne deplasăm ?","short":"Dacă zbori dimineața cu soarele în față, te deplasezi spre est.","long":"Dimineața soarele răsare în est. Dacă îl ai în față, zbori spre est.","answers":[{"text":"N","correct":false,"short":"","long":"Dacă zbori spre nord, soarele ar fi în dreapta.","warn":""},{"text":"E","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"S","correct":false,"short":"","long":"Dacă zbori spre sud, soarele ar fi în spate.","warn":""},{"text":"V","correct":false,"short":"","long":"Dacă zbori spre vest, soarele ar fi în spate.","warn":""}]},{"number":"#59","text":"962: În ce direcție va trebui să te îndrepți pentru a compensa un vânt puternic din sud-est în timp ce zbori spre nord?","short":"Pentru a compensa un vânt puternic din sud-est, în timp ce zbori spre nord, te îndrepți spre nord-est.","long":"Vântul din sud-est împinge aeronava spre nord-vest. Pentru a menține traiectul spre nord, trebuie să corectezi capul spre nord-est, care compensează componenta laterală.","answers":[{"text":"nord-vest","correct":false,"short":"","long":"Ar amplifica deriva, nu o compensează.","warn":""},{"text":"nord-est","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"sud-vest","correct":false,"short":"","long":"Este direcția opusă, greșită.","warn":""},{"text":"sud-est","correct":false,"short":"","long":"Este direcția opusă, greșită.","warn":""}]},{"number":"#60","text":"977: De ce este recomandată utilizarea unui GPS în raidurile de navigație?","short":"GPS-ul este recomandat în raiduri pentru că furnizează poziția exactă și viteza la sol.","long":"GPS-ul determină poziția, viteza la sol, direcția și timpul estimat până la destinație. Acestea ajută la navigație. Fotografiile, combustibilul și temperatura nu sunt funcțiile principale ale GPS-ului pentru navigație.","answers":[{"text":"Pentru a face fotografii","correct":false,"short":"","long":"Nu este funcția principală.","warn":""},{"text":"Pentru a verifica nivelul de combustibil","correct":false,"short":"","long":"Nu este funcția principală.","warn":""},{"text":"Pentru a furniza poziția exactă și viteza la sol","correct":true,"short":"","long":"","warn":""},{"text":"Pentru a măsura temperatura aerului","correct":false,"short":"","long":"GPS-ul nu măsoară temperatura.","warn":""}]},{"number":"#61","text":"974: Ce informații esențiale furnizează un GPS în timpul zborului?","short":"GPS-ul furnizează poziția actuală, viteza la sol și altitudinea.","long":"GPS-ul arată coordonatele, viteza la sol și, de regulă, altitudinea GPS (care nu este la fel de precisă ca altimetrul barometric). Distanța până la aeroport, vântul și meteo nu sunt informațiile standard ale GPS-ului.","answers":[{"text":"Distanta până la cel mai apropiat aeroport","correct":false,"short":"Distanța până la cel mai apropiat aeroport.","long":"Poate fi afișată, dar nu este informația esențială.","warn":""},{"text":"Poziția actuală, viteza la sol și altitudinea","correct":true,"short":"","long":"","warn":""},{"text":"Direcția vântului și umiditatea aerului","correct":false,"short":"","long":"GPS-ul nu măsoară umiditatea și nu oferă direct vântul.","warn":""},{"text":"Condițiile meteo și nivelul de combustibil","correct":false,"short":"","long":"GPS-ul nu oferă aceste date.","warn":""}]},{"number":"#62","text":"939: Ce este zborul în pilotaj?","short":"Pilotajul este zborul folosind o hartă și repere vizuale pentru a menține o traiectorie.","long":"Pilotajul este navigarea prin observarea terenului, cu harta și reperele. Este metoda de bază VFR. Zborul cu GPS sau cu calculatorul sunt metode complementare.","answers":[{"text":"utilizarea unui calculator de zbor pentru navigare","correct":false,"short":"","long":"Calculatorul este instrument, nu definiția pilotajului.","warn":""},{"text":"zborul folosind exclusiv GPS-ul","correct":false,"short":"","long":"Pilotajul nu este bazat exclusiv pe GPS.","warn":""},{"text":"utilizarea unei hărți și a reperelor vizuale pentru a menține o traiectorie","correct":true,"short":"","long":"","warn":""},{"text":"zborul la o altitudine constantă fără a ține cont de direcția vântului","correct":false,"short":"","long":"Nu este definiția pilotajului.","warn":""}]},{"number":"#63","text":"969: Cum se numește linia trasată pe hartă pentru a reprezenta traiectoria dorită de zbor?","short":"Linia trasată pe hartă pentru a reprezenta traiectoria dorită se numește linie de traseu.","long":"Linia de traseu este linia pe care pilotul o trasează pe hartă între punctele de navigație. Linia de aterizare, decolare și orientare nu sunt termenii pentru traiectorie.","answers":[{"text":"Linie de aterizare","correct":false,"short":"","long":"Nu este traseul dorit.","warn":""},{"text":"Linie de traseu","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"Linie de decolare","correct":false,"short":"","long":"Nu este traseul dorit.","warn":""},{"text":"Linie de orientare","correct":false,"short":"","long":"Nu este termenul pentru traiectoria dorită.","warn":""}]},{"number":"#64","text":"927: Ce este un meridian de longitudine?","short":"Meridianul de longitudine este un cerc mare care trece prin poli.","long":"Meridianele sunt cercuri mari care trec prin cei doi poli și măsoară longitudinea. Paralelele sunt cercuri paralele cu ecuatorul. Linia care unește două puncte pe glob este o altă noțiune.","answers":[{"text":"O linie imaginară care unește două puncte pe glob","correct":false,"short":"","long":"Aceasta este o definiție generală, nu a meridianului.","warn":""},{"text":"Un cerc mare care trece prin poli","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"O linie paralelă cu ecuatorul","correct":false,"short":"","long":"Aceasta este paralela, nu meridianul.","warn":""},{"text":"O linie care intersectează ecuatorul la 90 de grade","correct":false,"short":"O linie care intersectează ecuatorul la 90°.","long":"Meridianele intersectează ecuatorul la 90°, dar varianta completă este cea cu cercul mare.","warn":""}]},{"number":"#65","text":"905: QFE reprezintă:","short":"QFE reprezintă presiunea la pragul pistei.","long":"QFE este presiunea măsurată la aerodrom. Dacă altimetrul este reglat pe QFE, indică zero la pragul pistei. Presiunea la nivelul mării este QNH, iar presiunea standard este QNE.","answers":[{"text":"nici un raspuns nu este corect","correct":false,"short":"Nici un răspuns nu este corect.","long":"Varianta corectă există.","warn":""},{"text":"presiunea standard","correct":false,"short":"","long":"Aceasta este QNE.","warn":""},{"text":"presiunea la pragul pistei","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"presiunea la nivelul marii","correct":false,"short":"Presiunea la nivelul mării.","long":"Aceasta este QNH.","warn":""}]},{"number":"#66","text":"890: Avem în traseul nostru un vârf de peste 2500m, putem zbura peste acesta?","short":"Nu există reglementări care să interzică zborul peste un vârf de peste 2500 m, cu condiția să respecți limitele de altitudine aplicabile.","long":"Varianta corectă afirmă că nu există reglementări care să interzică zborul peste vârful de peste 2500 m. Totuși trebuie respectate limitele de altitudine și regulile de planificare, iar zborul peste munți trebuie făcut cu atenție. Verifică reglementarea actuală.","answers":[{"text":"nu, la altitudinea respectiva pilotul își poate pierde cunoștința","correct":false,"short":"Nu, la altitudinea respectivă pilotul își poate pierde cunoștința.","long":"Trebuie luate măsuri, dar nu este interdicție generală.","warn":""},{"text":"nu, cu parapanta cu motor este interzis zborul la înălțimi peste 2500m","correct":false,"short":"Nu, cu parapanta cu motor este interzis zborul la înălțimi peste 2500 m.","long":"Nu am confirmat această interdicție în sursele consultate.","warn":""},{"text":"da, este recomandat să zburăm cât mai aproape de acesta pentru a putea ateriza în caz de","correct":false,"short":"Da, este recomandat să zburăm cât mai aproape de acesta pentru a putea ateriza în caz de urgență.","long":"Zborul aproape de vârf nu este recomandat.","warn":""},{"text":"da, nu există reglementări care să interzică acest zbor","correct":true,"short":"","long":"","warn":""}]},{"number":"#67","text":"924: Traseul de la decolare și până la aterizare se numește:","short":"Traseul de la decolare până la aterizare se numește traiect.","long":"Traiectul este traseul real parcurs de la decolare până la aterizare. Ruta este planul de traseu, drumul este un drum rutier, iar traiectoria este un termen general pentru linia urmată de aeronavă.","answers":[{"text":"traiect","correct":true,"short":"","long":"","warn":""},{"text":"rută","correct":false,"short":"","long":"Ruta este planul de traseu, nu traseul real.","warn":""},{"text":"drum","correct":false,"short":"","long":"Drumul este un drum rutier, nu traiectul.","warn":""},{"text":"traiectorie","correct":false,"short":"","long":"Este un termen general, dar varianta corectă este traiectul.","warn":""}]},{"number":"#68","text":"965: Dacă vântul bate din nord-vest și zbori spre sud, în ce direcție va fi deviata traiectoria ta?","short":"Dacă vântul bate din nord-vest și zbori spre sud, traiectoria ta va fi deviată spre sud-est.","long":"Vântul din nord-vest împinge aeronava spre sud-est. Deviația este deci spre sud-est, iar pentru a menține traiectul spre sud trebuie corectat capul spre sud-vest.","answers":[{"text":"nord-vest","correct":false,"short":"","long":"Vântul vine din nord-vest, deviația este în direcția opusă.","warn":""},{"text":"sud-vest","correct":false,"short":"","long":"Aceasta este corecția capului, nu deviația.","warn":""},{"text":"nord-est","correct":false,"short":"","long":"Direcția este greșită.","warn":""},{"text":"sud-est","correct":true,"short":"","long":"Este varianta corectă.","warn":""}]},{"number":"#69","text":"963: Dacă zbori spre vest și observi că busola indică 270 de grade, dar GPS-ul indică o direcție de 260 de grade, ce corecție trebuie să faci?","short":"Dacă zbori spre vest, busola indică 270°, iar GPS-ul indică 260°, faci o corecție de 10° spre dreapta.","long":"Busola și GPS-ul arată direcții diferite: GPS-ul indică 260°, adică ești deviat spre sud. Ca să revii pe traiect spre vest (270°), corectezi capul cu 10° spre nord, adică spre dreapta, pentru că zbori spre vest.","answers":[{"text":"corecție de 10 grade spre dreapta","correct":true,"short":"Corecție de 10° spre dreapta.","long":"","warn":""},{"text":"corecție de 10 grade spre stânga","correct":false,"short":"Corecție de 10° spre stânga.","long":"Aceasta te-ar duce mai mult spre sud.","warn":""},{"text":"corecție de 20 de grade spre dreapta","correct":false,"short":"Corecție de 20° spre dreapta.","long":"Diferența este 10°, nu 20°.","warn":""},{"text":"nicio corecție necesară","correct":false,"short":"","long":"Există diferență, deci corecție necesară.","warn":""}]},{"number":"#70","text":"1101: Cum puteți estima vânturile la altitudini folosind GPS-ul?","short":"Vânturile la altitudine se estimează cu GPS făcând un viraj lent de 360° și notând cea mai mică viteză la sol.","long":"Când zbori în vânt, viteza la sol scade; când zbori cu vântul în spate, crește. Viteza minimă la sol în viraj indică direcția vântului: vântul vine din direcția în care ai zburat cu viteză minimă. Metoda este orientativă.","answers":[{"text":"Efectuând un viraj lent de 360 de grade și notând cea mai mică viteză la sol","correct":true,"short":"Efectuând un viraj lent de 360° și notând cea mai mică viteză la sol.","long":"","warn":""},{"text":"Zburând în linie dreaptă pentru 10 minute","correct":false,"short":"","long":"Nu permite estimarea vântului.","warn":""},{"text":"Utilizând doar un altimetru barometric","correct":false,"short":"","long":"Altimetrul nu dă vântul.","warn":""},{"text":"Întreținând o viteză constantă la sol","correct":false,"short":"Menținând o viteză constantă la sol.","long":"Viteza constantă nu permite estimarea.","warn":""}]},{"number":"#71","text":"964: Care este unghiul dintre nordul geografic și nordul magnetic dacă busola indică 15 grade est?","short":"Unghiul dintre nordul geografic și nordul magnetic, dacă busola indică 15° est, este 15° est.","long":"Declinația magnetică este unghiul dintre nordul geografic și cel magnetic. Varianta corectă indică 15° est, care este valoarea din enunț. Verifică declinația reală pe harta zonei, deoarece depinde de loc și de an.","answers":[{"text":"15 grade vest","correct":false,"short":"15° vest.","long":"Sensul este invers.","warn":""},{"text":"0 grade","correct":false,"short":"0°.","long":"Declinația nu este nulă aici.","warn":""},{"text":"15 grade est","correct":true,"short":"15° est.","long":"","warn":""},{"text":"30 grade est","correct":false,"short":"30° est.","long":"Dublează valoarea, greșit.","warn":""}]},{"number":"#72","text":"978: O parapantă zboară cu o viteză de 45 km/h și întâlnește un vânt din față de 15 km/h. Care este viteza sa la sol?","short":"O parapantă care zboară cu 45 km/h și întâlnește un vânt din față de 15 km/h are viteza la sol de 30 km/h.","long":"Cu vânt din față, viteza la sol = viteza față de aer − vânt = 45 − 15 = 30 km/h.","answers":[{"text":"15 km/h","correct":false,"short":"","long":"Ar fi viteza vântului, nu rezultanta.","warn":""},{"text":"60 km/h","correct":false,"short":"","long":"Ar fi cu vânt din spate.","warn":""},{"text":"45 km/h","correct":false,"short":"","long":"Ar fi fără vânt.","warn":""},{"text":"30 km/h","correct":true,"short":"","long":"Este varianta corectă: 45 − 15 = 30.","warn":""}]},{"number":"#73","text":"892: Este ora 18. Zburaţi în linie dreaptă, cu soarele in faţă. Compasul vă indică 080º. Deduceţi că:","short":"La ora 18, cu soarele în față și compasul pe 080°, afirmația că mergi spre est, cu soarele apus în vest, este falsă.","long":"La 18:00 soarele este în vest. Dacă îl ai în față, zbori spre vest, adică aproximativ 270°. Compasul pe 080° indică est. Deci nu poți avea soarele în față și compasul pe 080°, ceea ce face afirmația falsă.","answers":[{"text":"nu putem deduce nimic","correct":false,"short":"","long":"Se poate deduce, pe baza soarelui și a direcției.","warn":""},{"text":"compasul indică o direcție de deplasare catre Est, iar soarele apune la Vest, afirmația este falsă","correct":true,"short":"Compasul indică o direcție de deplasare către est, iar soarele apune la vest, afirmația este falsă.","long":"","warn":""},{"text":"este interzis zborul cu vânt de față","correct":false,"short":"","long":"Nu este legat de enunț.","warn":""},{"text":"este exact","correct":false,"short":"","long":"Compasul pe 080° și soarele în față nu sunt compatibile.","warn":""}]},{"number":"#74","text":"896: Ne propune să traversăm o zonă muntoasă, cum vom zbura din punctul A în punctul B?","short":"Pentru a traversa o zonă muntoasă, ocolim vârfurile peste 3200 m și zburăm aproape de locurile de aterizare și de căile de acces pentru recuperare.","long":"Zona muntoasă cere planificare: ocolirea vârfurilor care depășesc limita, păstrarea unei distanțe de siguranță față de relief și apropierea de locurile de aterizare. Nu se zboară în linie dreaptă indiferent de relief, nici nu se urmează punctele fără a verifica zona.","answers":[{"text":"zburăm în linie dreaptă indiferent de înălțimea față de sol și obstacolele din fața noastră","correct":false,"short":"Zburăm în linie dreaptă indiferent de înălțimea față de sol și obstacolele din față.","long":"Este periculos.","warn":""},{"text":"toate variantele sunt greșite","correct":false,"short":"","long":"Nu este varianta corectă.","warn":""},{"text":"ne setăm puncte pe aplicația de navigație pe care o folosim și nu ne abatem de la ele chiar dacă asta presupune să traversăm o zonă fără loc de aterizare","correct":false,"short":"Ne setăm puncte pe aplicația de navigație și nu ne abatem de la ele, chiar dacă trecem printr-o zonă fără loc de aterizare.","long":"Este periculos, nu ține cont de locurile de aterizare.","warn":""},{"text":"ocolim vârfurile peste 3200m și zburăm cât mai aproape de locurile de aterizare și căile de acces pentru recuperare în caz de urgență","correct":true,"short":"Ocolim vârfurile peste 3200 m și zburăm cât mai aproape de locurile de aterizare și căile de acces pentru recuperare în caz de urgență.","long":"","warn":""}]},{"number":"#75","text":"916: Care sunt reperele liniare pe o hartă?","short":"Reperele liniare de pe hartă sunt căile ferate, șoselele și râurile.","long":"Reperele liniare sunt elemente lungi care se văd ușor din aer și ajută la orientare: căile ferate, drumurile și râurile. Podurile mari, fabricile izolate și silozurile sunt repere punctuale.","answers":[{"text":"căi ferate, șosele, râuri","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"poduri mari, fabrici izolate, silozuri","correct":false,"short":"","long":"Sunt repere punctuale, nu liniare.","warn":""},{"text":"orase, lacuri, terenuri","correct":false,"short":"Orașe, lacuri, terenuri.","long":"Sunt suprafețe sau puncte, nu linii.","warn":""},{"text":"păduri, râuri, clădiri","correct":false,"short":"","long":"Pădurile și clădirile nu sunt repere liniare.","warn":""}]},{"number":"#76","text":"961: Care este declinația magnetică dacă zbori spre nord și busola indică 10 grade spre est?","short":"Dacă zbori spre nord și busola indică 10° est, declinația magnetică este 10° est.","long":"Varianta corectă indică 10° est. Declinația este diferența dintre nordul geografic și nordul magnetic. Verifică valoarea reală pe harta zonei.","answers":[{"text":"0 grade","correct":false,"short":"0°.","long":"Declinația nu este nulă aici.","warn":""},{"text":"20 grade est","correct":false,"short":"20° est.","long":"Dublează valoarea.","warn":""},{"text":"10 grade vest","correct":false,"short":"10° vest.","long":"Sensul este invers.","warn":""},{"text":"10 grade est","correct":true,"short":"10° est.","long":"","warn":""}]},{"number":"#77","text":"960: Dacă zbori spre soare cu soarele la răsărit, în ce direcție te deplasezi?","short":"Dacă zbori spre soare, cu soarele la răsărit, te deplasezi spre est.","long":"Soarele răsare în est. Dacă zbori spre el, zbori spre est.","answers":[{"text":"vest","correct":false,"short":"","long":"Spre vest soarele ar fi în spate.","warn":""},{"text":"nord","correct":false,"short":"","long":"Spre nord soarele ar fi în dreapta.","warn":""},{"text":"sud","correct":false,"short":"","long":"Spre sud soarele ar fi în stânga.","warn":""},{"text":"est","correct":true,"short":"","long":"Este varianta corectă.","warn":""}]},{"number":"#78","text":"925: Documentul de bază pentru informarea tuturor operatorilor în vederea efectuării activității de zbor pe teritoriul României este:","short":"Documentul de bază pentru informarea operatorilor în vederea zborului pe teritoriul României este AIP (Aeronautical Information Publication).","long":"AIP România este publicația oficială care conține informații aeronautice: spații aeriene, aerodromuri, frecvențe și proceduri. Este documentul de bază pentru zborul în România.","answers":[{"text":"F.I.R","correct":false,"short":"","long":"FIR este o regiune de informare, nu documentul de bază.","warn":""},{"text":"M.T.S","correct":false,"short":"","long":"Nu este documentul de informare aeronautică.","warn":""},{"text":"N.A.V","correct":false,"short":"","long":"Nu este documentul de bază.","warn":""},{"text":"A.I.P","correct":true,"short":"","long":"Este varianta corectă.","warn":""}]},{"number":"#79","text":"947: Un pilot zboară pe un traseu cu o lungime de 50 km la o viteză la sol de 80 km/h. Cât timp îi va lua să parcurgă traseul?","short":"Pentru un traseu de 50 km cu viteza la sol de 80 km/h, timpul este 37,5 minute.","long":"Timp = 50 / 80 = 0,625 h, adică 0,625 × 60 = 37,5 minute.","answers":[{"text":"60 minute","correct":false,"short":"","long":"Ar fi cu viteza de 50 km/h.","warn":""},{"text":"75 minute","correct":false,"short":"","long":"Ar fi cu viteza de 40 km/h.","warn":""},{"text":"45 minute","correct":false,"short":"","long":"Ar fi cu viteza de 66,7 km/h.","warn":""},{"text":"37.5 minute","correct":true,"short":"37,5 minute.","long":"Este varianta corectă.","warn":""}]},{"number":"#80","text":"920: Vizibilitatea scăzută:","short":"Vizibilitatea scăzută poate fi cauzată de fum, ceață sau ploaie.","long":"Vizibilitatea scade din cauza fumului, ceții, ploii, zăpezii sau a altor particule din aer. Vizibilitatea redusă afectează zborul VFR și cere atenție sporită sau amânarea zborului.","answers":[{"text":"implică utilizarea de lumini de navigație","correct":false,"short":"","long":"Luminile sunt utile, dar nu definesc vizibilitatea scăzută.","warn":""},{"text":"nu influențeaza zborurile VFR","correct":false,"short":"Nu influențează zborurile VFR.","long":"Influențează zborurile VFR.","warn":""},{"text":"reprezintă distanța pe verticală de la care se pot observa reperele de la sol","correct":false,"short":"","long":"Aceasta nu este definiția.","warn":""},{"text":"poate fi cauzată de fum, ceață, ploaie","correct":true,"short":"","long":"","warn":""}]},{"number":"#81","text":"957: O parapantă cu motor zboară 100 km în două ore cu un vânt din față de 10 km/h. Care este viteza față de aer?","short":"Dacă zbori 100 km în două ore cu vânt din față de 10 km/h, viteza față de aer este 60 km/h.","long":"Viteza la sol = 100 / 2 = 50 km/h. Cu vânt din față, viteza față de aer = viteza la sol + vânt = 50 + 10 = 60 km/h.","answers":[{"text":"70 km/h","correct":false,"short":"","long":"Ar fi cu vânt de 20 km/h.","warn":""},{"text":"80 km/h","correct":false,"short":"","long":"Ar fi cu vânt de 30 km/h.","warn":""},{"text":"50 km/h","correct":false,"short":"","long":"Este viteza la sol, nu față de aer.","warn":""},{"text":"60 km/h","correct":true,"short":"","long":"Este varianta corectă.","warn":""}]},{"number":"#82","text":"945: Ce este un traiect?","short":"Traiectul este traseul de la decolare până la aterizare.","long":"Traiectul este traseul real parcurs de la decolare la aterizare. Diferența dintre altitudinea reală și cea GPS, distanța pe verticală și raportul dintre viteze nu sunt definiții ale traiectului.","answers":[{"text":"diferența între altitudinea reală și altitudinea GPS","correct":false,"short":"","long":"Aceasta este o eroare de altitudine.","warn":""},{"text":"traseul de la decolare până la aterizare","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"viteza solului raportată la viteza aerului","correct":false,"short":"","long":"Aceasta este un raport de viteze.","warn":""},{"text":"distanța pe verticală între două puncte","correct":false,"short":"","long":"Aceasta este diferența de altitudine.","warn":""}]},{"number":"#83","text":"888: Cu ce culoare sunt de obicei reprezentate pe harta pădurile?","short":"Pădurile se reprezintă de obicei pe hartă cu verde.","long":"Pe hărțile topografice, pădurile sunt colorate în verde, apele în albastru, iar localitățile și drumurile în alte culori. Culorile sunt standardizate pe hartă.","answers":[{"text":"culori inchise","correct":false,"short":"Culori închise.","long":"Nu este convenția standard.","warn":""},{"text":"maro","correct":false,"short":"","long":"Maroul se folosește pentru relief, nu pentru păduri.","warn":""},{"text":"nu exista o regulă","correct":false,"short":"Nu există o regulă.","long":"Există convenție standard.","warn":""},{"text":"verde","correct":true,"short":"","long":"Este varianta corectă.","warn":""}]},{"number":"#84","text":"929: Ce este pilotajul?","short":"Pilotajul este zborul folosind o hartă, jurnal și repere vizuale.","long":"Pilotajul este navigația vizuală, bazată pe hartă, pe reperele de la sol și pe ținerea evidenței traseului. Zborul pe distanțe lungi fără repere sau navigarea doar cu GPS și ceas sau doar cu busola nu sunt definiția pilotajului.","answers":[{"text":"zborul folosind o hartă, jurnal și repere vizuale","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"zborul pe distanțe lungi fără repere vizuale","correct":false,"short":"","long":"Pilotajul folosește repere vizuale.","warn":""},{"text":"navigarea cu ajutorul unui GPS și a unui ceas","correct":false,"short":"","long":"Nu este pilotajul, ci navigația GPS.","warn":""},{"text":"utilizarea exclusivă a busolei pentru navigare","correct":false,"short":"","long":"Pilotajul nu se bazează doar pe busolă.","warn":""}]},{"number":"#85","text":"893: Zborul la 5m de sol cu soare de față este interzis pentru că:","short":"Zborul la 5 m de sol, cu soarele în față, nu este permis, cu excepția procedurii de decolare și aterizare, pentru că este interzis zborul la această înălțime.","long":"Zborul la înălțimi foarte mici este restricționat, cu excepția decolării și aterizării. Soarele în față nu este motivul interdicției, iar înălțimea maximă nu este nereglementată.","answers":[{"text":"Se poate zbura cu vânt de față doar la înălțimi ce depășesc 100m","correct":false,"short":"Se poate zbura cu vânt de față doar la înălțimi ce depășesc 100 m.","long":"Nu este regula.","warn":""},{"text":"Zborul cu soare de față este interzis","correct":false,"short":"","long":"Soarele în față nu este motivul interdicției.","warn":""},{"text":"Nu este reglementată înalțimea maximă de zbor","correct":false,"short":"Nu este reglementată înălțimea maximă de zbor.","long":"Înălțimea este reglementată.","warn":""},{"text":"Este interzis să zburăm la aceasta înălțime cu exceptie de procedura de aterizare si decolare","correct":true,"short":"Este interzis să zburăm la această înălțime, cu excepția procedurii de aterizare și decolare.","long":"","warn":""}]},{"number":"#86","text":"936: Ce este UTC?","short":"UTC este ora coordonată universală.","long":"UTC este ora de referință internațională, derivată din meridianul zero. Ora locală a aerodromului de plecare sau de sosire nu este referința comună.","answers":[{"text":"ora coordonată universală","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"ora locală a aerodromului de plecare","correct":false,"short":"","long":"Este ora locală, nu UTC.","warn":""},{"text":"ora locală a aerodromului de sosire","correct":false,"short":"","long":"Este ora locală, nu UTC.","warn":""},{"text":"ora locală la meridianul 0","correct":false,"short":"","long":"Este apropiată, dar denumirea este ora coordonată universală.","warn":""}]},{"number":"#87","text":"971: Care este scopul utilizării unei hărți în navigația cu parapanta?","short":"Scopul utilizării unei hărți în navigația cu parapanta este vizualizarea terenului și alegerea punctelor de reper.","long":"Harta arată relieful, drumurile, localitățile, cursurile de apă și zonele restricționate. Pe baza ei alegi reperele și traseul. Nu măsoară combustibilul, altitudinea sau vântul.","answers":[{"text":"Pentru a verifica nivelul de combustibil","correct":false,"short":"","long":"Harta nu arată combustibilul.","warn":""},{"text":"Pentru a vizualiza terenul și a alege punctele de reper","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"Pentru a măsura altitudinea","correct":false,"short":"","long":"Altitudinea se măsoară cu altimetrul.","warn":""},{"text":"Pentru a calcula viteza vântului","correct":false,"short":"","long":"Vântul nu se calculează din hartă.","warn":""}]},{"number":"#88","text":"950: Ce efect are un vânt de față de 10 km/h asupra unei parapante cu motor care zboară cu 40 km/h?","short":"Un vânt de față de 10 km/h reduce viteza la sol la 30 km/h, pentru o parapantă cu motor care zboară cu 40 km/h.","long":"Vântul din față se scade din viteza față de aer: 40 − 10 = 30 km/h.","answers":[{"text":"reduce viteza la sol la 20 km/h","correct":false,"short":"","long":"Ar fi cu vânt de 20 km/h.","warn":""},{"text":"nu are niciun efect asupra vitezei la sol","correct":false,"short":"","long":"Vântul afectează viteza la sol.","warn":""},{"text":"educe viteza la sol la 30 km/h","correct":true,"short":"Reduce viteza la sol la 30 km/h.","long":"Este varianta corectă.","warn":""},{"text":"mărește viteza la sol la 50 km/h","correct":false,"short":"","long":"Ar fi cu vânt din spate.","warn":""}]},{"number":"#89","text":"952: Cum afectează un vânt lateral de 15 km/h zborul unei parapante cu motor care zboară la 50 km/h?","short":"Un vânt lateral de 15 km/h deviază direcția de zbor a unei parapante cu motor care zboară cu 50 km/h.","long":"Vântul lateral nu schimbă doar viteza, ci și direcția: aeronava trebuie să corecteze capul pentru a menține traiectul. Viteza la sol devine √(50² + 15²) ≈ 52,2 km/h, deci nu rămâne 50.","answers":[{"text":"nu are niciun efect asupra direcției de zbor","correct":false,"short":"","long":"Vântul lateral deviază direcția.","warn":""},{"text":"crește viteza la sol la 65 km/h","correct":false,"short":"","long":"Vântul lateral nu se adună aritmetic.","warn":""},{"text":"deviază direcția de zbor","correct":true,"short":"","long":"","warn":""},{"text":"scade viteza la sol la 35 km/h","correct":false,"short":"","long":"Vântul lateral nu scade viteza cu 15.","warn":""}]},{"number":"#90","text":"958: Dacă zburați spre nord și vântul bate din vest, care va fi direcția de deplasare rezultantă?","short":"Dacă zbori spre nord și vântul bate din vest, direcția rezultantă este nord-est.","long":"Vântul din vest împinge aeronava spre est. Combinat cu deplasarea spre nord, rezultanta este spre nord-est.","answers":[{"text":"sud-est","correct":false,"short":"","long":"Direcția este greșită.","warn":""},{"text":"nord-est","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"sud-vest","correct":false,"short":"","long":"Direcția este greșită.","warn":""},{"text":"nord-vest","correct":false,"short":"","long":"Vântul din vest împinge spre est, nu spre vest.","warn":""}]},{"number":"#91","text":"941: Ce este un VOR?","short":"VOR este o metodă de navigație folosită de piloții de avioane pentru a determina cursul și locația.","long":"VOR este un radiofar VHF care oferă radialul față de stație. Este folosit mai ales de avioane, dar nu este un instrument pentru motoparapantă. Balizele de aterizare, comunicarea și altimetrul sunt alte funcții.","answers":[{"text":"o metodă de navigație folosită de piloții de avioane pentru a determina cursul și locația","correct":true,"short":"","long":"","warn":""},{"text":"un tip de baliză utilizată pentru aterizări","correct":false,"short":"","long":"Balizele de aterizare sunt alt echipament.","warn":""},{"text":"o metodă de comunicare între piloți","correct":false,"short":"","long":"VOR este de navigație, nu de comunicare.","warn":""},{"text":"un instrument folosit pentru a măsura altitudinea","correct":false,"short":"","long":"VOR nu măsoară altitudinea.","warn":""}]},{"number":"#92","text":"943: Ce este un azimut?","short":"Azimutul este unghiul dintre un obiect și nordul geografic, măsurat pe un plan orizontal.","long":"Azimutul se măsoară pe orizontală, de la nordul geografic în sensul acelor de ceasornic, până la direcția obiectului. Viteza aerului, distanța verticală și diferența de altitudine nu sunt azimutul.","answers":[{"text":"o metodă de calcul al vitezei aerului","correct":false,"short":"","long":"Nu este definiția azimutului.","warn":""},{"text":"distanța pe verticală între două puncte de pe suprafață","correct":false,"short":"","long":"Aceasta este diferența de altitudine.","warn":""},{"text":"diferența între altitudine și nivelul mării","correct":false,"short":"","long":"Aceasta este altitudinea.","warn":""},{"text":"unghiul dintre un obiect și nordul geografic măsurat pe un plan orizontal","correct":true,"short":"Unghiul dintre un obiect și nordul geografic, măsurat pe un plan orizontal.","long":"Este definiția corectă.","warn":""}]},{"number":"#93","text":"972: De ce este importantă estimarea vitezei la sol în timpul planificării zborului?","short":"Estimarea vitezei la sol este importantă pentru a calcula timpul necesar până la destinație.","long":"Viteza la sol împreună cu distanța dau timpul de zbor. Este esențială pentru combustibil, planificarea pauzelor și calculul orei de sosire. Nu determină variația magnetică sau altitudinea.","answers":[{"text":"Pentru a verifica nivelul de combustibil","correct":false,"short":"","long":"Viteza la sol ajută, dar varianta corectă este calculul timpului.","warn":""},{"text":"Pentru a ajusta variația magnetică","correct":false,"short":"","long":"Viteza nu ajustează variația magnetică.","warn":""},{"text":"Pentru a calcula timpul necesar pentru a ajunge la destinație","correct":true,"short":"","long":"","warn":""},{"text":"Pentru a determina altitudinea de zbor","correct":false,"short":"","long":"Viteza nu determină altitudinea.","warn":""}]},{"number":"#94","text":"933: Care este scopul navigației?","short":"Scopul navigației este zborul pe o traiectorie dorită deasupra solului și sosirea la destinație la un timp estimat.","long":"Navigația urmărește ca aeronava să ajungă unde a planificat, pe traseul dorit și în timpul estimat. Pentru asta combină harta, busola, GPS-ul și calculul vitezei la sol.","answers":[{"text":"zborul pe o traiectorie dorită deasupra solului și sosirea la destinație la un timp estimat","correct":true,"short":"","long":"","warn":""},{"text":"zborul pe distanțe scurte folosind repere vizuale","correct":false,"short":"","long":"Nu este scopul general al navigației.","warn":""},{"text":"utilizarea busolei pentru a găsi direcția nordului magnetic","correct":false,"short":"","long":"Este doar un instrument.","warn":""},{"text":"planificarea unui traseu fără a ține cont de condițiile meteo","correct":false,"short":"","long":"Navigația ține cont de meteo.","warn":""}]}]},{"id":"06","title":"Performanțe de zbor","questions":[{"number":"#1","text":"884: Cum afectează un centru de greutate setat necorespunzător manevrabilitatea în zbor?","short":"Un centru de greutate setat greșit poate face manevrele mai dificile și mai puțin precise.","long":"Centrul de greutate determină cum reacționează aripa la comenzi și la rafale. Dacă este setat greșit, comenzile devin grele sau imprevizibile, iar manevrele sunt mai greu de executat. Din acest motiv el trebuie reglat conform manualului.","answers":[{"text":"nu influențează manevrabilitatea în zbor","correct":false,"short":"","long":"Influențează direct manevrabilitatea.","warn":""},{"text":"poate face manevrele mai dificile și mai puțin precise","correct":true,"short":"","long":"","warn":""},{"text":"facilitează manevrele complexe","correct":false,"short":"","long":"Un centru de greutate greșit nu facilitează manevrele.","warn":""},{"text":"îmbunătățește manevrabilitatea în condiții de vânt puternic","correct":false,"short":"","long":"Nu îmbunătățește manevrabilitatea.","warn":""}]},{"number":"#2","text":"832: Cum influențează greutatea pilotului performanța zborului?","short":"Greutatea pilotului trebuie să fie compatibilă cu greutatea maximă admisă a aripii, pentru stabilitate și manevrabilitate.","long":"Fiecare aripă are un interval de greutate pentru care este omologată. În afara lui, stabilitatea și manevrabilitatea sunt afectate, iar performanțele se schimbă. De aceea greutatea totală trebuie să se încadreze în limitele aripii.","answers":[{"text":"greutatea pilotului trebuie să fie compatibilă cu greutatea maximă admisă a aripii pentru a asigura stabilitatea și manevrabilitatea","correct":true,"short":"Greutatea pilotului influențează capacitatea de ascensiune în termici.","long":"Influențează ascensiunea, dar nu este varianta corectă.","warn":""},{"text":"greutatea pilotului influențează capacitatea de ascensiune în termici","correct":false,"short":"Greutatea pilotului trebuie să fie compatibilă cu greutatea maximă admisă a aripii pentru a asigura stabilitatea și manevrabilitatea.","long":"Este varianta corectă.","warn":""},{"text":"greutatea pilotului influențează viteza de reacție a comenzilor","correct":false,"short":"","long":"Nu este varianta principală.","warn":""},{"text":"greutatea pilotului afectează echilibrul general al sistemului de suspensie","correct":false,"short":"","long":"Este parțial adevărat, dar varianta corectă este cea cu greutatea maximă admisă.","warn":""}]},{"number":"#3","text":"857: Cum afectează utilizarea sistemului speed bar viteza de zbor și stabilitatea?","short":"Folosirea sistemului speed bar crește viteza de zbor, dar poate reduce stabilitatea.","long":"Speed bar-ul scurtează liniile inferioare, deci unghiul de incidență scade și aripa zboară mai repede. În același timp, stabilitatea scade, iar aripa devine mai sensibilă la turbulență. Trebuie folosit cu măsură.","answers":[{"text":"reduce viteza de zbor, dar crește stabilitatea","correct":false,"short":"","long":"Este opusul efectului.","warn":""},{"text":"crește viteza de zbor, dar poate reduce stabilitatea","correct":true,"short":"","long":"","warn":""},{"text":"crește viteza de zbor și stabilitatea","correct":false,"short":"","long":"Stabilitatea scade, nu crește.","warn":""},{"text":"reduce viteza de zbor și stabilitatea","correct":false,"short":"","long":"Viteza crește cu speed bar-ul.","warn":""}]},{"number":"#4","text":"851: Cum poate influența greutatea totală a echipamentului performanțele de decolare?","short":"O greutate mai mare necesită o distanță de decolare mai lungă.","long":"Cu greutate mai mare, aripa are nevoie de o viteză mai mare pentru a decola, deci pilotul trebuie să alerge mai mult. Greutatea mai mare nu scurtează decolarea și nu o face mai rapidă.","answers":[{"text":"greutatea mai mare permite o decolare mai rapidă","correct":false,"short":"","long":"Greutatea mai mare cere mai multă viteză, deci decolare mai lungă.","warn":""},{"text":"greutatea mai mare reduce distanța de decolare necesară","correct":false,"short":"","long":"Este opusul efectului.","warn":""},{"text":"greutatea mai mare necesită o distanță de decolare mai lungă","correct":true,"short":"","long":"","warn":""},{"text":"greutatea nu influențează distanța de decolare","correct":false,"short":"","long":"Greutatea influențează decolarea.","warn":""}]},{"number":"#5","text":"867: Cum influențează greutatea totală a echipamentului stabilitatea în zbor?","short":"O greutate totală mai mare poate face zborul mai stabil.","long":"Cu o greutate mai mare, aripa este mai stabilă la turbulență și mai greu de desfășurat de vânt, deci reacțiile sunt mai puțin bruște. Varianta corectă reflectă acest efect. Greutatea prea mare depășește limitele omologării.","answers":[{"text":"greutatea totală nu influențează stabilitatea","correct":false,"short":"","long":"Influențează stabilitatea.","warn":""},{"text":"greutatea totală mai mare poate reduce stabilitatea","correct":false,"short":"","long":"Varianta contrazice regula, care marchează stabilitatea crescută.","warn":""},{"text":"greutatea totală mai mare poate face zborul mai stabil","correct":true,"short":"","long":"","warn":""},{"text":"greutatea totală mai mică poate reduce stabilitatea","correct":false,"short":"","long":"Greutatea mai mică poate fi mai sensibilă la vânt, dar nu este varianta corectă.","warn":""}]},{"number":"#6","text":"804: Întreţinerea ULM ului se face:","short":"Varianta A este un text incomplet; răspunsul logic este că întreținerea se face înainte de fiecare zbor.","long":"Întrebarea are o eroare: varianta A repetă enunțul, fără să indice o opțiune. Răspunsul rezonabil, conform practicii de întreținere, este că verificarea se face înainte de fiecare zbor. Reține principiul, nu formularea.","answers":[{"text":"Întreţinerea ULM ului se face:","correct":true,"short":"Întreținerea ULM-ului se face: (text incomplet).","long":"Textul este incomplet și nu poate fi evaluat; reține principiul din răspunsul logic.","warn":"Textul este incomplet și nu poate fi evaluat. Răspunsul corect este: întreținerea se face înainte de fiecare zbor."},{"text":"înainte de fiecare zbor","correct":false,"short":"","long":"Este răspunsul logic, potrivit practicii de întreținere.","warn":""},{"text":"doar după apariţia unei probleme","correct":false,"short":"Doar după apariția unei probleme.","long":"Întreținerea preventivă nu se face doar după probleme.","warn":""},{"text":"din timp în timp","correct":false,"short":"","long":"Întreținerea are intervale definite, nu aleatorii.","warn":""}]},{"number":"#7","text":"852: Ce rol are sistemul de suspensie (chingi + suspante) al aripii în performanțele de zbor?","short":"Sistemul de suspensie (chingi și suspante) distribuie uniform greutatea pilotului și a echipamentului.","long":"Suspantele și chingile leagă pilotul de aripă și transmit forțele. Ele distribuie greutatea pe toate celulele aripii. O distribuție bună asigură o aripă simetrică și previzibilă. Confortul și vizibilitatea nu sunt rolul principal.","answers":[{"text":"optimizează poziția pilotului pentru confort maxim","correct":false,"short":"","long":"Confortul este o consecință, nu rolul principal.","warn":""},{"text":"reduce consumul de combustibil","correct":false,"short":"","long":"Nu este rolul suspantelor.","warn":""},{"text":"distribuie uniform greutatea pilotului și echipamentului","correct":true,"short":"","long":"","warn":""},{"text":"îmbunătățește vizibilitatea în timpul zborului","correct":false,"short":"","long":"Nu este rolul suspantelor.","warn":""}]},{"number":"#8","text":"813: Ocolirea aerodromurilor în zbor VFR se execută obligatoriu la distanţe de cel puţin:","short":"Ocolirea aerodromurilor în zbor VFR se face la cel puțin 10 km în sectoarele de decolare și aterizare.","long":"Zborul VFR trebuie să evite zonele de trafic aerodromului, în special sectoarele de decolare și aterizare, pentru a nu intra în conflict cu aeronavele care aterizează sau decolează. Distanța de 10 km este cea corectă; verifică-o în reglementarea aplicabilă.","answers":[{"text":"10 km în sectoarele de decolare şi aterizare ale zonelor acestora","correct":true,"short":"10 km în sectoarele de decolare și aterizare ale zonelor acestora.","long":"","warn":""},{"text":"15 km în sectoarele de decolare şi aterizare ale zonelor acestora","correct":false,"short":"15 km în sectoarele de decolare și aterizare ale zonelor acestora.","long":"Nu este varianta corectă.","warn":""},{"text":"3 km în sectoarele de decolare şi aterizare ale zonelor acestora","correct":false,"short":"3 km în sectoarele de decolare și aterizare ale zonelor acestora.","long":"Distanța este prea mică pentru varianta corectă.","warn":""},{"text":"5 km în sectoarele de decolare şi aterizare ale zonelor acestora","correct":false,"short":"5 km în sectoarele de decolare și aterizare ale zonelor acestora.","long":"Nu este varianta corectă.","warn":""}]},{"number":"#9","text":"872: Cum afectează umiditatea ridicată eficiența amestecului aer-combustibil?","short":"Umiditatea ridicată poate reduce eficiența combustibilului, prin modificarea amestecului aer-combustibil.","long":"Umiditatea modifică densitatea și oxigenul disponibil în aerul de admisie. Amestecul devine mai puțin eficient, iar motorul pierde o parte din putere sau consumă mai mult. Efectul este moderat, dar real.","answers":[{"text":"umiditatea ridicată îmbunătățește eficiența combustibilului","correct":false,"short":"","long":"Nu este efectul principal.","warn":""},{"text":"umiditatea ridicată poate crește consumul de combustibil","correct":false,"short":"","long":"Varianta este apropiată, dar varianta corectă este formularea cu reducerea eficienței.","warn":""},{"text":"umiditatea nu influențează eficiența combustibilului","correct":false,"short":"","long":"Influențează.","warn":""},{"text":"umiditatea ridicată poate reduce eficiența combustibilului prin modificarea amestecului aer-combustibil","correct":true,"short":"","long":"","warn":""}]},{"number":"#10","text":"846: Cum poate influența o presiune atmosferică scăzută performanța zborului?","short":"O presiune atmosferică scăzută reduce puterea motorului și portanța aripii.","long":"La presiune scăzută aerul este mai rarefiat, deci motorul primește mai puțin oxigen, iar aripa produce mai puțină portanță la aceeași viteză. Efectul se simte mai ales la altitudine și pe vreme caldă.","answers":[{"text":"influențează fluxul de aer în jurul elicei și aripii","correct":false,"short":"","long":"Este un efect real, dar varianta corectă este reducerea puterii și a portanței.","warn":""},{"text":"afectează capacitatea de ascensiune în curenți de aer ascendenți","correct":false,"short":"","long":"Efectul este mai larg, nu varianta principală.","warn":""},{"text":"presiunea scăzută poate modifica punctul de aprindere al combustibil","correct":false,"short":"Presiunea scăzută poate modifica punctul de aprindere al combustibilului.","long":"Nu este efectul principal.","warn":""},{"text":"reduce puterea motorului și portanța aripii","correct":true,"short":"","long":"","warn":""}]},{"number":"#11","text":"792: În timpul alimentării cu combustibil vărsați o cantitate însemnată de benzină pe seleta motoparapantei. Cum procedați în acest caz?","short":"Dacă vărsați benzină pe seletă, anulați zborul și curățați seleta cu detergenți care nu afectează materialul.","long":"Benzina poate slăbi țesătura și cusăturile, deci poate afecta rezistența seletei. Trebuie curățată cu produse compatibile cu materialul și lăsată să se usuce complet. Decolarea după scurgere este interzisă.","answers":[{"text":"anulați zborul și încercați să degresați/ spalați seleta cu detergenți ce nu afectează materialele din care este construită seleta, încât benzina poate afecta drastic rezistența și integritatea acesteia","correct":true,"short":"Anulați zborul și încercați să degresați/spălați seleta cu detergenți care nu afectează materialele.","long":"","warn":""},{"text":"așteptați 10 minute să se evapore apoi continuați cu procedura de decolare","correct":false,"short":"Așteptați 10 minute să se evapore, apoi continuați cu procedura de decolare.","long":"Evaporarea nu elimină riscul pentru material.","warn":""},{"text":"instalați o folie de protecție o folie de protecție între pilot și seletă să nu vă murdăriți","correct":false,"short":"Instalați o folie de protecție între pilot și seletă.","long":"Folia nu rezolvă problema.","warn":""},{"text":"demontăm seleta și o lăsăm la soare câteva zile până se evapora benzina absorbită de materialul acesteia","correct":false,"short":"Demontăm seleta și o lăsăm la soare câteva zile.","long":"Soarele poate degrada materialul.","warn":""}]},{"number":"#12","text":"807: Care este motivul principal pentru care se caută a se decola cu vânt de faţă?","short":"Decolăm cu vânt de față ca să reducem viteza la sol și distanța de decolare.","long":"Cu vânt de față, aripa atinge viteza de decolare față de aer cu o viteză la sol mai mică, deci pe o distanță mai scurtă. Viteza indicată și TAS nu sunt motivul principal.","answers":[{"text":"ca să reducem viteza indicată şi astfel să reducem distanţa de decolare","correct":false,"short":"Ca să reducem viteza indicată și astfel să reducem distanța de decolare.","long":"Viteza indicată nu este motivul principal.","warn":""},{"text":"ca să reducem viteza de angajare","correct":false,"short":"","long":"Viteza de angajare nu este motivul principal.","warn":""},{"text":"ca să reducem TAS","correct":false,"short":"","long":"TAS nu este motivul principal.","warn":""},{"text":"ca să reducem viteza la sol şi astfel să reducem distanta de decolare","correct":true,"short":"Ca să reducem viteza la sol și astfel să reducem distanța de decolare.","long":"","warn":""}]},{"number":"#13","text":"817: Aeronavele care zboară în spaţiul aerian necontrolat sunt obligate să respecte înălţimile minime de siguranţa publicate în:","short":"Înălțimile minime de siguranță în spațiul aerian necontrolat sunt publicate în RACR-RA.","long":"RACR-RA (Regulile aerului) stabilește regulile de zbor, inclusiv înălțimile minime. Codul Aerian este actul general, AIP România publică informații aeronautice, iar regimul de zbor are alt conținut.","answers":[{"text":"Codul Aerian","correct":false,"short":"","long":"Codul Aerian este actul general, nu sursa înălțimilor minime.","warn":""},{"text":"RACR-RA","correct":true,"short":"","long":"","warn":""},{"text":"Regimul de zbor în spaţial aerian al României","correct":false,"short":"Regimul de zbor în spațiul aerian al României.","long":"Nu este denumirea documentului.","warn":""},{"text":"AIP România","correct":false,"short":"","long":"AIP publică informații, dar varianta corectă este RACR-RA.","warn":""}]},{"number":"#14","text":"853: Cum influențează poziția centrului de greutate stabilitatea în zbor?","short":"Un centru de greutate prea în față poate face zborul instabil.","long":"Dacă centrul de greutate este prea în față, aripa tinde să se înclineze în față, iar stabilitatea și comportamentul la comenzi se schimbă. Un centru prea în spate are efecte opuse. Poziția corectă este cea din manual.","answers":[{"text":"un centru de greutate prea în față poate face zborul instabil","correct":true,"short":"","long":"","warn":""},{"text":"un centru de greutate în poziția corectă nu influențează stabilitatea","correct":false,"short":"","long":"Influențează.","warn":""},{"text":"un centru de greutate prea în față reduce viteza de zbor","correct":false,"short":"","long":"Efectul principal este instabilitatea.","warn":""},{"text":"un centru de greutate prea în spate îmbunătățește manevrabilitatea","correct":false,"short":"","long":"Nu este efectul corect.","warn":""}]},{"number":"#15","text":"814: Când este necesară depunerea unui plan de zbor:","short":"Planul de zbor trebuie depus cel puțin atunci când zbori în spațiu controlat ATC.","long":"Zborul în spațiu controlat cere, cel puțin, depunerea planului de zbor, pentru ca ATC să știe intențiile. Alte zboruri pot cere plan în funcție de reglementare. Zborul în raid în clasa C și afară din zona de control nu este regula generală.","answers":[{"text":"numai atunci când se zboară în raid în spațiu aerian de clasă C","correct":false,"short":"","long":"Nu este regula generală.","warn":""},{"text":"cel puțin atunci când se efectuează zboruri în spațiu controlat ATC","correct":true,"short":"","long":"","warn":""},{"text":"numai când se efectuează zboruri în afara zonei de control al aeroportului/aerodromului","correct":false,"short":"Numai când se efectuează zboruri în afara zonei de control al aeroportului.","long":"Nu este regula generală.","warn":""},{"text":"nu este necesară depunerea pentru ULM","correct":false,"short":"","long":"Depunerea poate fi cerută.","warn":""}]},{"number":"#16","text":"878: Ce măsuri trebuie luate pentru a asigura o aterizare sigură în condiții de vânt lateral?","short":"Pentru o aterizare sigură cu vânt lateral ajustezi direcția de aterizare, pentru a compensa vântul lateral.","long":"Vântul lateral deviază aeronava de la traiect. Pilotul corectează capul, astfel încât traiectul față de sol să fie aliniat cu pista. Reducerea vitezei sau aterizarea fără ajustare nu compensează vântul.","answers":[{"text":"ajustați direcția de aterizare pentru a compensa vântul lateral","correct":true,"short":"","long":"","warn":""},{"text":"reduceți viteza de zbor înainte de aterizare","correct":false,"short":"","long":"Nu compensează vântul lateral.","warn":""},{"text":"asigurați-vă că aripa este complet deschisă înainte de aterizare","correct":false,"short":"","long":"Nu este măsura pentru vânt lateral.","warn":""},{"text":"aterizați fără a ajusta direcția","correct":false,"short":"","long":"Este periculos cu vânt lateral.","warn":""}]},{"number":"#17","text":"810: Care este ordinea de prioritate la aterizare:","short":"Ordinea de prioritate la aterizare este paraşuta, apoi planorul, apoi motoparapanta.","long":"Prioritatea la aterizare se stabilește după manevrabilitatea și viteza fiecărei categorii. Parașutistul are prioritate, apoi planorul, iar motoparapanta cedează. Ordinea este cea corectă.","answers":[{"text":"parașuta, motoparapanta, planor","correct":false,"short":"","long":"Motoparapanta trebuie să cedeze planorului.","warn":""},{"text":"paraşuta, planor, motoparapanta","correct":true,"short":"Parașuta, planor, motoparapanta.","long":"","warn":""},{"text":"în funcţie de intrarea în turul de pistă","correct":false,"short":"În funcție de intrarea în turul de pistă.","long":"Ordinea este dată de categorie, nu doar de intrare.","warn":""},{"text":"care este mai aproape de virajul “3”, cu traficul la vedere","correct":false,"short":"Care este mai aproape de virajul 3, cu traficul la vedere.","long":"Nu este regula de prioritate.","warn":""}]},{"number":"#18","text":"831: Ce măsuri de precauție trebuie luate atunci când zburați în apropierea zonei de munte?","short":"În zona de munte, trebuie să ai o altitudine suficient de mare pentru a evita rotoarele, în caz de vânt puternic.","long":"Rotoarele sunt turbulențe create de relief, mai ales sub vânt. Zborul la altitudine suficientă le evită. Coordonarea cu alte aeronave și harta topografică sunt și ele utile, dar varianta corectă este altitudinea.","answers":[{"text":"să coordonați zborul cu alte aeronave pentru a evita coliziuni","correct":false,"short":"","long":"Este utilă, dar varianta corectă este altitudinea.","warn":""},{"text":"să analizați detaliat harta topografică pentru a identifica zonele de risc","correct":false,"short":"","long":"Este utilă, dar varianta corectă este altitudinea.","warn":""},{"text":"să aveți o altitudine suficient de mare pentru a evita rotoarele în caz de vânt puternic","correct":true,"short":"","long":"","warn":""},{"text":"să zburați doar pe partea opusă vântului pentru a menține stabilitatea","correct":false,"short":"","long":"Nu este regula corectă.","warn":""}]},{"number":"#19","text":"875: Ce trebuie să faceți dacă observați o pierdere bruscă de putere a motorului în timpul zborului?","short":"Dacă observi o pierdere bruscă de putere a motorului, aterizezi imediat pentru a verifica și a repara motorul.","long":"O pierdere bruscă de putere poate fi cauzată de defecte serioase. Trebuie să cauți un loc sigur și să aterizezi cât mai curând, fără să încerci să repari în zbor. Ajustarea aripii sau reducerea turației nu rezolvă problema.","answers":[{"text":"ajustați poziția aripii pentru a compensa pierderea de putere","correct":false,"short":"","long":"Nu compensează pierderea de putere.","warn":""},{"text":"monitorizați comportamentul motorului și ajustați amestecul aer-combustibil","correct":false,"short":"","long":"Nu este procedura sigură.","warn":""},{"text":"aterizați imediat pentru a verifica și repara motorul","correct":true,"short":"","long":"","warn":""},{"text":"reduceți turația motorului și continuați zborul","correct":false,"short":"","long":"Nu este procedura sigură.","warn":""}]},{"number":"#20","text":"835: Cum se manifestă un stall aerodinamic și care sunt consecințele acestuia?","short":"La stall aerodinamic, aripa își pierde portanța și începe să coboare brusc.","long":"Stallul apare când unghiul de atac depășește limita, iar curgerea aerului se desprinde de pe extrados. Aripa pierde portanța și coboară. Revenirea se face prin reducerea unghiului de atac, conform procedurii.","answers":[{"text":"aripa poate intra într-o vrie incontrolabilă","correct":false,"short":"","long":"Vrie este un efect posibil, dar nu definiția stallului.","warn":""},{"text":"motorul poate experimenta pierderi temporare de putere","correct":false,"short":"","long":"Nu este consecința stallului.","warn":""},{"text":"aripa își pierde portanța și începe să coboare brusc","correct":true,"short":"","long":"","warn":""},{"text":"aripa poate suferi deformări structurale în timpul stall-ului","correct":false,"short":"","long":"Nu este consecința principală.","warn":""}]},{"number":"#21","text":"791: La verificarea voalurii înainte de decolare observați o ruptură de 2-3 cm la unul din capetele parapantei:","short":"Dacă observi o ruptură de 2–3 cm la voal înainte de decolare, renunți la decolare, repari ruptura și verifici întreaga voală.","long":"Rupturile se propagă sub sarcină. Decolarea cu o ruptură, chiar mică, poate duce la deteriorare în zbor. Trebuie reparată și întreaga voală inspectată amănunțit. Banda izolatoare nu este reparația corectă.","answers":[{"text":"trebuie să achizitionați o altă parapantă încât aceasta nu mai este sigură","correct":false,"short":"Trebuie să achiziționați o altă parapantă, încât aceasta nu mai este sigură.","long":"Nu este necesar; se repară.","warn":""},{"text":"renunțați la decolare și efectuați reparația rupturii și o inspecție amănunțită a întregii voaluri","correct":true,"short":"","long":"","warn":""},{"text":"decolați încât acea ruptură nu este suficient de mare încât să afecteze performanțele de zbor ale aripii","correct":false,"short":"Decolați, încât acea ruptură nu este suficient de mare încât să afecteze performanțele.","long":"Nu este sigur, chiar și o ruptură mică se propagă.","warn":""},{"text":"încercați să o reparați cu bandă izolatoare electrică încât e suficient pentru 1-2 zboruri","correct":false,"short":"Încercați să o reparați cu bandă izolatoare electrică, încât este suficientă pentru 1–2 zboruri.","long":"Banda izolatoare nu este reparația corectă.","warn":""}]},{"number":"#22","text":"865: Cum afectează viteza vântului decolarea unei motoparapante?","short":"Vântul de față reduce distanța de decolare necesară.","long":"Cu vânt de față, aripa atinge viteza de decolare față de aer cu o viteză la sol mai mică, deci decolarea este mai scurtă. Vântul lateral nu scurtează decolarea, iar vântul de față nu o mărește.","answers":[{"text":"vântul lateral reduce distanța de decolare","correct":false,"short":"","long":"Vântul lateral nu scurtează decolarea.","warn":""},{"text":"vântul de față mărește distanța de decolare necesară","correct":false,"short":"","long":"Este opusul efectului.","warn":""},{"text":"viteza vântului nu influențează decolarea","correct":false,"short":"","long":"Influențează.","warn":""},{"text":"vântul de față reduce distanța de decolare necesară","correct":true,"short":"","long":"","warn":""}]},{"number":"#23","text":"840: Cum poate influența zborul o presiune scăzută în rezervorul de combustibil?","short":"O presiune scăzută în rezervorul de combustibil poate duce la pierderea puterii și chiar la oprirea motorului.","long":"Dacă presiunea combustibilului scade, motorul nu primește suficient combustibil și poate pierde putere sau se poate opri. Trebuie verificată linia de combustibil și, dacă e nevoie, aterizat.","answers":[{"text":"presiunea scăzută poate afecta consistența amestecului aer-combustibil","correct":false,"short":"","long":"Este un efect, dar nu cel corect.","warn":""},{"text":"poate genera fluctuații în turația motorului","correct":false,"short":"","long":"Este un efect, dar nu cel corect.","warn":""},{"text":"motorul poate pierde putere și se poate opri","correct":true,"short":"","long":"","warn":""},{"text":"poate provoca suprasolicitarea sistemului de injecție a combustibilului","correct":false,"short":"","long":"Nu este efectul principal.","warn":""}]},{"number":"#24","text":"873: Ce măsuri trebuie luate pentru a preveni deteriorarea aripii în timpul transportului?","short":"Pentru a preveni deteriorarea aripii în transport, o împachetezi cu grijă și folosești huse de protecție.","long":"Aripa trebuie protejată de lovituri, de umezeală și de murdărie. Huse și împachetare corectă evită îndoirea, frecarea și pătrunderea apei. Expunerea la soare și umiditatea sunt dăunătoare.","answers":[{"text":"transportați aripa fără protecție pentru a economisi spațiu","correct":false,"short":"","long":"Este periculos pentru material.","warn":""},{"text":"asigurați-vă că aripa este expusă la soare pentru a preveni mucegaiul","correct":false,"short":"","long":"Soarele degradează materialul.","warn":""},{"text":"depozitați aripa într-un loc umed pentru a menține flexibilitatea materialului","correct":false,"short":"","long":"Umezeala favorizează mucegaiul.","warn":""},{"text":"împachetați aripa cu grijă și utilizați huse de protecție","correct":true,"short":"","long":"","warn":""}]},{"number":"#25","text":"809: În România zborul VFR în zona de aerodrom se admite de la:","short":"În România, zborul VFR în zona aerodromului se admite de la răsăritul până la apusul soarelui, cu orele din AIP, după ora aerodromului.","long":"Orele de zbor VFR sunt cele de la răsărit până la apus, luate din AIP după ora locală a aerodromului unde se desfășoară zborul. Ora GPS și ora Bucureștiului nu sunt referința corectă.","answers":[{"text":"daca pista e luminata nu exista reglementari","correct":false,"short":"Dacă pista e luminată, nu există reglementări.","long":"Reglementările există.","warn":""},{"text":"răsăritul soarelui până la apus orele fiind luate din AIP după ora Bucureşti","correct":false,"short":"Răsăritul soarelui până la apus, orele fiind luate din AIP după ora Bucureștiului.","long":"Referința este ora aerodromului, nu a Bucureștiului.","warn":""},{"text":"30 min după răsărit până la 30 min înainte de apus după ora Bucureşti","correct":false,"short":"30 min după răsărit până la 30 min înainte de apus, după ora Bucureștiului.","long":"Intervalul și referința sunt greșite.","warn":""},{"text":"răsăritul soarelui până la apus luate din AIP după ora aerodromului unde vă desfăşuraţi activitatea de zbor","correct":true,"short":"Răsăritul soarelui până la apus, luate din AIP după ora aerodromului unde vă desfășurați activitatea de zbor.","long":"","warn":""}]},{"number":"#26","text":"829: În ce condiții este recomandat să nu folosiți „speed bar-ul”?","short":"Speed bar-ul nu se folosește în condiții de turbulență puternică.","long":"În turbulență, speed bar-ul reduce stabilitatea, deci aripa devine mai sensibilă și mai greu de controlat. În turbulență se zboară cu viteză normală, cu trimul și comenzile în poziție neutră.","answers":[{"text":"în condiții de turbulență puternică","correct":true,"short":"","long":"","warn":""},{"text":"în timpul zborului la altitudine joasă","correct":false,"short":"","long":"Speed bar-ul nu este interzis în această situație.","warn":""},{"text":"în timpul aterizării","correct":false,"short":"","long":"Nu este regula generală.","warn":""},{"text":"în timpul decolării","correct":false,"short":"","long":"Nu este regula generală.","warn":""}]},{"number":"#27","text":"870: Ce trebuie să verificați înainte de a începe procedura de decolare?","short":"Înainte de decolare verifici direcția și intensitatea vântului, funcționarea motorului și aripa.","long":"Verificarea preliminară acoperă vântul (pentru alegerea direcției), motorul (dacă funcționează corect) și aripa (dacă este întinsă și corect conectată). Verificarea doar a frânelor sau a combustibilului nu este completă.","answers":[{"text":"doar alinierea aripii cu direcția vântului","correct":false,"short":"","long":"Verificarea este incompletă.","warn":""},{"text":"direcția și intensitatea vântului, funcționarea motorului și aripa","correct":true,"short":"","long":"","warn":""},{"text":"doar funcționarea sistemului de frânare","correct":false,"short":"","long":"Verificarea este incompletă.","warn":""},{"text":"doar nivelul combustibilului","correct":false,"short":"","long":"Verificarea este incompletă.","warn":""}]},{"number":"#28","text":"787: În timpul încălzirii motorului la sol auziți un zgomot deosebit, nou, metalic, ce apare la turație mare:","short":"Dacă auzi un zgomot metalic nou la turație mare, anulezi decolarea și faci o inspecție completă a defectului.","long":"Un zgomot nou și metalic indică un defect la motor, transmisie sau elice. Decolarea cu un defect poate duce la pierderea puterii în zbor. Trebuie anulată decolarea și defectul identificat și remediat.","answers":[{"text":"decolați încât sunteți un pilot ușor și nu aveți nevoie de turație/ puterea maximă a motorului","correct":false,"short":"Decolați, încât sunteți un pilot ușor și nu aveți nevoie de turația/puterea maximă.","long":"Este periculos.","warn":""},{"text":"anulați decolarea și efectuați o inspecție complexă în căutarea și remedierea defectului","correct":true,"short":"","long":"","warn":""},{"text":"decolați și sperați că motorul va funcționa pentru încă 2 ore încât să puteți efectua zborul planificat","correct":false,"short":"Decolați și sperați că motorul va funcționa pentru încă 2 ore.","long":"Este periculos.","warn":""},{"text":"anulați decolarea și așteptați 10 min sperând că zgomotul va dispărea","correct":false,"short":"Anulați decolarea și așteptați 10 minute sperând că zgomotul va dispărea.","long":"Zgomotul nu dispare de la sine.","warn":""}]},{"number":"#29","text":"790: În timpul zborului observați că uneia din comenzi i-a dispărut magnetul/ capsa și nu mai poate fi prinsă pe chingă:","short":"Dacă ai pierdut un magnet sau o capsă de la o comandă, îți continui zborul prudent, ținând mânerul în mână până la at
