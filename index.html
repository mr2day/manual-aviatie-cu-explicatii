 impun acest lucru, dispare orientarea și zborul se poate face doar după IFR.","long":"Toate aceste răspunsuri sunt corecte: reglementările interzic zborul în nor pentru ULM, pilotul își pierde orientarea vizuală, iar zborul în nor este zbor instrumental (IFR).","answers":[{"text":"reglementările impun acest lucru","correct":false,"short":"","long":"Este corect, dar nu singurul.","warn":""},{"text":"acest zbor poate efectuat doar după regulile IFR","correct":false,"short":"Acest zbor poate fi efectuat doar după regulile IFR.","long":"Este corect, dar nu singurul.","warn":""},{"text":"dispare orientarea","correct":false,"short":"","long":"Este corect, dar nu singurul.","warn":""},{"text":"toate răspunsurile sunt corecte","correct":true,"short":"","long":"","warn":""}]},{"number":"#91","text":"1074: Cum poate fi prevenită pierderea auzului cauzată de zgomotul puternic în aviație?","short":"Pierderea auzului cauzată de zgomotul puternic se previne prin căști antifonice sau căști de zbor.","long":"Căștile antifonice și de zbor reduc zgomotul care ajunge la ureche. Dopurile de bumbac sunt insuficiente, iar creșterea volumului sonor agravează problema.","answers":[{"text":"Utilizarea de dopuri de urechi din bumbac","correct":false,"short":"","long":"Protecția este insuficientă.","warn":""},{"text":"Evitarea consumului de alimente bogate în zahăr","correct":false,"short":"","long":"Nu are legătură cu auzul.","warn":""},{"text":"Folosirea căștilor antifonice sau a căștilor de zbor","correct":true,"short":"","long":"","warn":""},{"text":"Creșterea volumului sonor în cabină","correct":false,"short":"","long":"Agravează problema.","warn":""}]},{"number":"#92","text":"1050: Cu toate că un pilot deține un certificat medical valabil, cine decide dacă acesta este apt pentru un zbor?","short":"Pilotul decide dacă este apt pentru zbor, chiar dacă are un certificat medical valabil.","long":"Certificatul medical confirmă aptitudinea generală, dar pilotul evaluează zilnic starea sa: somn, stres, boală sau medicamente. Decizia finală de a zbura este a pilotului.","answers":[{"text":"Pilotul","correct":true,"short":"","long":"","warn":""},{"text":"Un examinator medical","correct":false,"short":"","long":"Emite certificatul, nu decide zborul zilnic.","warn":""},{"text":"A.A.C.R.","correct":false,"short":"","long":"Emite autorizațiile, nu decide zborul zilnic.","warn":""},{"text":"Operatorul aerian pentru care lucrează","correct":false,"short":"","long":"Nu decide zborul zilnic.","warn":""}]},{"number":"#93","text":"1072: Ce rol joacă trompa lui Eustache în urechea medie?","short":"Trompa lui Eustache echilibrează presiunea dintre urechea medie și atmosfera exterioară.","long":"Trompa lui Eustache leagă urechea medie de nazofaringe și se deschide la deglutiție, permițând egalizarea presiunii. Ea nu conduce sunetele, nu produce cerumen și nu reglează temperatura.","answers":[{"text":"Echilibrează presiunea dintre urechea medie și atmosfera exterioară","correct":true,"short":"","long":"","warn":""},{"text":"Conduce sunetele de la urechea externă la urechea internă","correct":false,"short":"","long":"Este rolul oscioarelor urechii medii.","warn":""},{"text":"Produce cerumen pentru protecția urechii","correct":false,"short":"","long":"Nu este rolul trompei.","warn":""},{"text":"Reglează temperatura în urechea internă","correct":false,"short":"","long":"Nu este rolul trompei.","warn":""}]},{"number":"#94","text":"1012: În ultimele zile nu ați dormit suficient, vă simțiți obosit și fără putere:","short":"Dacă nu ai dormit suficient și te simți obosit, renunți la zbor până revii la o formă fizică și psihică apte.","long":"Oboseala afectează atenția și reacțiile. Zborul acrobatic nu te readuce în formă, iar zborul pentru relaxare sau cu ajutorul prietenilor nu este soluție. Renunțarea este decizia corectă.","answers":[{"text":"efectuați un zbor acrobatic încât adrenalina o sa va repuna pe picioare","correct":false,"short":"Efectuați un zbor acrobatic, încât adrenalina o să vă repună pe picioare.","long":"Este periculos.","warn":""},{"text":"renuntați la zbor pentru următoarea perioadă până va reveniți la o formă fizica/ psihică apta pentru zbor","correct":true,"short":"Renunțați la zbor pentru următoarea perioadă până reveniți la o formă fizică/psihică aptă pentru zbor.","long":"","warn":""},{"text":"mergeți la zbor încat este o activitate relaxantă","correct":false,"short":"Mergeți la zbor, încât este o activitate relaxantă.","long":"Oboseala face zborul periculos.","warn":""},{"text":"rugați câțiva prieteni să vă ajute să decolați încât singur nu va simțiți în stare","correct":false,"short":"Rugați câțiva prieteni să vă ajute să decolați.","long":"Nu este soluție sigură.","warn":""}]},{"number":"#95","text":"1022: Care este unul dintre simptomele inițiale ale hipoxiei?","short":"Unul dintre simptomele inițiale ale hipoxiei este senzația de confort și euforie.","long":"La început, hipoxia dă senzație de bine și euforie, ceea ce face pilotul să nu își dea seama de pericol. Pierderea cunoștinței, vomă și vălul gri apar mai târziu.","answers":[{"text":"Pierderea cunoștinței","correct":false,"short":"","long":"Apare mai târziu.","warn":""},{"text":"Senzație de confort și euforie","correct":true,"short":"","long":"","warn":""},{"text":"Stare de vomă","correct":false,"short":"","long":"Apare mai târziu.","warn":""},{"text":"Vălul gri","correct":false,"short":"","long":"Apare mai târziu.","warn":""}]},{"number":"#96","text":"1032: Cum se poate preveni răul de mișcare în timpul zborului?","short":"Răul de mișcare se previne evitând manevrele cu factor de sarcină mare.","long":"Manevrele bruște și accelerațiile mari amplifică conflictul dintre ochi și urechea internă. Evitarea lor reduce răul de mișcare. Zborul la altitudini mari și echipamentul special nu sunt măsurile principale.","answers":[{"text":"Zburând la altitudini foarte mari","correct":false,"short":"","long":"Nu previne răul de mișcare.","warn":""},{"text":"Consumând cantități mari de apă","correct":false,"short":"","long":"Nu previne răul de mișcare.","warn":""},{"text":"Evitând manevrele cu factor de sarcină mare","correct":true,"short":"","long":"","warn":""},{"text":"Folosind un echipament special","correct":false,"short":"","long":"Nu este măsura principală.","warn":""}]},{"number":"#97","text":"1089: Care sunt principalele cauze ale stresului în aviație?","short":"Principala cauză a stresului în aviație este suprasolicitarea individului și incapacitatea de răspuns adaptiv la agenții din mediu.","long":"Stresul apare când cerințele depășesc resursele pilotului. Mediul (zgomot, vibrații, meteo) și solicitările îl pot declanșa. Comunicarea, echipamentul sau alimentația sunt factori secundari.","answers":[{"text":"Suprasolicitarea individului și incapacitatea de răspuns adaptiv la agentii din mediul înconjurător","correct":true,"short":"Suprasolicitarea individului și incapacitatea de răspuns adaptiv la agenții din mediul înconjurător.","long":"","warn":""},{"text":"Comunicarea ineficientă cu controlul de trafic aerian","correct":false,"short":"","long":"Este un factor secundar.","warn":""},{"text":"Utilizarea necorespunzătoare a echipamentului de zbor","correct":false,"short":"","long":"Este un factor secundar.","warn":""},{"text":"Consumul excesiv de alimente înainte de zbor","correct":false,"short":"","long":"Nu este factorul principal.","warn":""}]},{"number":"#98","text":"1055: Cum se poate reduce răul de mișcare?","short":"Răul de mișcare se reduce privind în afara aeronavei.","long":"Privitul spre orizont ajută creierul să își corecteze percepția, deoarece informațiile vizuale și vestibulare se potrivesc. Privitul în cabină sau respirația într-o pungă nu sunt metode corecte.","answers":[{"text":"Privind în afara aeronavei","correct":true,"short":"","long":"","warn":""},{"text":"Respirând într-o pungă de hârtie","correct":false,"short":"","long":"Nu este metoda corectă.","warn":""},{"text":"În viraje nu trebuie depășită o înclinare mai mare de 5 grade","correct":false,"short":"","long":"Nu este regula din explicație.","warn":""},{"text":"Privind în cabina aeronavei","correct":false,"short":"","long":"Agravează răul de mișcare.","warn":""}]},{"number":"#99","text":"1034: Ce trebuie făcut în cazul unei arsuri de gradul I?","short":"Pentru o arsură de gradul I se răcește zona afectată cu apă rece.","long":"Răcirea cu apă rece, timp de cel puțin 10–20 de minute, reduce durerea și inflamația. Pătura groasă, untul și ruperea bășicilor agravează arsura.","answers":[{"text":"Acoperirea arsurii cu o pătură groasă","correct":false,"short":"","long":"Reține căldura și agravează.","warn":""},{"text":"Aplicarea de unt sau ulei pe arsură","correct":false,"short":"","long":"Agravează arsura.","warn":""},{"text":"Răcirea zonei afectate cu apă rece","correct":true,"short":"","long":"","warn":""},{"text":"Ruperea bășicilor formate","correct":false,"short":"","long":"Crește riscul de infecție.","warn":""}]},{"number":"#100","text":"1073: Care sunt efectele zgomotului excesiv asupra auzului?","short":"Zgomotul excesiv produce pierderea sensibilității celulelor ciliate din cohlee.","long":"Zgomotul puternic și prelungit distruge celulele ciliate din cohlee, care transformă sunetul în semnal nervos. Pierderea este ireversibilă, de regulă. Zgomotul nu crește acuitatea și nu îmbunătățește echilibrul.","answers":[{"text":"Pierderea senzitivității cililor din cochlee","correct":true,"short":"Pierderea senzitivității celulelor ciliate din cohlee.","long":"","warn":""},{"text":"Creșterea acuității auditive","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"Reducerea capacității de concentrare","correct":false,"short":"","long":"Este un efect, dar nu varianta corectă.","warn":""},{"text":"Îmbunătățirea echilibrului","correct":false,"short":"","long":"Nu este efectul.","warn":""}]},{"number":"#101","text":"1059: Cum trebuie așezată victima unui accident care prezintă hemoragie externă?","short":"Victima cu hemoragie externă se așază astfel încât rana să fie mai sus decât nivelul corpului.","long":"Poziția mai sus reduce fluxul de sânge spre rană, deci sângerarea scade. Se aplică și presiune directă pe rană. Poziția cu zona mai jos sau picioarele mai sus decât capul nu este cea corectă pentru rană.","answers":[{"text":"Astfel încât zona să fie mai jos decât nivelul corpului","correct":false,"short":"","long":"Crește sângerarea.","warn":""},{"text":"Astfel încât să nu pătrundă corpuri străine în rană","correct":false,"short":"","long":"Este important, dar nu este poziția corectă.","warn":""},{"text":"Cu picioarele mai sus decât nivelul capului","correct":false,"short":"","long":"Nu este poziția pentru rană.","warn":""},{"text":"Astfel încât rana să fie mai sus decât nivelul corpului","correct":true,"short":"","long":"","warn":""}]},{"number":"#102","text":"1052: Ce măsuri se iau în cazul victimelor cu fracturi de claviculă (umărul victimei este deplasat ușor înainte și în jos)?","short":"La fractura de claviculă, brațul victimei se suspendă într-o eșarfă sau o chingă legată de gât.","long":"Suspendarea brațului sprijină clavicula și reduce mișcarea și durerea. Aducerea umărului în poziție normală, culcatul pe spate sau pe burtă nu sunt măsurile corecte.","answers":[{"text":"Aduceți umărul în poziția normală","correct":false,"short":"","long":"Mișcarea poate agrava fractura.","warn":""},{"text":"Suspendați brațul într-o eșarfă sau o chingă legată de gât","correct":true,"short":"","long":"","warn":""},{"text":"Culcați victima pe spate","correct":false,"short":"","long":"Nu este măsura specifică.","warn":""},{"text":"Culcați victima pe burtă","correct":false,"short":"","long":"Nu este măsura specifică.","warn":""}]},{"number":"#103","text":"1015: La efectuarea unui viraj mai strâns simțim că ne ia amețeala:","short":"Dacă simți amețeală într-un viraj strâns, mărești raza virajului, eliberezi ușor și treptat comanda și revii la zborul rectiliniu.","long":"Virajul strâns crește factorul de sarcină și poate produce amețeală sau vălul negru. Mărirea razei, eliberarea treptată a comenzii și revenirea la zbor drept reduc sarcina și permit recuperarea.","answers":[{"text":"marim raza virajului eliberând ușor și treptat comanda aplicată revenind la un zbor rectiliniu și ne relaxam/ revenim","correct":true,"short":"Mărim raza virajului, eliberând ușor și treptat comanda aplicată, revenind la un zbor rectiliniu și ne relaxăm/revenim.","long":"","warn":""},{"text":"acționăm ambele frâne simultan puternic pentru a opri manevra pe loc","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"micșoram raza virajului astfel încât să mărim forța G, încât după un anumit nivel totul revine la normal","correct":false,"short":"Micșorăm raza virajului, astfel încât să mărim forța G.","long":"Agravează situația.","warn":""},{"text":"eliberăm comanda acționată și accelerăm motorul la maxim pentru a neutraliza efectul gravitațional","correct":false,"short":"Eliberăm comanda acționată și accelerăm motorul la maxim.","long":"Nu este procedura corectă.","warn":""}]},{"number":"#104","text":"1054: Pentru a putea desfășura activități de zbor în siguranță, pilotul trebuie să fie:","short":"Pentru a desfășura activități de zbor în siguranță, pilotul trebuie să fie într-o stare psiho-fizică bună.","long":"Starea psihică și fizică influențează atenția și reacțiile. Alcoolul, lipsa pregătirii sau lipsa paraşutei nu înlocuiesc o stare bună. Pilotul trebuie să fie apt.","answers":[{"text":"instructor sau examinator","correct":false,"short":"","long":"Nu este cerința de siguranță.","warn":""},{"text":"sub influența alcoolului","correct":false,"short":"","long":"Este interzis.","warn":""},{"text":"într-o stare psiho-fizică bună","correct":true,"short":"","long":"","warn":""},{"text":"pregătit să acționeze parașuta de siguranță","correct":false,"short":"","long":"Nu este cerința principală.","warn":""}]},{"number":"#105","text":"997: Ce este Hipoxia?","short":"Hipoxia este lipsa de oxigen datorată creșterii înălțimii.","long":"Aceeași explicație ca la întrebarea 13: la altitudine, oxigenul scade, deci țesuturile primesc mai puțin oxigen.","answers":[{"text":"lipsa de oxigen datorată creşterii înălţimii","correct":true,"short":"Lipsa de oxigen datorată creșterii înălțimii.","long":"","warn":""},{"text":"lipsa de oxigen datorată scăderii temperaturii exterioare","correct":false,"short":"","long":"Nu este definiția.","warn":""},{"text":"creșterea nivelului glicemiei din sânge","correct":false,"short":"","long":"Nu este definiția.","warn":""},{"text":"creşterea presiunii arteriale datorată creşterii înălţimii","correct":false,"short":"Creșterea presiunii arteriale datorată creșterii înălțimii.","long":"Nu este definiția.","warn":""}]},{"number":"#106","text":"1002: Pentru păstrarea întregii capacitaţi a aptitudinilor de zbor este interzis:","short":"Pentru păstrarea aptitudinilor de zbor este interzis consumul de alcool, oricare ar fi cantitatea și cauza.","long":"Alcoolul este interzis în orice cantitate înainte de zbor, pentru că afectează atenția și judecata. Odihna regulamentară și evitarea fumatului sunt măsuri pozitive sau reglementate.","answers":[{"text":"consumul de alcool în cantitate mare","correct":false,"short":"","long":"Alcoolul este interzis oricare ar fi cantitatea.","warn":""},{"text":"fumatul","correct":false,"short":"","long":"Nu este varianta corectă.","warn":""},{"text":"a nu se respecta programul de odihnă regulamentar, în timpul aşteptării pentru zbor precum şi în timpul zborului","correct":false,"short":"A nu se respecta programul de odihnă regulamentar.","long":"Este varianta contrară regulii.","warn":""},{"text":"consumul de alcool oricare ar fi cantitatea şi cauza","correct":true,"short":"Consumul de alcool oricare ar fi cantitatea și cauza.","long":"","warn":""}]},{"number":"#107","text":"1037: Ce trebuie făcut în cazul unei hemoragii externe?","short":"În caz de hemoragie externă se aplică presiune directă pe rană.","long":"Presiunea directă, cu un pansament sau cu o compresă curată, oprește sângerarea în cele mai multe cazuri. Garoul se folosește doar în situații extreme. Spălarea cu alcool și compresele reci nu opresc sângerarea.","answers":[{"text":"Aplicarea presiunii directe pe rană","correct":true,"short":"","long":"","warn":""},{"text":"Spălarea rănii cu alcool","correct":false,"short":"","long":"Nu oprește sângerarea.","warn":""},{"text":"Aplicarea unui garou imediat","correct":false,"short":"","long":"Garoul este pentru situații extreme, nu prima măsură.","warn":""},{"text":"Aplicarea unei comprese reci","correct":false,"short":"","long":"Nu oprește sângerarea.","warn":""}]},{"number":"#108","text":"1000: Suferiţi de o răceală cu blocare parţială a sinusurilor, aveţi nasul înfundat şi trebuie să zburaţi, ce veţi face?","short":"Dacă ai o răceală cu blocare parțială a sinusurilor și nasul înfundat, se recomandă să nu zbori.","long":"Sinusurile blocate nu se pot egaliza, deci pot apărea durere și barotrauma. Decongestionantul nu rezolvă întotdeauna problema și poate avea efecte secundare. Zborul se amână până la vindecare.","answers":[{"text":"zburaţi normal dar cu condiţia să nu urcaţi sau coborâţi cu rate mari","correct":false,"short":"Zburați normal, dar cu condiția să nu urcați sau coborâți cu rate mari.","long":"Riscul rămâne.","warn":""},{"text":"se recomandă să nu zburaţi","correct":true,"short":"Se recomandă să nu zburați.","long":"","warn":""},{"text":"puteţi zbura normal","correct":false,"short":"Puteți zbura normal.","long":"Este periculos.","warn":""},{"text":"luaţi un decongestionant cu o jumătate de ora înainte de zbor","correct":false,"short":"Luați un decongestionant cu o jumătate de oră înainte de zbor.","long":"Nu garantează egalizarea și poate avea efecte secundare.","warn":""}]},{"number":"#109","text":"1085: Cum influențează capacitatea mentală activitatea de pilotaj?","short":"Nivelul de inteligență și gândirea rapidă permit ieșirea din situații critice în mod adecvat.","long":"Capacitatea mentală ajută pilotul să analizeze rapid situația și să aleagă soluția corectă. Ea influențează deciziile, mai ales în situații neobișnuite. Nu se limitează la rutină.","answers":[{"text":"Îmbunătățește abilitățile fizice ale pilotului","correct":false,"short":"","long":"Este un alt aspect.","warn":""},{"text":"Este importantă doar în situații de rutină","correct":false,"short":"","long":"Este importantă și în situații critice.","warn":""},{"text":"Nivelul de inteligență și gândirea rapidă permit ieșirea din situații critice în mod adecvat","correct":true,"short":"","long":"","warn":""},{"text":"Nu are impact semnificativ asupra deciziilor de pilotaj","correct":false,"short":"","long":"Are impact.","warn":""}]},{"number":"#110","text":"1069: Care sunt efectele secundare ale consumului de droguri și medicamente asupra zborului?","short":"Drogurile și medicamentele pot provoca întârzierea reflexelor, reducerea capacității de decizie și creșterea oboselii.","long":"Efectele secundare ale medicamentelor și ale drogurilor afectează reflexele, judecata și energia. Pilotul nu trebuie să zboare sub influența lor, decât cu acordul medicului și după evaluare.","answers":[{"text":"Intârzierea reflexelor, reducerea capacității de decizie și creșterea oboselii","correct":true,"short":"Creșterea vigilenței și a clarității mentale.","long":"Efectul este opus.","warn":""},{"text":"Creșterea vigilenței și a clarității mentale","correct":false,"short":"Îmbunătățirea capacității de concentrare și a timpului de reacție.","long":"Efectul este opus.","warn":""},{"text":"Îmbunătățirea capacității de concentrare și a timpului de reacție","correct":false,"short":"Reducerea stresului și a anxietății în timpul zborului.","long":"Nu este efectul principal.","warn":""},{"text":"Reducerea stresului și a anxietății în timpul zborului","correct":false,"short":"Întârzierea reflexelor, reducerea capacității de decizie și creșterea oboselii.","long":"Este varianta corectă.","warn":""}]},{"number":"#111","text":"1079: Care sunt efectele conflictului între auz și văz în timpul zborului?","short":"Conflictul între auz și văz în zbor poate genera dezorientare spațială și iluzii false asupra poziției corpului.","long":"Când informațiile auzului, vederii și echilibrului nu se potrivesc, creierul poate interpreta greșit poziția aeronavei. Pilotul trebuie să se bazeze pe instrumente și pe repere sigure.","answers":[{"text":"Nu are efecte semnificative asupra orientării","correct":false,"short":"","long":"Are efecte.","warn":""},{"text":"Îmbunătățește percepția spațială și orientarea","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"Poate genera dezorientare spațială și iluzii false asupra poziției corpului","correct":true,"short":"","long":"","warn":""},{"text":"Crește acuratețea măsurării vitezei de zbor","correct":false,"short":"","long":"Nu este efectul.","warn":""}]},{"number":"#112","text":"985: Iniţial la apariţia hipoxiei se instalează:","short":"La apariția hipoxiei se instalează inițial o senzație de confort și de putere, care dă o stare euforică.","long":"Simptomul inițial al hipoxiei este euforia, care face pilotul să nu își dea seama de pericol. Vălul gri, plictiseala și starea de vomă apar mai târziu sau sunt simptome diferite.","answers":[{"text":"vălul gri","correct":false,"short":"","long":"Apare mai târziu.","warn":""},{"text":"plictiseala","correct":false,"short":"","long":"Nu este simptomul inițial.","warn":""},{"text":"o stare de vomă","correct":false,"short":"","long":"Apare mai târziu.","warn":""},{"text":"o senzaţie de confort, de putere care dă o stare euforică","correct":true,"short":"O senzație de confort, de putere care dă o stare euforică.","long":"","warn":""}]},{"number":"#113","text":"1068: De ce este periculoasă încărcarea stomacului înainte de zbor?","short":"Încărcarea stomacului înainte de zbor poate provoca disconfort digestiv și afectează capacitatea de concentrare.","long":"Digestia consumă energie și poate produce greață, somnolență și disconfort. Zborul pe stomacul încărcat reduce atenția. Se recomandă mese ușoare înainte de zbor.","answers":[{"text":"Crește riscul de deshidratare","correct":false,"short":"","long":"Nu este efectul principal.","warn":""},{"text":"Îmbunătățește absorbția oxigenului în sânge","correct":false,"short":"","long":"Nu este efectul.","warn":""},{"text":"Îmbunătățește performanțele fizice ale pilotului","correct":false,"short":"","long":"Nu este efectul.","warn":""},{"text":"Poate provoca disconfort digestiv și afectează capacitatea de concentrare a pilotului","correct":true,"short":"","long":"","warn":""}]},{"number":"#114","text":"1083: Cum influențează anticiparea activitatea de pilotaj?","short":"Anticiparea permite pilotului să prevadă evenimentele și să planifice acțiuni adecvate.","long":"Pilotul care anticipează vede din timp situațiile posibile și pregătește răspunsul. Anticiparea reduce riscul de eroare și de surpriză. Ea nu conduce la supraestimare.","answers":[{"text":"Crește riscul de eroare în timpul manevrelor complexe","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"Conduce la o supraestimare a capacităților pilotului","correct":false,"short":"","long":"Nu este efectul corect.","warn":""},{"text":"Permite pilotului să prevadă evenimentele și să planifice acțiuni adecvate","correct":true,"short":"","long":"","warn":""},{"text":"Reduce capacitatea de concentrare asupra sarcinilor curente","correct":false,"short":"","long":"Efectul este opus.","warn":""}]},{"number":"#115","text":"1026: La ce altitudine poate apărea „boala de înălțime”?","short":"Boala de altitudine poate apărea peste 3000 m.","long":"Peste 3000 m, scăderea oxigenului poate produce simptome de boală de altitudine: durere de cap, oboseală, greață. Sub 1000 m, la nivelul solului și între 1000 și 2000 m, simptomele sunt rare.","answers":[{"text":"Sub 1000 m","correct":false,"short":"","long":"Simptomele sunt rare.","warn":""},{"text":"Între 1000 și 2000 m","correct":false,"short":"","long":"Simptomele sunt rare.","warn":""},{"text":"Peste 3000 m","correct":true,"short":"","long":"","warn":""},{"text":"La nivelul solului","correct":false,"short":"","long":"Nu apare la nivelul solului.","warn":""}]},{"number":"#116","text":"1066: Care sunt cerințele medicale pentru a fi admis la zbor?","short":"Personalul navigant trebuie să dețină o licență medicală valabilă.","long":"Pentru a zbura, pilotul trebuie să aibă aptitudine medicală valabilă, confirmată prin certificat sau licență medicală. Vaccinarea, dieta și controalele la doi ani nu sunt cerințele principale.","answers":[{"text":"Personalul navigant trebuie să fie vaccinat împotriva gripei","correct":false,"short":"","long":"Nu este cerința principală.","warn":""},{"text":"Personalul navigant trebuie să aibă o dietă strict vegetariană","correct":false,"short":"","long":"Nu este cerință.","warn":""},{"text":"Personalul navigant trebuie să dețină o licență medicală valabilă","correct":true,"short":"","long":"","warn":""},{"text":"Personalul navigant trebuie să facă un control medical o dată la doi ani","correct":false,"short":"","long":"Intervalul depinde de vârstă și de clasa certificatului.","warn":""}]},{"number":"#117","text":"998: Acumulări semnificative de monoxid de carbon în organism pot genera:","short":"Acumulările de monoxid de carbon pot produce dureri de cap la nivelul frunții și al tâmplelor.","long":"Monoxidul de carbon se leagă de hemoglobină și reduce oxigenul din sânge. Simptomele includ durerea de cap, amețeala, greața. Euforia și anxietatea nu sunt semnele principale.","answers":[{"text":"senzaţie de pierdere a apetitului","correct":false,"short":"Senzație de pierdere a apetitului.","long":"Nu este simptomul principal.","warn":""},{"text":"dureri de cap la nivelul creierului parietal (în zona frunţii şi tâmplă)","correct":true,"short":"Dureri de cap la nivelul creierului parietal (în zona frunții și tâmplei).","long":"","warn":""},{"text":"o stare de euforie generala şi agitaţie","correct":false,"short":"O stare de euforie generală și agitație.","long":"Nu este simptomul principal.","warn":""},{"text":"stare de anxietate și neliniște","correct":false,"short":"","long":"Nu este simptomul principal.","warn":""}]},{"number":"#118","text":"1071: Care este funcția principală a analizatorului auditiv?","short":"Funcția principală a analizatorului auditiv este transformarea undelor sonore în semnale electrice interpretate de creier.","long":"Undele sonore intră în ureche și se transformă în impulsuri nervoase, care ajung la creier. Echilibrul, filtrarea zgomotelor și producerea sunetelor țin de alte funcții.","answers":[{"text":"Transformă undele sonore în semnale electrice care sunt interpretate de creier","correct":true,"short":"","long":"","warn":""},{"text":"Reglează echilibrul corporal","correct":false,"short":"","long":"Este funcția aparatului vestibular.","warn":""},{"text":"Filtrează zgomotele de fundal","correct":false,"short":"","long":"Nu este funcția principală.","warn":""},{"text":"Produce sunete pentru comunicare","correct":false,"short":"","long":"Nu este funcția analizatorului auditiv.","warn":""}]},{"number":"#119","text":"1090: Care sunt manifestările fizice ale stresului?","short":"Manifestările fizice ale stresului sunt dureri de cap, palpitații, dificultăți respiratorii și insomnii.","long":"Stresul activează sistemul nervos simpatic, ceea ce produce palpitații, tensiune musculară, dificultăți respiratorii și tulburări de somn. Creșterea energiei sau scăderea zgomotului nu sunt manifestările tipice.","answers":[{"text":"Îmbunătățirea memoriei și a timpului de reacție","correct":false,"short":"","long":"Nu este manifestarea fizică.","warn":""},{"text":"Dureri de cap, palpitatii, dificultati respiratorii, insomnii","correct":true,"short":"Dureri de cap, palpitații, dificultăți respiratorii, insomnii.","long":"","warn":""},{"text":"Creșterea energiei și a capacității de concentrare","correct":false,"short":"","long":"Nu este manifestarea tipică.","warn":""},{"text":"Scăderea nivelului de zgomot perceput","correct":false,"short":"","long":"Nu este manifestare a stresului.","warn":""}]}]},{"id":"08","title":"Proceduri operaționale","questions":[{"number":"#1","text":"502: Una dintre cele mai importante verificări înainte de pornirea paramotului în siguranță este:","short":"Înainte de pornire verifici ca legătura manetei de accelerație cu comanda carburatorului să permită revenirea la relanti.","long":"Dacă maneta nu revine la relanti, motorul poate rămâne turat sau nu poate fi oprit rapid. Este una dintre cele mai importante verificări de siguranță. Pornirea la turație mare, cantitatea de combustibil și anticiparea decolării nu sunt verificările esențiale.","answers":[{"text":"motorul să pornească la turație mare","correct":false,"short":"","long":"Pornirea la turație mare este periculoasă.","warn":""},{"text":"anticiparea traiectoriei de decolare","correct":false,"short":"","long":"Este pregătire, nu verificare de pornire.","warn":""},{"text":"în rezervor să se afle cel puțin 5 litri de combustibil","correct":false,"short":"","long":"Cantitatea nu este criteriul de siguranță.","warn":""},{"text":"legătura manetei de accelerație cu comanda carburatorului să permită revenirea la poziția de relanti","correct":true,"short":"","long":"","warn":""}]},{"number":"#2","text":"575: Ce măsuri de siguranță trebuie să iei înainte de un zbor cross country?","short":"Înainte de un zbor cross-country informezi pe cineva despre zbor și iei cu tine un telefon sau un dispozitiv de localizare prin satelit.","long":"Dacă ai un accident sau te pierzi, cineva trebuie să știe unde ești și unde trebuia să ajungi. Telefonul sau dispozitivul de localizare prin satelit permite salvarea. Harta digitală, costumul și frecvențele nu sunt măsurile de bază.","answers":[{"text":"Să informezi pe cineva despre zbor și să iei un telefon mobil sau un dispozitiv de localizare prin satelit","correct":true,"short":"","long":"","warn":""},{"text":"Să iei doar harta locală fără a avea o hartă digitală","correct":false,"short":"Să iei doar harta locală, fără a avea o hartă digitală.","long":"Nu este măsura principală de siguranță.","warn":""},{"text":"Să te asiguri că ai un costum de zbor adecvat","correct":false,"short":"","long":"Este util, dar nu este măsura principală.","warn":""},{"text":"Să verifici frecvențele radio locale","correct":false,"short":"","long":"Este util, dar nu este măsura principală.","warn":""}]},{"number":"#3","text":"513: Ce trebuie să faci dacă aripa începe să oscileze stanga-dreapta față de direcția înainte în timpul decolării?","short":"Dacă aripa începe să oscileze stânga-dreapta în timpul decolării, reduci viteza și corectezi direcția.","long":"Oscilația apare când aripa nu este bine aliniată sau când pilotul merge prea repede. Reducerea vitezei și corectarea direcției stabilizează aripa. Sărirea din scaun sau frânarea bruscă agravează situația.","answers":[{"text":"Să sări din scaun","correct":false,"short":"Să sari din scaun.","long":"Este periculos.","warn":""},{"text":"Să mărești viteza","correct":false,"short":"","long":"Agravează oscilația.","warn":""},{"text":"Să reduci viteza și să corectezi direcția","correct":true,"short":"","long":"","warn":""},{"text":"Să tragi de frânele parapantei","correct":false,"short":"","long":"Frânarea bruscă poate agrava situația.","warn":""}]},{"number":"#4","text":"473: Suntem începători și suntem invitați la un eveniment de zbor unde sunt mai multi piloți și invitați, cum vom proceda pentru și după decolare:","short":"La un eveniment cu mai mulți piloți, alegi un loc de decolare sigur, departe de mulțime, și după decolare te îndepărtezi de locul de decolare.","long":"În aglomerație, pilotul trebuie să aleagă un loc sigur și să elibereze zona pentru ceilalți. Zborul acrobatic deasupra mulțimii, consumul de alcool și decolarea în grabă sunt periculoase.","answers":[{"text":"decolăm cât mai repede pentru a scăpa de emoții","correct":false,"short":"","long":"Grabă este periculoasă.","warn":""},{"text":"efectuăm un zbor deasupra mulțimii, acrobatic pentru a ne demonstra abilitațile","correct":false,"short":"Efectuăm un zbor deasupra mulțimii, acrobatic, pentru a ne demonstra abilitățile.","long":"Este periculos și interzis.","warn":""},{"text":"ne alegem un loc de decolare în siguranță și cât mai departe de mulțime, iar după decolare ne îndepărtăm de locul de decolare pentru a le permite și celorlalți decolarea în siguranță","correct":true,"short":"Ne alegem un loc de decolare în siguranță și cât mai departe de mulțime, iar după decolare ne îndepărtăm de locul de decolare.","long":"","warn":""},{"text":"bem maxim 2 beri căt e permis pentru ne avea curaj și decolăm în siguranță","correct":false,"short":"Bem maxim 2 beri și decolăm în siguranță.","long":"Alcoolul este interzis înainte de zbor.","warn":""}]},{"number":"#5","text":"531: Ce se întâmplă în cazul unei închideri asimetrice mari?","short":"O închidere asimetrică mare poate provoca o înclinare violentă și o întoarcere în afundare spre partea închisă.","long":"Când o parte a aripii se închide, aripa se întoarce spre partea închisă. Dacă închiderea este mare, întoarcerea poate deveni violentă. Aripa nu se stabilizează singură fără intervenția pilotului.","answers":[{"text":"Poate provoca o înclinare violentă și o întoarcere în afundare spre partea închisă","correct":true,"short":"","long":"","warn":""},{"text":"Aripa se stabilizează automat fără intervenție din partea pilotului","correct":false,"short":"","long":"Nu se stabilizează singură în cazul mare.","warn":""},{"text":"Aripa se va deschide automat după câteva secunde de cădere liberă","correct":false,"short":"","long":"Nu este garantat.","warn":""},{"text":"Pilotul este tras spre partea deschisă și intră într-o spirală ascendentă","correct":false,"short":"","long":"Efectul este diferit.","warn":""}]},{"number":"#6","text":"493: Este necesară calcularea masei totale înainte de decolare?","short":"Da, masa totală trebuie calculată înainte de decolare și comparată cu masa maximă din manualul de utilizare.","long":"Masa totală include pilotul, echipamentul, combustibilul și aripa. Comparația cu masa maximă din manual previne suprasolicitarea aripii și motorului. Verificarea nu este necesară doar la zborurile cu pasager sau la raiduri.","answers":[{"text":"da, pentru a fi comparată cu masa maximă specificată în manualul de utilizare şi întreţinere","correct":true,"short":"Da, pentru a fi comparată cu masa maximă specificată în manualul de utilizare și întreținere.","long":"","warn":""},{"text":"nu este necesar la această clasa de aeronavă","correct":false,"short":"Nu este necesar la această clasă de aeronavă.","long":"Este necesar.","warn":""},{"text":"numai dacă se zboară cu pasager la bord","correct":false,"short":"","long":"Este necesar întotdeauna.","warn":""},{"text":"doar în zborurile de raid","correct":false,"short":"","long":"Este necesar întotdeauna.","warn":""}]},{"number":"#7","text":"510: Care este procedura corectă pentru a verifica motorul înainte de decolare?","short":"Înainte de a verifica motorul, te asiguri că zona de pe sol este liberă de obiecte care ar putea fi aspirate în elice.","long":"Elicea aspiră pietre, bețe și alte obiecte, care pot lovi pilotul sau pot deteriora elicea. Verificarea zonei este o regulă de bază înainte de pornire sau încălzire.","answers":[{"text":"Să te asiguri că zona de pe sol este liberă de obiecte care ar putea fi aspirate în elice","correct":true,"short":"","long":"","warn":""},{"text":"Să verifici dacă rezervorul este plin","correct":false,"short":"","long":"Este util, dar nu verificarea principală.","warn":""},{"text":"Să testezi parașuta de rezervă","correct":false,"short":"","long":"Nu este verificarea motorului.","warn":""},{"text":"Să pornești motorul la turație maximă","correct":false,"short":"","long":"Este periculos.","warn":""}]},{"number":"#8","text":"517: De ce este important să te antrenezi să simți unde este aripa fără să te uiți în sus?","short":"Te antrenezi să simți unde este aripa fără să te uiți în sus, pentru a putea decola din locuri înguste fără a rata decolarea.","long":"Pilotul care simte aripa poate verifica gonflajul fără să își ia ochii de la traiect. Acest lucru este important în locuri înguste sau cu obstacole, unde nu există loc pentru ratare.","answers":[{"text":"Pentru a reduce riscul de accident","correct":false,"short":"","long":"Este un efect general, dar varianta corectă este decolarea din locuri înguste.","warn":""},{"text":"Pentru a economisi timp","correct":false,"short":"","long":"Nu este motivul principal.","warn":""},{"text":"Pentru a putea decola din locuri înguste fără a rata decolarea","correct":true,"short":"","long":"","warn":""},{"text":"Pentru a impresiona spectatorii","correct":false,"short":"","long":"Nu este motivul.","warn":""}]},{"number":"#9","text":"478: Sunteți la aerodrom și aveți aprobare pentru decolare cu motoparapanta dumneavoastră. Cum veți executa virajul după decolare și cele pentru aterizare dacă nu este prevăzut sau nu se solicită altfel?","short":"După decolare, dacă nu se solicită altfel, virezi spre stânga.","long":"Circuitul de trafic al aerodromului are, în mod standard, viraje la stânga. Dacă nu ai o direcție impusă de autoritate sau de aerodrom, respecți virajul la stânga.","answers":[{"text":"la latitudinea dumneavoastră pentru că nu se solicită o direcție anume","correct":false,"short":"La latitudinea dumneavoastră, pentru că nu se solicită o direcție anume.","long":"Trebuie respectat circuitul standard.","warn":""},{"text":"spre stânga","correct":true,"short":"","long":"","warn":""},{"text":"spre dreapta","correct":false,"short":"","long":"Circuitul standard este la stânga.","warn":""},{"text":"nu este prevăzută nicăieri o direcție anume","correct":false,"short":"","long":"Circuitul standard este prevăzut.","warn":""}]},{"number":"#10","text":"572: Ce efect are oboseala asupra capacității unui pilot de a controla paramotorul?","short":"Oboseala scade timpul de reacție și precizia, crescând riscul de accidente.","long":"Oboseala afectează atenția, reacțiile și judecata. Pilotul obosit reacționează mai lent și greșește mai ușor. Ea nu îmbunătățește concentrarea sau stabilitatea.","answers":[{"text":"Scade timpul de reacție și precizia, crescând riscul de accidente","correct":true,"short":"","long":"","warn":""},{"text":"Nu are niciun efect semnificativ","correct":false,"short":"","long":"Are efect.","warn":""},{"text":"Crește viteza de reacție și stabilitatea în zbor","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"Îmbunătățește concentrarea și atenția","correct":false,"short":"","long":"Efectul este opus.","warn":""}]},{"number":"#11","text":"468: Zburam la 3m deasupra unui lac într-o seară liniștită la apus; vom evita:","short":"Zburând la 3 m deasupra unui lac seara, evităm să zburăm sub 150 m față de sol sau apă, deoarece este interzis.","long":"Zborul la altitudine foarte mică deasupra apei este restricționat. Varianta corectă indică înălțimea de 150 m ca limită pentru acest caz. Apusul și combustibilul sunt alți factori, dar nu regula principală.","answers":[{"text":"Să zburăm cu putin combustibil la bord pentru a avea aparatul cât mai usor","correct":false,"short":"Să zburăm cu puțin combustibil la bord pentru a avea aparatul cât mai ușor.","long":"Nu este regula principală.","warn":""},{"text":"Zborul cu soarele din fața încât ne poate afecta percepția vizuala și putem să amerizăm fără sa dorim acest lucru","correct":false,"short":"Zborul cu soarele în față, încât ne poate afecta percepția vizuală.","long":"Factor de risc, nu regula principală.","warn":""},{"text":"Să luam pasageri încât este periculos în caz de amerizare","correct":false,"short":"Să luăm pasageri, încât este periculos în caz de amerizare.","long":"Factor de risc, nu regula principală.","warn":""},{"text":"Să zburam la o inaltime mai mica de 150 m fata de sol/ apa, deoarece este interzis","correct":true,"short":"Să zburăm la o înălțime mai mică de 150 m față de sol/apă, deoarece este interzis.","long":"","warn":""}]},{"number":"#12","text":"505: Care este primul pas recomandat înainte de o aterizare inevitabilă în apă?","short":"Înainte de o aterizare inevitabilă în apă, primul pas este dezlegarea chingilor de la picioare, piept și rezervă.","long":"Dacă rămâi legat de echipament, poți fi tras sub apă sau împiedicat să ieși. Dezlegarea chingilor permite ieșirea rapidă. Fotografia, lumânarea și săritura din scaun nu sunt pași de siguranță.","answers":[{"text":"Făcutul unei fotografii rapide","correct":false,"short":"","long":"Nu este pas de siguranță.","warn":""},{"text":"Dezlegarea chingilor de la picioare, piept și rezervă","correct":true,"short":"","long":"","warn":""},{"text":"Aprinderea unei lumânări","correct":false,"short":"","long":"Nu este pas de siguranță.","warn":""},{"text":"Săritura din scaun","correct":false,"short":"","long":"Nu este pas de siguranță.","warn":""}]},{"number":"#13","text":"530: Ce este un full stall și cum poate fi recuperat?","short":"Un full stall este o manevră extremă în care pilotul trage destul de mult de frâne pentru a deforma aripa, iar recuperarea se face prin eliberarea graduală și uniformă a frânelor.","long":"La full stall, aripa se oprește din zbor, se deformează și cade. Recuperarea cere eliberarea treptată a frânelor, nu bruscă. Căderea controlată cu motorul și frânarea bruscă nu sunt descrierea corectă.","answers":[{"text":"O cădere controlată a aripii, recuperată prin utilizarea completă a motorului","correct":false,"short":"","long":"Descrierea nu este cea corectă.","warn":""},{"text":"O deformare frontală a aripii, recuperată prin tragerea bruscă de frâne","correct":false,"short":"","long":"Este o altă situație.","warn":""},{"text":"O cădere ușoară a aripii, recuperată prin accelerare maximă","correct":false,"short":"","long":"Descrierea nu este cea corectă.","warn":""},{"text":"O manevră extremă unde pilotul trage destul de mult de frâne pentru a deforma aripa, recuperată prin eliberarea graduală și uniformă a frânelor","correct":true,"short":"","long":"","warn":""}]},{"number":"#14","text":"581: Care este regula de prioritate în cazul în care o aeronavă motorizată și una nemotorizată se apropie una de alta?","short":"Dacă o aeronavă motorizată se apropie de una nemotorizată, aeronava motorizată cedează trecerea.","long":"Regula de prioritate protejează aeronava fără motor, care are manevrabilitate mai redusă. Aeronava motorizată trebuie să se îndepărteze sau să vireze. Ambele aeronave virând spre stânga nu este regula.","answers":[{"text":"Aeronava motorizată trebuie să cedeze trecerea aeronavei nemotorizate","correct":true,"short":"","long":"","warn":""},{"text":"Ambele aeronave trebuie să urce","correct":false,"short":"","long":"Nu este regula.","warn":""},{"text":"Aeronava nemotorizată trebuie să cedeze trecerea aeronavei motorizate","correct":false,"short":"","long":"Este opusul regulii.","warn":""},{"text":"Ambele aeronave trebuie să vireze spre stânga","correct":false,"short":"","long":"Nu este regula.","warn":""}]},{"number":"#15","text":"471: La 10 metri înălțime după decolare ni se oprește motorul, ce este recomandat să facem în acest caz?","short":"Dacă motorul se oprește la 10 m după decolare, asiguri viteza de planare și aterizezi înainte.","long":"La oprirea motorului la altitudine mică, primul lucru este menținerea vitezei de planare, ca aripa să rămână stabilă. Apoi alegi locul de aterizare cel mai apropiat, în direcția înainte. Virajul rapid spre decolare și frânarea bruscă pot provoca stallul.","answers":[{"text":"virăm rapid pentru a ne întoarce la decolare","correct":false,"short":"","long":"Virajul rapid poate duce la stall.","warn":""},{"text":"trebuie asigurată viteza de planare, iar direcția de aterizare este înainte","correct":true,"short":"","long":"","warn":""},{"text":"vom frâna cât mai repede aripa pentru ca urmeaza impactul cu solul","correct":false,"short":"Vom frâna cât mai repede aripa pentru că urmează impactul cu solul.","long":"Frânarea bruscă poate duce la stall.","warn":""},{"text":"încercam să pornim motorul cât mai repede","correct":false,"short":"Încercăm să pornim motorul cât mai repede.","long":"Prioritatea este viteza de planare.","warn":""}]},{"number":"#16","text":"487: În ce perioada a zilei este recomandat zborul cu paramotorul, pentru ca atmosfera să fie cât mai calmă:","short":"Zborul cu paramotorul este recomandat dimineața și seara, când atmosfera este mai calmă.","long":"Dimineața și seara vântul este de regulă mai slab și convecția este redusă. La amiază, termicele sunt intense și turbulente. Zborul după apus fără echipament adecvat nu este recomandat.","answers":[{"text":"Dimineața și seara","correct":true,"short":"","long":"","warn":""},{"text":"După apusul soarelui, dacă suntem echipati cu lumini de aviație","correct":false,"short":"După apusul soarelui, dacă suntem echipați cu lumini de aviație.","long":"Zborul de noapte este alt caz.","warn":""},{"text":"Orice perioadă este potrivită, chiar cu riscul unei închideri parțiale a aripii","correct":false,"short":"","long":"Riscul nu este acceptabil.","warn":""},{"text":"In mijlocul zilei, pentru a beneficia de termice","correct":false,"short":"În mijlocul zilei, pentru a beneficia de termice.","long":"Termicele de amiază pot fi turbulente.","warn":""}]},{"number":"#17","text":"550: Care este primul criteriu de verificat înainte de a alege un loc de decolare?","short":"Primul criteriu înainte de a alege un loc de decolare este asigurarea că te afli într-un spațiu aerian legal.","long":"Înainte de orice altă evaluare, trebuie verificat că zona de decolare și traseul sunt legale, adică în afara zonelor interzise și restricționate. Meteo, obstacolele și zonele de urgență contează după.","answers":[{"text":"Evaluarea condițiilor meteorologice","correct":false,"short":"","long":"Este important, dar nu primul criteriu.","warn":""},{"text":"Verificarea prezenței obstacolelor","correct":false,"short":"","long":"Este important, dar nu primul criteriu.","warn":""},{"text":"Asigurarea că se află într-un spațiu aerian legal","correct":true,"short":"","long":"","warn":""},{"text":"Confirmarea existenței unei zone de urgență","correct":false,"short":"","long":"Este importantă, dar nu primul criteriu.","warn":""}]},{"number":"#18","text":"504: Mentiunea CAVOK în METAR presupune în mod obligatoriu:","short":"Mențiunea CAVOK în METAR nu presupune restricții speciale în acest caz.","long":"CAVOK indică vizibilitate bună, fără nori sub 1500 m și fără fenomene semnificative. Nu înseamnă automat că zborul este permis oricum, dar nu impune restricții speciale din cauza meteo. Traficul sau condițiile periculoase nu sunt definite de CAVOK.","answers":[{"text":"interzicerea zborului, trafic aerian aglomerat in zonă","correct":false,"short":"Interzicerea zborului, trafic aerian aglomerat în zonă.","long":"CAVOK nu definește trafic aglomerat.","warn":""},{"text":"nu există restricții speciale în acest caz","correct":true,"short":"","long":"","warn":""},{"text":"interzicerea zborului, condiții meteo periculoase","correct":false,"short":"","long":"CAVOK indică condiții bune.","warn":""},{"text":"condiții meteo bune, dar în curs de schimbare","correct":false,"short":"","long":"CAVOK nu indică schimbare.","warn":""}]},{"number":"#19","text":"535: Care este principala metodă de recuperare dintr-o închidere frontală?","short":"Pentru a recupera dintr-o închidere frontală eliberezi accelerația și tragi puțin frânele, ca să nu te depășească aripa când își revine.","long":"La închiderea frontală, aripa pierde presiunea în față. Eliberarea accelerației și o ușoară tragere de frâne ajută aripa să își revină treptat, fără să o depășească. Tragerea bruscă a frânelor și mărirea puterii nu sunt soluțiile corecte.","answers":[{"text":"Tragi brusc de frâne pentru a deschide aripa","correct":false,"short":"","long":"Agravează situația.","warn":""},{"text":"Eliberezi accelerația și tragi puțin frânele să nu te depășească când își revine","correct":true,"short":"Eliberezi accelerația și tragi puțin frânele, să nu te depășească când își revine.","long":"","warn":""},{"text":"Mărești puterea motorului pentru a stabiliza aripa","correct":false,"short":"","long":"Nu este soluția corectă.","warn":""},{"text":"Folosești rezerva pentru a stabiliza zborul","correct":false,"short":"","long":"Rezerva se folosește doar în caz extrem.","warn":""}]},{"number":"#20","text":"506: De ce nu este recomandat să sari înainte de atingerea apei în cazul unei aterizări forțate?","short":"Nu sări înainte de atingerea apei, pentru că este greu de estimat înălțimea deasupra apei.","long":"Dacă sari prea devreme, cazi de la înălțime și te lovești. Dacă sari prea târziu, poți fi prins în echipament. Este mai sigur să rămâi legat, să menții poziția și să ieși după impact.","answers":[{"text":"Este imposibil să înoți corect după o săritură","correct":false,"short":"","long":"Nu este motivul.","warn":""},{"text":"Apa poate ascunde rechini","correct":false,"short":"","long":"Nu este motivul principal.","warn":""},{"text":"Este greu de estimat înălțimea peste apă","correct":true,"short":"","long":"","warn":""},{"text":"Apa este prea rece pentru o săritură","correct":false,"short":"","long":"Nu este motivul.","warn":""}]},{"number":"#21","text":"520: Care este scopul principal al „flare-ului” în timpul aterizării?","short":"Scopul flare-ului în aterizare este să facă corpul să se balanseze înainte, reducând viteza de coborâre și de înaintare.","long":"Flare-ul este o trăgare ușoară și progresivă a comenzilor, care ridică nasul aripii și reduce viteza de coborâre. Pilotul ajunge la sol cu viteză mică. Scopul nu este ridicarea aripii sau creșterea vitezei.","answers":[{"text":"Să crească viteza de înaintare pentru o aterizare mai lină","correct":false,"short":"","long":"Flare-ul reduce viteza.","warn":""},{"text":"să permită o corectare ușoară a direcției în timpul aterizării","correct":false,"short":"","long":"Corecția direcției este alt aspect.","warn":""},{"text":"Să facă corpul să se balanseze înainte, reducând viteza de coborâre și de înaintare","correct":true,"short":"","long":"","warn":""},{"text":"Să ridice aripa pentru o coborâre mai rapidă","correct":false,"short":"","long":"Efectul este opus.","warn":""}]},{"number":"#22","text":"466: Cum se decoleaza cu vânt de spate cu viteza mai mare de 20 km/h?","short":"Nu este recomandată decolarea cu vânt de spate peste 20 km/h, iar la această viteză este puțin probabil să poți decola.","long":"Cu vânt de spate, viteza față de sol este mare, deci aripa nu poate fi decolată în siguranță. Distanța necesară crește și riscul de accident crește. Decolarea trebuie amânată sau mutată pe o direcție cu vânt de față.","answers":[{"text":"se accelerează motorul pe loc în turație maximă după care se ridică brusc aripa și se decolează cât mai repede posibil","correct":false,"short":"Se accelerează motorul pe loc în turație maximă, după care se ridică brusc aripa și se decolează cât mai repede posibil.","long":"Este periculos.","warn":""},{"text":"nu este recomandată decolarea cu vânt de spate, iar la aceasta viteză este puțin probabil să putem decola","correct":true,"short":"Nu este recomandată decolarea cu vânt de spate, iar la această viteză este puțin probabil să putem decola.","long":"","warn":""},{"text":"se aleargă cu viteza mare și cu aripa frânată pentru a micșora distanța de decolare","correct":false,"short":"Se aleargă cu viteză mare și cu aripa frânată pentru a micșora distanța de decolare.","long":"Frânarea nu scurtează decolarea.","warn":""},{"text":"ne aruncăm cât mai repede în seletă pentru a alerga cât mai puțin","correct":false,"short":"","long":"Este periculos.","warn":""}]},{"number":"#23","text":"514: Cum trebuie să abordezi decolarea în condiții de vânt slab sau inexistent?","short":"În vânt slab sau inexistent, menții suspantele tensionate și alergi pentru a câștiga viteză.","long":"Fără vânt, aripa trebuie gonflată cu alergare. Suspantele tensionate și alergarea progresivă permit aripii să se umfle și să decoleze. Motorul la putere maximă sau parașuta de rezervă nu sunt soluțiile.","answers":[{"text":"Să folosești motorul la putere maximă","correct":false,"short":"","long":"Nu este soluția.","warn":""},{"text":"Să decolezi dintr-un punct înalt","correct":false,"short":"","long":"Nu este soluția.","warn":""},{"text":"Să folosești parașuta de rezervă","correct":false,"short":"","long":"Nu este soluția.","warn":""},{"text":"Să menții suspantele tensionate și să alergi pentru a câștiga viteză","correct":true,"short":"","long":"","warn":""}]},{"number":"#24","text":"573: Care este un semn comun al oboselii pe care un pilot trebuie să-l recunoască?","short":"Un semn comun al oboselii este senzația de somnolență sau lipsa de concentrare.","long":"Oboseala se manifestă prin somnolență, dificultăți de concentrare, reacții lente și greșeli. Pilotul care observă aceste semne trebuie să amâne zborul.","answers":[{"text":"Senzație de somnolență sau lipsă de concentrare","correct":true,"short":"","long":"","warn":""},{"text":"Creșterea clarității mentale","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"Creșterea energiei și a vigilenței","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"Reducerea frecvenței cardiace","correct":false,"short":"","long":"Nu este semnul principal.","warn":""}]},{"number":"#25","text":"560: Ce metodă este considerată cea mai puțin dezirabilă pentru a porni un motor nesecurizat?","short":"Cea mai puțin dezirabilă metodă de pornire a unui motor nesecurizat este să îl pornești stând în fața lui.","long":"Dacă motorul pornește brusc, elicea poate lovi pilotul din față. Pornirea se face din spate, cu suportul fix sau cu un asistent care ține aparatul. Stând în fața motorului, riscul de lovire este maxim.","answers":[{"text":"Să pornești motorul pe spatele tău","correct":false,"short":"","long":"Este metoda corectă, de regulă.","warn":""},{"text":"Să pornești motorul singur, stând în fața lui","correct":true,"short":"","long":"","warn":""},{"text":"Să pornești motorul cu ajutorul unui asistent","correct":false,"short":"","long":"Este o metodă mai sigură.","warn":""},{"text":"Să pornești motorul pe un suport fix","correct":false,"short":"","long":"Este o metodă mai sigură.","warn":""}]},{"number":"#26","text":"497: Sunteți în luna iunie și doriți să efectuați un zbor cu motoparapanta. Dacă doriți să decolați la ora 18:00 local la ce oră cel mai târziu UTC trebuie să depuneți planul de zbor?","short":"Dacă vrei să decolezi la 18:00 ora locală, în iunie, planul de zbor se depune cel mai târziu la 14:00 UTC.","long":"În iunie, România folosește ora de vară (UTC+3), deci 18:00 local înseamnă 15:00 UTC. Varianta corectă indică depunerea cu o oră înainte, la 14:00 UTC. Verifică regula de depunere a planului în reglementarea actuală.","answers":[{"text":"la ora 15:00 UTC","correct":false,"short":"","long":"Este ora decolării, nu a depunerii planului.","warn":""},{"text":"la ora 13:00 UTC","correct":false,"short":"","long":"Este cu o oră înainte de termenul corect.","warn":""},{"text":"la ora 14:00 UTC","correct":true,"short":"","long":"","warn":""},{"text":"la ora 16:00 UTC","correct":false,"short":"","long":"Este după ora decolării.","warn":""}]},{"number":"#27","text":"481: Când este o problemă oprirea motorului în zbor:","short":"Oprirea motorului în zbor este o problemă doar atunci când nu mai poți ajunge la un loc unde poți ateriza în siguranță.","long":"Motorul oprit nu este automat o urgență: aripa poate planează până la un loc sigur. Problema devine critică dacă nu poți ajunge la un loc de aterizare în siguranță.","answers":[{"text":"niciodată, atunci când zburăm cu parașuta de rezervă","correct":false,"short":"","long":"Parașuta nu înlocuiește aterizarea controlată.","warn":""},{"text":"cateodată, dacă zburăm cu pasager","correct":false,"short":"","long":"Pasagerul nu schimbă natura problemei.","warn":""},{"text":"doar atunci când nu mai putem ajunge la un loc unde putem ateriza în siguranță","correct":true,"short":"","long":"","warn":""},{"text":"niciodată, dacă anunțăm oprirea acestuia","correct":false,"short":"","long":"Anunțarea nu elimină problema.","warn":""}]},{"number":"#28","text":"566: De ce este important să respecți intervalul de greutate recomandat pentru o aripă de parapantă?","short":"Respectarea intervalului de greutate recomandat pentru aripă asigură performanța optimă și siguranța în zbor.","long":"Fiecare aripă are un interval de greutate pentru care este omologată. În afara lui, performanța și siguranța sunt afectate. Amenzile, aspectul și costurile de întreținere nu sunt motivul principal.","answers":[{"text":"Pentru a evita amenzile legale","correct":false,"short":"","long":"Nu este motivul principal.","warn":""},{"text":"Pentru a îmbunătăți aspectul estetic al echipamentului","correct":false,"short":"","long":"Nu este motivul.","warn":""},{"text":"Pentru a reduce costurile de întreținere","correct":false,"short":"","long":"Nu este motivul principal.","warn":""},{"text":"Pentru a asigura performanța optimă și siguranța în zbor","correct":true,"short":"","long":"","warn":""}]},{"number":"#29","text":"557: Care sunt semnele care indică prezența turbulențelor mecanice?","short":"Turbulențele mecanice sunt indicate de norii de praf, de devierea fumului și de modificările bruște ale vântului.","long":"Turbulența mecanică apare la obstacole, relief sau clădiri. Ea se vede prin praf, prin fumul care se deviază și prin rafale. Zgomotul constant, norii de furtună la distanță și creșterea constantă a vântului nu sunt indicatorii.","answers":[{"text":"Zgomot constant și lin","correct":false,"short":"","long":"Nu este indicatorul.","warn":""},{"text":"Prezența norilor de furtună la distanță","correct":false,"short":"","long":"Nu este indicatorul turbulenței mecanice.","warn":""},{"text":"O creștere constantă a vitezei vântului","correct":false,"short":"","long":"Nu este indicatorul.","warn":""},{"text":"Turbulențele mecanice sunt indicate de prezența norilor de praf, devierea fumului și modificările bruște ale vântului","correct":true,"short":"","long":"","warn":""}]},{"number":"#30","text":"492: Pornirea motorului se poate efectua:","short":"Pornirea motorului se poate face în spatele pilotului, în aer liber, cu elicea liberă.","long":"Pornirea se face cu motorul sprijinit, în spatele pilotului, în aer liber, fără obstacole, cu elicea liberă și fără persoane în zona elicei. Pietrișul și orice suprafață nu sunt condițiile corecte.","answers":[{"text":"în spatele pilotului, în aer liber având elicea liberă","correct":true,"short":"În spatele pilotului, în aer liber, având elicea liberă.","long":"","warn":""},{"text":"sprijinit de corp cu minim 2 puncte de sprijin","correct":false,"short":"Sprijinit de corp, cu minim 2 puncte de sprijin.","long":"Nu este varianta corectă pentru pornire.","warn":""},{"text":"pe suprafeţe cu pietriş","correct":false,"short":"Pe suprafețe cu pietriș.","long":"Pietrișul poate fi aruncat în elice.","warn":""},{"text":"pe orice suprafaţă","correct":false,"short":"Pe orice suprafață.","long":"Suprafața trebuie să fie stabilă.","warn":""}]},{"number":"#31","text":"486: Care este înălțimea maximă până la care puteți zbura la verticala unui aerodrom situat la cota de 1300 m și în spațiu aerian de clasa G?","short":"Dacă zbori la verticala unui aerodrom situat la 1300 m, în spațiu de clasa G, varianta corectă indică înălțimea maximă de 1900 m.","long":"Limitele de înălțime în spațiul G sunt raportate la aerodrom sau la altitudinea terenului, conform regulilor. Varianta corectă indică 1900 m, adică 1300 m (aerodrom) plus 600 m. Verifică valoarea din reglementarea aplicabilă, deoarece limitele pot fi exprimate diferit.\n\nClasa G este spațiu necontrolat: zborul VFR și IFR este permis, nu este obligatorie autorizarea ATC, iar serviciul furnizat este doar de informare a zborurilor. Din acest motiv comunicarea radio nu este obligatorie, dar este recomandată.","answers":[{"text":"150m","correct":false,"short":"150 m.","long":"Este o limită pentru alt caz.","warn":""},{"text":"3000m","correct":false,"short":"3000 m.","long":"Depășește limita pentru acest caz.","warn":""},{"text":"1900m","correct":true,"short":"1900 m.","long":"Limitele de înălțime în spațiul G se raportează de obicei la sol: 1300 m (cota aerodromului) plus înălțimea maximă de deasupra terenului dă 1900 m dacă înălțimea maximă este de 600 m. Cifra de 600 m nu am confirmat-o în sursele consultate; verifică-o în RACR-RA.","warn":""},{"text":"1500m","correct":false,"short":"1500 m.","long":"Nu este varianta corectă.","warn":""}]},{"number":"#32","text":"536: Ce este un stall și cum poate fi provocat?","short":"Un stall apare când unghiul de atac crește atât de mult încât fluxul de aer de pe aripă se separă, provocat de frânare excesivă sau de rafale de vânt.","long":"La stall, aripa își pierde portanța deoarece aerul nu mai curge lipit de profil. Frânarea excesivă și rafalele pot provoca stallul. Nu este un fenomen rar sau o deformare.","answers":[{"text":"Un stall apare când unghiul de atac crește atât de mult încât fluxul de aer de pe aripă se separă, provocat de frânare excesivă sau rafale de vânt","correct":true,"short":"","long":"","warn":""},{"text":"O închidere a aripii provocată de o manevră bruscă","correct":false,"short":"","long":"Este alt fenomen.","warn":""},{"text":"Un fenomen rar care apare numai în condiții de zbor extrem","correct":false,"short":"","long":"Nu este definiția.","warn":""},{"text":"O deformare a aripii provocată de utilizarea incorectă a frânelor","correct":false,"short":"","long":"Este alt fenomen.","warn":""}]},{"number":"#33","text":"525: Cum trebuie să abordezi aterizarea în condiții de vânt ușor?","short":"În vânt ușor, folosești trimmerele în setarea lentă și aplici o presiune ușoară pe frâne la aterizare.","long":"Setarea lentă a trimmerelor și frânarea ușoară asigură o aterizare controlată, cu viteză mică. Cele două variante identice descriu aceeași procedură. Sărirea din scaun și virajele strânse nu sunt metode corecte.","answers":[{"text":"Să folosești trimmerele la setarea lentă și să aplici o presiune ușoară pe frâne","correct":false,"short":"","long":"Are același text ca varianta B, deci nu este varianta corectă.","warn":""},{"text":"Să folosești trimmerele la setarea lentă și să aplici o presiune ușoară pe frâne","correct":true,"short":"","long":"Este varianta corectă; varianta A are același text.","warn":""},{"text":"Să sari din scaun înainte de aterizare","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"Să faci viraje strânse pentru a pierde altitudine","correct":false,"short":"","long":"Nu este procedura corectă în vânt ușor.","warn":""}]},{"number":"#34","text":"489: Pilotarea cu ajutorul chingilor spate:","short":"Pilotarea cu ajutorul chingilor spate permite redresarea în cazul ruperii unei comenzi.","long":"Chingile spate pot ține aripa direcționată când o comandă se rupe sau se desprinde. Ele permit controlul de rezervă. Nu permit coborâre rapidă și nu se folosesc prin tragerea de câțiva centimetri.","answers":[{"text":"permite redresarea în cazul ruperii unei comenzi","correct":true,"short":"","long":"","warn":""},{"text":"permite coborârea rapidă","correct":false,"short":"","long":"Nu este scopul.","warn":""},{"text":"se face cu o chingă spate şi comanda opusă","correct":false,"short":"Se face cu o chingă spate și comanda opusă.","long":"Nu este procedura.","warn":""},{"text":"trebuie să se facă prin tragerea lor cu câţiva cm","correct":false,"short":"Trebuie să se facă prin tragerea lor cu câțiva cm.","long":"Nu este procedura.","warn":""}]},{"number":"#35","text":"500: În zbor, o aeronoavă ajunge în dreapta dv. pe o rută convergentă:","short":"Dacă o aeronavă vine în dreapta ta pe o rută convergentă, tu trebuie să cedezi prioritatea.","long":"La rute convergente, aeronava care are cealaltă aeronavă în dreapta cedează. Dacă vine în dreapta ta, cedezi. Paramotorul nu are prioritate doar pentru că este mai lent.","answers":[{"text":"dvs. aveţi prioritate","correct":false,"short":"Dvs. aveți prioritate.","long":"Nu este regula dacă vine din dreapta.","warn":""},{"text":"prioritatea depinde de tipul de aeronavă","correct":false,"short":"","long":"Regula este dreapta, nu tipul.","warn":""},{"text":"dvs. trebuie să cedaţi prioritatea","correct":true,"short":"Dvs. trebuie să cedați prioritatea.","long":"","warn":""},{"text":"paramotorul, fiind cea mai inceată aeronava, are intotdeauna prioritate","correct":false,"short":"Paramotorul, fiind cea mai lentă aeronavă, are întotdeauna prioritate.","long":"Viteza nu dă prioritate.","warn":""}]},{"number":"#36","text":"561: Ce este recomandat să faci cu motorul după ce a rulat la relanti pentru câteva minute?","short":"După ce motorul a rulat la relanti câteva minute, îl accelerezi la 50% putere pentru aproximativ 10 secunde, pentru a curăța motorul.","long":"Turația mică poate depune reziduuri, iar accelerarea scurtă la regim mediu le elimină. Accelerarea la putere maximă sau oprirea imediată nu sunt recomandate.","answers":[{"text":"Să-l lași să ruleze la ralanti până la decolare","correct":false,"short":"Să-l lași să ruleze la relanti până la decolare.","long":"Reziduurile se acumulează.","warn":""},{"text":"Să-l accelerezi la putere maximă","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"Să-l accelerezi la 50% putere pentru aproximativ 10 secunde pentru a curăța motorul","correct":true,"short":"","long":"","warn":""},{"text":"Să-l oprești imediat","correct":false,"short":"","long":"Nu este procedura.","warn":""}]},{"number":"#37","text":"479: Decolarea cu motoparapanta tip rucsac se execută:","short":"Decolarea cu motoparapanta tip rucsac se execută cu alergare accelerată progresiv.","long":"Motoparapanta tip rucsac se decolează prin alergare, cu accelerare progresivă, până când aripa se umflă și se ridică. Turarea agresivă, viteza constantă sau viteza mică nu sunt metodele.","answers":[{"text":"prin turarea agresivă a motorului pentru a genera propulsie","correct":false,"short":"","long":"Turarea agresivă nu este metoda.","warn":""},{"text":"cu viteză constantă pentru a putea menține panta de zbor","correct":false,"short":"","long":"Viteza constantă nu este metoda.","warn":""},{"text":"cu alergare accelerată progresiv","correct":true,"short":"","long":"","warn":""},{"text":"cu viteză mică pentru a nu afecta gonflajul voalurii","correct":false,"short":"","long":"Viteza mică nu asigură decolarea.","warn":""}]},{"number":"#38","text":"569: Care este procedura corectă de pregătire pentru aruncarea parașutei de salvare?","short":"Procedura de aruncare a parașutei de salvare este: oprește motorul, privește, trage, asigură și aruncă.","long":"Secvența „Kill, Look, Pull, Clear, and Throw” înseamnă: oprirea motorului, verificarea spațiului, tragerea mânerului parașutei, asigurarea că zona este liberă și aruncarea. Ordinea este importantă pentru siguranță.","answers":[{"text":"\"Prepare, Adjust, Deploy\" (Pregătește, ajustează, aruncă)","correct":false,"short":"Pregătește, ajustează, aruncă.","long":"Nu este procedura.","warn":""},{"text":"\"Check, Reduce, Release\" (Verifică, redu, eliberează)","correct":false,"short":"Verifică, redu, eliberează.","long":"Nu este procedura.","warn":""},{"text":"\"Look, Aim, Fire\" (Privește, țintește, aruncă)","correct":false,"short":"Privește, țintește, aruncă.","long":"Nu este procedura.","warn":""},{"text":"\"Kill, Look, Pull, Clear, and Throw\" (Oprește motorul, privește, trage, asigură și aruncă)","correct":true,"short":"Oprește motorul, privește, trage, asigură și aruncă.","long":"","warn":""}]},{"number":"#39","text":"526: Ce trebuie să faci dacă aterizezi într-un loc îngust și obstrucționat?","short":"Dacă aterizezi într-un loc îngust și obstrucționat, eviți frânarea extremă și planifici coborârea urmărind conturul obstacolelor.","long":"În locuri înguste, pilotul coboară controlat, evitând manevrele bruște și frânarea extremă. El urmărește obstacolele și alege traiectoria. Motorul pentru corecție sau aterizarea oriunde nu sunt soluțiile corecte.","answers":[{"text":"Să folosești motorul pentru a-ți corecta traiectoria","correct":false,"short":"","long":"Nu este soluția principală.","warn":""},{"text":"Să eviți utilizarea frânelor extrem și să planifici coborârea urmărind conturul obstacolelor","correct":true,"short":"Să eviți utilizarea frânelor extreme și să planifici coborârea urmărind conturul obstacolelor.","long":"","warn":""},{"text":"Să aterizezi într-un loc deschis indiferent de vânt","correct":false,"short":"","long":"Vântul contează.","warn":""},{"text":"Să ignori obstacolele și să te concentrezi doar pe locul de aterizare","correct":false,"short":"","long":"Este periculos.","warn":""}]},{"number":"#40","text":"491: Cum se compensează ruperea comenzii direcţiei?","short":"Ruperea comenzii direcției se compensează cu ajutorul ultimului rând de suspante, D.","long":"Suspantele D sunt cele din spatele aripii, care pot fi trase pentru a controla direcția când comanda principală nu funcționează. Trimmerele și motorul nu compensează ruperea comenzii.","answers":[{"text":"prin modificarea regimului motorului","correct":false,"short":"","long":"Nu compensează ruperea comenzii.","warn":""},{"text":"cu ajutorul ultimului rând de suspante(D)","correct":true,"short":"Cu ajutorul ultimului rând de suspante (D).","long":"","warn":""},{"text":"se acţionează obligatoriu paraşuta de rezervă","correct":false,"short":"Se acționează obligatoriu parașuta de rezervă.","long":"Nu este obligatoriu.","warn":""},{"text":"cu ajutorul trimmerelor","correct":false,"short":"","long":"Nu compensează ruperea comenzii.","warn":""}]},{"number":"#41","text":"472: Urmează sa efectuăm un viraj în zbor și avem în jur mai multe aeronave, cum vom proceda:","short":"Înainte de un viraj te uiți în direcția în care vrei să virezi, te asiguri că nu sunt alte aeronave și abia apoi execuți manevra.","long":"Virajul fără verificare poate duce la coliziune. Pilotul privește în direcția virajului, verifică traficul din jur și doar apoi execută manevra. Încrederea în piloții cunoscuți nu înlocuiește verificarea.","answers":[{"text":"dacă din față vine o altă aeronava este interzis să efectuăm manevre","correct":false,"short":"Dacă din față vine o altă aeronavă, este interzis să efectuăm manevre.","long":"Nu este formularea completă; important este verificarea înainte de viraj.","warn":""},{"text":"dacă zburăm cu piloți pe care îi cunoaștem putem vira fără să ne privim în jur pentru că ne cunosc comportamentul","correct":false,"short":"Dacă zburăm cu piloți pe care îi cunoaștem, putem vira fără să ne privim în jur.","long":"Este periculos.","warn":""},{"text":"vom vira tot timpul în sensul momentului motor","correct":false,"short":"Virăm tot timpul în sensul momentului motor.","long":"Nu este regula.","warn":""},{"text":"ne uităm în direcția în care vrem să facem virajul, ne asigurăm, după care executăm manevra","correct":true,"short":"","long":"","warn":""}]},{"number":"#42","text":"565: Ce se întâmplă dacă zbori cu o aripă supraîncărcată?","short":"Dacă zbori cu o aripă supraîncărcată, aceasta devine mai dinamică și mai reactivă, are o rată de urcare mai scăzută și reacționează mai violent la colaps.","long":"Aripa supraîncărcată zboară mai rapid și este mai greu de controlat. Rata de urcare scade, iar colapsul este mai violent. Aripa nu devine mai stabilă și nu își pierde capacitatea de umflare.","answers":[{"text":"Devine mai dinamică și mai reactivă și are o rată de urcare mai scăzută și reacționează mai violent în cazul unui colaps","correct":true,"short":"Devine mai dinamică și mai reactivă, are o rată de urcare mai scăzută și reacționează mai violent în cazul unui colaps.","long":"","warn":""},{"text":"Devine mai stabilă și mai puțin reactivă la comenzile de control","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"Îmbunătățește eficiența aerodinamică la viteze mari","correct":false,"short":"","long":"Nu este efectul principal.","warn":""},{"text":"Își pierde capacitatea de a se inflata corect","correct":false,"short":"Își pierde capacitatea de a se umfla corect.","long":"Nu este efectul principal.","warn":""}]},{"number":"#43","text":"476: În cazul înrăutăţirii condiţiilor meteorologice pe traiect (ceaţă, ploaie, vânt, etc.):","short":"Dacă meteo se înrăutățește pe traiect, ocolești zona periculoasă, te îndrepți spre zone mai sigure și aterizezi pe aerodromul cel mai apropiat.","long":"Când condițiile se înrăutățesc, decizia corectă este să schimbi traseul spre zone sigure și să aterizezi. Pilotul nu trebuie să continue în limita suportabilității, iar urcarea excesivă nu rezolvă problema.","answers":[{"text":"se ocoleşte, se evită zona periculoasă şi se îndreaptă către zone mai sigure şi se aterizează pe aerodromul cel mai apropiat","correct":true,"short":"Se ocolește, se evită zona periculoasă, se îndreaptă către zone mai sigure și se aterizează pe aerodromul cel mai apropiat.","long":"","warn":""},{"text":"pilotul poate lua orice hotărâre, nefiind suspus nici unei reglementari în acest sens","correct":false,"short":"Pilotul poate lua orice hotărâre, nefiind supus niciunei reglementări în acest sens.","long":"Pilotul este supus reglementărilor.","warn":""},{"text":"se va lua înălțime cât mai mare pentru a evita vremea nefavorabilă","correct":false,"short":"Se va lua altitudine cât mai mare pentru a evita vremea nefavorabilă.","long":"Nu rezolvă problema.","warn":""},{"text":"se continuă zborul în limita suportabilității","correct":false,"short":"","long":"Este periculos.","warn":""}]},{"number":"#44","text":"533: Ce ar trebui să faci în cazul unui spin?","short":"Într-un spin reduci imediat puterea și frânele și te pregătești să atenuezi balansul.","long":"Spinul este o rotație în care aripa cade și se învârte. Reducerea puterii și eliberarea frânelor permit aripii să își revină. Pilotul se pregătește apoi să atenueze balansul de la revenire.","answers":[{"text":"Să mărești viteza de zbor pentru a stabiliza aripa","correct":false,"short":"","long":"Nu este procedura corectă.","warn":""},{"text":"Să reduci imediat puterea și frânele și să te pregătești să atenuezi balansul","correct":true,"short":"","long":"","warn":""},{"text":"Să încerci să oprești motorul","correct":false,"short":"","long":"Nu este procedura corectă.","warn":""},{"text":"Să tragi de frânele opuse pentru a corecta rotația","correct":false,"short":"","long":"Agravează rotația.","warn":""}]},{"number":"#45","text":"485: În zbor, va trebui să evitaţi o aeronavă, dvs. efectuaţi:","short":"Dacă trebuie să eviți o aeronavă, efectuezi un viraj la dreapta.","long":"Regula de evitare cere ca ambele aeronave să vireze spre dreapta la apropiere frontală. Așa fiecare trece pe partea dreaptă a celeilalte. Coborârea sau o manevră pentru a atrage atenția nu sunt regula.","answers":[{"text":"o coborâre","correct":false,"short":"","long":"Nu este manevra standard de evitare.","warn":""},{"text":"orice manevra, pentru a atrage atentia celeilalte aeronave","correct":false,"short":"Orice manevră, pentru a atrage atenția celeilalte aeronave.","long":"Este periculos.","warn":""},{"text":"un viraj la stânga","correct":false,"short":"","long":"Regula este virajul la dreapta.","warn":""},{"text":"un viraj la dreapta","correct":true,"short":"","long":"","warn":""}]},{"number":"#46","text":"465: Cum se execută atingerea apei în situaţia unei amerizări?","short":"La amerizare, aterizezi cu chingile desfăcute și cu viteza cât mai mică.","long":"Chingile desfăcute permit ieșirea rapidă din echipament după impact. Viteza mică reduce șocul. Frânarea sus pentru a stala aripa și săritura de la înălțime nu sunt metodele corecte.","answers":[{"text":"se aterizează cu chingile desfăcute și cu viteza cât mai mică","correct":true,"short":"","long":"","warn":""},{"text":"se franează cât mai sus pentru a stala aripa","correct":false,"short":"Se frânează cât mai sus pentru a stala aripa.","long":"Nu este procedura corectă.","warn":""},{"text":"viteza maximă","correct":false,"short":"","long":"Viteza mare crește șocul.","warn":""},{"text":"se deschid chingile și se sare de la înălțime de 150 metri","correct":false,"short":"Se deschid chingile și se sare de la înălțime de 150 de metri.","long":"Este periculos.","warn":""}]},{"number":"#47","text":"469: În cazul în care producatorul parapantei cu motor recomandă o anumită procedură de pornire a aparatului, dar noi avem de efectuat mai multe porniri consecutive în cadrul unor reglaje și nu putem respecta procedura, putem să:","short":"Dacă producătorul recomandă o procedură de pornire, nu poți efectua proceduri care nu sunt în manualul de operare al aeronavei.","long":"Procedurile neaprobate de producător pot duce la defecte sau accidente. Chiar dacă ai experiență, trebuie respectat manualul. Dacă procedura nu poate fi respectată, se oprește activitatea și se cere ajutor.","answers":[{"text":"solicităm ajutorul celorlalți piloți care au experiență pentru a ne ajuta","correct":false,"short":"","long":"Nu înlocuiește procedura din manual.","warn":""},{"text":"este interzis să efectuăm proceduri care nu sunt în manulul de operare al aeronavei","correct":true,"short":"Este interzis să efectuăm proceduri care nu sunt în manualul de operare al aeronavei.","long":"","warn":""},{"text":"căutam o variantă de pornire optimă încât să ne asigure pornirea în siguranță","correct":false,"short":"Căutăm o variantă de pornire optimă încât să ne asigure pornirea în siguranță.","long":"Nu este procedura permisă.","warn":""},{"text":"ne abatem de la recomandarile producătorului dacă experiența de permite","correct":false,"short":"Ne abatem de la recomandările producătorului dacă experiența ne permite.","long":"Experiența nu permite abaterea.","warn":""}]},{"number":"#48","text":"528: Care este primul pas în pregătirea pentru o aterizare de urgență?","short":"Primul pas în pregătirea unei aterizări de urgență este verificarea direcției vântului și alegerea unui loc sigur.","long":"Înainte de orice manevră, pilotul evaluează vântul și locul de aterizare, pentru a alege cea mai sigură variantă. Frânarea completă, trimmerele la viteză maximă și oprirea motorului nu sunt primul pas.","answers":[{"text":"Să verifici direcția vântului și să alegi un loc sigur pentru aterizare","correct":true,"short":"","long":"","warn":""},{"text":"Să tragi de frâne complet","correct":false,"short":"","long":"Nu este primul pas.","warn":""},{"text":"Să te asiguri că trimmerele sunt setate la viteza maximă","correct":false,"short":"","long":"Nu este primul pas.","warn":""},{"text":"Să oprești motorul imediat","correct":false,"short":"","long":"Nu este primul pas.","warn":""}]},{"number":"#49","text":"543: Care sunt complicațiile posibile ale unui full stall?","short":"Complicațiile posibile ale unui full stall sunt că poți fi învăluit în aripă, iar căderea poate fi violentă.","long":"La full stall, aripa se poate înfășura în jurul pilotului, iar căderea este rapidă și violentă. Stabilizarea automată nu este garantată, iar spirala ascendentă și creșterea vitezei nu sunt efecte tipice.","answers":[{"text":"Aripa se stabilizează automat fără intervenție din partea pilotului","correct":false,"short":"","long":"Nu este garantat.","warn":""},{"text":"Poți intra într-o spirală ascendentă","correct":false,"short":"","long":"Nu este efectul tipic.","warn":""},{"text":"Viteza de zbor poate crește brusc","correct":false,"short":"","long":"Nu este efectul tipi
