c.","warn":""},{"text":"Poți fi învăluit în aripă și căderea poate fi violentă","correct":true,"short":"Poți fi învăluit în aripă, iar căderea poate fi violentă.","long":"","warn":""}]},{"number":"#50","text":"507: Ce trebuie să faci imediat după ce atingi apa într-o aterizare de urgență?","short":"După ce atingi apa într-o aterizare de urgență, iei o gură mare de aer și ieși imediat din echipament.","long":"Impactul cu apa poate fi șocant, iar aripa se poate încurca. Este important să respiri și să ieși din echipament rapid, fără să te lupți cu el. Recuperarea motorului și lanterna nu sunt prioritățile.","answers":[{"text":"Să încerci să recuperezi motorul","correct":false,"short":"","long":"Nu este prioritatea.","warn":""},{"text":"Să aprinzi o lanternă","correct":false,"short":"","long":"Nu este prioritatea.","warn":""},{"text":"Să iei o gură mare de aer și să ieși imediat din echipament","correct":true,"short":"","long":"","warn":""},{"text":"Să scanezi împrejurimile pentru pericole","correct":false,"short":"","long":"Este important, dar prioritatea este aerul și ieșirea din echipament.","warn":""}]},{"number":"#51","text":"474: Doriţi sa zburaţi VFR în spaţiul aerian de clasă G, din punctul A în punctul B la şes. Vizibilitatea este peste 8 km, plafon la 400 m. Cum procedaţi?","short":"Dacă vizibilitatea este peste 8 km, dar plafonul este la 400 m, în spațiul G nu zbori.","long":"Varianta corectă recomandă să nu zbori în aceste condiții. Pentru zborul VFR, condițiile minime de vizibilitate și de distanță față de nori trebuie respectate. Verifică valorile exacte din reglementare, pentru că plafonul de 400 m poate fi sub limita cerută.","answers":[{"text":"informați ATC despre condițiile de vizibilitate și cereți aprobare pentru a decola","correct":false,"short":"","long":"În spațiul G nu este nevoie de aprobare ATC pentru zbor.","warn":""},{"text":"zburaţi la o înălţime minimă de 150 m","correct":false,"short":"Zburați la o înălțime minimă de 150 m.","long":"Nu este regula.","warn":""},{"text":"zburaţi la o înălţime maximă de 250 m","correct":false,"short":"Zburați la o înălțime maximă de 250 m.","long":"Nu este regula.","warn":""},{"text":"nu zburaţi","correct":true,"short":"Nu zburați.","long":"","warn":""}]},{"number":"#52","text":"551: De ce este recomandat să se evite zonele împădurite și mlăștinoase pentru decolare?","short":"Zonele împădurite și mlăștinoase se evită la decolare, pentru că trebuie să menții o opțiune de aterizare de urgență.","long":"În asemenea zone, dacă motorul se oprește, nu există unde să aterizezi în siguranță. Pilotul decolează de pe un loc unde poate ateriza în caz de urgență. Dificultatea navigației sau animalele nu sunt motivele principale.","answers":[{"text":"Dificultatea de a naviga prin teren","correct":false,"short":"","long":"Nu este motivul principal.","warn":""},{"text":"Prezenta animalelor sălbatice","correct":false,"short":"Prezența animalelor sălbatice.","long":"Nu este motivul principal.","warn":""},{"text":"Necesitatea menținerii unei opțiuni de aterizare de urgență","correct":true,"short":"","long":"","warn":""},{"text":"Vizibilitatea redusă","correct":false,"short":"","long":"Nu este motivul principal.","warn":""}]},{"number":"#53","text":"508: În cazul în care vântul este mai slab de 10 km/h, cum este recomandat să aterizezi în apă?","short":"Dacă vântul este mai slab de 10 km/h și vrei să aterizezi în apă, aterizezi cu vânt din spate, astfel încât aripa să intre în apă cu marginea de atac.","long":"Cu vânt slab, aripa poate cădea peste pilot dacă aterizează cu vânt din față. Vântul din spate face ca marginea de atac să intre primul în apă, iar aripa se așază mai ușor. Varianta corectă indică această variantă.","answers":[{"text":"Aterizare în picaj","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"Aterizare cu vânt din față, astfel încât aripa să fie departe de tine","correct":false,"short":"","long":"Vântul de față poate duce aripa peste pilot.","warn":""},{"text":"Aterizare cu vânt din spate, astfel încât aripa să intre în apă cu marginea de atac","correct":true,"short":"","long":"","warn":""},{"text":"Aterizare cu viteză maximă","correct":false,"short":"","long":"Este periculos.","warn":""}]},{"number":"#54","text":"477: Prevenirea apariţiei unei pene de motor:","short":"Prevenirea penei de motor se face prin întreținerea regulată a aeronavei și prin pregătirea și verificarea sistematică a acesteia.","long":"Întreținerea periodică și verificările sistematice descoperă defectele înainte de zbor. Calitatea uleiului sau controalele doar înainte de decolare nu acoperă toate cauzele.","answers":[{"text":"se realizează prin folosirea unui ulei de motor și benzină de calitate","correct":false,"short":"","long":"Este util, dar nu acoperă prevenția completă.","warn":""},{"text":"se realizează prin întreţinerea regulată a aeronavei şi prin pregătirea şi verificarea sistematică a acesteia","correct":true,"short":"Se realizează prin întreținerea regulată a aeronavei și prin pregătirea și verificarea sistematică a acesteia.","long":"","warn":""},{"text":"se face doar înainte de decolare, prin controale ale elementelor vitale ale aeronavei","correct":false,"short":"","long":"Verificarea trebuie făcută și periodic.","warn":""},{"text":"se face doar prin controale periodice ale aeronavei","correct":false,"short":"","long":"Verificarea trebuie făcută și înainte de fiecare zbor.","warn":""}]},{"number":"#55","text":"490: Pentru ca pornirea paramotorului să se facă în siguranță, se recomandă a se face:","short":"Pentru ca pornirea paramotorului să fie sigură, se pornește pe spate, echipat cel puțin cu cască.","long":"Pornirea pe spate, cu elicea în fața pilotului, reduce riscul de lovire. Casca protejează capul dacă motorul se întoarce sau dacă apare o problemă. Pornirea pe sol sau fără elice nu sunt metodele corecte.","answers":[{"text":"Pe sol","correct":false,"short":"","long":"Nu este metoda corectă.","warn":""},{"text":"Cu putin combustibil","correct":false,"short":"Cu puțin combustibil.","long":"Nu are legătură cu siguranța pornirii.","warn":""},{"text":"Fără elice","correct":false,"short":"","long":"Pornirea trebuie făcută cu elicea montată, cu precauțiile corecte.","warn":""},{"text":"Pe spate, echipat cel puțin cu cască","correct":true,"short":"","long":"","warn":""}]},{"number":"#56","text":"498: . Nu ați reușit să decolați în maxim 30 de minute față de ora decolării din planul de zbor depus. În acest caz, aveți obligația să:","short":"Dacă nu reușești să decolezi în maximum 30 de minute față de ora din planul de zbor, ceri un DELAY la briefing.","long":"Întârzierea față de planul depus trebuie comunicată prin procedura de ajustare a planului, de regulă cerând un DELAY. Informarea COAP sau depunerea altui plan nu sunt pașii corecți. Varianta corectă indică DELAY-ul.","answers":[{"text":"cereți un DELAY la briefing","correct":true,"short":"","long":"","warn":""},{"text":"informați COAP despre întârziere","correct":false,"short":"","long":"Nu este pasul corect.","warn":""},{"text":"depuneți un alt plan de zbor","correct":false,"short":"","long":"Nu este pasul corect.","warn":""},{"text":"nu aveți nici o obligație","correct":false,"short":"Nu aveți nicio obligație.","long":"Există obligația de a comunica întârzierea.","warn":""}]},{"number":"#57","text":"549: Cum trebuie să te pregătești pentru o aterizare de urgență după un eveniment periculos în zbor?","short":"Pentru o aterizare de urgență, verifici direcția vântului și alegi un loc sigur de aterizare.","long":"Aceeași explicație ca la întrebarea 48: primul pas este evaluarea vântului și alegerea locului sigur. Trimmerele la viteză maximă, frânarea completă și oprirea motorului nu sunt pașii corecți.","answers":[{"text":"Te asiguri că trimmerele sunt setate la viteza maximă","correct":false,"short":"","long":"Nu este pasul corect.","warn":""},{"text":"Verifici direcția vântului și alegi un loc sigur pentru aterizare","correct":true,"short":"","long":"","warn":""},{"text":"Oprești motorul imediat","correct":false,"short":"","long":"Nu este pasul corect.","warn":""},{"text":"Tragi de frâne complet","correct":false,"short":"","long":"Nu este pasul corect.","warn":""}]},{"number":"#58","text":"564: Ce riscuri sunt asociate cu depășirea greutății maxime a aripii?","short":"Depășirea greutății maxime a aripii crește probabilitatea de eșec structural.","long":"Aripa este dimensionată pentru o greutate maximă. Depășirea ei solicită suspantele și țesătura peste limită, ceea ce poate duce la rupere. Scăderea vitezei, stabilitatea sau consumul de combustibil nu sunt efectele principale.","answers":[{"text":"Scade viteza de zbor","correct":false,"short":"","long":"Nu este riscul principal.","warn":""},{"text":"Crește probabilitatea de eșec structural","correct":true,"short":"","long":"","warn":""},{"text":"Îmbunătățește stabilitatea în zbor","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"Reduce consumul de combustibil","correct":false,"short":"","long":"Nu este efectul.","warn":""}]},{"number":"#59","text":"555: Ce ar trebui să faci dacă te afli în zbor și observi că vântul a crescut brusc?","short":"Dacă vântul a crescut brusc, observi steaguri, fum, copaci și alte vegetații pentru a detecta schimbările vântului.","long":"Vântul se vede în obiecte din jur. Steagurile, fumul, copacii și iarba indică direcția și intensitatea. Ignorarea schimbării, creșterea altitudinii sau aterizarea imediată nu sunt pașii standard.","answers":[{"text":"Ignori schimbările și continui să zbori","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"Mărești altitudinea pentru a evita turbulențele","correct":false,"short":"","long":"Nu este măsura principală.","warn":""},{"text":"Aterizezi imediat","correct":false,"short":"","long":"Nu este măsura principală.","warn":""},{"text":"Folosești steaguri, fum, copaci și alte vegetații pentru a detecta schimbările vântului","correct":true,"short":"","long":"","warn":""}]},{"number":"#60","text":"541: Ce este o spirală asimetrică?","short":"O spirală asimetrică este o spirală care se îndreaptă ușor în fiecare revoluție și este mai sigură decât o spirală obișnuită.","long":"Varianta corectă descrie spirala asimetrică ca o spirală care se îndreaptă treptat. Verifică definiția în manualul de pregătire, pentru că termenul poate fi folosit diferit. Spirala cu frânare intensă sau cea care duce la închidere frontală sunt alte situații.","answers":[{"text":"O spirală care necesită o utilizare intensă a frânelor","correct":false,"short":"","long":"Este o altă descriere.","warn":""},{"text":"O spirală care se stabilizează automat după câteva secunde","correct":false,"short":"","long":"Nu este garantat.","warn":""},{"text":"O spirală care se îndreaptă ușor în fiecare revoluție și este mai sigură decât o spirală obișnuită","correct":true,"short":"","long":"","warn":""},{"text":"O spirală care duce la o închidere frontală a aripii","correct":false,"short":"","long":"Este o altă situație.","warn":""}]},{"number":"#61","text":"470: Suntem surprinși în zbor de condiții meteo cu care nu suntem obisnuiți și avem probleme în a ne continua traseul, cum abordăm situația:","short":"Când ești surprins de condiții meteo cu care nu ești obișnuit, încerci să te întorci pe același traseu, probabil cel mai sigur.","long":"Traseul cunoscut este cel mai bine cunoscut și are repere și posibilități de aterizare. Aterizarea de urgență fără alte manevre, trimmerele închise sau eliberarea trimmerelor pentru viteză nu sunt soluțiile corecte.","answers":[{"text":"aterizăm de urgență fără a încerca alte manevre","correct":false,"short":"","long":"Nu este procedura cea mai bună.","warn":""},{"text":"zburam cu trimerele inchise pentru a avea o aripa stabila si usor manevrabila","correct":false,"short":"Zburăm cu trimmerele închise pentru a avea o aripă stabilă și ușor manevrabilă.","long":"Nu este varianta corectă.","warn":""},{"text":"încercăm să ne întoarcem din drum pe același traseu pentru ca e probabil cel mai sigur","correct":true,"short":"Încercăm să ne întoarcem din drum pe același traseu, pentru că e probabil cel mai sigur.","long":"","warn":""},{"text":"eliberam trimerele pentru a avea viteză cat mai mare sa ieșim din zona respectivă","correct":false,"short":"Eliberăm trimmerele pentru a avea viteză cât mai mare și să ieșim din zona respectivă.","long":"Este periculos.","warn":""}]},{"number":"#62","text":"568: Cum trebuie să fie orientată direcția de aruncare a parașutei de salvare?","short":"Parașuta de salvare se aruncă spre aer curat, departe de virajele aripii sau de alte obstacole.","long":"Parașuta trebuie aruncată într-o direcție în care nu este blocată sau încurcată cu aripa. Aerul curat și lipsa obstacolelor permit deschiderea. Spre partea închisă sau spre sol nu este corect.","answers":[{"text":"Spre partea deschisă a aripii","correct":false,"short":"","long":"Nu este direcția corectă.","warn":""},{"text":"Spre partea închisă a aripii","correct":false,"short":"","long":"Nu este direcția corectă.","warn":""},{"text":"Către aer curat, departe de virajele aripii sau alte obstacole","correct":true,"short":"","long":"","warn":""},{"text":"Către sol, direct în jos","correct":false,"short":"","long":"Nu este direcția corectă.","warn":""}]},{"number":"#63","text":"554: Care este metoda recomandată pentru a penetra turbulențele?","short":"Pentru a penetra turbulențele, nu folosești speed bar, ții trimmerele neutre și aplici o presiune ușoară pe frâne.","long":"Speed bar-ul reduce stabilitatea în turbulență. Trimmerele neutre și frânarea ușoară permit aripii să se stabilizeze. Frânarea completă sau trimmerele la viteza maximă nu sunt recomandate.","answers":[{"text":"Fără trimmere și cu frânele complet trase","correct":false,"short":"","long":"Frânarea completă este periculoasă.","warn":""},{"text":"Fără speedbar, trimmere neutre și presiune ușoară pe frâne","correct":true,"short":"","long":"","warn":""},{"text":"Cu trimmere la viteza minimă și accelerația completă","correct":false,"short":"","long":"Nu este metoda recomandată.","warn":""},{"text":"Cu speedbar și trimmere la viteza maximă","correct":false,"short":"","long":"Agravează instabilitatea.","warn":""}]},{"number":"#64","text":"499: În zbor, va trebui să evitaţi o aeronavă, dvs. efectuaţi:","short":"Dacă trebuie să eviți o aeronavă, efectuezi un viraj la dreapta.","long":"Aceeași regulă ca la întrebarea 45: virajul la dreapta este regula de evitare.","answers":[{"text":"orice manevra, pentru a atrage atentia celeilalte aeronave","correct":false,"short":"Orice manevră, pentru a atrage atenția celeilalte aeronave.","long":"Nu este regula.","warn":""},{"text":"un viraj la stanga","correct":false,"short":"Un viraj la stânga.","long":"Regula este virajul la dreapta.","warn":""},{"text":"un viraj la dreapta","correct":true,"short":"","long":"","warn":""},{"text":"o coborâre","correct":false,"short":"","long":"Nu este regula standard.","warn":""}]},{"number":"#65","text":"574: Care este principalul avantaj al planificării zborului în direcția vântului la începutul unui zbor cross country?","short":"Planificarea zborului în direcția vântului la început permite o întoarcere rapidă dacă decizi să te întorci devreme, iar combustibilul se planifică mai ușor.","long":"Alte surse recomandă de regulă să începi cu vântul de față, astfel încât, dacă te întorci, să ai vânt de spate. Varianta D pornește de la ideea opusă; verifică sursa ta.","answers":[{"text":"Permite o viteză mai mare de urcare","correct":false,"short":"","long":"Nu este efectul principal.","warn":""},{"text":"Îmbunătățește performanța motorului","correct":false,"short":"","long":"Nu este efectul principal.","warn":""},{"text":"Reduce riscul de a te pierde","correct":false,"short":"","long":"Nu este efectul principal.","warn":""},{"text":"Permite o întoarcere rapidă dacă decizi să te întorci devreme, iar planificarea combustibilului este mai ușoară","correct":true,"short":"","long":"Este discutabilă; sfatul obișnuit este diferit, verifică sursa.","warn":"Sfatul uzual este să începi zborul cu vântul de față, ca la întoarcere să ai vânt de spate. Varianta D contrazice acest principiu; vezi și întrebarea 17 din pagina 05, unde răspunsul corect indică același principiu."}]},{"number":"#66","text":"559: De ce este important să verifici întotdeauna accelerația înainte de a porni motorul?","short":"Înainte de a porni motorul verifici accelerația, să te asiguri că revine la relanti.","long":"Dacă maneta nu revine, motorul poate ieși din control la pornire. Verificarea este de siguranță, la fel ca în întrebarea 1. Frânele, elicea și altimetrul nu sunt verificate în acest scop.","answers":[{"text":"Pentru a verifica funcționarea corectă a frânelor","correct":false,"short":"","long":"Nu este scopul.","warn":""},{"text":"Pentru a ajusta turația motorului","correct":false,"short":"","long":"Nu este scopul.","warn":""},{"text":"Pentru a testa elicea","correct":false,"short":"","long":"Nu este scopul.","warn":""},{"text":"Pentru a te asigura că accelerația revine la relanti","correct":true,"short":"","long":"","warn":""}]},{"number":"#67","text":"552: Care sunt riscurile asociate decolarilor dintr-un loc aglomerat cu copaci sau fire?","short":"Decolările dintr-un loc aglomerat cu copaci sau fire pot fi fatale pentru un pilot începător.","long":"Obstacolele apropiate de decolare reduc spațiul de manevră. Un pilot începător nu are experiență pentru a corecta rapid. Riscul este mare, deci locul trebuie evitat.","answers":[{"text":"Necesită un echipament special","correct":false,"short":"","long":"Nu este riscul principal.","warn":""},{"text":"Necesită mai mult timp pentru lansare","correct":false,"short":"","long":"Nu este riscul principal.","warn":""},{"text":"Pot fi fatale pentru un pilot începător","correct":true,"short":"","long":"","warn":""},{"text":"Pot duce la coliziuni ușoare","correct":false,"short":"","long":"Riscul este mai mare.","warn":""}]},{"number":"#68","text":"547: Care este metoda corectă de recuperare dintr-un stall?","short":"Recuperarea dintr-un stall se face reducând presiunea pe frâne și puterea, pentru a lăsa aripa să zboare din nou.","long":"La stall, aripa se oprește din zbor. Reducerea presiunii pe frâne și a puterii readuce unghiul de atac sub limită, iar aripa începe să zboare din nou. Tragerea bruscă sau accelerația maximă nu sunt corecte.","answers":[{"text":"Reduci presiunea pe frâne și puterea pentru a lăsa aripa să zboare din nou","correct":true,"short":"","long":"","warn":""},{"text":"Tragi brusc de frâne pentru a opri stall-ul","correct":false,"short":"","long":"Agravează situația.","warn":""},{"text":"Încerci să stabilizezi aripa folosind rezerva","correct":false,"short":"","long":"Nu este procedura.","warn":""},{"text":"Folosești accelerația maximă pentru a recupera aripa","correct":false,"short":"","long":"Nu este procedura.","warn":""}]},{"number":"#69","text":"576: Ce trebuie să faci dacă te pierzi în timpul unui zbor cross country?","short":"Dacă te pierzi în zbor cross-country, te urci mai sus pentru o perspectivă mai bună și folosești drumuri și repere importante pentru orientare.","long":"Altitudinea mai mare dă o vedere mai largă. Drumurile, râurile, căile ferate și localitățile sunt repere. Zborul în cerc sau aterizarea imediată fără orientare nu sunt soluțiile corecte.","answers":[{"text":"Încerci să găsești un râu sau o cale ferată pentru a le urma","correct":false,"short":"","long":"Este util, dar varianta corectă este urcarea și reperele.","warn":""},{"text":"Te urci mai sus pentru a obține o perspectivă mai bună și folosești drumuri și alte repere importante pentru orientare","correct":true,"short":"","long":"","warn":""},{"text":"Zbori în cerc până găsești o locație cunoscută","correct":false,"short":"","long":"Consumă combustibil și nu este procedura.","warn":""},{"text":"Aterizezi imediat pentru a cere direcții","correct":false,"short":"","long":"Nu este procedura cea mai bună.","warn":""}]},{"number":"#70","text":"519: Ce trebuie să faci pentru a minimiza riscul de a cădea în poziția „țestoasa” în cazul vântului puternic la decolare?","short":"Pentru a minimiza riscul de a cădea în poziția „țestoasă” la vânt puternic, eviți startul A în condiții de vânt puternic.","long":"Startul A, cu spatele la aripă, poate duce la intrarea aripii în „țestoasă” dacă vântul o rotește. În vânt puternic se preferă startul B sau alt tip de gonflaj, conform condițiilor.","answers":[{"text":"Folosește frânele pentru a ridica rapid aripa","correct":false,"short":"","long":"Frânele nu previn țestoasa.","warn":""},{"text":"Crește puterea motorului la maximum","correct":false,"short":"","long":"Nu previne țestoasa.","warn":""},{"text":"Evită startul A în condiții de vânt puternic","correct":true,"short":"","long":"","warn":""},{"text":"Înclină-te în față cât mai mult posibil","correct":false,"short":"","long":"Nu previne țestoasa.","warn":""}]},{"number":"#71","text":"495: Dacă motoparapanta este echipată cu paraşută de rezervă este indicată oprirea motorului după deschiderea acesteia?","short":"Dacă motoparapanta este echipată cu parașută de rezervă și ai deschis-o, oprirea motorului este obligatorie.","long":"Odată ce aripa a fost lăsată, motorul nu mai poate fi controlat pentru zbor, iar elicea ar lovi pilotul sau liniile. Oprirea motorului este obligatorie în această situație.","answers":[{"text":"motorul se opreşte dar poate fi pornit pentru a frâna la aterizare","correct":false,"short":"Motorul se oprește, dar poate fi pornit pentru a frâna la aterizare.","long":"Nu este procedura.","warn":""},{"text":"oprirea motorului este obligatorie în astfel de situaţii","correct":true,"short":"Oprirea motorului este obligatorie în astfel de situații.","long":"","warn":""},{"text":"motorul poate fi folosit pentru a continua zborul după largarea aripii","correct":false,"short":"","long":"Nu este posibil.","warn":""},{"text":"motorul trebuie sa funcţioneze pentru a ateriza în zona dorită","correct":false,"short":"Motorul trebuie să funcționeze pentru a ateriza în zona dorită.","long":"Nu este procedura.","warn":""}]},{"number":"#72","text":"524: De ce este important să eviți corectările de direcție sub 10 metri?","short":"Evitarea corecțiilor de direcție sub 10 m te ajută să te concentrezi pe flare și să eviți aterizarea în derivă.","long":"Corecțiile făcute aproape de sol pot duce la derivă sau la pierderea flare-ului. Pilotul își păstrează direcția și concentrarea pentru flare. Vederea, viteza de coborâre și economisirea energiei nu sunt motivele principale.","answers":[{"text":"Pentru a te concentra pe flare și a evita aterizarea în derivă","correct":true,"short":"","long":"","warn":""},{"text":"Pentru a avea o vedere mai bună asupra terenului","correct":false,"short":"","long":"Nu este motivul.","warn":""},{"text":"Pentru a mări viteza de coborâre","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"Pentru a economisi energie","correct":false,"short":"","long":"Nu este motivul principal.","warn":""}]},{"number":"#73","text":"553: De ce este importantă respectarea semnelor de „Interzis accesul” și evitarea traversării gardurilor?","short":"Respectarea semnelor „Interzis accesul” și evitarea traversării gardurilor previne problemele legale și păstrează relațiile bune cu proprietarii terenurilor.","long":"Zborul și aterizările trebuie făcute cu acordul proprietarilor. Încălcarea proprietății poate duce la sancțiuni și la pierderea accesului la locurile de zbor. Animalele și echipamentul sunt motive secundare.","answers":[{"text":"Pentru a evita deteriorarea echipamentului","correct":false,"short":"","long":"Nu este motivul principal.","warn":""},{"text":"Pentru a evita întâlnirile neplăcute cu animalele","correct":false,"short":"","long":"Nu este motivul principal.","warn":""},{"text":"Pentru a asigura siguranța personală în timpul lansării","correct":false,"short":"","long":"Nu este motivul principal.","warn":""},{"text":"Pentru a preveni problemele legale și a păstra relațiile bune cu proprietarii terenurilor","correct":true,"short":"","long":"","warn":""}]},{"number":"#74","text":"548: Ce trebuie să faci dacă observi o încetinire neobișnuită sau o întoarcere în timpul zborului?","short":"Dacă observi o încetinire neobișnuită sau o întoarcere în zbor, reduci imediat puterea și frânele și te pregătești să atenuezi balansul.","long":"Încetinirea neobișnuită sau întoarcerea pot fi semne de stall sau de deformare. Reducerea puterii și a frânelor readuce aripa în zbor normal. Tragerea bruscă a frânelor și creșterea vitezei nu sunt corecte.","answers":[{"text":"Tragi brusc de frâne pentru a deschide aripa","correct":false,"short":"","long":"Agravează situația.","warn":""},{"text":"Reduci imediat puterea și frânele și te pregătești să atenuezi balansul","correct":true,"short":"","long":"","warn":""},{"text":"Folosești rezerva pentru a stabiliza zborul","correct":false,"short":"","long":"Rezerva este pentru situații extreme.","warn":""},{"text":"Mărești viteza de zbor pentru a stabiliza aripa","correct":false,"short":"","long":"Nu este procedura corectă.","warn":""}]},{"number":"#75","text":"527: De ce este important să planifici o abordare finală de la aproximativ 30 de metri?","short":"Planifici abordarea finală de la aproximativ 30 m pentru a evalua înălțimea, vântul, condițiile terenului și obstacolele.","long":"La 30 m, pilotul are o imagine clară a terenului și a vântului. Din acest punct decide dacă aterizează sau face o ratare. Virajele strânse, reducerea timpului și creșterea vitezei de coborâre nu sunt scopul.","answers":[{"text":"Pentru a evalua mai bine înălțimea, vântul, condițiile terenului și obstacolele","correct":true,"short":"","long":"","warn":""},{"text":"Pentru a face viraje strânse înainte de aterizare","correct":false,"short":"","long":"Nu este scopul.","warn":""},{"text":"Pentru a reduce timpul de aterizare","correct":false,"short":"","long":"Nu este scopul.","warn":""},{"text":"Pentru a mări viteza de coborâre","correct":false,"short":"","long":"Nu este scopul.","warn":""}]},{"number":"#76","text":"523: Care este metoda corectă pentru a evita oscilațiile în timpul apropierii finale?","short":"Pentru a evita oscilațiile în apropierea finală, practici amortizarea oscilațiilor la altitudine mare și eviți corectarea lor sub aproximativ 20 m.","long":"Oscilațiile se amortizează la altitudine, unde există timp să se stabilizeze. Sub 20 m corectarea excesivă poate agrava situația. Corectarea imediată și virajele strânse nu sunt soluțiile corecte.","answers":[{"text":"Să corectezi oscilațiile imediat ce apar","correct":false,"short":"","long":"Corectarea imediată poate agrava.","warn":""},{"text":"Să practici amortizarea oscilațiilor la altitudine mare și să eviți corectarea acestora sub aproximativ 20 metri","correct":true,"short":"Să practici amortizarea oscilațiilor la altitudine mare și să eviți corectarea acestora sub aproximativ 20 m.","long":"","warn":""},{"text":"Să faci viraje strânse pentru a stabiliza aripa","correct":false,"short":"","long":"Agravează.","warn":""},{"text":"Să tragi de frâne brusc la fiecare oscilație","correct":false,"short":"","long":"Agravează.","warn":""}]},{"number":"#77","text":"515: Ce este recomandat să faci dacă nu reușești să intri în scaun imediat după decolare?","short":"Dacă nu reușești să intri în scaun imediat după decolare, continui să urci și aterizezi în 5 minute.","long":"Pilotul care nu este încă în scaun trebuie să își mențină controlul și să urce în siguranță, apoi să aterizeze controlat după ce se așază. Tragerea frânelor sau oprirea motorului nu sunt soluțiile.","answers":[{"text":"Să continui să urci și să aterizezi în 5 minute","correct":true,"short":"","long":"","warn":""},{"text":"Să tragi frânele brusc","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"Să oprești motorul","correct":false,"short":"","long":"Nu este procedura.","warn":""},{"text":"Să încerci să te urci în scaun în timp ce cobori","correct":false,"short":"","long":"Este periculos.","warn":""}]},{"number":"#78","text":"512: De ce este esențial să decolezi împotriva vântului?","short":"Decolezi împotriva vântului pentru a reduce viteza la sol, ceea ce scurtează distanța de decolare.","long":"Cu vânt de față, aripa atinge viteza de decolare față de aer cu o viteză la sol mai mică, deci distanța de decolare scade. Economia de combustibil sau vederea nu sunt motivele principale.","answers":[{"text":"Pentru a obține o viteză mai mare în aer","correct":false,"short":"","long":"Nu este motivul principal.","warn":""},{"text":"Pentru a economisi combustibil","correct":false,"short":"","long":"Nu este motivul principal.","warn":""},{"text":"Pentru a reduce viteza la sol","correct":true,"short":"","long":"","warn":""},{"text":"Pentru a avea o vedere mai bună asupra peisajului","correct":false,"short":"","long":"Nu este motivul principal.","warn":""}]},{"number":"#79","text":"475: Deasupra unui teren obstacolat:","short":"Dacă nu poți evita zona obstacolată, crești înălțimea de zbor pentru a te asigura în caz de pană de motor.","long":"Deasupra terenului obstacolat, altitudinea oferă timp și distanță pentru planare și pentru alegerea unui loc de aterizare, dacă motorul se oprește. Reducerea înălțimii sau siguranța dată de combustibil nu sunt garanții.","answers":[{"text":"nu sunt necesare alte măsuri deoarece aveți suficient combustibil pentru a traversa zona","correct":false,"short":"Nu sunt necesare alte măsuri, deoarece aveți suficient combustibil pentru a traversa zona.","long":"Combustibilul nu garantează siguranța.","warn":""},{"text":"reduceţi înălţimea de zbor pentru a vedea mai detaliat eventualele terenuri de aterizare","correct":false,"short":"Reduceți înălțimea de zbor pentru a vedea mai detaliat eventualele terenuri de aterizare.","long":"Reducerea înălțimii crește riscul.","warn":""},{"text":"nu sunt necesare alte măsuri deoarece motorul are aprindere dublă şi aveţi paraşută","correct":false,"short":"Nu sunt necesare alte măsuri, deoarece motorul are aprindere dublă și aveți parașută.","long":"Nu este garanție.","warn":""},{"text":"dacă nu puteţi evita zona creşteţi înălţimea de zbor pentru a vă asigura în caz de pană de motor","correct":true,"short":"Dacă nu puteți evita zona, creșteți înălțimea de zbor pentru a vă asigura în caz de pană de motor.","long":"","warn":""}]},{"number":"#80","text":"556: Cum pot influența condițiile termice zborul?","short":"Termicele puternice pot cauza turbulențe severe, crescând riscul de colapsuri.","long":"Curenții termici puternici creează rafale și turbulențe care pot închide aripa. Termicele slabe sunt mai blânde. Termicele pot fi folosite pentru urcare, dar necesită atenție.","answers":[{"text":"Termicele puternice pot cauza turbulențe severe, crescând riscul de colapsuri","correct":true,"short":"","long":"","warn":""},{"text":"Termicele reduc viteza de zbor","correct":false,"short":"","long":"Nu este efectul principal.","warn":""},{"text":"Termicele nu afectează zborul paramotorului","correct":false,"short":"","long":"Afectează.","warn":""},{"text":"Termicele slabe asigură un zbor lin și stabil","correct":false,"short":"","long":"Este adevărat, dar varianta corectă este cea despre termicele puternice.","warn":""}]},{"number":"#81","text":"467: În situația în care motorul are un zgomot diferit celui normal și vibrații mari, cum vom proceda în zbor?","short":"Dacă motorul are un zgomot diferit și vibrații mari, alegi un loc sigur de aterizare și oprești motorul doar dacă poți ateriza în siguranță.","long":"Zgomotul nou și vibrațiile indică un defect. Pilotul caută mai întâi un loc sigur, apoi decide. Oprirea motorului în zbor trebuie făcută doar dacă aterizarea este sigură. Continuarea traseului sau accelerarea nu sunt corecte.","answers":[{"text":"lăsăm motorul în turație constantă și ne vom continua traseul stabilit","correct":false,"short":"Lăsăm motorul în turație constantă și ne continuăm traseul stabilit.","long":"Este periculos.","warn":""},{"text":"ținem motorul în relanti până la remedierea situației","correct":false,"short":"","long":"Nu rezolvă defectul.","warn":""},{"text":"vom accelera cât mai mult pentru a evita oprirea acestuia","correct":false,"short":"","long":"Agravează defectul.","warn":""},{"text":"ne vom alege un loc sigur de aterizare și vom opri motorul dacă putem ateriza în siguranță","correct":true,"short":"","long":"","warn":""}]},{"number":"#82","text":"579: Ce trebuie să faci dacă observi trafic aerian în apropierea ta?","short":"Dacă observi trafic aerian în apropiere, menții traiectoria și altitudinea actuală, pregătindu-te să iei măsuri de evitare dacă este necesar.","long":"Schimbările bruște de direcție sau de altitudine pot surprinde alte aeronave. Pilotul menține traiectoria, observă traficul și acționează conform regulilor de evitare doar dacă devine necesar.","answers":[{"text":"Schimbi imediat direcția și altitudinea","correct":false,"short":"","long":"Schimbările bruște pot crea conflict.","warn":""},{"text":"Ignori și continui zborul","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"Accelerezi pentru a te îndepărta de traficul aerian","correct":false,"short":"","long":"Nu este procedura.","warn":""},{"text":"Menții traiectoria și altitudinea actuală, pregătindu-te să iei măsuri de evitare dacă este necesar","correct":true,"short":"","long":"","warn":""}]},{"number":"#83","text":"545: Ce trebuie să faci în cazul unei cravate?","short":"În cazul unei cravate (linii încurcate) încerci să găsești linia stabilo și tragi de ea cu forță.","long":"Cravata este o încurcătură a liniilor, care poate bloca aripa. Linia stabilo este cea care dă stabilitatea și poate fi trasă pentru a debloca. Frânarea opusă, accelerarea și reducerea completă a puterii nu rezolvă cravata.","answers":[{"text":"Tragi de frânele opuse pentru a stabiliza aripa","correct":false,"short":"","long":"Nu rezolvă cravata.","warn":""},{"text":"Mărești viteza pentru a deschide aripa","correct":false,"short":"","long":"Nu rezolvă cravata.","warn":""},{"text":"Încerci să găsești linia stabilo și tragi de ea cu forță","correct":true,"short":"","long":"","warn":""},{"text":"Încerci să stabilizezi zborul prin reducerea completă a puterii","correct":false,"short":"","long":"Nu rezolvă cravata.","warn":""}]},{"number":"#84","text":"540: Cum trebuie să te pregătești pentru o recuperare dintr-un stall?","short":"Pentru recuperarea dintr-un stall reduci presiunea pe frâne și puterea, pentru a lăsa aripa să zboare din nou.","long":"Aceeași explicație ca la întrebarea 68: reducerea presiunii pe frâne și a puterii readuce aripa în zbor.","answers":[{"text":"Tragi brusc de frâne pentru a opri stall-ul","correct":false,"short":"","long":"Agravează.","warn":""},{"text":"Reduci presiunea pe frâne și puterea pentru a lăsa aripa să zboare din nou","correct":true,"short":"","long":"","warn":""},{"text":"Folosești accelerația maximă pentru a recupera aripa","correct":false,"short":"","long":"Nu este procedura.","warn":""},{"text":"Încerci să stabilizezi aripa folosind rezerva","correct":false,"short":"","long":"Nu este procedura.","warn":""}]},{"number":"#85","text":"562: Care este greutatea care trebuie luată în considerare pentru a respecta limita maximă admisă în zbor?","short":"Greutatea care trebuie luată în calcul este cea totală: pilotul, motorul cu combustibil și aripa, gata de decolare.","long":"Limita maximă admisă se verifică cu toate componentele care sunt în zbor. Greutatea aripii fără pilot sau a motorului fără combustibil nu dă imaginea completă.","answers":[{"text":"Greutatea aripii fără pilot","correct":false,"short":"","long":"Nu este greutatea totală.","warn":""},{"text":"Greutatea aripii și a motorului fără combustibil","correct":false,"short":"","long":"Nu este greutatea totală.","warn":""},{"text":"Greutatea pilotului fără echipament","correct":false,"short":"","long":"Nu este greutatea totală.","warn":""},{"text":"Greutatea totală: tu, motorul cu combustibil și aripa, gata de decolare","correct":true,"short":"","long":"","warn":""}]},{"number":"#86","text":"537: Ce trebuie să faci în timpul unei închideri asimetrice?","short":"În timpul unei închideri asimetrice nu tragi imediat de frâne, ci corectezi cu grijă, pentru a preveni o spirală.","long":"Frânarea bruscă în închidere asimetrică poate duce la spirală sau la stall. Corectarea blândă, cu comenzile, redă aripii simetria. Frânarea opusă, reducerea completă a puterii și creșterea vitezei nu sunt soluții corecte.","answers":[{"text":"Trage de frânele opuse pentru a stabiliza aripa","correct":false,"short":"","long":"Poate duce la spirală.","warn":""},{"text":"Încească să stabilizezi zborul prin reducerea completă a puterii","correct":false,"short":"Încearcă să stabilizezi zborul prin reducerea completă a puterii.","long":"Nu este soluția principală.","warn":""},{"text":"Nu trage imediat de frâne, ci corectează cu grijă pentru a preveni o spirală","correct":true,"short":"","long":"","warn":""},{"text":"Mărește viteza pentru a deschide aripa","correct":false,"short":"","long":"Nu este procedura.","warn":""}]},{"number":"#87","text":"539: Ce se întâmplă în timpul unui full stall?","short":"În timpul unui full stall, aripa se deformează și începe să cadă vertical în jos, cu o rată de coborâre de peste 2000 FPM (aproximativ 10 m/s).","long":"La full stall, aripa își pierde complet portanța și cade. Rata de coborâre poate depăși 2000 ft/min, adică aproximativ 10 m/s. Valoarea este și corespunde conversiei.","answers":[{"text":"Aripa începe să urce rapid înainte de a se stabiliza","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"Pilotul poate sări din scaun pentru a evita o coliziune","correct":false,"short":"","long":"Nu este procedura.","warn":""},{"text":"Aripa se deformează și începe să cadă vertical în jos, cu o rată de coborâre de peste 2000 FPM (10 m/s)","correct":true,"short":"","long":"","warn":""},{"text":"Aripa se stabilizează automat fără intervenția pilotului","correct":false,"short":"","long":"Nu este garantat.","warn":""}]},{"number":"#88","text":"546: Cum poate fi provocată o închidere asimetrică?","short":"O închidere asimetrică poate fi provocată de turbulențe sau de manevre greșite.","long":"Rafalele, turbulența puternică și manevrele bruște pot închide o parte a aripii. Utilizarea accelerației, zborul la altitudine joasă sau utilizarea rezervei nu sunt cauzele directe.","answers":[{"text":"Prin turbulențe sau manevre greșite","correct":true,"short":"","long":"","warn":""},{"text":"Prin utilizarea incorectă a accelerației","correct":false,"short":"","long":"Poate contribui, dar nu este varianta principală.","warn":""},{"text":"Prin zborul la altitudine joasă","correct":false,"short":"","long":"Nu este cauza directă.","warn":""},{"text":"Prin utilizarea rezervei pentru a stabiliza zborul","correct":false,"short":"","long":"Nu este cauza.","warn":""}]},{"number":"#89","text":"501: Zburaţi pe o ruta în acelaşi timp cu o aeronavă mai lentă; efectuaţi separarea prin:","short":"Când zbori pe o rută în același timp cu o aeronavă mai lentă, faci separarea trecând pe dreapta.","long":"Pentru a evita o aeronavă care zboară în aceeași direcție dar mai lent, pilotul o depășește pe partea dreaptă, conform regulilor de trafic. Trecerea pe stânga, pe sub sau deasupra nu sunt regulile.","answers":[{"text":"stânga","correct":false,"short":"","long":"Regula este dreapta.","warn":""},{"text":"pe sub ea","correct":false,"short":"","long":"Nu este regula standard.","warn":""},{"text":"dreapta","correct":true,"short":"","long":"","warn":""},{"text":"deasupra","correct":false,"short":"","long":"Nu este regula standard.","warn":""}]},{"number":"#90","text":"494: Înainte de a porni motorul pilotul atenţionează prin folosirea expresiei:","short":"Înainte de a porni motorul, pilotul atenționează prin expresia „liber la elice?”.","long":"Expresia verifică faptul că zona elicei este liberă de persoane și obiecte. Așteptarea confirmării este obligatorie. Celelalte expresii nu sunt semnalul standard.","answers":[{"text":"atenţie pornesc","correct":false,"short":"Atenție pornesc.","long":"Nu este expresia standard de verificare.","warn":""},{"text":"liber la elice?","correct":true,"short":"","long":"","warn":""},{"text":"atenție, feriți-vă!","correct":false,"short":"","long":"Nu este expresia standard.","warn":""},{"text":"pot porni motorul?","correct":false,"short":"","long":"Nu este expresia standard de atenționare.","warn":""}]},{"number":"#91","text":"571: Când ar trebui să folosești parașuta de salvare în timpul zborului?","short":"Parașuta de salvare se folosește în caz de spirală dezvoltată, pierdere iminentă a controlului sau coliziune în aer.","long":"Parașuta de rezervă este pentru situațiile în care aripa nu mai poate fi controlată sau nu se poate recupera. Nu se folosește la decolare, la fiecare aterizare sau doar pe vreme calmă.","answers":[{"text":"La decolare pentru a stabiliza aripa","correct":false,"short":"","long":"Nu este situația.","warn":""},{"text":"În caz de spirale dezvoltate, pierdere iminentă a controlului sau coliziuni în aer","correct":true,"short":"","long":"","warn":""},{"text":"La fiecare aterizare pentru a asigura o coborâre lină","correct":false,"short":"","long":"Nu este situația.","warn":""},{"text":"Doar în condiții de vreme calmă","correct":false,"short":"","long":"Nu este situația.","warn":""}]},{"number":"#92","text":"511: Care este cea mai importantă acțiune pe care trebuie să o faci după pre-flight check și înainte de decolare?","short":"Cea mai importantă acțiune după pre-flight și înainte de decolare este încălzirea motorului.","long":"După verificarea echipamentului, motorul se încălzește conform procedurii pentru a funcționa stabil. Citirea manualului, verificarea vremii și fotografia nu sunt acțiunea principală în acest moment.","answers":[{"text":"Să încălzești motorul","correct":true,"short":"","long":"","warn":""},{"text":"Să citești manualul de utilizare","correct":false,"short":"","long":"Nu este acțiunea principală.","warn":""},{"text":"Să verifici vremea","correct":false,"short":"","long":"Este util, dar nu acțiunea principală.","warn":""},{"text":"Să faci o poză de ansamblu a echipamentului","correct":false,"short":"","long":"Nu este acțiunea principală.","warn":""}]},{"number":"#93","text":"484: Intradosul aripei este partea:","short":"Intradosul aripii este partea de sub aripă.","long":"Intradosul este fața inferioară a profilului. Extradosul este fața superioară. Partea din față și cea din spate sunt bordurile de atac și de fugă.","answers":[{"text":"de sub aripă","correct":true,"short":"","long":"","warn":""},{"text":"din faţă","correct":false,"short":"Din față.","long":"Aceasta este bordul de atac.","warn":""},{"text":"de deasupra","correct":false,"short":"","long":"Aceasta este extradosul.","warn":""},{"text":"din spate","correct":false,"short":"","long":"Aceasta este bordul de fugă.","warn":""}]},{"number":"#94","text":"534: Cum se intră corect într-un full stall?","short":"Pentru a intra într-un full stall tragi frânele în jos până când mâinile sunt blocate sub coapse.","long":"Full stall-ul se intră prin tragerea profundă a frânelor, cu mâinile până sub coapse. Aceasta deformează aripa și provoacă stallul. Recuperarea se face prin eliberarea graduală.","answers":[{"text":"Mărești viteza aripii și apoi reduci brusc puterea","correct":false,"short":"","long":"Nu este procedura.","warn":""},{"text":"Tragi brusc de frâne și eliberezi rapid după câteva secunde","correct":false,"short":"","long":"Nu este procedura.","warn":""},{"text":"Tragi frânele în jos până când mâinile sunt blocate sub coapse","correct":true,"short":"","long":"","warn":""},{"text":"Folosești accelerația maximă pentru a forța aripa în full stall","correct":false,"short":"","long":"Nu este procedura.","warn":""}]},{"number":"#95","text":"496: Cum procedaţi când va întâlniţi, în zbor, cu o aeronava care vine din faţă sau aproximativ din faţă ?","short":"Dacă vine o aeronavă din față sau aproximativ din față, virezi la dreapta, la orizontală.","long":"Regula la întâlnire frontală este virajul la dreapta, la orizontală, pentru a trece fiecare pe dreapta celuilalt. Urcarea cu 150 m, reducerea motorului sau virajul la stânga nu sunt regula.","answers":[{"text":"viraţi la stânga în urcare","correct":false,"short":"Virați la stânga în urcare.","long":"Nu este regula.","warn":""},{"text":"reduceți motorul pentru a coborî","correct":false,"short":"","long":"Nu este regula.","warn":""},{"text":"urcaţi la înălţime superioară acesteia cu 150 m","correct":false,"short":"Urcați la înălțime superioară acesteia cu 150 m.","long":"Nu este regula.","warn":""},{"text":"viraţi dreapta la orizontală","correct":true,"short":"Virați dreapta la orizontală.","long":"","warn":""}]},{"number":"#96","text":"558: Cum trebuie să fie asigurat motorul în timpul pornirii?","short":"Motorul se asigură în timpul pornirii pe un suport fix, pe spatele pilotului sau în fața unui obiect care îl ține în loc la turație maximă.","long":"Motorul trebuie fixat pentru a nu se mișca la turație mare, cu suport stabil. Suprafața plană, terenul înclinat sau structura înaltă nu sunt soluțiile corecte pentru asigurare.","answers":[{"text":"Pe un suport fix, pe spatele pilotului sau în fața unui obiect care îl poate ține în loc la turație maximă","correct":true,"short":"","long":"","warn":""},{"text":"Pe o suprafață plată","correct":false,"short":"Pe o suprafață plană.","long":"Suprafața plană nu asigură motorul.","warn":""},{"text":"Pe un teren înclinat","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"Agățat de o structură înaltă","correct":false,"short":"","long":"Nu este procedura.","warn":""}]},{"number":"#97","text":"516: Cum se face corect gonflajul aripii în condiții de vânt ușor?","short":"Gonflajul aripii în vânt ușor se face tensionând ușor suspantele, fără să strici profilul aripii.","long":"Tensionarea blândă a suspantelor ajută aripa să se umfle. Frânarea bruscă, săritura și înclinarea corpului pe spate nu sunt metodele corecte.","answers":[{"text":"Să tensionezi ușor suspantele fără strica profilul aripii","correct":true,"short":"Să tensionezi ușor suspantele fără să strici profilul aripii.","long":"","warn":""},{"text":"Să tragi brusc de frâne","correct":false,"short":"","long":"Nu este metoda corectă.","warn":""},{"text":"Să sari în sus pentru a accelera procesul","correct":false,"short":"","long":"Nu este metoda corectă.","warn":""},{"text":"Să înclini corpul pe spate","correct":false,"short":"","long":"Nu este metoda corectă.","warn":""}]},{"number":"#98","text":"529: Ce trebuie să faci dacă observi derivă în timpul aterizării?","short":"Dacă observi derivă în timpul aterizării, te aliniezi cu vântul pe final și faci corecții ușoare, evitând comenzile sub 10 metri.","long":"Deriva se corectează devreme, pe final, prin corecții ușoare. Sub 10 m corecțiile sunt evitate pentru a păstra controlul la flare. Tragerea completă a frânelor, accelerația și întoarcerea la decolare nu sunt corecte.","answers":[{"text":"Să tragi frânele complet pentru a opri derapajul","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"Să te aliniezi cu vântul pe final și să faci corecții ușoare, evitând comenzile sub 10 metri","correct":true,"short":"","long":"","warn":""},{"text":"Să accelerezi pentru a corecta deriva","correct":false,"short":"","long":"Nu este metoda corectă.","warn":""},{"text":"Să te întorci la punctul de decolare","correct":false,"short":"","long":"Nu este metoda corectă.","warn":""}]},{"number":"#99","text":"503: Inspecția înainte de zbor este:","short":"Inspecția înainte de zbor este temeinică, consistentă și neîntreruptă, deci toate variantele sunt corecte.","long":"Inspecția este temeinică (nu se omite nimic), consistentă (se face la fel de fiecare dată) și neîntreruptă (dacă se întrerupe, se reia). Toate cele trei caracteristici sunt corecte.","answers":[{"text":"consistentă – se începe din același loc și în același fel de fiecare dată","correct":false,"short":"","long":"Este o caracteristică corectă, dar nu singura.","warn":""},{"text":"temeinică – nu se omite niciun lucru","correct":false,"short":"","long":"Este o caracteristică corectă, dar nu singura.","warn":""},{"text":"neintreruptă – dacă se întrerupe se reia în totalitate","correct":false,"short":"Neîntreruptă – dacă se întrerupe se reia în totalitate.","long":"Este o caracteristică corectă, dar nu singura.","warn":""},{"text":"toate variantele sunt corecte","correct":true,"short":"","long":"","warn":""}]},{"number":"#100","text":"522: Cum trebuie să te pregătești pentru o aterizare în condiții de vânt puternic?","short":"Pentru o aterizare în vânt puternic încerci să aterizezi într-un loc fără rotor și cu panta redusă.","long":"Vântul puternic creează rotoare (turbulență) în spatele obstacolelor și pe pante. Locul fără rotor și cu panta mică reduce riscul. Trimmerele la viteza maximă, frânarea minimă sau vântul din spate nu sunt soluțiile.","answers":[{"text":"Să te asiguri că trimmerele sunt setate la viteza maximă","correct":false,"short":"","long":"Nu este soluția.","warn":""},{"text":"Să aterizezi cu vânt din spate pentru a reduce viteza de coborâre","correct":false,"short":"","long":"Vântul din spate este periculos.","warn":""},{"text":"Să încerci să aterizezi într-un loc fără rotor și cu panta redusă","correct":true,"short":"","long":"","warn":""},{"text":"Să folosești frânele cât mai puțin posibil","correct":false,"short":"","long":"Nu este soluția.","warn":""}]},{"number":"#101","text":"509: Ce este recomandat să faci dacă te încurci în suspante după o aterizare în apă?","short":"Dacă te încurci în suspante după o aterizare în apă, începi imediat să tai suspantele cu cuțitul.","long":"Dacă ești prins în suspante în apă, timpul este critic. Tăierea suspantelor cu cuțitul de siguranță permite eliberarea. Înotul în jurul suspantelor, întoarcerea la echipament și așteptarea ajutorului pot fi fatale.","answers":[{"text":"Să înoți în jurul suspantelor","correct":false,"short":"","long":"Poate duce la încurcare și mai mare.","warn":""},{"text":"Să te întorci la echipament","correct":false,"short":"","long":"Nu este soluția.","warn":""},{"text":"Să începi imediat să tai suspentele cu cuțitul","correct":true,"short":"","long":"","warn":""},{"text":"Să aștepți ajutor","correct":false,"short":"","long":"Timpul este critic.","warn":""}]},{"number":"#102","text":"521: Ce trebuie să faci pentru a aterizare cât mai corectă?","short":"Pentru o aterizare cât mai corectă ții mâinile aproape de poziția complet ridicată, fără frâne, înainte de a începe flare-ul.","long":"Mâinile ridicate, fără frâne, păstrează aripa în zbor și permit flare-ul corect. Frânarea de la 30 de picioare în sus, aterizarea cu vântul din spate și începerea prea devreme a flare-ului nu sunt corecte.","answers":[{"text":"Să tragi frânele complet de la 30 de picioare în sus","correct":false,"short":"","long":"Este greșit.","warn":""},{"text":"Să ai mâinile aproape de poziția complet ridicată (fără frâne) înainte de a începe flare-ul","correct":true,"short":"","long":"","warn":""},{"text":"Să aterizezi cu vânt din spate pentru a reduce impactul","correct":false,"short":"","long":"Vântul din spate este periculos.","warn":""},{"text":"Să începi flare-ul mai devreme","correct":false,"short":"","long":"Flare-ul devreme poate duce la stall.","warn":""}]},{"number":"#103","text":"580: Care este regula de prioritate atunci când două aeronave se apropie frontal una de alta?","short":"Când două aeronave se apropie frontal, ambele virează la dreapta.","long":"Regula la apropiere frontală este virajul la dreapta pentru ambele aeronave, astfel încât să treacă una pe lângă alta pe partea dreaptă.","answers":[{"text":"Una dintre aeronave trebuie să accelereze","correct":false,"short":"","long":"Nu este regula.","warn":""},{"text":"Ambele aeronave trebuie să vireze spre stânga","correct":false,"short":"","long":"Regula este dreapta.","warn":""},{"text":"Una dintre aeronave trebuie să urce, iar cealaltă să coboare","correct":false,"short":"","long":"Nu este regula.","warn":""},{"text":"Ambele aeronave trebuie să vireze spre dreapta","correct":true,"short":"","long":"","warn":""}]},{"number":"#104","text":"482: În ce perioada a zilei este recomandat zborul cu paramotorul, pentru ca atmosfera să fie cât mai calma:","short":"Zborul cu paramotorul este recomandat dimineața și seara, când atmosfera este mai calmă.","long":"Aceeași explicație ca la întrebarea 16: dimineața și seara vântul este mai slab și convecția mai redusă.","answers":[{"text":"dimineața și seara","correct":true,"short":"","long":"","warn":""},{"text":"în mijlocul zilei, pentru a beneficia de termice","correct":false,"short":"","long":"Termicele de amiază pot fi turbulente.","warn":""},{"text":"orice perioadă este potrivită, chiar cu riscul unei închideri parțiale a aripii","correct":false,"short":"","long":"Riscul nu este acceptabil.","warn":""},{"text":"după apusul soarelui, dacă suntem echipați cu lumini de aviație","correct":false,"short":"","long":"Zborul de noapte are alte restricții.","warn":""}]},{"number":"#105","text":"532: Care este cauza principală a unei închideri frontale (front stall)?","short":"Cauza principală a unei închideri frontale este o rafală de vânt descendentă.","long":"Închiderea frontală apare când aripa primește o rafală care coboară pe bordul de atac, deci o parte a profilului se pierde. Utilizarea incorectă a frânelor, schimbarea direcției vântului și defecțiunile sunt alte cauze, dar nu cele principale.","answers":[{"text":"O utilizare incorectă a frânelor în timpul zborului lent","correct":false,"short":"","long":"Poate contribui, dar nu este cauza principală.","warn":""},{"text":"O rafală de vânt descendentă","correct":true,"short":"","long":"","warn":""},{"text":"O schimbare bruscă a direcției vântului în timpul zborului","correct":false,"short":"","long":"Poate contribui, dar nu este cauza principală.","warn":""},{"text":"O defecțiune a echipamentului de zbor","correct":false,"short":"","long":"Nu este cauza principală.","warn":""}]},{"number":"#106","text":"483: Startul B, adica gonflajul făcut cu fața la aripă, se recomandă:","short":"Startul B, adică gonflajul cu fața la aripă, se recomandă când viteza vântului este de aproximativ 10 km/h.","long":"Startul B se folosește când vântul este suficient pentru a umfla aripa, dar nu permite startul A. Pentru vânt zero sau pentru începători, procedura este diferită. Varianta corectă indică 10 km/h.","answers":[{"text":"niciodată","correct":false,"short":"","long":"Se folosește în anumite condiții.","warn":""},{"text":"atunci cand viteza vântului este 0","correct":false,"short":"Atunci când viteza vântului este 0.","long":"Fără vânt se folosește alt gonflaj.","warn":""},{"text":"nu este relevant pentru începători","correct":false,"short":"","long":"Este relevant în anumite condiții.","warn":""},{"text":"atunci cand viteza vântului este de aproximativ 10 km/h","correct":true,"short":"Atunci când viteza vântului este de aproximativ 10 km/h.","long":"","warn":""}]},{"number":"#107","text":"570: Ce tipuri de parașute de salvare sunt disponibile și care sunt avantajele lor?","short":"Parașutele de salvare sunt dirijabile (Rogallo) și rotunde; cele dirijabile oferă o rată de coborâre îmbunătățită și posibilitatea de a evita obstacolele.","long":"Parașuta dirijabilă permite controlul direcției și coborârea mai bună, deci evitarea obstacolelor. Parașuta rotundă este mai simplă, dar fără control. Celelalte clasificări nu sunt cele standard.","answers":[{"text":"Parașute dirijabile (Rogallo) și parașute rotunde; cele dirijabile oferă o rată de coborâre îmbunătățită și posibilitatea de a evita obstacolele","correct":true,"short":"","long":"","warn":""},{"text":"Parașute cu deschidere rapidă și parașute cu deschidere lentă; cele cu deschidere lentă sunt mai sigure în zbor","correct":false,"short":"Parașute cu deschidere rapidă și parașute cu deschidere lentă.","long":"Nu este clasificarea standard.","warn":""},{"text":"Parașute frontale și parașute laterale; cele frontale sunt mai ușor de aruncat","correct":false,"short":"Parașute frontale și parașute laterale.","long":"Nu este clasificarea standard.","warn":""},{"text":"Parașute automate și parașute manuale; cele automate se deschid mai rapid","correct":false,"short":"Parașute automate și parașute manuale.","long":"Nu este clasificarea standard.","warn":""}]},{"number":"#108","text":"578: Ce echipament suplimentar ar trebui să iei cu tine într-un zbor cross country pentru a face față eventualelor situații de urgență?","short":"Pentru un zbor cross-country este bine să iei cu tine un sac de aripă simplu, în cazul în care motorul se oprește, și uneltele de bază.","long":"Sacul de aripă permite împachetarea și transportul aripii după aterizare. Uneltele de bază permit reparații în teren. Extinctorul, lanterna și costumul suplimentar nu sunt echipamentul principal.","answers":[{"text":"Un extinctor de incendiu și un rezervor de apă suplimentar","correct":false,"short":"","long":"Nu este echipamentul principal.","warn":""},{"text":"Un sac de aripă simplu în cazul în care motorul se oprește și uneltele de bază","correct":true,"short":"","long":"","warn":""},{"text":"O lanternă mare și un radio de urgență","correct":false,"short":"","long":"Este util, dar nu varianta corectă.","warn":""},{"text":"Un costum de zbor suplimentar și o pătură","correct":false,"short":"","long":"Nu este echipamentul principal.","warn":""}]},{"number":"#109","text":"488: Cum executați virajele pentru aterizare și după decolare când zburați într-o zonă de trafic de aerodrom dacă nu este prevăzut sau nu se solicită altfel?","short":"Virajele pentru aterizare și după decolare, dacă nu se solicită altfel, se execută spre stânga.","long":"Circuitul standard de trafic are viraje la stânga. Dacă nu ai o direcție impusă, respecți circuitul. Virajul de 90° la alegere sau la latitudinea pilotului nu este regula.","answers":[{"text":"spre stânga","correct":true,"short":"","long":"","warn":""},{"text":"la latitudinea dvs. deoarece nu se solicită o direcție anume","correct":false,"short":"La latitudinea dvs., deoarece nu se solicită o direcție anume.","long":"Circuitul standard este prevăzut.","warn":""},{"text":"viraj de 90 grade la alegere","correct":false,"short":"Viraj de 90 de grade la alegere.","long":"Nu este regula.","warn":""},{"text":"spre dreapta","correct":false,"short":"","long":"Circuitul standard este la stânga.","warn":""}]},{"number":"#110","text":"563: Ce efecte are încărcarea prea mare a aripii asupra zborului?","short":"Încărcarea prea mare a aripii face aripa mai dinamică, mai reactivă la comenzi și cu o viteză mai mare de înfundare.","long":"Aripa cu încărcare mare zboară mai rapid, reacționează mai puternic și coboară mai repede. Este mai greu de controlat, deci pilotul trebuie să aibă experiență. Ea nu devine mai rezistentă la colaps.","answers":[{"text":"Scade rata de cădere și crește rata de urcare","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"Devine mai ușor de umflat, dar necesită o alergare mai lentă pentru decolare","correct":false,"short":"","long":"Nu este efectul principal.","warn":""},{"text":"Devine mai dinamică, răspunde mai rapid la comenzile de control și are o viteză mai mare de înfundare","correct":true,"short":"","long":"","warn":""},{"text":"Devine mai puțin rezistentă la colapsuri","correct":false,"short":"","long":"Nu este varianta corectă; discutabil.","warn":""}]},{"number":"#111","text":"542: Ce trebuie să faci în cazul unui parachutal stall?","short":"În cazul unui parachutal stall reduci complet puterea și frânele și te pregătești să atenuezi balansul.","long":"Stallul provocat de paraşuta de frânare (parachutal stall) se recuperează reducând presiunea pe frâne și puterea, apoi pregătindu-te pentru balans. Mărirea vitezei, tragerea bruscă de frâne și folosirea rezervei nu sunt corecte.","answers":[{"text":"Reduci complet puterea și frânele și te pregătești să atenuezi balansul","correct":true,"short":"","long":"","warn":""},{"text":"Mărești viteza de zbor pentru a stabiliza aripa","correct":false,"short":"","long":"Nu este procedura.","warn":""},{"text":"Tragi brusc de frâne pentru a deschide aripa","correct":false,"short":"","long":"Agravează.","warn":""},{"text":"Folosești rezerva pentru a stabiliza zborul","correct":false,"short":"","long":"Rezerva este pentru situații extreme.","warn":""}]},{"number":"#112","text":"577: De ce este important să eviți zborul la altitudini joase în timpul unui zbor cross country?","short":"Este important să eviți zborul la altitudini joase în cross-country, pentru a evita majoritatea obstacolelor create de oameni și a scana pentru turnuri înalte.","long":"La altitudine mică, liniile electrice, antenele și turnurile sunt greu de observat. Zburând mai sus, pilotul vede mai bine și scanează eficient. Vederea și combustibilul nu sunt motivele principale.","answers":[{"text":"Pentru a evita majoritatea obstacolelor create de oameni și a scana pentru turnuri înalte","correct":true,"short":"Pentru a avea o vedere mai bună asupra peisajului.","long":"Nu este motivul principal.","warn":""},{"text":"Pentru a avea o vedere mai bună asupra peisajului","correct":false,"short":"Pentru a evita majoritatea obstacolelor create de oameni și a scana pentru turnuri înalte.","long":"Este varianta corectă.","warn":""},{"text":"Pentru a economisi combustibil","correct":false,"short":"","long":"Nu este motivul principal.","warn":""},{"text":"Pentru a reduce zgomotul perceput de oamenii de la sol","correct":false,"short":"","long":"Nu este motivul principal.","warn":""}]},{"number":"#113","text":"544: Cum poate fi evitată o închidere frontală?","short":"O închidere frontală se evită prin utilizarea corectă a accelerației și prin evitarea frânării excesive în zborul accelerat.","long":"Frânarea excesivă la viteză mare poate duce la închidere frontală. Utilizarea corectă a accelerației și a frânelor, cu moderație, previne problema. Frânarea completă în zbor lent, zborul la altitudine joasă și rezerva nu sunt soluțiile.","answers":[{"text":"Prin utilizarea completă a frânelor în timpul zborului lent","correct":false,"short":"","long":"Agravează.","warn":""},{"text":"Prin zborul la altitudine joasă","correct":false,"short":"","long":"Nu este soluția.","warn":""},{"text":"Prin utilizarea corectă a accelerației și evitarea frânării excesive în timpul zborului accelerat","correct":true,"short":"","long":"","warn":""},{"text":"Prin utilizarea rezerva pentru a stabiliza zborul","correct":false,"short":"Prin utilizarea rezervei pentru a stabiliza zborul.","long":"Nu este soluția.","warn":""}]},{"number":"#114","text":"518: Care este semnificația unui pre-flight check complet?","short":"Un pre-flight check complet asigură că toate echipamentele sunt în stare optimă și reduce riscul de accidente.","long":"Verificarea completă confirmă aripa, motorul, suspantele, seleta și combustibilul. Ea reduce riscul de accidente, pentru că defectele sunt descoperite înainte de zbor. Sentimentul de siguranță, vremea și decolarea rapidă nu sunt scopul.","answers":[{"text":"Îți dă un sentiment de siguranță","correct":false,"short":"","long":"Este un efect, nu scopul.","warn":""},{"text":"Asigură că vremea este potrivită pentru zbor","correct":false,"short":"","long":"Meteo este alt aspect.","warn":""},{"text":"Te ajută să decolezi mai repede","correct":false,"short":"","long":"Nu este scopul.","warn":""},{"text":"Asigură că toate echipamentele sunt în stare optimă și reduc riscul de accidente","correct":true,"short":"","long":"","warn":""}]},{"number":"#115","text":"480: Fazele decolării cu motoparapanta sunt:","short":"Fazele decolării cu motoparapanta sunt: gonflaj, control vizual al aripii, accelerare și desprindere.","long":"Decolarea începe cu gonflajul aripii, continuă cu verificarea vizuală a acesteia, apoi accelerarea și desprinderea de sol. Reglajele chingilor și stabilizarea sunt faze ulterioare.","answers":[{"text":"accelerare, alergare, desprindere, reglaje chingi seletă","correct":false,"short":"","long":"Ordinea nu este cea standard.","warn":""},{"text":"gonflaj, accelerare, desprindere, stabilizare","correct":false,"short":"","long":"Lipsește controlul vizual.","warn":""},{"text":"gonflaj, control vizual al aripii, accelerare, desprindere","correct":true,"short":"","long":"","warn":""},{"text":"alergare, gonflaj, desprindere, stabilizare","correct":false,"short":"","long":"Ordinea nu este cea standard.","warn":""}]},{"number":"#116","text":"538: Care este riscul principal al unei închideri frontale?","short":"Riscul principal al unei închideri frontale este o rată de coborâre care poate atinge până la 1000 FPM (5 m/s).","long":"În închiderea frontală, aripa coboară rapid. Varianta corectă indică 1000 FPM (aproximativ 5 m/s) ca valoare a ratei de coborâre. Pilotul poate pierde controlul sau aripa poate intra în spirală, dar valoarea vizează coborârea.","answers":[{"text":"Pilotul poate pierde complet controlul aripii","correct":false,"short":"","long":"Poate fi un risc, dar varianta corectă este rata de coborâre.","warn":""},{"text":"Aripa poate intra într-o spirală ascendentă","correct":false,"short":"","long":"Nu este efectul corect.","warn":""},{"text":"Rata de coborâre poate atinge până la 1000 FPM (5 m/s)","correct":true,"short":"","long":"","warn":""},{"text":"Viteza de zbor poate crește brusc","correct":false,"short":"","long":"Nu este efectul tipic.","warn":""}]},{"number":"#117","text":"567: Ce trebuie să faci imediat după ce ai decis să arunci parașuta de salvare?","short":"Când ai decis să arunci parașuta de salvare, oprești motorul, privești mânerul și tragi de el cu o mișcare puternică.","long":"Procedura de aruncare începe cu oprirea motorului, apoi privirea spre mâner și tragerea ferm. Continuarea zborului, frânarea sau așteptarea deschiderii automate nu sunt corecte. Varianta A descrie mișcarea ca „în formă de Z”, o formulare pe care o verifici cu manualul echipamentului.","answers":[{"text":"Oprește motorul, privește mânerul parașutei și trage de el cu o mișcare puternică în formă de „Z”","correct":true,"short":"","long":"Este greșită: formularea „în formă de Z” nu este procedura standard. Verifică formularea mișcării în manualul parașutei.","warn":"Formularea „în formă de Z” nu este procedura standard. Procedura este: oprești motorul, privești mânerul și trage ferm; verifică mișcarea exactă în manualul parașutei."},{"text":"Continuă să zbori și trage de frâne","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"Mărește altitudinea și pregătește-te pentru aterizare","correct":false,"short":"","long":"Nu este procedura.","warn":""},{"text":"Redu viteza și așteaptă deschiderea automată a parașutei","correct":false,"short":"","long":"Nu este procedura.","warn":""}]}]},{"id":"09","title":"Principii de zbor","questions":[{"number":"#1","text":"627: Care este efectul principal al unui unghi de atac prea mare asupra unei aripi?","short":"Un unghi de atac prea mare poate duce la stall.","long":"Unghiul de atac este unghiul dintre coarda profilului și vântul relativ. Crește portanța până la un punct, apoi aerul se desprinde de pe extrados și aripa intră în stall. Stabilitatea laterală, croaziera și consumul nu sunt efectele directe.","answers":[{"text":"optimizează stabilitatea laterală","correct":false,"short":"","long":"Nu este efectul corect.","warn":""},{"text":"poate duce la un stall","correct":true,"short":"","long":"","warn":""},{"text":"îmbunătățește portanța și reduce consumul de combustibil","correct":false,"short":"","long":"Portanța crește, dar consumul și stallul nu sunt îmbunătățiri.","warn":""},{"text":"crește viteza de croazieră","correct":false,"short":"","long":"Nu este efectul.","warn":""}]},{"number":"#2","text":"595: Conul de siguranţă este spaţiul în care putem evolua ajungând la un teren de aterizare în caz de până motor:","short":"Conul de siguranță este spațiul în care poți ajunge la un teren de aterizare dacă motorul se oprește. Afirmația este adevărată.","long":"Conul de siguranță este o zonă imaginară sub aripă, în care, dacă motorul se oprește, pilotul poate planează către un loc sigur de aterizare. Este un concept de bază la motoparapantă.","answers":[{"text":"adevărat","correct":true,"short":"","long":"","warn":""},{"text":"nu se recomandă a avea con de siguranță","correct":false,"short":"","long":"Conul este recomandat.","warn":""},{"text":"fals","correct":false,"short":"","long":"Afirmația este adevărată.","warn":""},{"text":"este o noțiune ce nu se folosește la parapantă cu motor","correct":false,"short":"","long":"Se folosește.","warn":""}]},{"number":"#3","text":"657: Ce se întâmplă dacă zbori la altitudine mare?","short":"La altitudine mare scade portanța, deci trebuie ajustată puterea.","long":"Aerul rarefiat produce mai puțină portanță la aceeași viteză, iar motorul produce mai puțină putere. Pilotul trebuie să ajusteze puterea și viteza. Consumul, stabilitatea și controlul nu se îmbunătățesc automat.","answers":[{"text":"reduce consumul de combustibil","correct":false,"short":"","long":"Nu este efectul principal.","warn":""},{"text":"scade portanța și necesită ajustarea puterii","correct":true,"short":"","long":"","warn":""},{"text":"crește portanța și stabilitatea","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"îmbunătățește controlul aripii","correct":false,"short":"","long":"Nu este efectul.","warn":""}]},{"number":"#4","text":"639: Ce se întâmplă dacă viteza paramotorului scade sub viteza de angajare?","short":"Dacă viteza scade sub viteza de angajare, aripa intră în stall și pierde rapid altitudine.","long":"Viteza de angajare este cea minimă la care aripa își păstrează portanța. Sub ea, unghiul de atac crește și aripa intră în stall. Pierderea rapidă de altitudine este consecința.","answers":[{"text":"aripa își menține altitudinea","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"aripa devine mai stabilă","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"aripa intră în stall și pierde rapid altitudine","correct":true,"short":"","long":"","warn":""},{"text":"aripa crește viteza de zbor","correct":false,"short":"","long":"Efectul este opus.","warn":""}]},{"number":"#5","text":"603: Am parcurs distanța de 30 km într-o oră cu vânt de față; viteza noastră față de aer este de 60 km/h. Ce viteza medie a avut vântul în aceasta perioadă?","short":"Dacă ai parcurs 30 km într-o oră cu vânt de față și viteza față de aer de 60 km/h, vântul a avut viteza medie de 30 km/h.","long":"Viteza față de sol este 30 km/h. Viteza față de aer este 60 km/h. Cu vânt de față, viteza față de sol = viteza față de aer − vânt, deci vântul = 60 − 30 = 30 km/h.","answers":[{"text":"0 km/h","correct":false,"short":"","long":"Vântul există, deoarece viteza la sol este mai mică decât viteza față de aer.","warn":""},{"text":"30 km/h","correct":true,"short":"","long":"Este varianta corectă: 60 − 30 = 30.","warn":""},{"text":"60 km/h","correct":false,"short":"","long":"Ar fi viteza față de aer, nu a vântului.","warn":""},{"text":"36 km/h","correct":false,"short":"","long":"Nu rezultă din calcul.","warn":""}]},{"number":"#6","text":"653: Ce ar trebui să faci dacă observi o creștere bruscă a vitezei în timpul coborârii?","short":"Dacă observi o creștere bruscă a vitezei în coborâre, ajustezi trimmerele și folosești frânele pentru a stabiliza aripa.","long":"Creșterea bruscă a vitezei în coborâre poate indica un unghi de atac prea mic sau o aripă instabilă. Ajustarea trimmerelor și frânarea ușoară stabilizează aripa. Creșterea puterii sau frânarea bruscă nu sunt corecte.","answers":[{"text":"să crești puterea motorului","correct":false,"short":"","long":"Nu este procedura corectă.","warn":""},{"text":"să tragi brusc de frâne","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"să ignori creșterea vitezei","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"să ajustezi trimmerele și să folosești frânele pentru a stabiliza","correct":true,"short":"","long":"","warn":""}]},{"number":"#7","text":"618: Cum se piloteaza dacă am pierdut o comandă în timpul zborului?","short":"Dacă ai pierdut o comandă în zbor, pilotezi cu chinga.","long":"Când o comandă nu mai poate fi folosită, aripa se controlează prin chingile din spate, care permit redresarea și virajele. Pilotarea cu corpul sau încetarea pilotării nu sunt soluțiile.","answers":[{"text":"se pilotează normal cu o comandă","correct":false,"short":"","long":"Nu este posibil cu comanda pierdută.","warn":""},{"text":"cu corpul","correct":false,"short":"","long":"Corpul ajută, dar nu este metoda principală.","warn":""},{"text":"nu mai pilotăm","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"se pilotează cu chinga","correct":true,"short":"","long":"","warn":""}]},{"number":"#8","text":"671: Cum influențează forța portanței comportamentul unei parapante în zbor?","short":"Forța portanței contracarează greutatea și menține altitudinea constantă, permițând un zbor stabil.","long":"În zbor orizontal, portanța egalează greutatea. Dacă portanța este mai mare decât greutatea, aeronava urcă. Acesta este echilibrul care permite zborul stabil. Reducerea rezistenței sau stabilizarea în turbulență nu sunt efectele principale ale portanței.","answers":[{"text":"forța portanței contracarează greutatea parapantei și menține altitudinea constantă, permițând un zbor stabil","correct":true,"short":"","long":"","warn":""},{"text":"forța portanței reduce rezistența aerodinamică și crește viteza de zbor","correct":false,"short":"","long":"Portanța nu reduce rezistența.","warn":""},{"text":"forța portanței este responsabilă doar pentru virajele strânse și manevrele rapide","correct":false,"short":"","long":"Nu este doar pentru viraje.","warn":""},{"text":"forța portanței ajută la stabilizarea parapantei în condiții de turbulență puternică","correct":false,"short":"","long":"Nu este efectul principal.","warn":""}]},{"number":"#9","text":"594: Cu cât raza virajului scade:","short":"Când raza virajului scade, crește înclinația.","long":"La viteză constantă, o rază mai mică presupune o înclinație mai mare, deoarece forța centrifugă trebuie compensată de o componentă mai mare a portanței. Înclinația crescută produce și o viteză de înfundare mai mare.","answers":[{"text":"trebuie sa reducem motorul penru a pastra vario 0","correct":false,"short":"Trebuie să reducem motorul pentru a păstra variometrul la 0.","long":"Nu este regula.","warn":""},{"text":"cu atât creşte viteza de înfundare","correct":false,"short":"Cu atât crește viteza de înfundare.","long":"Viteza de înfundare crește, dar varianta corectă este înclinația.","warn":""},{"text":"cu atât se diminueză înclinaţia","correct":false,"short":"Cu atât se diminuează înclinația.","long":"Efectul este opus.","warn":""},{"text":"cu atât creşte înclinaţia","correct":true,"short":"Cu atât crește înclinația.","long":"","warn":""}]},{"number":"#10","text":"661: Cum influențează condițiile de zbor pe vreme caldă performanța aripii?","short":"Pe vreme caldă, aerul este mai rarefiat, deci scade portanța și trebuie ajustată puterea.","long":"Aerul cald are densitate mai mică, deci aripa produce mai puțină portanță la aceeași viteză, iar motorul produce mai puțină putere. Pilotul trebuie să ajusteze puterea și să zboare cu mai multă atenție.","answers":[{"text":"scade portanța și necesită ajustarea puterii","correct":true,"short":"","long":"","warn":""},{"text":"crește portanța și stabilitatea","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"reduce consumul de combustibil","correct":false,"short":"","long":"Nu este efectul principal.","warn":""},{"text":"îmbunătățește controlul aripii","correct":false,"short":"","long":"Nu este efectul.","warn":""}]},{"number":"#11","text":"615: Viteza de curgere a fileurilor de aer pe un profil aerodinamic este:","short":"Viteza de curgere a aerului pe extrados este mai mare decât pe intrados.","long":"Profilul curbat face ca aerul de deasupra să curgă mai repede, ceea ce creează depresiunea responsabilă de portanță. Pe intrados aerul curge mai încet, iar presiunea este mai mare.","answers":[{"text":"mai mică pe extrados decât pe intrados","correct":false,"short":"","long":"Efectul este opus.","warn":""},{"text":"egală intrados cu extrados","correct":false,"short":"","long":"Nu există portanță dacă este egală.","warn":""},{"text":"mai mare pe extrados decât pe intrados","correct":true,"short":"","long":"","warn":""},{"text":"mai mare pe intrados decât pe extrados","correct":false,"short":"","long":"Efectul este opus.","warn":""}]},{"number":"#12","text":"633: Cum este afectată performanța aripii la viteze mici?","short":"La viteze mici, aripa scade portanța și stabilitatea în viraje strânse.","long":"La viteze mici, aripa are mai puțină portanță și stabilitate. În viraje strânse, riscul de stall și de colaps crește. Consumul sau manevrabilitatea în turbulență nu sunt efectele principale.","answers":[{"text":"scade portanța și stabilitatea în viraje strânse","correct":true,"short":"","long":"","warn":""},{"text":"optimizează consumul de combustibil în zborul la altitudine","correct":false,"short":"","long":"Efectul este diferit.","warn":""},{"text":"reduce stabilitatea și necesită ajustări frecvente ale trimmerelor","correct":false,"short":"","long":"Nu este formularea principală.","warn":""},{"text":"îmbunătățește manevrabilitatea în condiții de turbulențe moderate","correct":false,"short":"","long":"Efectul este opus.","warn":""}]},{"number":"#13","text":"650: Ce trebuie să faci dacă simți o scădere bruscă de altitudine în timpul zborului?","short":"Dacă simți o scădere bruscă de altitudine, crești puterea motorului și stabilizezi aripa folosind frânele.","long":"Pierderea bruscă de altitudine indică o scădere a portanței. Creșterea puterii readuce tracțiunea, iar frânele ușoare stabilizează aripa. Ignorarea problemei sau frânarea bruscă nu sunt corecte.","answers":[{"text":"să crești puterea motorului și să stabilizezi aripa folosind frânele","correct":true,"short":"","long":"","warn":""},{"text":"să ignori scăderea de altitudine","correct":false,"short":"","long":"Este periculos.","warn":""},{"text":"să reduci puterea motorului și să aștepți stabilizarea","correct":false,"short":"","long":"Nu este procedura.","warn":""},{"text":"să tragi brusc de frâne","correct":false,"short":"","long":"Este periculos.","warn":""}]},{"number":"#14","text":"608: La viteza constantă, când înclinarea creşte:","short":"La viteză constantă, când înclinarea crește, raza de viraj scade.","long":"Înclinarea mai mare produce o forță centripetă mai mare, deci virajul se strânge. Viteza constantă face ca raza să depindă de înclinare: mai mare înclinare, rază mai mică.","answers":[{"text":"rata de coborâre scade","correct":false,"short":"","long":"Efectul nu este principal.","warn":""},{"text":"nu se schimbă viteza fiind constantă","correct":false,"short":"","long":"Nu explică efectul asupra razei.","warn":""},{"text":"raza de viraj scade","correct":true,"short":"","long":"","warn":""},{"text":"raza de viraj creşte","correct":false,"short":"Raza de viraj crește.","long":"Efectul este opus.","warn":""}]},{"number":"#15","text":"614: În cazul motoparapantelor forța portantă este influențată de:","short":"În cazul motoparapantelor, forța portantă este influențată de viteza de zbor și de unghiul de incidență.","long":"Portanța crește cu pătratul vitezei și cu unghiul de inciden
