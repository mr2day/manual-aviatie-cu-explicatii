:"ulei pentru motoare marine răcite cu apă","correct":false,"short":"","long":"Este pentru alte motoare, răcite cu apă.","warn":""}]},{"number":"#42","text":"457: Care este principalul avantaj al aripilor cu aspect ratio mare?","short":"Aripile cu aspect ratio mare oferă performanță superioară la zborurile de distanță.","long":"Aspect ratio (alungirea) este raportul dintre anvergură și lățime. O alungire mare reduce rezistența indusă, deci aripa planează mai eficient, ideal pentru zboruri lungi. Aceste aripi sunt, în schimb, mai puțin manevrabile și mai greu de lansat în spații restrânse.","answers":[{"text":"sunt mai stabile la vânt puternic","correct":false,"short":"","long":"Stabilitatea nu este avantajul principal al alungirii mari.","warn":""},{"text":"sunt mai ușor de decolat","correct":false,"short":"","long":"Sunt, de regulă, mai greu de lansat.","warn":""},{"text":"performanță superioară la zborurile de distanță","correct":true,"short":"","long":"Este avantajul principal al alungirii mari.","warn":""},{"text":"manevrabilitate mai bună în spații restrânse","correct":false,"short":"","long":"Este avantajul aripilor cu alungire mică.","warn":""}]},{"number":"#43","text":"244: Când alegem un paramotor:","short":"La alegerea paramotorului se ține cont de nivelul de pilotare.","long":"Motorul trebuie să fie potrivit experienței pilotului, greutății totale și tipului de zbor. Calitatea și confortul sunt criterii secundare, iar diametrul elicei sau raportul putere-greutate sunt parametri tehnici care trebuie corelați cu pilotul.","answers":[{"text":"trebuie să ţinem cont de câteva elemente de ordin subiectiv: calitate şi finisaje, confort în zbor, locul în care va fi utilizat, tipul de utilizare","correct":false,"short":"Trebuie să ținem cont de elemente subiective: calitate, finisaje, confort, locul și tipul de utilizare.","long":"Acestea sunt criterii secundare, nu cel principal.","warn":""},{"text":"ţinem cont de nivelul de pilotare","correct":true,"short":"Ținem cont de nivelul de pilotare.","long":"Este criteriul principal de alegere.","warn":""},{"text":"ţinem cont de diametrul elicei","correct":false,"short":"Ținem cont de diametrul elicei.","long":"Este un parametru tehnic, nu criteriul principal.","warn":""},{"text":"ţinem cont de puterea motorului raportat la greutatea lui","correct":false,"short":"Ținem cont de puterea motorului raportată la greutatea lui.","long":"Este important, dar nu criteriul principal.","warn":""}]},{"number":"#44","text":"420: Ce ar trebui să faci dacă observi o deformare a aripii în timpul zborului?","short":"Dacă observi o deformare a aripii în zbor, reacția corectă este să aplici frânele pentru a stabiliza aripa.","long":"Deformarea aripii trebuie tratată cu calm și în conformitate cu procedura de recuperare. Frânele pot ajuta la stabilizarea aripii în anumite situații, dar pot și agrava o deformare asimetrică. Reducerea altitudinii rapid sau creșterea vitezei nu sunt răspunsuri corecte.","answers":[{"text":"verifică nivelul de combustibil","correct":false,"short":"","long":"Nu are legătură cu deformarea aripii în zbor.","warn":""},{"text":"crește viteza de zbor","correct":false,"short":"","long":"Creșterea vitezei poate agrava deformarea.","warn":""},{"text":"aplică frânele pentru a opri mișcarea nedorită și a stabiliza aripa","correct":true,"short":"","long":"Este răspunsul; frânele trebuie folosite cu grijă, după procedura de recuperare.","warn":""},{"text":"redu altitudinea rapid","correct":false,"short":"","long":"Nu este răspunsul corect.","warn":""}]},{"number":"#45","text":"202: Părțile fixe ale motorului unei motoparapante sunt:","short":"Părțile fixe ale motorului sunt cilindrul și carterul.","long":"Cilindrul și carterul formează structura fixă a motorului, pe care se montează piesele mobile. Pistonul, biela și arborele cotit se mișcă, deci nu sunt părți fixe. Seleta și brațele sunt părți ale paramotorului, nu ale motorului.","answers":[{"text":"cilindrul, carterul","correct":true,"short":"","long":"Sunt părțile fixe ale motorului.","warn":""},{"text":"pistonul, biela, arborele cotit","correct":false,"short":"","long":"Sunt piese mobile.","warn":""},{"text":"seleta și brațele mobile","correct":false,"short":"","long":"Nu fac parte din motor.","warn":""},{"text":"cadrul cu cercul de protecție","correct":false,"short":"","long":"Nu fac parte din motor.","warn":""}]},{"number":"#46","text":"450: Ce trebuie verificat la rezervorul de combustibil înainte de zbor?","short":"Înainte de zbor se verifică la rezervor fixarea capacului și a rezervorului, nivelul și absența scurgerilor: toate variantele sunt corecte.","long":"Rezervorul trebuie să fie fixat ferm pe cadru, cu capacul bine strâns, să aibă combustibil suficient și să nu aibă scurgeri. Toate aceste verificări sunt necesare, deci varianta care le cuprinde pe toate este corectă.","answers":[{"text":"fixarea fermă a capacului rezervorului și a rezervorului pe cadru","correct":false,"short":"Fixarea fermă a capacului și a rezervorului pe cadru.","long":"Este o parte corectă a verificării.","warn":""},{"text":"toate variantele sunt corecte","correct":true,"short":"","long":"Este varianta corectă, care le cuprinde pe toate.","warn":""},{"text":"nivelul de combustibil","correct":false,"short":"","long":"Este o parte corectă a verificării.","warn":""},{"text":"absența scurgerilor","correct":false,"short":"","long":"Este o parte corectă a verificării.","warn":""}]},{"number":"#47","text":"461: Care este principalul avantaj al aripilor de începător (EN A)?","short":"Principalul avantaj al aripii de începător EN A este stabilitatea și siguranța maximă în zbor.","long":"Aripile EN A sunt cele mai iertătoare, revin singure din colaps și au reacții previzibile. Nu sunt cele mai ușor de reparat, nici cele mai ieftine și nu permit viteze mari. Avantajul lor real este siguranța.","answers":[{"text":"sunt mai ușor de reparat în caz de avarii","correct":false,"short":"","long":"Reparabilitatea nu este avantajul principal.","warn":""},{"text":"permit viteze mai mari și viraje strânse","correct":false,"short":"","long":"Aceasta este caracteristica aripilor de performanță.","warn":""},{"text":"sunt mai ieftine decât aripile avansate","correct":false,"short":"","long":"Prețul nu este avantajul principal.","warn":""},{"text":"oferă o stabilitate și siguranță maximă în zbor","correct":true,"short":"","long":"Este avantajul principal al aripii EN A.","warn":""}]},{"number":"#48","text":"421: Ce este atașarea carabinierelor”?","short":"Atașarea carabinierelor înseamnă fixarea aripii prin buclele de suspensie la seletă.","long":"Carabinierele (sau conectorii) leagă buclele de suspensie de seletă. Fixarea trebuie să fie corectă și închisă, pentru că aici se transmite toată sarcina. Măsurarea presiunii, verificarea vitezei și ajustarea unghiului de atac nu au legătură cu această operație.","answers":[{"text":"măsurarea presiunii combustibilului","correct":false,"short":"","long":"Nu are legătură cu carabinierele.","warn":""},{"text":"fixarea aripii prin buclele de suspensie la seleta","correct":true,"short":"Fixarea aripii prin buclele de suspensie la seletă.","long":"Este definiția corectă.","warn":""},{"text":"ajustarea unghiului de atac al aripii","correct":false,"short":"","long":"Nu este operația cu carabinierele.","warn":""},{"text":"verificarea vitezei aerului","correct":false,"short":"","long":"Nu are legătură cu carabinierele.","warn":""}]},{"number":"#49","text":"427: Ce este o deformare frontală a aripii (frontstall)?","short":"Deformarea frontală (frontstall) este o deformare în care bordul de atac se pliază în jos.","long":"La un frontstall, aripa pierde presiunea în față, iar bordul de atac se îndoaie spre interior. Este o deformare cunoscută, care trebuie recunoscută și gestionată corect. Nu este o eroare de navigație, nici o turbulență sau o manevră avansată.","answers":[{"text":"o eroare de navigație comună","correct":false,"short":"","long":"Nu este o eroare de navigație.","warn":""},{"text":"un tip de turbulență cauzată de munți","correct":false,"short":"","long":"Nu este un tip de turbulență.","warn":""},{"text":"o tehnică de manevră avansată","correct":false,"short":"","long":"Este o deformare, nu o manevră.","warn":""},{"text":"o deformare în care bordul de atac se pliază în jos","correct":true,"short":"","long":"Este definiția corectă.","warn":""}]},{"number":"#50","text":"200: Rolul carburatorului, pentru un motor în 2 timpi, este:","short":"Carburatorul unui motor în doi timpi asigură amestecul aer/combustibil din motor.","long":"Carburatorul dozează aerul și combustibilul, formând amestecul care intră în cilindru. Aprinderea se face de bujie, iar fiabilitatea depinde de întreaga instalație. Carburatorul nu injectează combustibil sub presiune, ca un sistem cu injecție.","answers":[{"text":"asigură amestecul aer/combustibil în motor","correct":true,"short":"","long":"Este rolul corect al carburatorului.","warn":""},{"text":"crește fiabilitatea paramotorului","correct":false,"short":"","long":"Fiabilitatea este un efect general, nu rolul carburatorului.","warn":""},{"text":"asigură aprinderea amestecului aer/combustibil","correct":false,"short":"","long":"Aprinderea o face bujia.","warn":""},{"text":"injectează combustibil în motor","correct":false,"short":"","long":"Injecția este alt sistem, nu carburatorul.","warn":""}]},{"number":"#51","text":"443: Ce este important de făcut la verificarea periodică a aripii?","short":"La verificarea periodică a aripii se testează rezistența materialului, porozitatea și lungimea suspantelor.","long":"Verificarea periodică are scopul de a depista uzura materialului. Testul de porozitate arată dacă țesătura a pierdut din rezistență, iar măsurarea suspantelor arată dacă s-au întins. Curățarea și ajustarea trimmerelor sunt operațiuni separate.","answers":[{"text":"modifică lugimea frânelor","correct":false,"short":"Modifică lungimea frânelor.","long":"Nu este verificarea periodică a aripii.","warn":""},{"text":"ajustează poziția trimmerelor pentru un zbor mai lin","correct":false,"short":"","long":"Reglajul nu este verificarea periodică.","warn":""},{"text":"efectuează un test de rezistență a materialului și verifică porozitatea acestuia, verifică lungimea suspantelor","correct":true,"short":"Efectuează un test de rezistență a materialului, verifică porozitatea și lungimea suspantelor.","long":"Este verificarea periodică corectă.","warn":""},{"text":"curăță aripa de praf și murdărie","correct":false,"short":"","long":"Curățarea este operațiune separată.","warn":""}]},{"number":"#52","text":"419: Ce este un „B stall”?","short":"B stall este o condiție în care aripa este blocată prin tragerea liniilor B spre pieptul pilotului.","long":"Când liniile B sunt trase în exces, aripa intră în stall și nu mai zboară eficient. Este o condiție periculoasă, care trebuie evitată și recunoscută. Nu este o eroare de zbor generică, o metodă de verificare sau o tehnică de decolare.","answers":[{"text":"o eroare de zbor","correct":false,"short":"","long":"Este o condiție specifică, nu o eroare generică.","warn":""},{"text":"o metodă de verificare a motorului","correct":false,"short":"","long":"Nu este legată de motor.","warn":""},{"text":"o condiție în care aripa este blocată prin tragerea liniilor B către pieptul pilotului","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"o tehnică de decolare rapidă","correct":false,"short":"","long":"Nu este tehnică de decolare.","warn":""}]},{"number":"#53","text":"436: Cum se efectuează corect uscarea unei aripi ude?","short":"Aripa udă se întinde și se lasă să se usuce într-o zonă deschisă, de preferat la umbră.","long":"Uscarea la umbră protejează materialul de degradarea provocată de UV și de căldura excesivă. Întinderea evită pliurile care rețin umezeala și mucegaiul. Uscătorul de păr, soarele direct și mașina de spălat pot deteriora țesătura și suspantele.","answers":[{"text":"folosește un uscător de păr pentru a accelera uscarea","correct":false,"short":"","long":"Căldura poate deteriora materialul.","warn":""},{"text":"întinde aripa și las-o să se usuce într-o zonă deschisă, de preferat la umbră","correct":true,"short":"Întinde aripa și lasă-o să se usuce într-o zonă deschisă, de preferat la umbră.","long":"Este metoda corectă.","warn":""},{"text":"lasă aripa să se usuce complet la soare","correct":false,"short":"","long":"Soarele direct poate degrada materialul.","warn":""},{"text":"pune aripa într-o mașină de spălat","correct":false,"short":"","long":"Mașina de spălat poate deteriora aripa.","warn":""}]},{"number":"#54","text":"238: Ce indica variometrul?","short":"Variometrul indică viteza pe verticală.","long":"Variometrul arată cât de repede urci sau cobori, în metri pe secundă. Este instrumentul care ajută la găsirea curentului ascendent. Altitudinea o indică altimetrul, iar viteza pe orizontală și pe traiectorie sunt alte mărimi.","answers":[{"text":"viteza pe orizontala","correct":false,"short":"Viteza pe orizontală.","long":"Aceasta este viteza față de sol, nu variometrul.","warn":""},{"text":"altitudinea","correct":false,"short":"","long":"Aceasta este funcția altimetrului.","warn":""},{"text":"viteza de deplasare pe traiectorie","correct":false,"short":"","long":"Aceasta este viteza față de sol.","warn":""},{"text":"viteza pe verticală","correct":true,"short":"","long":"Este răspunsul corect.","warn":""}]},{"number":"#55","text":"208: Extradosul aripii este:","short":"Extradosul aripii este partea superioară a aripii.","long":"Extradosul este fața de sus a profilului, unde aerul curge mai repede și creează depresiunea principală. Intradosul este fața de jos. Partea de sub suspante și partea din față sunt alte noțiuni.","answers":[{"text":"partea inferioară a aripii","correct":false,"short":"","long":"Aceasta este intradosul.","warn":""},{"text":"partea superioară a suspantajului","correct":false,"short":"","long":"Suspantajul nu definește extradosul.","warn":""},{"text":"partea superioară a aripii","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"partea din faţă a aripii","correct":false,"short":"Partea din față a aripii.","long":"Aceasta este bordul de atac.","warn":""}]},{"number":"#56","text":"428: Ce rol are o elice echilibrată dinamic?","short":"Elicea echilibrată dinamic reduce vibrațiile cauzate de dezechilibrul aerodinamic în zbor.","long":"Echilibrarea dinamică ia în calcul rotația elicei, nu doar greutatea ei în repaus. Astfel se reduc vibrațiile în timpul funcționării. Ea nu previne supraîncălzirea și nu crește performanța la sol sau la decolare.","answers":[{"text":"reduce vibrațiile cauzate de dezechilibrul aerodinamic în zbor","correct":true,"short":"","long":"Este efectul corect.","warn":""},{"text":"previne supraîncălzirea motorului","correct":false,"short":"","long":"Supraîncălzirea nu depinde de echilibrare.","warn":""},{"text":"îmbunătățește stabilitatea la decolare","correct":false,"short":"","long":"Nu este efectul principal al echilibrării.","warn":""},{"text":"crește performanța motorului la sol","correct":false,"short":"","long":"Nu este efectul echilibrării.","warn":""}]},{"number":"#57","text":"409: Cum se verifică presiunea corectă a combustibilului?","short":"Presiunea corectă a combustibilului se verifică cu un manometru de presiune.","long":"Manometrul arată presiunea din linia de combustibil, care trebuie să fie în limitele indicate de constructor. Nivelul se vede vizual, temperatura se măsoară separat, iar uleiul se verifică prin alt control.","answers":[{"text":"verificând vizual nivelul combustibilului","correct":false,"short":"","long":"Nivelul nu arată presiunea.","warn":""},{"text":"măsurând temperatura motorului","correct":false,"short":"","long":"Temperatura nu indică presiunea combustibilului.","warn":""},{"text":"utilizând un manometru de presiune","correct":true,"short":"","long":"Este metoda corectă.","warn":""},{"text":"verificând nivelul de ulei","correct":false,"short":"","long":"Uleiul nu indică presiunea combustibilului.","warn":""}]},{"number":"#58","text":"438: Ce trebuie verificat la chingile aripii înainte de zbor?","short":"La chingile aripii se verifică starea materialului și a cusăturilor, precum și închiderea și strângerea carabinierelor.","long":"Chingile și cusăturile preiau sarcina, iar carabinierele trebuie închise și strânse, pentru a nu se deschide în zbor. Verificarea acestor elemente este parte din inspecția înainte de zbor. Poziția trimmerelor, lungimea suspantelor și nivelul de combustibil sunt verificări separate.","answers":[{"text":"poziția corectă a trimmerelor","correct":false,"short":"","long":"Este o verificare separată.","warn":""},{"text":"lungimea suspantelor și ajustarea frânelor","correct":false,"short":"","long":"Este o verificare separată.","warn":""},{"text":"nivelul de combustibil și ulei","correct":false,"short":"","long":"Este o verificare separată.","warn":""},{"text":"condiția materialului și a cusăturilor, închiderea și strângerea carabinierelor","correct":true,"short":"","long":"Este verificarea corectă.","warn":""}]},{"number":"#59","text":"426: De ce este importantă inspecția vizuală a aripii înainte de decolare?","short":"Inspecția vizuală a aripii înainte de decolare detectează eventualele daune sau uzură.","long":"Vizual se pot observa rupturi, găuri, cusături deschise sau suspante deteriorate. Este un control rapid care poate preveni un accident. Măsurarea altitudinii, verificarea combustibilului și ajustarea frânelor sunt alte operațiuni.","answers":[{"text":"pentru a măsura altitudinea de zbor","correct":false,"short":"","long":"Nu este scopul inspecției vizuale.","warn":""},{"text":"pentru a verifica nivelul de combustibil","correct":false,"short":"","long":"Nu este scopul inspecției aripii.","warn":""},{"text":"pentru a ajusta frânele","correct":false,"short":"","long":"Nu este scopul inspecției vizuale.","warn":""},{"text":"pentru a detecta eventualele daune sau uzură","correct":true,"short":"","long":"Este scopul corect.","warn":""}]},{"number":"#60","text":"206: Care este zona de uzură maximă a voalurii de parapantă?","short":"Zona de uzură maximă a voalurii este extradosul pe treimea anterioară, măsurată de la bordul de atac.","long":"Partea din față a extradosului este expusă cel mai mult la UV, la frecare și la contactul cu solul în timpul gonflării. De aceea se verifică prima. Intradosul și zona suspantelor se uzează altfel, iar bordul de fugă are alte probleme.","answers":[{"text":"tot extradosul","correct":false,"short":"","long":"Uzura nu este uniformă pe tot extradosul.","warn":""},{"text":"tot intradosul","correct":false,"short":"","long":"Intradosul se uzează mai puțin.","warn":""},{"text":"extrados pe treimea anterioară, măsurând de la bordul de atac","correct":true,"short":"Extradosul pe treimea anterioară, măsurând de la bordul de atac.","long":"Este zona de uzură maximă.","warn":""},{"text":"zona acroșajului suspantelor","correct":false,"short":"","long":"Acolo se verifică alte probleme, nu uzura generală.","warn":""}]},{"number":"#61","text":"212: Depăşirea masei maxime admise la decolare:","short":"Depășirea masei maxime admise la decolare este interzisă, pentru că depășește rezistența structurală.","long":"Aceeași regulă ca la întrebarea 38: masa maximă este stabilită pentru rezistența structurii. Depășirea nu este permisă și nu este lipsită de consecințe, deci nu este doar o problemă de performanță.","answers":[{"text":"aeronava va zbura cu o viteză mai mare și va avea rata de coborâre mai mare","correct":false,"short":"","long":"Consecința este mai gravă decât atât.","warn":""},{"text":"este interzisă întrucât atrage depăşirea rezistenţei structurale","correct":true,"short":"Este interzisă întrucât atrage depășirea rezistenței structurale.","long":"Este răspunsul corect.","warn":""},{"text":"are drept consecinţă doar diminuarea performanţelor aparatului","correct":false,"short":"Are drept consecință doar diminuarea performanțelor aparatului.","long":"Consecința este și structurală.","warn":""},{"text":"nu are consecinţe","correct":false,"short":"Nu are consecințe.","long":"Are consecințe.","warn":""}]},{"number":"#62","text":"423: Ce este un „colaps asimetric” al aripii?","short":"Un colaps asimetric este o deformare în care o parte a aripii se dezumflă, iar cealaltă nu.","long":"Colapsul asimetric apare când o jumătate a aripii pierde presiunea, iar cealaltă rămâne umflată. Aripa se întoarce spre partea colapsată, iar pilotul trebuie să reacționeze conform procedurii. Nu este un instrument, nici o manevră.","answers":[{"text":"o metodă de verificare a frânelor","correct":false,"short":"","long":"Nu este o verificare.","warn":""},{"text":"un tip de carburator utilizat la motoare","correct":false,"short":"","long":"Nu este legat de carburator.","warn":""},{"text":"o manevră avansată de zbor","correct":false,"short":"","long":"Este o deformare, nu o manevră.","warn":""},{"text":"o deformare în care o parte a aripii se dezumflă și cealaltă nu","correct":true,"short":"","long":"Este definiția corectă.","warn":""}]},{"number":"#63","text":"248: Un motor cu puterea de 40 kW are:","short":"Un motor de 40 kW are aproximativ 54,4 CP, cea mai apropiată variantă din listă fiind 54,8 CP.","long":"1 kW este aproximativ 1,36 CP. Deci 40 kW × 1,36 ≈ 54,4 CP. Valoarea, 54,8 CP, este cea mai apropiată dintre variantele date, deci rămâne răspunsul corect în context.","answers":[{"text":"65 C.P.","correct":false,"short":"65 CP.","long":"Este prea mult pentru 40 kW.","warn":""},{"text":"40 C.P","correct":false,"short":"40 CP.","long":"Este valoarea în kW, nu conversia în CP.","warn":""},{"text":"54,8 C.P.","correct":true,"short":"54,8 CP.","long":"Este cea mai apropiată variantă: 40 kW ≈ 54,4 CP.","warn":""},{"text":"50 C.P.","correct":false,"short":"50 CP.","long":"Este prea puțin pentru 40 kW.","warn":""}]},{"number":"#64","text":"211: Cuplul reactiv al elicei se manifestă prin:","short":"Cuplul reactiv al elicei determină tendința aeronavei de a se înclina în partea opusă rotației elicei.","long":"Conform principiului acțiunii și reacțiunii, elicea care se rotește într-un sens produce o reacție care rotește aeronava în sens invers. La paramotor această tendință se simte mai ales la decolare și la putere mare. Pilotul o compensează cu greutatea corpului sau cu ajustarea direcției.","answers":[{"text":"tendinţa aeronavei de a se înclina în partea opusă mişcării de rotaţie a elicei","correct":true,"short":"Menținerea aripii la orizontală.","long":"Nu este efectul cuplului reactiv.","warn":""},{"text":"menţinerea aripii la orizontală","correct":false,"short":"Producerea de vibrații specifice.","long":"Vibrațiile au altă cauză.","warn":""},{"text":"producerea de vibrații specifice","correct":false,"short":"Tendința aeronavei de a se înclina în partea opusă mișcării de rotație a elicei.","long":"Este efectul corect.","warn":""},{"text":"tendinţa aeronavei de a se înclina în partea mişcării de rotaţie a elicei","correct":false,"short":"Tendința aeronavei de a se înclina în partea mișcării de rotație a elicei.","long":"Sensul este inversat.","warn":""}]},{"number":"#65","text":"437: Ce trebuie să conțină un kit de reparații de urgență pentru aripă?","short":"Kitul de reparații de urgență pentru aripă conține bandă din nylon ripstop și foarfecă.","long":"Pentru reparații de urgență pe teren, kitul trebuie să conțină material care se lipește pe țesătură (ripstop) și unelte pentru a-l tăia. Soluțiile de curățare, banda adezivă obișnuită și instrumentele de măsurare nu sunt cele mai potrivite pentru reparația țesăturii.","answers":[{"text":"soluție de curățare, lavete, detergent","correct":false,"short":"","long":"Acestea sunt pentru curățare, nu pentru reparație.","warn":""},{"text":"bandă adezivă, clei, ac și ață","correct":false,"short":"","long":"Banda obișnuită și acul nu sunt cele mai potrivite pentru țesătură.","warn":""},{"text":"instrumente de măsurare, busolă, lanternă","correct":false,"short":"","long":"Nu sunt pentru reparații.","warn":""},{"text":"bandă din nylon ripstop, foarfecă","correct":true,"short":"","long":"Este varianta corectă pentru un kit de reparații.","warn":""}]},{"number":"#66","text":"400: Cum se repară o aripă deteriorată în teren?","short":"O aripă deteriorată în teren se repară prin acoperirea rupturii cu bandă din nylon ripstop.","long":"Banda ripstop se lipește pe ambele părți ale rupturii, distribuie tensiunea și oprește propagarea. Coaserea sau o soluție de etanșare nu rezistă la fel. Înlocuirea completă a secțiunii nu se face în teren.","answers":[{"text":"se folosește bandă din nylon ripstop pentru a acoperi ruptura","correct":true,"short":"","long":"Este metoda corectă de reparație în teren.","warn":""},{"text":"se coase ruptura cu un fir de nylon","correct":false,"short":"","long":"Coaserea în teren nu este metoda standard.","warn":""},{"text":"se aplică o soluție de etanșare","correct":false,"short":"","long":"Soluția nu rezistă tensiunii structurale.","warn":""},{"text":"se înlocuiește complet secțiunea deteriorată","correct":false,"short":"","long":"Nu se face în teren.","warn":""}]},{"number":"#67","text":"401: Ce trebuie verificat la propulsor înainte de fiecare zbor?","short":"Înainte de fiecare zbor se verifică starea elicei, jocul axial și monturile motorului.","long":"Elicea trebuie să fie întreagă, fără joc axial, iar motorul trebuie să fie fixat ferm pe cadru prin monturi. Aceste verificări previn vibrațiile și desprinderea motorului. Nivelul de ulei și combustibil și poziția centurii sunt alte verificări, iar altimetrul nu ține de propulsor.","answers":[{"text":"condiția elicei, jocul axial și monturile motorului","correct":true,"short":"","long":"Este verificarea corectă a propulsorului.","warn":""},{"text":"nivelul uleiului și al combustibilului","correct":false,"short":"","long":"Sunt verificări importante, dar nu cele care descriu propulsorul.","warn":""},{"text":"poziția centurii de siguranță","correct":false,"short":"","long":"Nu ține de propulsor.","warn":""},{"text":"funcționarea corectă a altimetrului","correct":false,"short":"","long":"Nu ține de propulsor.","warn":""}]},{"number":"#68","text":"397: Ce trebuie verificat la aripa înainte de decolare?","short":"Înainte de decolare se verifică suspantele: să fie conectate, fără îndoituri, rupturi sau stres evident.","long":"Suspantele sunt legătura dintre aripă și pilot, deci orice îndoitură, rupere sau tensiune anormală trebuie corectată înainte de zbor. Echipamentul de protecție și fixarea rezervei sunt verificări importante, dar nu cele care privesc specific aripa.","answers":[{"text":"pilotul trebuie să aibă echipament de protecție complet","correct":false,"short":"","long":"Este important, dar nu este verificarea aripii.","warn":""},{"text":"rezerva trebuie să fie bine fixată","correct":false,"short":"","long":"Este important, dar nu este verificarea aripii.","warn":""},{"text":"frânele trebuie să fie reglate","correct":false,"short":"","long":"Este important, dar nu este verificarea suspantelor.","warn":""},{"text":"suspantele trebuie să fie conectate, fără îndoituri și fără rupturi sau stres evident","correct":true,"short":"Suspantele trebuie să fie conectate, fără îndoituri, rupturi sau stres evident.","long":"Este verificarea corectă a aripii.","warn":""}]},{"number":"#69","text":"233: Când este o problemă oprirea motorului în zbor:","short":"Oprirea motorului în zbor este o problemă doar atunci când nu mai poți ajunge la un loc de aterizare în siguranță.","long":"Motorul oprit nu este automat o urgență, dacă pilotul poate planează către un loc sigur de aterizare. Pilotul trebuie să aleagă un loc, să își gestioneze altitudinea și să comunice dacă este nevoie. Dacă nu mai poate ajunge în siguranță, situația devine critică.","answers":[{"text":"câteodată, dacă zburăm cu pasager","correct":false,"short":"","long":"Pasagerul nu schimbă natura problemei.","warn":""},{"text":"niciodată, dacă anunțăm oprirea acestuia","correct":false,"short":"","long":"Anunțarea nu elimină problema.","warn":""},{"text":"doar atunci când nu mai putem ajunge la un loc de aterizare în siguranță","correct":true,"short":"","long":"Este răspunsul corect.","warn":""},{"text":"niciodată, atunci când zburăm cu parașută de rezervă","correct":false,"short":"","long":"Parașuta de rezervă nu înlocuiește aterizarea controlată.","warn":""}]},{"number":"#70","text":"406: Cum ar trebui să fie setate trimmerele aripii pentru decolare?","short":"Trimmerele aripii se setează, pentru decolare, în poziția neutră recomandată de producător.","long":"Poziția neutră asigură aripii o comportare previzibilă la decolare, cu stabilitate și portanță potrivită. Poziția de viteză maximă sau cea mai lentă pot face decolarea dificilă, mai ales la vânt slab.","answers":[{"text":"la poziția neutră recomandată de producător","correct":true,"short":"","long":"Este poziția corectă pentru decolare.","warn":""},{"text":"la poziția maximă de viteză","correct":false,"short":"","long":"Viteza maximă face decolarea dificilă.","warn":""},{"text":"la cea mai lentă setare","correct":false,"short":"","long":"Poate duce la stabilitate redusă sau la decolare dificilă.","warn":""},{"text":"la cea mai rapidă setare","correct":false,"short":"","long":"Nu este recomandată la decolare.","warn":""}]},{"number":"#71","text":"231: Una dintre cele mai importante verificări înainte de pornirea paramotorului în siguranță este:","short":"Înainte de pornire trebuie verificat ca legătura manetei de accelerație cu carburatorul să permită revenirea la relanti.","long":"Dacă manetei îi lipsește revenirea, motorul poate rămâne turat la pornire sau nu poate fi oprit rapid. Verificarea legăturii (cablu, arc, reglaj) este una dintre cele mai importante verificări de siguranță. Cantitatea minimă de combustibil și pornirea la turație mare nu sunt criterii de siguranță.","answers":[{"text":"în rezervor să se afle cel putin 5 litri de combustibil","correct":false,"short":"În rezervor să se afle cel puțin 5 litri de combustibil.","long":"Cantitatea nu este criteriul de siguranță.","warn":""},{"text":"motorul să pornească la turație mare","correct":false,"short":"","long":"Pornirea la turație mare este periculoasă.","warn":""},{"text":"legătura manetei de accelerație cu comanda carburatorului să permita revenirea la poziția de relanti","correct":true,"short":"Legătura manetei de accelerație cu comanda carburatorului să permită revenirea la poziția de relanti.","long":"Este verificarea de siguranță corectă.","warn":""},{"text":"anticiparea traiectoriei de decolare","correct":false,"short":"","long":"Este pregătire pentru zbor, nu verificare de pornire.","warn":""}]},{"number":"#72","text":"413: Care este scopul unui conector rapid (maillon)?","short":"Un conector rapid (maillon) conectează aripa prin buclele de suspensie la seletă.","long":"Conectorul rapid este un element metalic închis cu șurub sau cu clemă, care leagă buclele de suspensie de seletă. Trebuie să fie închis și verificat înainte de fiecare zbor. Nu măsoară presiunea, viteza sau unghiul de atac.","answers":[{"text":"conectează aripa prin buclele de suspensie la seletă","correct":true,"short":"","long":"Este scopul corect.","warn":""},{"text":"măsoară presiunea combustibilului","correct":false,"short":"","long":"Nu are legătură cu combustibilul.","warn":""},{"text":"indică viteza aerului","correct":false,"short":"","long":"Nu este un instrument.","warn":""},{"text":"reglează unghiul de atac al aripii","correct":false,"short":"","long":"Unghiul de atac nu se reglează cu conectorul.","warn":""}]},{"number":"#73","text":"250: Se numeşte bord de atac:","short":"Bordul de atac este partea din față a aripii.","long":"Bordul de atac este marginea din față a profilului, prima parte pe care o întâlnește aerul. Bordul de fugă este cel din spate. Partea din față a celulei și partea superioară a aripii sunt alte noțiuni.","answers":[{"text":"partea din faţă a celulei","correct":false,"short":"Partea din față a celulei.","long":"Celula este o unitate a aripii, nu bordul de atac.","warn":""},{"text":"partea din faţă a aripii","correct":true,"short":"Partea din față a aripii.","long":"Este definiția corectă.","warn":""},{"text":"partea din spate a aripii","correct":false,"short":"","long":"Aceasta este bordul de fugă.","warn":""},{"text":"partea superioară a aripii spre față","correct":false,"short":"","long":"Nu este definiția bordului de atac.","warn":""}]},{"number":"#74","text":"246: După perioada de șolarizare putem zbura:","short":"După perioada de școlarizare putem zbura cu o parapantă adecvată începătorilor.","long":"După școală, piloții trebuie să continue cu o aripă potrivită nivelului lor, de regulă EN A sau un EN B ușor, nu cu o aripă de performanță. Alegerea depinde de pregătire și de recomandarea instructorului, nu de experiența din școală sau de dimensiunea aripii.","answers":[{"text":"zburăm cu o aripă de dimensiuni mari","correct":false,"short":"","long":"Dimensiunea nu este criteriul.","warn":""},{"text":"EN C este potrivit pentru perioada de după școlarizare","correct":false,"short":"","long":"EN C este pentru piloți cu mai multă experiență.","warn":""},{"text":"orice aripă dacă ne-am descurat bine în școală și instructorul ne recomandă","correct":false,"short":"Orice aripă, dacă ne-am descurcat bine în școală și instructorul ne recomandă.","long":"Recomandarea instructorului contează, dar aripa trebuie să fie adecvată.","warn":""},{"text":"o parapantă adecvată începătorilor","correct":true,"short":"","long":"Este răspunsul corect.","warn":""}]},{"number":"#75","text":"444: Ce trebuie să verifici la elice înainte de fiecare zbor?","short":"Înainte de fiecare zbor se verifică elicea: toate verificările sunt corecte.","long":"Elicea trebuie să fie întreagă, fără fisuri sau ciobituri, să nu aibă joc axial și să fie fixată corect. Toate aceste verificări fac parte din inspecția înainte de zbor, deci varianta care le cuprinde pe toate este corectă.","answers":[{"text":"lipsa jocului axial","correct":false,"short":"","long":"Este o verificare corectă, dar nu singura.","warn":""},{"text":"toate sunt corecte","correct":true,"short":"","long":"Este varianta corectă, care le cuprinde pe toate.","warn":""},{"text":"integritatea elicei pentru fisuri sau ciobituri","correct":false,"short":"","long":"Este o verificare corectă, dar nu singura.","warn":""},{"text":"fixarea corectă a elicei","correct":false,"short":"","long":"Este o verificare corectă, dar nu singura.","warn":""}]},{"number":"#76","text":"455: Care este principalul avantaj al unei aripi EN B față de o aripă EN A?","short":"Principalul avantaj al unei aripi EN B față de una EN A este performanța mai mare și vitezele mai mari.","long":"Aripile EN B sunt mai rapide și mai performante decât EN A, dar cer mai multă experiență și atenție. Costul, ușurința de utilizare și stabilitatea sunt, în general, avantajele aripilor EN A.","answers":[{"text":"costul mai redus","correct":false,"short":"","long":"Costul nu este avantajul principal al EN B.","warn":""},{"text":"ușurința de utilizare și siguranța în zbor","correct":false,"short":"","long":"Acestea sunt avantajele aripilor EN A.","warn":""},{"text":"performanță mai mare și viteze mai mari","correct":true,"short":"","long":"Este avantajul principal al EN B.","warn":""},{"text":"stabilitatea la viteze mari","correct":false,"short":"","long":"Stabilitatea nu este avantajul principal.","warn":""}]},{"number":"#77","text":"448: Ce trebuie să verifici la casca de zbor înainte de decolare?","short":"Înainte de decolare se verifică casca: toate variantele sunt corecte.","long":"Casca trebuie să fie în stare bună, cu cureaua de bărbie bine fixată, iar vizorul funcțional, fără crăpături. Toate aceste aspecte fac parte din verificarea echipamentului de protecție, deci varianta care le cuprinde pe toate este corectă.","answers":[{"text":"toate variantele sunt corecte","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"fixarea corectă a curelei de bărbie","correct":false,"short":"","long":"Este o verificare corectă, dar nu singura.","warn":""},{"text":"funcționarea corectă a vizorului","correct":false,"short":"","long":"Este o verificare corectă, dar nu singura.","warn":""},{"text":"integritatea structurii căștii","correct":false,"short":"","long":"Este o verificare corectă, dar nu singura.","warn":""}]},{"number":"#78","text":"251: Ce indică variometrul?","short":"Variometrul indică viteza pe verticală.","long":"Variometrul măsoară cât de repede urci sau cobori, util pentru găsirea curenților ascendenți. Înălțimea o indică altimetrul, iar vitezele pe traiectorie și pe orizontală sunt alte mărimi.","answers":[{"text":"viteza de deplasare pe traiectorie","correct":false,"short":"","long":"Aceasta este viteza față de sol.","warn":""},{"text":"viteza pe verticală","correct":true,"short":"","long":"Este răspunsul corect.","warn":""},{"text":"înălțimea","correct":false,"short":"","long":"Aceasta este funcția altimetrului.","warn":""},{"text":"viteza pe orizontală","correct":false,"short":"","long":"Aceasta este viteza față de sol.","warn":""}]},{"number":"#79","text":"463: De ce aripile de începător au un aspect ratio mai mic?","short":"Aripile de începător au un aspect ratio mai mic pentru o manevrabilitate mai mare și o lansare mai ușoară.","long":"Aspect ratio mic (alungire mică) înseamnă aripă mai scurtă și mai răsucită, care se lansează mai ușor, răspunde mai bine și este mai iertătoare. Nu este concepută pentru zboruri de distanță sau viteză maximă.","answers":[{"text":"pentru a crește viteza maximă de zbor","correct":false,"short":"","long":"Alungirea mică nu este pentru viteză.","warn":""},{"text":"pentru a oferi o manevrabilitate mai mare și o lansare mai ușoară","correct":true,"short":"","long":"Este motivul corect.","warn":""},{"text":"pentru a permite zboruri de distanță mai lungi","correct":false,"short":"","long":"Acesta este avantajul alungirii mari.","warn":""},{"text":"pentru a reduce costurile de producți","correct":false,"short":"Pentru a reduce costurile de producție.","long":"Costul nu este motivul principal.","warn":""}]},{"number":"#80","text":"452: Ce tip de aripă este recomandată pentru piloții începători?","short":"Aripa recomandată pentru piloții începători este EN A.","long":"EN A este clasa cu cea mai mare stabilitate și iertare, potrivită începătorilor. EN B și EN C sunt pentru piloții cu experiență, iar EN D este pentru competiție.","answers":[{"text":"EN A","correct":true,"short":"","long":"Este clasa recomandată începătorilor.","warn":""},{"text":"EN C","correct":false,"short":"","long":"Este pentru piloți cu experiență.","warn":""},{"text":"EN D","correct":false,"short":"","long":"Este pentru competiție, cu experiență mare.","warn":""},{"text":"EN B","correct":false,"short":"","long":"Este pentru piloți cu experiență intermediară.","warn":""}]},{"number":"#81","text":"432: Cum se procedează corect pentru întinderea suspantelor aripii?","short":"Suspantele aripii se întind cu un sistem de scripeți, o bandă de măsurare și o greutate de 18 kg.","long":"Întinderea suspantelor se face sub o sarcină controlată, cu metoda indicată de producător, pentru ca toate să aibă aceeași lungime. Sursele consultate nu confirmă cifra de 18 kg ca standard general, deci valoarea trebuie verificată în manualul aripii. Înlocuirea suspantelor după fiecare zbor sau întinderea doar cu mâna nu sunt metodele corecte.","answers":[{"text":"folosind un sistem de scripeți, bandă de măsurare și o greutate de 18 kg","correct":true,"short":"","long":"Este metoda; greutatea exactă trebuie verificată în manualul aripii.","warn":""},{"text":"înlocuind toate suspantele după fiecare zbor","correct":false,"short":"","long":"Nu este necesar după fiecare zbor.","warn":""},{"text":"aplicând presiune uniformă cu mâna","correct":false,"short":"","long":"Presiunea manuală nu asigură aceeași tensiune.","warn":""},{"text":"verificând suspantele vizual","correct":false,"short":"","long":"Verificarea vizuală nu înlocuiește măsurarea lungimii.","warn":""}]},{"number":"#82","text":"441: Cum se repară corect o gaură mică în materialul aripii?","short":"O gaură mică în materialul aripii se repară cu bandă din nylon ripstop pe ambele părți.","long":"Banda se lipește pe ambele fețe ale materialului, astfel încât să distribuie tensiunea în jurul găurii. Înlocuirea completă a secțiunii, soluția de etanșare sau coaserea nu sunt metodele standard pentru o gaură mică.","answers":[{"text":"se folosește bandă din nylon ripstop pe ambele părți ale materialului","correct":true,"short":"","long":"Este metoda corectă.","warn":""},{"text":"se înlocuiește complet secțiunea deteriorată","correct":false,"short":"","long":"Nu este necesar pentru o gaură mică.","warn":""},{"text":"se aplică o soluție de etanșare pe marginea găurii","correct":false,"short":"","long":"Soluția nu rezistă tensiunii.","warn":""},{"text":"se coase gaura cu un fir de nylon","correct":false,"short":"","long":"Coaserea nu este metoda standard pentru materialul aripii.","warn":""}]},{"number":"#83","text":"407: Ce tip de carburator folosește motorul în doi timpi de obicei?","short":"Motorul în doi timpi folosește de obicei un carburator cu membrană.","long":"Carburatorul cu membrană funcționează în orice poziție și asigură amestecul corect la paramotor, chiar și la înclinări. Carburatorul cu bol plutitor este mai sensibil la poziție, iar cel mecanic sau electronic nu este tipul obișnuit la aceste motoare.","answers":[{"text":"carburator cu membrană","correct":true,"short":"","long":"Este tipul obișnuit pentru motoarele în doi timpi ale paramotorului.","warn":""},{"text":"carburator cu bol plutitor","correct":false,"short":"","long":"Este mai sensibil la poziția motorului.","warn":""},{"text":"carburator mecanic","correct":false,"short":"","long":"Nu este tipul obișnuit.","warn":""},{"text":"carburator electronic","correct":false,"short":"","long":"Nu este tipul obișnuit la aceste motoare.","warn":""}]},{"number":"#84","text":"235: Startul B, adică gonflajul făcut cu fața la aripă, se recomandă:","short":"Startul B (gonflajul cu fața la aripă) se recomandă atunci când viteza vântului nu permite gonflajul cu startul A.","long":"La startul A, pilotul stă cu spatele la aripă. La startul B, stă cu fața la aripă și o ridică pe ambele margini, util în vânt slab sau în condiții dificile. Se folosește când vântul nu permite startul A și nu este o metodă generală.","answers":[{"text":"nu este relevant pentru începători","correct":false,"short":"","long":"Startul B este folosit și de începători, în condiții potrivite.","warn":""},{"text":"niciodată","correct":false,"short":"","long":"Se folosește în anumite condiții.","warn":""},{"text":"atunci când viteza vântului este 0","correct":false,"short":"","long":"Fără vânt, gonflajul se face altfel.","warn":""},{"text":"atunci când viteza vântului nu permite gonflajul cu startul A","correct":true,"short":"","long":"Este condiția corectă.","warn":""}]},{"number":"#85","text":"240: Ce rol are reductorul?","short":"Reductorul micșorează turația axului elicei față de turația motorului.","long":"Reductorul transmite elicei o turație mai mică decât a motorului, ca să poată funcționa motorul la turații bune și elicea la o turație eficientă. Nu scade viteza motorului și nu mărește puterea fără să schimbe turația transmisă.","answers":[{"text":"micşorează turaţia axului elicei fată de turatia motorului","correct":true,"short":"Micșorează turația axului elicei față de turația motorului.","long":"Este rolul corect.","warn":""},{"text":"scade viteza motorului","correct":false,"short":"","long":"Reductorul nu scade viteza motorului.","warn":""},{"text":"măreşte puterea motorului, fără a modifica turaţia ce se transmite elicei","correct":false,"short":"Mărește puterea motorului, fără a modifica turația transmisă elicei.","long":"Reductorul modifică turația transmisă.","warn":""},{"text":"multiplică turaţia ce se transmite elicei","correct":false,"short":"Multiplică turația transmisă elicei.","long":"Reductorul reduce turația, nu o multiplică.","warn":""}]},{"number":"#86","text":"249: Dacă amestecul ulei/benzină este insuficient:","short":"Dacă amestecul ulei/benzină este insuficient, există riscul supraîncălzirii și al defectării motorului.","long":"Uleiul din amestec asigură ungerea pieselor interne. Dacă proporția este prea mică, ungerea este insuficientă, iar piesele se uzează sau se gripează. Supraîncălzirea și defectarea sunt consecințele principale.","answers":[{"text":"nu sunt consecinţe notabile","correct":false,"short":"Nu sunt consecințe notabile.","long":"Există consecințe, deci varianta este greșită.","warn":""},{"text":"creşte consumul de combustibil","correct":false,"short":"Crește consumul de combustibil.","long":"Consumul nu este consecința principală.","warn":""},{"text":"temperatura chiuloasei este prea mică ceeea ce conduce la o omogenitate termică slabă a motorului","correct":false,"short":"Temperatura chiulasei este prea mică, ceea ce conduce la o omogenitate termică slabă.","long":"Efectul este supraîncălzirea, nu răcirea.","warn":""},{"text":"există riscul supraîncălzirii și defectării motorului","correct":true,"short":"","long":"Este consecința corectă.","warn":""}]},{"number":"#87","text":"454: Ce caracteristică este specifică paramotoarelor cu brațe pivotante (S-arm)?","short":"Paramotoarele cu brațe pivotante (S-arm) permit o schimbare a centrului de greutate în zbor.","long":"Brațele pivotante se rotesc în zbor, mutând centrul de greutate al ansamblului. Acest lucru schimbă comportamentul paramotorului, mai ales în viraje și la viteză. Nu sunt în mod special mai ușoare la întreținere, nici mai rapide.","answers":[{"text":"sunt mai ușor de întreținut","correct":false,"short":"","long":"Nu este caracteristica specifică.","warn":""},{"text":"sunt mai greu de manevrat la sol","correct":false,"short":"","long":"Nu este caracteristica specifică.","warn":""},{"text":"permit o schimbare a centrului de greutate în zbor","correct":true,"short":"","long":"Este caracteristica corectă.","warn":""},{"text":"au o viteză maximă mai mare","correct":false,"short":"","long":"Nu este caracteristica specifică.","warn":""}]},{"number":"#88","text":"447: Ce trebuie să conțină verificarea seletei înainte de zbor?","short":"Verificarea seletei înainte de zbor cuprinde cataramele, cusăturile și ajustarea hamului: toate variantele sunt corecte.","long":"Seleta trebuie să fie funcțională, cu cataramele bine fixate, cusăturile fără uzură și ajustată pentru confort și siguranță. Toate aceste aspecte fac parte din verificare.","answers":[{"text":"asigurarea că toate cataramele sunt funcționale și bine fixate","correct":false,"short":"","long":"Este o parte corectă, dar nu singura.","warn":""},{"text":"verificarea cusăturilor pentru uzură","correct":false,"short":"","long":"Este o parte corectă, dar nu singura.","warn":""},{"text":"ajustarea hamului pentru confort și siguranță","correct":false,"short":"","long":"Este o parte corectă, dar nu singura.","warn":""},{"text":"toate variantele sunt corecte","correct":true,"short":"","long":"Este varianta corectă.","warn":""}]},{"number":"#89","text":"440: De ce este importantă verificarea curelei de transmisie a motorului?","short":"Verificarea curelei de transmisie a motorului previne alunecarea sau ruperea ei în timpul zborului.","long":"Cureaua transmite puterea motorului la elice. Dacă alunecă sau se rupe în zbor, se pierde propulsia. Verificarea tensiunii și a stării curelei previne această problemă, fiind mai importantă decât performanța generală sau zgomotul.","answers":[{"text":"pentru a îmbunătăți performanța generală a motorului","correct":false,"short":"","long":"Nu este motivul principal.","warn":""},{"text":"pentru a economisi combustibil","correct":false,"short":"","long":"Nu este motivul principal.","warn":""},{"text":"pentru a preveni alunecarea sau ruperea acesteia în timpul zborului","correct":true,"short":"","long":"Este motivul corect.","warn":""},{"text":"pentru a reduce zgomotul produs de motor","correct":false,"short":"","long":"Nu este motivul principal.","warn":""}]},{"number":"#90","text":"446: Cum se verifică sistemul de alimentare cu combustibil înainte de zbor?","short":"Sistemul de alimentare cu combustibil se verifică prin toate verificările: nivel, ventil, furtunuri.","long":"Se verifică nivelul din rezervor, ca ventilul să fie deschis și să nu se formeze vid, și furtunurile pentru scurgeri sau bule. Toate aceste verificări sunt necesare, deci varianta care le cuprinde pe toate este corectă.","answers":[{"text":"verifică nivelul de combustibil în rezervor","correct":false,"short":"","long":"Este o parte corectă, dar nu singura.","warn":""},{"text":"asigură-te că ventilul de combustibil este deschis și nu se formează vid în rezervor","correct":false,"short":"","long":"Este o parte corectă, dar nu singura.","warn":""},{"text":"toate variantele sunt corecte","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"inspectează furtunele de combustibil pentru scurgeri sau bule","correct":false,"short":"","long":"Este o parte corectă, dar nu singura.","warn":""}]},{"number":"#91","text":"456: Care este dezavantajul principal al paramotoarelor cu elice de lemn?","short":"Dezavantajul principal al elicelor din lemn este că sunt mai susceptibile la deteriorare.","long":"Lemnul poate crăpa, se poate despica sau se poate deforma sub umezeală și lovituri. Elicele din compozit sunt mai rezistente la aceste probleme, deși pot fi mai scumpe. Greutatea, zgomotul și întreținerea sunt alte aspecte.","answers":[{"text":"sunt mai grele decât elicele din materiale compozite","correct":false,"short":"","long":"Greutatea nu este dezavantajul principal.","warn":""},{"text":"sunt mai susceptibile la deteriorare","correct":true,"short":"","long":"Este dezavantajul principal.","warn":""},{"text":"sunt mai zgomotoase","correct":false,"short":"","long":"Zgomotul nu este dezavantajul principal.","warn":""},{"text":"necesită mai multă întreținere","correct":false,"short":"","long":"Întreținerea nu este dezavantajul principal.","warn":""}]},{"number":"#92","text":"416: Ce însemnă Big Ears „urechi mari”?","short":"Big Ears („urechi mari”) este o manevră în care pilotul trage liniile A exterioare pentru a plia vârfurile aripii în jos.","long":"Big Ears este o manevră de coborâre rapidă, prin pliarea vârfurilor aripii, care crește rata de coborâre. Trebuie executată cu atenție și ieșirea trebuie făcută corect. Nu este o tehnică de aterizare în vânt sau o eroare.","answers":[{"text":"o tehnică de aterizare în condiții de vânt puternic","correct":false,"short":"","long":"Nu este tehnica descrisă.","warn":""},{"text":"o metodă de verificare a aripii înainte de decolare","correct":false,"short":"","long":"Nu este o verificare.","warn":""},{"text":"o eroare comună în zborul cu parapanta","correct":false,"short":"","long":"Nu este o eroare, ci o manevră.","warn":""},{"text":"o manevră în care pilotul trage liniile A exterioare pentru a plia vârfurile aripii în jos","correct":true,"short":"","long":"Este definiția corectă.","warn":""}]},{"number":"#93","text":"439: Cum se ajustează corect frânele aripii?","short":"Frânele aripii se ajustează gonflând aripa, marcând zonele de modificare și consultând manualul producătorului.","long":"Ajustarea se face cu aripa gonflată, pentru ca lungimea să fie măsurată în condiții reale, după care se marchează ce trebuie modificat. Manualul producătorului dă valorile corecte. Înlocuirea suspantelor cu unele mai lungi sau ajustarea trimmerelor nu sunt metodele corecte.","answers":[{"text":"se verifică lungimea suspantelor și adaugă extensii dacă este necesar","correct":false,"short":"Se verifică lungimea suspantelor și se adaugă extensii dacă este necesar.","long":"Extensiile nu sunt metoda recomandată.","warn":""},{"text":"se înlocuiesc suspantele de frână cu unele mai lungi","correct":false,"short":"","long":"Nu este metoda recomandată.","warn":""},{"text":"se ajustează trimmerele pentru a schimba tensiunea frânelor","correct":false,"short":"","long":"Trimmerele nu ajustează frânele.","warn":""},{"text":"se gonflează aripa și marchează unde trebuie făcute noi modificări si consultă manualul producătorului","correct":true,"short":"Se gonflează aripa, se marchează unde trebuie făcute noi modificări și se consultă manualul producătorului.","long":"Este metoda corectă.","warn":""}]},{"number":"#94","text":"449: Cum se verifică corect funcționarea frânelor?","short":"Funcționarea frânelor se verifică prin toate verificările: suspante nerâncite, răspunsul aripii, uzura frânelor.","long":"Verificarea frânelor cuprinde: suspantele de frână să nu fie încurcate, să se tragă și să se verifice răspunsul aripii și să se inspecteze uzura. Toate sunt necesare, deci varianta care le cuprinde pe toate este corectă.","answers":[{"text":"asigură-te că suspentele de frână nu sunt încurcate","correct":false,"short":"","long":"Este o parte corectă, dar nu singura.","warn":""},{"text":"trage frânele și verifică răspunsul aripii","correct":false,"short":"","long":"Este o parte corectă, dar nu singura.","warn":""},{"text":"toate variantele sunt corecte","correct":true,"short":"","long":"Este varianta corectă.","warn":""},{"text":"inspectează frânele pentru semne de uzură","correct":false,"short":"","long":"Este o parte corectă, dar nu singura.","warn":""}]},{"number":"#95","text":"435: De ce este necesară schimbarea periodică furtunelor de combustibil?","short":"Furtunurile de combustibil se schimbă periodic pentru a preveni formarea de reziduuri care pot înfunda carburatorul.","long":"Cauciucul furtunurilor se degradează în timp și lasă reziduuri în combustibil, care pot înfunda carburatorul și jiclorul. Schimbarea periodică previne problemele de funcționare. Nu este doar pentru reducerea consumului sau pentru performanță.","answers":[{"text":"pentru a preveni scurgerile de combustibil","correct":false,"short":"","long":"Scurgerile sunt un motiv, dar nu cel principal.","warn":""},{"text":"pentru a reduce consumul de combustibil","correct":false,"short":"","long":"Consumul nu este motivul principal.","warn":""},{"text":"pentru a îmbunătăți performanța motorului","correct":false,"short":"","long":"Performanța nu este motivul principal.","warn":""},{"text":"pentru a preveni formarea de reziduuri care pot înfunda carburatorul","correct":true,"short":"","long":"Este motivul corect.","warn":""}]},{"number":"#96","text":"205: Profilul aripii de motoparapantă este dat de:","short":"Profilul aripii de motoparapantă este dat de membranele intercheson.","long":"Membranele intercheson sunt pereții interiori care separă celulele aripii și dau forma profilului, adică curbura și grosimea. Numărul de suspante, suprafața desfășurată și proiecția pe plan nu definesc profilul.","answers":[{"text":"numărul de suspante","correct":false,"short":"","long":"Suspantele nu definesc profilul.","warn":""},{"text":"membranele intercheson","correct":true,"short":"","long":"Este răspunsul corect.","warn":""},{"text":"suprafața aripii desfășurată","correct":false,"short":"","long":"Aceasta este suprafața, nu profilul.","warn":""},{"text":"proiecția aripii pe un plan orizontal","correct":false,"short":"","long":"Aceasta este proiecția, nu profilul.","warn":""}]},{"number":"#97","text":"431: Care este scopul unui conector rapid (quick link)?","short":"Un conector rapid (quick link) conectează aripa prin buclele de suspensie la seletă.","long":"Este același element ca la întrebarea 72: legătura metalică închisă între bucla de suspensie și seletă. Nu măsoară presiunea, viteza sau unghiul de atac.","answers":[{"text":"conectează aripa prin buclele de suspensie la seletă","correct":true,"short":"","long":"Este scopul corect.","warn":""},{"text":"măsoară presiunea combustibilului","correct":false,"short":"","long":"Nu are legătură cu combustibilul.","warn":""},{"text":"indică viteza aerului","correct":false,"short":"","long":"Nu este un instrument.","warn":""},{"text":"reglează unghiul de atac al aripii","correct":false,"short":"","long":"Unghiul de atac nu se reglează cu conectorul.","warn":""}]},{"number":"#98","text":"201: Care sunt factorii care duc la uzura accentuată a aripii de paramotor:","short":"Uzura aripii de paramotor este accentuată de vârstă și de expunerea la lumina solară.","long":"Materialul aripii se degradează în timp și sub expunerea la UV. De aceea se recomandă depozitarea în umbră și înlocuirea aripii după o anumită vechime sau după un anumit număr de ore. Stocarea în zonă umedă, combustibilul vechi și zborul calm nu sunt factorii principali ai uzurii.","answers":[{"text":"uzura apare doar in cazul stocării aripii într-o zonă umedă","correct":false,"short":"Uzura apare doar în cazul stocării aripii într-o zonă umedă.","long":"Umezeala contează, dar nu este singurul factor.","warn":""},{"text":"varsta și expunerea la lumina solară","correct":true,"short":"Vârsta și expunerea la lumina solară.","long":"Este răspunsul corect.","warn":""},{"text":"folosirea unui combustibil vechi","correct":false,"short":"","long":"Combustibilul nu degradează aripa.","warn":""},{"text":"zborul calm","correct":false,"short":"","long":"Zborul calm nu accelerează uzura.","warn":""}]},{"number":"#99","text":"410: Ce este „aerodinamica fluxului de aer redirecționat”?","short":"Aerodinamica fluxului de aer redirecționat înseamnă folosirea lamelor pentru a redirecționa fluxul de aer.","long":"Lamelele sau ghidajele redirecționează aerul pentru a îmbunătăți performanța, de exemplu la elice sau în jurul motorului. Reglarea frânelor, a unghiului de atac sau controlul pe trei axe sunt alte noțiuni.","answers":[{"text":"utilizarea lamelor pentru a redirecționa fluxul de aer și a îmbunătăți performanța zborului","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"reglarea frânelor pentru un zbor mai lin","correct":false,"short":"","long":"Nu este definiția.","warn":""},{"text":"ajustarea unghiului de atac al aripii","correct":false,"short":"","long":"Nu este definiția.","warn":""},{"text":"utilizarea controlului în trei axe","correct":false,"short":"","long":"Este o noțiune diferită.","warn":""}]},{"number":"#100","text":"198: Prezența ambreajului:","short":"Ambreiajul permite pornirea motorului fără ca elicea să se învârtă.","long":"Ambreiajul decuplează elicea de motor. La pornire, motorul se învârte fără să antreneze elicea, apoi ambreiajul o cuplează când motorul atinge turația potrivită. Ambreiajul nu schimbă treapta de viteză și nu este doar pentru motoarele în patru timpi.","answers":[{"text":"aduce complexitate paramotorului și scade siguranța","correct":false,"short":"","long":"Ambreiajul nu scade siguranța în sine.","warn":""},{"text":"permite schimbarea treptei de viteză","correct":false,"short":"","long":"Ambreiajul nu schimbă treapta de viteză.","warn":""},{"text":"nu este folosit decât în cazul motoarelor în 4 timpi","correct":false,"short":"Nu este folosit decât în cazul motoarelor în patru timpi.","long":"Este folosit și la alte motoare.","warn":""},{"text":"dă posibilitatea pornirii motorului fără ca elicea să se învârtă","correct":true,"short":"","long":"Este rolul corect.","warn":""}]},{"number":"#101","text":"424: Ce este un altimetru?","short":"Altimetrul este un dispozitiv care măsoară altitudinea la care te afli.","long":"Altimetrul determină altitudinea pe baza presiunii atmosferice. Direcția vântului, temperatura motorului și viteza aerului sunt măsurate de alte instrumente.","answers":[{"text":"un dispozitiv pentru determinarea direcției vântului","correct":false,"short":"","long":"Aceasta este funcția fanionului.","warn":""},{"text":"un dispozitiv care măsoară altitudinea la care te afli","correct":true,"short":"","long":"Este definiția corectă.","warn":""},{"text":"un echipament pentru controlul temperaturii motorului","correct":false,"short":"","long":"Aceasta este funcția senzorului de temperatură.","warn":""},{"text":"un instrument pentru măsurarea vitezei aerului","correct":false,"short":"","long":"Aceasta este funcția anemometrului.","warn":""}]},{"number":"#102","text":"422: Cum ar trebui să fie depozitată aripa după utilizare?","short":"După utilizare, aripa se depozitează într-un mediu uscat, pentru a preveni umezirea materialului.","long":"Umezeala și mucegaiul degradează țesătura și suspantele. Depozitarea în locuri uscate, ventilate și fără expunere la soare protejează aripa. Locul închis și comprimat poate deforma și reține umezeala, iar expunerea la soare degradează materialul.","answers":[{"text":"într-un mediu uscat pentru a preveni umezirea materialului","correct":true,"short":"Într-un mediu uscat, pentru a preveni umezirea materialului.","long":"Este varianta corectă.","warn":""},{"text":"expusă la soare pentru a se usca rapid","correct":false,"short":"","long":"Soarele degradează materialul.","warn":""},{"text":"într-un mediu umed pentru a preveni uscarea materialului","correct":false,"short":"Într-un mediu umed, pentru a preveni uscarea materialului.","long":"Umezeala degradează materialul.","warn":""},{"text":"într-un loc închis și comprimat pentru a economisi spațiu","correct":false,"short":"Într-un loc închis și comprimat, pentru a economisi spațiu.","long":"Compresia poate deteriora aripa.","warn":""}]},{"number":"#103","text":"418: Ce tip de combustibil este recomandat pentru motoarele în doi timpi?","short":"Pentru motoarele în doi timpi se folosește benzină fără plumb amestecată cu ulei pentru motoare în doi timpi.","long":"Benzina fără plumb se amestecă cu uleiul 2T în proporția recomandată de producător. Uleiul asigură ungerea motorului. Benzina simplă fără ulei, motorina și etanolul pur nu sunt combustibilii recomandați.","answers":[{"text":"benzină fără plumb amestecată cu ulei pentru motoare în doi timpi","correct":true,"short":"","long":"Este combustibilul corect.","warn":""},{"text":"benzină simplă fără aditivi","correct":false,"short":"","long":"Fără ulei, motorul în doi timpi nu este uns.","warn":""},{"text":"motorină","correct":false,"short":"","long":"Nu este combustibilul pentru motorul în doi timpi.","warn":""},{"text":"etanol pur","correct":false,"short":"","long":"Nu este combustibilul recomandat.","warn":""}]},{"number":"#104","text":"204: Alegeți afirmația adevărată:","short":"Comenzile paramotorului sau ale aripii acționează asupra bordului de fugă.","long":"Liniile de comandă (frânele) sunt fixate de bordul de fugă, deci acționarea lor schimbă direcția și viteza aripii. Liniile A sunt fixate de bordul de atac, iar stabilizatoarele nu sunt elemente ale parapantei.","answers":[{"text":"comenzile acționează asupra bordului de fugă","correct":true,"short":"","long":"Este afirmația corectă.","warn":""},{"text":"comenzile acționează asupra liniei de suspante A","correct":false,"short":"","long":"Liniile A sunt pentru accelerație sau bordul de atac, nu comenzile principale.","warn":""},{"text":"comenzile acționează asupra stabilizatoarelor","correct":false,"short":"","long":"Parapanta nu are stabilizatoare în acest sens.","warn":""},{"text":"comenzile acționează asupra liniei de suspante B","correct":false,"short":"","long":"Liniile B sunt pentru frânare sau stall, nu afirmația corectă.","warn":""}]}]},{"id":"03","title":"Legislație","questions":[{"number":"#1","text":"325: Ce drepturi au piloții străini de motoparapantă pentru a zbura în România?","short":"Piloții străini de motoparapantă pot zbura în România doar în anumite zone desemnate.","long":"Accesul piloților străini depinde de recunoașterea licenței și de respectarea regulilor locale. Varianta corectă este cea cu zonele desemnate. Condițiile exacte (recunoașterea licenței, zonele, eventualele autorizări) trebuie verificate în reglementarea actuală (RACR-LPAN ULM și legislația aeronautică), deoarece aceste cerințe pot fi modificate.","answers":[{"text":"pot zbura numai sub supravegherea unui pilot român","correct":false,"short":"","long":"Nu este varianta corectă.","warn":""},{"text":"pot zbura doar în anumite zone desemnate","correct":true,"short":"","long":"Sursele consultate arată că aeronavele ULM înmatriculate în alt stat pot zbura în România doar dacă pilotul are o licență recunoscută de Aeroclubul României, iar licențele și documentele de navigabilitate trebuie depuse la Aeroclubul României înainte de zbor. Pentru aeronave străine sunt permise doar zboruri în interes propriu și particulare. Restricția la anumite zone desemnate nu este confirmată de sursele consultate; verifică-o în RACR-LPAN ULM și în AIP România.","warn":""},{"text":"pot zbura numai dacă dețin o licență emisă de un stat UE","correct":false,"short":"","long":"Recunoașterea licenței depinde de echivalare, nu doar de statul emitent.","warn":""},{"text":"pot zbura fără restricții","correct":false,"short":"","long":"Nu există zbor fără restricții pentru piloții străini.","warn":""}]},{"number":"#2","text":"373: Ce reprezintă VMC?","short":"VMC înseamnă condițiile meteorologice pentru zboruri la vedere.","long":"VMC (Visual Meteorological Conditions) sunt condițiile în care pilotul poate vedea și evita obstacolele și alte aeronave. Sunt condiții de zbor VFR. Opusul lor sunt condițiile IMC, pentru zborul instrumental.","answers":[{"text":"condițiile de zbor pe timp de noapte","correct":false,"short":"","long":"Noaptea poate fi VMC sau nu; nu este definiția VMC.","warn":""},{"text":"regulile de zbor instrumental","correct":false,"short":"","long":"Acestea sunt regulile IFR, nu VMC.","warn":""},{"text":"sistemul de dirijare și control al traficului aerian","correct":false,"short":"","long":"Aceasta este definiția ATC.","warn":""},{"text":"condițiile meteorologice pentru zboruri la vedere","correct":true,"short":"","long":"Este definiția corectă.","warn":""}]},{"number":"#3","text":"335: Care este înălțimea maximă la care poate zbura o motoparapantă în spațiul aerian controlat?","short":"Varianta corectă indică 3000 de metri ca înălțime maximă a motoparapantei în spațiul aerian controlat.","long":"Limitele de altitudine pentru ULM în spațiul controlat sunt stabilite prin reglementarea aeronautică și prin autorizațiile de zbor. Valoarea este 3000 m, dar nu am confirmat-o în textul oficial consultat, deci trebuie verificată în RACR-LPAN ULM și în AIP România înainte de zbor.","answers":[{"text":"1500 de metri","correct":false,"short":"","long":"Nu este valoarea corectă.","warn":""},{"text":"3000 de metri","correct":true,"short":"","long":"Sursele consultate nu confirmă cifra de 3000 m ca limită de altitudine pentru ULM în spațiul controlat. În spațiul controlat zborul depinde de autorizarea ATC, iar limitele de altitudine sunt stabilite în reglementarea aplicabilă. Cifra nu am confirmat-o; verifică-o în RACR-LPAN ULM și în AIP România.","warn":""},{"text":"2000 de metri","correct":false,"short":"","long":"Nu este valoarea corectă.","warn":""},{"text":"4000 de metri","correct":false,"short":"","long":"Nu este valoarea corectă.","warn":""}]},{"number":"#4","text":"323: Care este înălțimea maximă la care poate zbura o motoparapantă în spațiul aerian G?","short":"Varianta corectă indică 3000 de metri ca înălțime maximă a motoparapantei în spațiul aerian G.","long":"Spațiul aerian G este necontrolat. Limitele depind de condițiile VMC și de reglementarea aplicabilă. Valoarea este 3000 m, dar nu am găsit confirmarea ei în sursele consultate, deci verifică-o înainte să o reții.","answers":[{"text":"3000 de metri","correct":true,"short":"","long":"Sursele consultate nu confirmă cifra de 3000 m ca limită de altitudine în spațiul G. Ce am găsit: în spațiul G, sub 3000 ft (circa 900 m), vizibilitatea minimă este de 5 km. Este o limită de vizibilitate, nu de înălțime maximă, și nu trebuie confundată cu 3000 m.","warn":""},{"text":"2000 de metri","correct":false,"short":"","long":"Nu este valoarea corectă.","warn":""},{"text":"4000 de metri","correct":false,"short":"","long":"Nu este valoarea corectă.","warn":""},{"text":"1500 de metri","correct":false,"short":"","long":"Nu este valoarea corectă.","warn":""}]},{"number":"#5","text":"394: Ce tip de licență este prevăzută pentru personalul aeronautic civil navigant al motoparapantelor conform OMTCT 630, consolidat 2023?","short":"Pentru personalul navigant al motoparapantelor, licența prevăzută este RACR-LPAN ULM.","long":"Licența de pilot pentru aeronave ultraușoare motorizate din România este emisă conform RACR-LPAN ULM. CPL, ATPL și PPL sunt licențe pentru avioane, în sistemul de licențiere EASA. Denumirea exactă a documentului și valabilitatea trebuie verificate în reglementarea actuală.","answers":[{"text":"CPL (Commercial Pilot License)","correct":false,"short":"","long":"Este licență pentru avioane, nu pentru ULM.","warn":""},{"text":"RACR - LPAN ULM","correct":true,"short":"","long":"Este licența corectă pentru personalul navigant ULM.","warn":""},{"text":"ATPL (Airline Transport Pilot License)","correct":false,"short":"","long":"Este licența pentru transportul aerian de linie.","warn":""},{"text":"PPL (Private Pilot License)","correct":false,"short":"","long":"Este licența pentru avioane, nu pentru ULM.","warn":""}]},{"number":"#6","text":"172: Evidenţa activităţii de zbor a unui pilot de aeronave ultrauşoare motorizate se ţine în:","short":"Evidența activității de zbor a pilotului de ULM se ține în carnetul de zbor.","long":"Carnetul de zbor este documentul personal în care pilotul consemnează zborurile. Livretul aeronavei este pentru aeronavă, fișa de pregătire este pentru instruire, iar cantitatea de ulei nu este evidență de zbor.","answers":[{"text":"fişa de pregătire practică în zbor","correct":false,"short":"Fișa de pregătire practică în zbor.","long":"Este pentru instruire, nu pentru evidența zborurilor.","warn":""},{"text":"livretul aeronavei","correct":false,"short":"","long":"Este documentul aeronavei, nu al pilotului.","warn":""},{"text":"carnetul de zbor","correct":true,"short":"","long":"Este documentul corect pentru evidența zborurilor.","warn":""},{"text":"cantitatea de ulei consumată","correct":false,"short":"","long":"Nu este evidența activității de zbor.","warn":""}]},{"number":"#7","text":"340: Ce document trebuie prezentat pentru recunoașterea licențelor străine de pilot de motoparapantă?","short":"Pentru recunoașterea licențelor străine de pilot de motoparapantă se prezintă certificatul de recunoaștere emis de autoritatea de certificare.","long":"Licența străină nu este valabilă automat în România. Este nevoie de un certificat de recunoaștere emis de autoritatea competentă, care arată că licența a fost echivalată. Certificatul de radiotelefonist, cel de navigabilitate și cel medical au alte roluri.","answers":[{"text":"certificatul de radiotelefonist","correct":false,"short":"","long":"Are alt rol, legat de operarea radioului.","warn":""},{"text":"certificatul de recunoaștere emis de autoritatea de certificare","correct":true,"short":"","long":"","warn":""},{"text":"certificatul de navigabilitate","correct":false,"short":"","long":"Este pentru aeronavă, nu pentru licența pilotului.","warn":""},{"text":"certificatul medical","correct":false,"short":"","long":"Este separat de recunoașterea licenței.","warn":""}]},{"number":"#8","text":"175: Care sunt, conform reglementării RACR – RA Regulile aerului, condiţiile de vizibilitate şi plafon în care o aeronavă poate decola sau ateriza de pe/pe un aerodrom situat într-o zonă de control sau să intre în zona de trafic de aerodrom sau în procedura de trafic?","short":"Pentru decolare sau aterizare pe aerodromul din zona de control sau în zona de trafic, varianta corectă indică plafon de 450 m și vizibilitate la sol de 5 km.","long":"Condițiile minime de plafon și vizibilitate pentru decolare și aterizare în zona de control sunt stabilite prin RACR-RA (Regulile aerului). Valorile sunt 450 m și 5 km. Nu le-am confirmat în textul oficial, deci verifică-le înainte de utilizare.","answers":[{"text":"plafon la 1000 m, vizibilitate la sol 10 km","correct":false,"short":"","long":"Nu este varianta corectă.","warn":""},{"text":"plafon la 1500 m, vizibilitate la sol 10 km","correct":false,"short":"","long":"Nu este varianta corectă.","warn":""},{"text":"plafon la 1500 m, vizibilitate la sol 5 km","correct":false,"short":"","long":"Nu este varianta corectă.","warn":""},{"text":"plafon la 450 m, vizibilitate la sol 5 km","correct":true,"short":"","long":"Conform RACR-RA (4.020), o aeronavă VFR nu poate decola sau ateriza pe un aerodrom din zona de control dacă plafonul este sub 450 m (1500 ft) sau vizibilitatea la sol este sub 5 km, decât cu autorizare ATC. Varianta D are exact aceste valori, iar celelalte variante au plafoane sau vizibilități diferite.","warn":""}]},{"number":"#9","text":"176: Terenurile sau suprafeţele de apă, altele decât aerodromurile certificate de pe/pe care se pot efectua decolări şi aterizări ale aeronavelor civile, trebuie să:","short":"Terenurile sau suprafețele de apă, altele decât aerodromurile certificate, trebuie să aibă acordul proprietarului și să fie în afara zonelor dens populate, la cel puțin 150 m de locuințe.","long":"Decolarea sau aterizarea pe alte terenuri necesită acordul proprietarului sau administratorului, iar terenul trebuie să permită decolare și aterizare în siguranță, departe de zonele populate și de locuințe. Varianta reunește aceste condiții. Distanța de 150 m trebuie verificată în reglementarea actuală.","answers":[{"text":"să obţină acordul proprietarului terenului sau al administratorului şi să fie amplasate în afara zonelor dens populate, la o distanță nu mai mică de 150 m de o locuință, iar dimensiunile terenului să permită decolarea/ aterizarea în condiții de siguranță","correct":true,"short":"Să aibă o lățime minimă de 50 m, lungime minimă de 500 m și să nu fie obstacolate la mai puțin de 200 m față de praguri.","long":"Sunt dimensiuni pentru aerodrom, nu condițiile pentru teren.","warn":""},{"text":"aibă o lăţime minima de 50 m, lungime minimă de 500 m, să nu fie obstacolate la mai puţin de 200 m faţa de praguri pe directive","correct":false,"short":"Să fie cosite sau betonate.","long":"Nu este condiția corectă.","warn":""},{"text":"să fie cosite sau betonate","correct":false,"short":"Să obțină acordul proprietarului sau al administratorului, să fie în afara zonelor dens populate, la cel puțin 150 m de o locuință, iar dimensiunile să permită decolarea și aterizarea în siguranță.","long":"Nu este varianta corectă.","warn":""},{"text":"fie autorizate de primărie","correct":false,"short":"Să fie autorizate de primărie.","long":"Nu este condiția corectă.","warn":""}]},{"number":"#10","text":"188: Este permis zborul VFR în spaţiul aerian de clasă A?","short":"Zborul VFR nu este permis în spațiul aerian de clasă A.","long":"Clasa A este spațiul cel mai strict controlat, în care zborurile se fac numai IFR, cu autorizare de la ATC. VFR nu este permis în această clasă, deci răspunsul „nu” este corect. Restul variantelor contrazic regula.\n\nClasa A este spațiu controlat în care zborul este permis doar IFR, cu autorizare ATC; VFR nu este permis.","answers":[{"text":"nu","correct":true,"short":"","long":"Este răspunsul corect: VFR nu este permis în clasa A.","warn":""},{"text":"da","correct":false,"short":"","long":"Nu este permis zborul VFR în clasa A.","warn":""},{"text":"doar în timpul zilei","correct":false,"short":"","long":"Ziua nu schimbă regula pentru clasa A.","warn":""},{"text":"cu autorizarea unităţii de trafic aerian respective","correct":false,"short":"Cu autorizarea unității de trafic aerian respective.","long":"Autorizarea nu transformă clasa A în spațiu pentru VFR.","warn":""}]},{"number":"#11","text":"384: Ce se întâmplă cu aeronavele civile care aterizează în România fără a respecta reglementările?","short":"Aeronavele care aterizează în România fără a respecta reglementările pot fi reținute la sol până la plata datoriilor sau constituirea garanțiilor.","long":"Autoritățile pot reține aeronava dacă există datorii, sancțiuni sau lipsa unor garanții. Reținerea este temporară și se ridică la plata datoriilor sau la constituirea garanțiilor. Confiscarea definitivă, returnarea automată și distrugerea imediată nu sunt măsurile prevăzute.","answers":[{"text":"pot fi reținute la sol până la stingerea debitelor sau constituirea unor garanții suficiente","correct":true,"short":"","long":"","warn":""},{"text":"sunt confiscate definitiv de autorități","correct":false,"short":"","long":"Confiscarea definitivă nu este măsura prevăzută.","warn":""},{"text":"sunt returnate automat la punctul de origine","correct":false,"short":"","long":"Nu este măsura prevăzută.","warn":""},{"text":"sunt distruse imediat","correct":false,"short":"","long":"Nu este măsura prevăzută.","warn":""}]},{"number":"#12","text":"369: Ce autoritate reglementează funcționarea aerodromurilor civile?","short":"Funcționarea aerodromurilor civile este reglementată de Ministerul Transporturilor.","long":"Ministerul Transporturilor, Construcțiilor și Turismului (MTCT) reglementează aviația civilă, inclusiv aerodromurile. Administrația locală, Autoritatea Națională de Securitate și Ministerul Apărării au alte atribuții în domeniu.","answers":[{"text":"Administrația locală","correct":false,"short":"","long":"Nu reglementează aerodromurile civile.","warn":""},{"text":"Ministerul Transporturilor","correct":true,"short":"","long":"","warn":""},{"text":"Autoritatea Națională de Securitate","correct":false,"short":"","long":"Nu este autoritatea pentru aerodromuri civile.","warn":""},{"text":"Ministerul Apărării Naționale","correct":false,"short":"","long":"Nu reglementează aerodromurile civile.","warn":""}]},{"number":"#13","text":"379: Cine eliberează certificatul de pregătire teoretică și practică pentru revalidarea licenței de pilot de aeronave ultraușoare motorizate?","short":"Certificatul de pregătire pentru revalidarea licenței de ULM este eliberat de pilotul instructor.","long":"Pregătirea pentru revalidare este efectuată de un instructor calificat, care eliberează certificatul de pregătire. Ministerul, operatorul și examinatorul au alte roluri în procesul de licențiere.","answers":[{"text":"Ministerul Transporturilor","correct":false,"short":"","long":"Nu eliberează certificatul de pregătire pentru revalidare.","warn":""},{"text":"pilotul instructor","correct":true,"short":"","long":"","warn":""},{"text":"operatorul aerian","correct":false,"short":"","long":"Nu este varianta corectă.","warn":""},{"text":"examinatorul autorizat","correct":false,"short":"","long":"Examinatorul evaluează, dar nu eliberează certificatul de pregătire.","warn":""}]},{"number":"#14","text":"343: Ce trebuie să facă un pilot pentru a efectua salturi cu parașuta?","short":"Pentru a efectua salturi cu parașuta, pilotul trebuie să obțină autorizație de la AACR.","long":"Salturile cu parașuta dintr-o aeronavă sunt activitate specială, care cere autorizare. Autoritatea competentă este Autoritatea Aeronautică Civilă Română (AACR). Notificarea turnului sau a aeroportului și planul de zbor nu înlocuiesc autorizația.","answers":[{"text":"să comunice cu turnul de control","correct":false,"short":"","long":"Comunicarea nu înlocuiește autorizația.","warn":""},{"text":"să obțină autorizație de la AACR","correct":true,"short":"","long":"","warn":""},{"text":"să notifice autoritățile aeroportului","correct":false,"short":"","long":"Notificarea nu înlocuiește autorizația.","warn":""},{"text":"să depună un plan de zbor","correct":false,"short":"","long":"Planul de zbor nu înlocuiește autorizația.","warn":""}]},{"number":"#15","text":"364: Ce sunt serviciile de informare a zborurilor?","short":"Serviciile de informare a zborurilor oferă informații despre meteo, starea aerodromurilor și alte ele
